<script>
  function mostrarErrorBoot(titulo, detalle) {
    var box = document.getElementById('boot-error');
    if (!box) return;
    box.style.display = 'block';
    box.textContent = titulo + '\n\n' + detalle;
  }
  window.addEventListener('error', function (e) {
    // "ResizeObserver loop ..." es un aviso inofensivo del navegador (el layout cambió de tamaño durante un fotograma): no es un fallo de la app.
    if (/ResizeObserver loop/i.test(e.message || '')) { e.stopImmediatePropagation(); return; }
    var detalle = e.error && e.error.stack ? e.error.stack : (e.message || 'Error desconocido');
    if (e.filename) detalle += '\n\nArchivo: ' + e.filename + (e.lineno ? (':' + e.lineno + ':' + e.colno) : '');
    mostrarErrorBoot('Error al cargar el CRM:', detalle);
  });
  function describirError(reason) {
    if (!reason) return 'Error desconocido';
    if (reason.stack) return reason.stack;
    if (typeof reason === 'string') return reason;
    var partes = [];
    if (reason.message) partes.push('message: ' + reason.message);
    if (reason.details) partes.push('details: ' + reason.details);
    if (reason.hint) partes.push('hint: ' + reason.hint);
    if (reason.code) partes.push('code: ' + reason.code);
    if (partes.length) return partes.join('\n');
    try { return JSON.stringify(reason); } catch (err) { return String(reason); }
  }
  function esErrorDeSesionBoot(reason) {
    if (!reason) return false;
    var msg = ((reason.message || '') + ' ' + (reason.code || '')).toLowerCase();
    return reason.status === 401 || msg.indexOf('jwt') !== -1 || msg.indexOf('pgrst301') !== -1 || msg.indexOf('session') !== -1;
  }
  window.addEventListener('unhandledrejection', function (e) {
    // La sesión caducada se resuelve mostrando el login (ver api.js); no tapar la pantalla con el overlay de error.
    if (esErrorDeSesionBoot(e.reason)) { console.warn('Sesión caducada, redirigiendo a login.', e.reason); return; }
    mostrarErrorBoot('Error (promesa) al cargar el CRM:', describirError(e.reason));
  });
</script>

// ===================== utils.js =====================
// Utilidades compartidas

function formatCurrency(value) {
  const n = Number(value || 0);
  return n.toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
}

function formatDate(value) {
  if (!value) return '—';
  const d = new Date(value);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function formatDateTime(value) {
  if (!value) return '—';
  const d = new Date(value);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' +
    d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
}

function toDateInput(value) {
  if (!value) return '';
  const d = new Date(value);
  if (isNaN(d.getTime())) return '';
  return d.toISOString().slice(0, 10);
}

function priceWithIVA(precio, iva) {
  const p = Number(precio || 0);
  const i = Number(iva || 0);
  return p * (1 + i / 100);
}

function normalizeUrl(url) {
  if (!url) return '';
  const u = url.trim();
  if (!u) return '';
  return /^https?:\/\//i.test(u) ? u : 'https://' + u;
}

function waNumber(phone) {
  if (!phone) return '';
  let digits = String(phone).replace(/[^\d]/g, '');
  if (!digits) return '';
  if (digits.startsWith('00')) digits = digits.slice(2);
  // Números españoles de 9 dígitos sin prefijo de país -> anteponer 34
  if (digits.length === 9 && /^[67689]/.test(digits)) digits = '34' + digits;
  return digits;
}

function waLink(phone) {
  const n = waNumber(phone);
  return n ? `https://wa.me/${n}` : '';
}

function telLink(phone) {
  if (!phone) return '';
  return 'tel:' + String(phone).replace(/[^\d+]/g, '');
}

// Datos de pago comunes a los PDF y a la página de impresión
const TITULAR_PAGO_DEFECTO = 'Mónica Peralta Garrido';
function titularPago(empresa) {
  const n = ((empresa && empresa.nombreFiscal) || '').trim();
  return n && !/creadores\s*web/i.test(n) ? n : TITULAR_PAGO_DEFECTO;
}
const TEXTO_PAGO_FACTURA = 'El pago se realizará en el plazo acordado mediante transferencia bancaria en el IBAN indicado, incluyendo el número de factura como concepto y a nombre del titular:';
function textoDetallesPago(empresa, esPresupuesto) {
  const que = esPresupuesto ? 'presupuesto' : 'factura';
  if (!esPresupuesto) return TEXTO_PAGO_FACTURA;
  const iban = empresa && empresa.iban ? ` en el IBAN ${empresa.iban}` : '';
  return `El pago se realizará en el plazo acordado mediante transferencia bancaria${iban}, indicando el número de ${que} y al titular: ${titularPago(empresa)}.`;
}

// Genera un PDF (jsPDF) para un presupuesto o factura: diseño sobrio en blanco y negro, sin fondos de color.
// opciones.facturaOriginal: factura que rectifica (solo para rectificativas).
function generateDocumentoPDF(tipo, documento, items, cliente, empresa, opciones) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const margin = 18;
  const right = W - margin;
  const esFactura = tipo === 'Factura';
  const tipoFactura = documento.tipoFactura || 'completa';
  const titulo = esFactura ? (FACTURA_TITULOS[tipoFactura] || 'FACTURA') : 'PRESUPUESTO';
  const sinIva = !!documento.sinIva;
  const base = Number(documento.subtotal || 0) - Number(documento.descuento || 0);
  const retPct = Number(documento.retencionPorcentaje || 0);
  const retImporte = Number(documento.retencionImporte || 0);
  const t = (txt, x, yy, o) => doc.text(Array.isArray(txt) ? txt : String(txt), x, yy, o);
  const gris = (n) => doc.setTextColor(n);
  const linea = (x1, yy, x2, n, w) => { doc.setDrawColor(n); doc.setLineWidth(w || 0.2); doc.line(x1, yy, x2, yy); };

  if (esFactura && documento.estado === 'borrador') {
    doc.setFont(undefined, 'bold'); doc.setFontSize(80); gris(236);
    t('BORRADOR', W / 2 - 41, H / 2 + 29, { angle: 35 });
  }

  // Cabecera: logo + datos del emisor a la izquierda; título y datos del documento a la derecha
  doc.addImage(LOGO_WORDMARK_DATA_URI, 'PNG', margin, 13, 56, 13.1);
  let yL = 33;
  doc.setFont(undefined, 'bold'); doc.setFontSize(9.5); gris(20);
  if (empresa?.nombreFiscal) { t(empresa.nombreFiscal, margin, yL); yL += 4.6; }
  doc.setFont(undefined, 'normal'); doc.setFontSize(8.5); gris(90);
  const ciudadE = [empresa?.codigoPostal, empresa?.poblacion].filter(Boolean).join(' ') + (empresa?.provincia ? ` (${empresa.provincia})` : '');
  [empresa?.nif ? `NIF: ${empresa.nif}` : null, empresa?.direccion, ciudadE.trim() || null, empresa?.email || null]
    .filter(Boolean).forEach((l) => { t(l, margin, yL); yL += 4.2; });

  doc.setFont(undefined, 'bold'); doc.setFontSize(17); gris(20);
  t(titulo, right, 20, { align: 'right' });
  doc.setFontSize(10.5); t(`Nº ${documento.numero || 'Borrador'}`, right, 27, { align: 'right' });
  doc.setFont(undefined, 'normal'); doc.setFontSize(9); gris(90);
  let yR = 33;
  t(`Fecha de emisión: ${formatDate(documento.fechaEmision)}`, right, yR, { align: 'right' }); yR += 4.6;
  if (esFactura) { t(`Fecha de la operación: ${formatDate(documento.fechaOperacion || documento.fechaEmision)}`, right, yR, { align: 'right' }); yR += 4.6; }
  if (!esFactura && documento.fechaValidez) { t(`Válido hasta: ${formatDate(documento.fechaValidez)}`, right, yR, { align: 'right' }); yR += 4.6; }
  if (esFactura && documento.fechaVencimiento) { t(`Vencimiento: ${formatDate(documento.fechaVencimiento)}`, right, yR, { align: 'right' }); yR += 4.6; }

  let y = Math.max(yL, yR, 44) + 3;
  linea(margin, y, right, 200, 0.3);
  y += 7;

  if (esFactura && tipoFactura === 'rectificativa') {
    doc.setFontSize(9); gris(40);

// ---------- Fechas locales (sin desfases de zona horaria) ----------
function parseDateOnly(str) {
  if (!str) return null;
  const s = String(str).slice(0, 10);
  const [y, m, d] = s.split('-').map(Number);
  // y < 1000 descarta años a medio escribir en un <input type="date"> (ej. "0002" mientras
  // se teclea "2026"): new Date(2, ...) los interpretaría como 1900+2 = 1902.
  if (!y || !m || !d || y < 1000) return null;
  return new Date(y, m - 1, d);
}

function dateKey(d) {
  const dt = (d instanceof Date) ? d : parseDateOnly(d);
  if (!dt || isNaN(dt.getTime())) return '';
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const day = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function addMonths(dateStr, months) {
  const d = parseDateOnly(dateStr);
  if (!d) return '';
  const nd = new Date(d.getFullYear(), d.getMonth() + Number(months || 0), d.getDate());
  return dateKey(nd);
}

function addDays(dateStr, days) {
  const d = parseDateOnly(dateStr);
  if (!d) return '';
  const nd = new Date(d.getFullYear(), d.getMonth(), d.getDate() + Number(days || 0));
  return dateKey(nd);
}

const PERIODICIDAD_MESES = { mensual: 1, trimestral: 3, semestral: 6, anual: 12 };

function getMonthMatrix(year, month) {
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay() + 6) % 7; // Lunes = 0
  const start = new Date(year, month, 1 - startOffset);
  const days = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    days.push(d);
  }
  return days;
}

function computeAvisos({ tareas, facturas, recurrentes, presupuestos, clientes, proyectos }) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const clienteById = {}; (clientes || []).forEach((c) => { clienteById[c.id] = c; });
  const proyectoById = {}; (proyectos || []).forEach((p) => { proyectoById[p.id] = p; });
  const items = [];

  (tareas || []).forEach((t) => {
    if (!t.fechaLimite || t.estado === 'completada' || t.estado === 'cancelada') return;
    const fecha = parseDateOnly(t.fechaLimite);
    if (!fecha) return;
    const proyecto = proyectoById[t.proyectoId];
    items.push({ id: 'tarea-' + t.id, tipo: 'tarea', fecha, fechaStr: t.fechaLimite, titulo: t.titulo, contexto: proyecto ? proyecto.nombre : '', ruta: 'proyectos' });
  });

  (facturas || []).forEach((f) => {
    if (!f.fechaVencimiento || f.estado === 'pagada' || f.estado === 'cancelada') return;
    const fecha = parseDateOnly(f.fechaVencimiento);
    if (!fecha) return;
    const cliente = clienteById[f.clienteId];
    items.push({ id: 'factura-' + f.id, tipo: 'factura', fecha, fechaStr: f.fechaVencimiento, titulo: `Factura ${f.numero}`, contexto: cliente ? cliente.nombre : '', ruta: 'facturas' });
  });

  (recurrentes || []).forEach((r) => {
    if (!r.proximaRenovacion || r.estado !== 'activo') return;
    const fecha = parseDateOnly(r.proximaRenovacion);
    if (!fecha) return;
    const cliente = clienteById[r.clienteId];
    items.push({ id: 'recurrente-' + r.id, tipo: 'renovacion', fecha, fechaStr: r.proximaRenovacion, titulo: r.descripcion, contexto: cliente ? cliente.nombre : '', ruta: 'recurrentes' });
  });

  (presupuestos || []).forEach((p) => {
    if (!p.fechaValidez || (p.estado !== 'borrador' && p.estado !== 'enviado')) return;
    const fecha = parseDateOnly(p.fechaValidez);
    if (!fecha) return;
    const cliente = clienteById[p.clienteId];
    items.push({ id: 'presupuesto-' + p.id, tipo: 'presupuesto', fecha, fechaStr: p.fechaValidez, titulo: `Presupuesto ${p.numero}`, contexto: cliente ? cliente.nombre : '', ruta: 'presupuestos' });
  });

  (proyectos || []).forEach((p) => {
    if (!p.fechaPrevista || p.estado === 'completado' || p.estado === 'cancelado') return;
    const fecha = parseDateOnly(p.fechaPrevista);
    if (!fecha) return;
    const cliente = clienteById[p.clienteId];
    items.push({ id: 'proyecto-' + p.id, tipo: 'proyecto', fecha, fechaStr: p.fechaPrevista, titulo: `Entrega: ${p.nombre}`, contexto: cliente ? cliente.nombre : '', ruta: 'proyectos' });
  });

  items.forEach((it) => {
    const diffDays = Math.round((it.fecha - today) / 86400000);
    it.diffDays = diffDays;
    it.urgencia = diffDays < 0 ? 'vencido' : diffDays <= 7 ? 'proximo' : 'normal';
  });

  items.sort((a, b) => a.fecha - b.fecha);
  return items;
}

// Genera el siguiente número correlativo tipo PRE-2026-0001 / FAC-2026-0001
function nextNumero(prefix, existentes) {
  const year = new Date().getFullYear();
  const pattern = new RegExp('^' + prefix + '-' + year + '-(\\d{4})$');
  let max = 0;
  (existentes || []).forEach((n) => {
    const m = pattern.exec(n || '');
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  const next = String(max + 1).padStart(4, '0');
  return prefix + '-' + year + '-' + next;
}

function calcLineBruto(item) {
  return Number(item.cantidad || 0) * Number(item.precioUnitario || 0);
}
// Importe de la línea tras el descuento (porcentaje y/o importe fijo), redondeado a céntimos y nunca negativo.
// El IVA se calcula sobre este importe, así que el descuento se aplica antes del IVA.
function calcLineTotal(item) {
  const bruto = calcLineBruto(item);
  const pct = Math.min(100, Math.max(0, Number(item.descuentoPct || 0)));
  const fijo = Math.max(0, Number(item.descuentoImporte || 0));
  return Math.max(0, Math.round((bruto * (1 - pct / 100) - fijo + Number.EPSILON) * 100) / 100);
}
function descuentoLineaTexto(item) {
  const pct = Number(item.descuentoPct || 0); const fijo = Number(item.descuentoImporte || 0);
  if (!(pct > 0) && !(fijo > 0)) return '';
  const partes = [];
  if (pct > 0) partes.push(`${pct} %`);
  if (fijo > 0) partes.push(formatCurrency(fijo));
  return `Descuento ${partes.join(' + ')} (-${formatCurrency(calcLineBruto(item) - calcLineTotal(item))})`;
}

// Suma de lo descontado en las líneas (bruto - importe tras descuento)
function descuentoTotalLineas(items) {
  return Math.round(((items || []).reduce((a, it) => a + (calcLineBruto(it) - calcLineTotal(it)), 0) + Number.EPSILON) * 100) / 100;
}

function calcTotales(items, descuento) {
  const subtotal = (items || []).reduce((acc, it) => acc + calcLineTotal(it), 0);
  const ivaTotal = (items || []).reduce((acc, it) => acc + Math.round(calcLineTotal(it) * Number(it.iva || 0)) / 100, 0);
  const desc = Number(descuento || 0);
  const total = subtotal + ivaTotal - desc;
  return { subtotal, ivaTotal, total };
}

// Misma fórmula que el trigger aplicar_fiscalidad_cliente de la base de datos; solo se usa para mostrar en vivo antes de guardar.
const MENCION_IVA_UE = 'Inversión del sujeto pasivo. Operación no sujeta a IVA en España por reglas de localización (art. 69.Uno.1º LIVA).';
const MENCION_IVA_FUERA_UE = 'Operación no sujeta a IVA en España por reglas de localización (art. 69.Uno.1º LIVA).';

function calcFiscalidad({ items, descuento, tipoCliente, retencionPorDefecto, retencionManual, retencionPorcentaje }) {
  const sinIva = tipoCliente === 'ue' || tipoCliente === 'fuera_ue';
  const { subtotal, ivaTotal: ivaLineas } = calcTotales(items, 0);
  const desc = Number(descuento || 0);
  const base = subtotal - desc;
  const ivaTotal = sinIva ? 0 : ivaLineas;
  const total = sinIva ? base : subtotal + ivaTotal - desc;
  const pct = retencionManual
    ? Number(retencionPorcentaje || 0)
    : (tipoCliente === 'autonomo' || tipoCliente === 'empresa' ? Number(retencionPorDefecto ?? 15) : 0);
  const retencion = Math.round((base * pct / 100 + Number.EPSILON) * 100) / 100;
  const mencionIva = tipoCliente === 'ue' ? MENCION_IVA_UE : tipoCliente === 'fuera_ue' ? MENCION_IVA_FUERA_UE : null;
  return { subtotal, base, ivaTotal, sinIva, mencionIva, pct, retencion, total, aTransferir: total - retencion, descuentosLineas: descuentoTotalLineas(items) };
}

// ---------- Ordenación de listados (cabeceras clicables) ----------
function toggleSort(sort, key) {
  return sort && sort.key === key ? { key, dir: sort.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' };
}

function compareValues(a, b) {
  if (typeof a === 'number' && typeof b === 'number') return a - b;
  return String(a ?? '').localeCompare(String(b ?? ''), 'es', { numeric: true, sensitivity: 'base' });
}

// getters: { [sortKey]: (item) => valor comparable }
function sortRows(items, sort, getters) {
  if (!sort || !sort.key || !getters || !getters[sort.key]) return items;
  const getter = getters[sort.key];
  const sorted = [...items].sort((a, b) => compareValues(getter(a), getter(b)));
  return sort.dir === 'desc' ? sorted.reverse() : sorted;
}

// ---------- Exportación a CSV (separador ; y BOM para que Excel lo abra bien en español) ----------
function csvCelda(v) {
  if (v === null || v === undefined) return '';
  let s = typeof v === 'number' ? String(v).replace('.', ',') : String(v);
  if (typeof v !== 'number' && /^(=|@|[+\-][A-Za-z(])/.test(s)) s = "'" + s; // evita que Excel interprete texto como fórmula
  return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
const csvFecha = (v) => (v ? formatDate(v) : '');
const csvSiNo = (v) => (v ? 'Sí' : 'No');
const csvCliente = (c) => (c ? (c.empresa || c.nombre || '') : '');

function descargarCSV(nombre, columnas, filas) {
  const lineas = [columnas.map((c) => csvCelda(c.titulo)).join(';')];
  filas.forEach((f) => lineas.push(columnas.map((c) => csvCelda(c.valor(f))).join(';')));
  const blob = new Blob(['﻿' + lineas.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${nombre}_${toDateInput(new Date())}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function ExportCsvButton({ nombre, columnas, filas }) {

      Exportar CSV
    </Button>
  );
}

// ===================== api.js =====================
// Capa de acceso a datos (Supabase)

// Detecta errores por sesión caducada/token inválido (401 / JWT / PGRST301).
// Cuando la pestaña lleva mucho tiempo abierta, el token puede caducar antes de refrescarse;
// forzamos el cierre de sesión para que App.js muestre el login limpiamente en vez de
// dejar la petición como un rechazo de promesa sin gestionar.
function esErrorDeSesion(error) {
  if (!error) return false;
  const msg = ((error.message || '') + ' ' + (error.code || '')).toLowerCase();
  return error.status === 401 || msg.includes('jwt') || msg.includes('pgrst301') || msg.includes('session');
}

async function manejarError(error) {
  if (esErrorDeSesion(error)) {
    await supabaseClient.auth.signOut();
  }
  throw error;
}

const api = {
  async list(table, { order = 'createdAt', ascending = false, select = '*' } = {}) {
    let q = supabaseClient.from(table).select(select);
    if (order) q = q.order(order, { ascending });
    const { data, error } = await q;
    if (error) await manejarError(error);
    return data || [];
  },
  async get(table, id) {
    const { data, error } = await supabaseClient.from(table).select('*').eq('id', id).single();
    if (error) await manejarError(error);
    return data;
  },
  async insert(table, payload) {
    const { data, error } = await supabaseClient.from(table).insert(payload).select().single();
    if (error) await manejarError(error);
    return data;
  },
  async update(table, id, payload) {
    const { data, error } = await supabaseClient.from(table).update(payload).eq('id', id).select().single();
    if (error) await manejarError(error);
    return data;
  },
  async remove(table, id) {
    const { error } = await supabaseClient.from(table).delete().eq('id', id);
    if (error) await manejarError(error);
    return true;
  },
  async removeWhere(table, column, value) {
    const { error } = await supabaseClient.from(table).delete().eq(column, value);
    if (error) await manejarError(error);
    return true;
  },
};

const ToastCtx = createContext(null);
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((msg, type = 'success') => {
    const id = uid();
    setToasts((t) => [...t, { id, msg, type }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3500);
  }, []);
  return (
    <ToastCtx.Provider value={push}>
      {children}
      <div className="fixed bottom-4 right-4 z-[100] flex flex-col gap-2 w-[min(92vw,360px)]">
        {toasts.map((t) => (
          <div key={t.id} className={classNames(
            'fade-in rounded-lg shadow-lg px-4 py-3 text-sm font-medium text-white flex items-start gap-2',
            t.type === 'error' ? 'bg-rose-600' : t.type === 'info' ? 'bg-ink-800' : 'bg-emerald-600'
          )}>
            {t.type === 'error' ? <Icons.Alert className="w-4 h-4 mt-0.5 shrink-0" /> : <Icons.Check className="w-4 h-4 mt-0.5 shrink-0" />}
            <span>{t.msg}</span>

        ))}
      </div>
    </ToastCtx.Provider>
  );
}

// Celda editable en el propio listado: al pulsar sobre el valor se convierte en campo de edición.
// Enter o salir del campo guarda; Esc cancela. Los campos de tipo lista guardan al elegir una opción.
function EditableCell({ value, onSave, type = 'text', options, display, placeholder = '—', required, validate, maxLength, step, className }) {
  const toast = useToast();
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState('');
  const [saving, setSaving] = useState(false);
  const stop = (e) => e.stopPropagation();

  function start(e) { e.stopPropagation(); setDraft(value ?? ''); setEditing(true); }

  async function commit(nuevo) {
    const limpio = typeof nuevo === 'string' ? nuevo.trim() : nuevo;
    if (limpio === (value ?? '')) { setEditing(false); return; }
    if (required && !limpio) { toast('Este campo no puede quedar vacío', 'error'); setEditing(false); return; }
    const problema = validate && limpio ? validate(limpio) : '';
    if (problema) { toast(problema, 'error'); setEditing(false); return; }
    setSaving(true);
    try { await onSave(limpio); }
    catch (err) { toast(err.message || 'No se pudo guardar', 'error'); }
    finally { setSaving(false); setEditing(false); }
  }

  if (editing) {
    const comun = 'rounded-md border border-brand-300 bg-white px-1.5 py-0.5 text-sm text-ink-800 focus:outline-none focus:ring-2 focus:ring-brand-500/40 max-w-full';
    if (options) {
      return (
        <select autoFocus value={draft} disabled={saving} onClick={stop} className={comun}
          onChange={(e) => { setDraft(e.target.value); commit(e.target.value); }} onBlur={() => setEditing(false)}
          onKeyDown={(e) => { if (e.key === 'Escape') setEditing(false); }}>
          {options.map(([k, label]) => <option key={k} value={k}>{label}</option>)}
        </select>
      );
    }
    return (
      <input autoFocus type={type} step={step} value={draft} disabled={saving} maxLength={maxLength} onClick={stop} className={classNames(comun, type === 'date' ? 'w-36' : 'w-full min-w-[8rem]')}
        onChange={(e) => setDraft(e.target.value)} onBlur={() => commit(draft)}
        onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); commit(draft); } if (e.key === 'Escape') setEditing(false); }} />
    );
  }

  return (
    <button type="button" onClick={start} title="Pulsa para editar"
      className={classNames('text-left rounded px-1 -mx-1 cursor-text hover:bg-slate-100 hover:ring-1 hover:ring-slate-200 transition', className)}>
      {display !== undefined ? display : (value ? value : <span className="text-slate-300">{placeholder}</span>)}
    </button>
  );
}

// Calcula la posición (fixed) del desplegable de un combobox a partir de su elemento ancla.
// Se usa junto a un portal a document.body para que el desplegable nunca quede recortado
// por el overflow-hidden/overflow-x-auto de las tablas (CardTable) o de un Modal.
function useDropdownPosition(open, anchorRef) {
  const [pos, setPos] = useState(null);
  useEffect(() => {
    if (!open || !anchorRef.current) { setPos(null); return; }
    function update() {
      if (!anchorRef.current) return;
      const r = anchorRef.current.getBoundingClientRect();
      const width = Math.min(Math.max(r.width, 340), window.innerWidth - 16);
      setPos({ top: r.bottom + 4, left: Math.max(8, Math.min(r.left, window.innerWidth - width - 8)), width });
    }
    update();
    window.addEventListener('resize', update);
    document.addEventListener('scroll', update, true);
    return () => { window.removeEventListener('resize', update); document.removeEventListener('scroll', update, true); };
  }, [open]);
  return pos;
}

          onKeyDown={(e) => { if (e.key === 'Escape') { setOpen(false); setQuery(''); } }} />
      ) : (
        <button type="button" onClick={() => setOpen(true)}
          className={classNames(inputCls, 'w-full text-left flex items-center justify-between', !seleccionado && 'text-slate-400')}>
          <span className="truncate">{seleccionado ? seleccionado.nombre : (placeholder || 'Ninguno')}</span>
          <Icons.ChevronDown className="w-4 h-4 text-slate-400 shrink-0" />
        </button>
      )}
      {open && pos && ReactDOM.createPortal(
        <div ref={dropdownRef} style={{ position: 'fixed', top: pos.top, left: pos.left, width: pos.width }}
          className="z-50 bg-white rounded-lg border border-slate-200 shadow-xl max-h-64 overflow-y-auto py-1">
          <button type="button" onClick={() => seleccionar({ id: '' })}
            className={classNames('w-full text-left px-3 py-1.5 text-sm hover:bg-slate-50', !value ? 'bg-brand-50 text-brand-700' : 'text-slate-400')}>
            {placeholder || 'Ninguno'}
          </button>
          {filtrados.length === 0 ? (
            <p className="px-3 py-2 text-xs text-slate-400">Sin resultados</p>
          ) : filtrados.map((p) => (
            <button key={p.id} type="button" onClick={() => seleccionar(p)}
              className={classNames('w-full text-left px-3 py-1.5 text-sm hover:bg-slate-50 truncate', p.id === value ? 'bg-brand-50 text-brand-700' : 'text-ink-700')}>
              {p.nombre}
            </button>
          ))}
        </div>, document.body
      )}
    </div>
  );
}

// ---------- Modal ----------
// Se renderiza con un portal a document.body: los formularios de alta rápida (cliente/producto)
// abren su propio <Modal> desde dentro de otro formulario, y sin portal quedaría un <form> anidado
// dentro de otro <form> (HTML inválido) que rompe el submit. El portal saca el DOM fuera del <form> padre.
function Modal({ open, onClose, title, children, footer, wide, size, bare }) {
  if (!open) return null;
  const sizeCls = size === '2xl' ? 'sm:max-w-7xl' : size === 'xl' ? 'sm:max-w-5xl' : (wide || size === 'lg') ? 'sm:max-w-3xl' : 'sm:max-w-lg';
  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-50 flex items-start sm:items-center justify-center p-0 sm:p-4">
      <div className="absolute inset-0 bg-ink-900/50 backdrop-blur-[2px]" onClick={onClose}></div>
      <div className={classNames(
        'relative bg-white w-full sm:rounded-2xl shadow-2xl fade-in flex flex-col max-h-full sm:max-h-[95vh]',
        bare && 'overflow-hidden',
        sizeCls
      )}>
        {!bare && (
          <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100 shrink-0">
            <h3 className="text-base font-semibold text-ink-900">{title}</h3>
            <button onClick={onClose} className="text-slate-400 hover:text-ink-700 rounded-lg p-1 hover:bg-slate-100">
              <Icons.X className="w-5 h-5" />
            </button>
          </div>
        )}
        {bare ? children : <div className="px-5 py-4 overflow-y-auto bg-slate-100/80">{children}</div>}
        {!bare && footer && <div className="px-5 py-3.5 border-t border-slate-100 flex justify-end gap-2 shrink-0">{footer}</div>}
      </div>
    </div>,
    document.body
  );
}

// ---------- Paginación de listados ----------
function Pagination({ page, totalPages, onPageChange, totalItems, pageSize }) {
  if (totalPages <= 1) return null;
  const start = (page - 1) * pageSize + 1;
  const end = Math.min(page * pageSize, totalItems);
  return (
    <div className="flex items-center justify-between px-4 py-3 border-t border-slate-100 text-xs text-slate-500">
      <span>{start}–{end} de {totalItems}</span>
      <div className="flex items-center gap-2">
        <Button size="sm" variant="secondary" disabled={page <= 1} onClick={() => onPageChange(page - 1)}>
          <Icons.ChevronLeft className="w-4 h-4" />
        </Button>
        <span>Página {page} de {totalPages}</span>
        <Button size="sm" variant="secondary" disabled={page >= totalPages} onClick={() => onPageChange(page + 1)}>
          <Icons.ChevronRight className="w-4 h-4" />
        </Button>
      </div>
    </div>
  );
}

function Th({ children, className, ...props }) {
  return <th {...props} className={classNames('text-left text-[11px] font-semibold uppercase tracking-wide px-4 py-3 whitespace-nowrap', className)}>{children}</th>;
}
function Td({ children, className }) {
  return <td className={classNames('px-4 py-3 text-sm text-ink-700 whitespace-nowrap', className)}>{children}</td>;
}

// Cabecera de columna ordenable: al pulsar el nombre del campo, ordena asc/desc (y alterna al volver a pulsar)
function SortableTh({ children, sortKey, sort, onSort, className }) {
  const active = sort && sort.key === sortKey;
  return (
    <Th className={classNames('cursor-pointer select-none hover:text-white/80', className)} onClick={() => onSort(sortKey)}>
      <span className="inline-flex items-center gap-1">
        {children}
        <Icons.ArrowUp className={classNames('w-3 h-3 shrink-0 transition-transform', active ? 'opacity-100' : 'opacity-30', active && sort.dir === 'desc' && 'rotate-180')} />
      </span>
    </Th>
  );
}

// ---------- Editor de líneas (presupuestos / facturas) ----------
function LineItemsEditor({ items, setItems, productos, onProductoCreado, sinIva, permitirRecurrente }) {
  const [creandoProducto, setCreandoProducto] = useState(false);

  function update(idx, patch) {
    setItems(items.map((it, i) => (i === idx ? { ...it, ...patch } : it)));
  }
  function addItem() {
    setItems([...items, { _key: uid(), concepto: '', descripcion: '', cantidad: 1, precioUnitario: 0, descuentoPct: 0, descuentoImporte: 0, iva: sinIva ? 0 : 21 }]);
  }
  function addFromProducto(p) {
    setItems([...items, { _key: uid(), concepto: p.nombre, descripcion: p.descripcion || '', cantidad: 1, precioUnitario: Number(p.precio || 0), descuentoPct: 0, descuentoImporte: 0, iva: sinIva ? 0 : Number(p.iva || 21) }]);
  }
  function removeItem(idx) {
    setItems(items.filter((_, i) => i !== idx));
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-2">
        <span className="text-xs font-semibold text-ink-600">Líneas del documento</span>
        <div className="flex items-center gap-1.5">
          {productos && productos.length > 0 && (
            <Select className="!w-auto !py-1 !text-xs" onChange={(e) => {
              const p = productos.find((x) => x.id === e.target.value);
              if (p) addFromProducto(p);
              e.target.value = '';
            }} defaultValue="">
              <option value="" disabled>+ Añadir desde catálogo</option>
              {productos.map((p) => <option key={p.id} value={p.id}>{p.nombre} — {formatCurrency(p.precio)}</option>)}
            </Select>
          )}
          <Button type="button" size="sm" variant="secondary" title="Crear producto nuevo" onClick={() => setCreandoProducto(true)} className="!px-2.5">
            <Icons.Plus className="w-3.5 h-3.5" />
          </Button>
        </div>
      </div>
      <Modal open={creandoProducto} onClose={() => setCreandoProducto(false)} title="Nuevo producto">
        <ProductoQuickForm onCancel={() => setCreandoProducto(false)} onCreated={(p) => {
          addFromProducto(p);
          onProductoCreado && onProductoCreado(p);
          setCreandoProducto(false);
        }} />
      </Modal>
      <div className="border border-slate-200 rounded-lg overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full min-w-[1000px] text-sm">
            <thead className="bg-slate-50 text-slate-400"><tr>
              <Th className="!py-2">Concepto</Th>
              <Th className="!py-2 w-20">Cant.</Th>
              <Th className="!py-2 w-28">Precio (€)</Th>
              <Th className="!py-2 w-20">Dto. %</Th>
              <Th className="!py-2 w-24">Dto. (€)</Th>
              <Th className="!py-2 w-20">IVA %</Th>
              <Th className="!py-2 w-28 text-right">Total</Th>
              <Th className="!py-2 w-28 text-right">Total c/IVA</Th>
              <Th className="!py-2 w-10"></Th>
            </tr></thead>
            <tbody className="divide-y divide-slate-100">
              {items.length === 0 && (
                <tr><td colSpan="9" className="text-center text-xs text-slate-400 py-6">Sin líneas. Añade una línea o un producto del catálogo.</td></tr>
              )}
              {items.map((it, idx) => (
                <React.Fragment key={it._key || it.id || idx}>
                <tr>
                  <td className="px-2 py-1.5 min-w-[420px]"><Textarea rows={2} className="!py-1.5 min-h-[3.5rem]" value={it.concepto} onChange={(e) => update(idx, { concepto: e.target.value })} placeholder="Concepto (puedes escribir varias líneas)" /></td>
                  <td className="px-2 py-1.5"><Input type="number" min="0" step="1" className="!py-1.5" value={it.cantidad} onChange={(e) => update(idx, { cantidad: e.target.value })} /></td>
                  <td className="px-2 py-1.5"><Input type="number" min="0" step="0.01" className="!py-1.5" value={it.precioUnitario} onChange={(e) => update(idx, { precioUnitario: e.target.value })} /></td>
                  <td className="px-2 py-1.5"><Input type="number" min="0" max="100" step="0.01" className="!py-1.5" value={it.descuentoPct ?? 0}
                    onChange={(e) => update(idx, { descuentoPct: Math.min(100, Math.max(0, Number(e.target.value || 0))), ...(Number(e.target.value) >= 100 && it.recurrente ? { recPrimeraGratis: true } : {}) })} /></td>
                  <td className="px-2 py-1.5"><Input type="number" min="0" step="0.01" className="!py-1.5" value={it.descuentoImporte ?? 0} onChange={(e) => update(idx, { descuentoImporte: Math.max(0, Number(e.target.value || 0)) })} /></td>
                  <td className="px-2 py-1.5"><Input type="number" min="0" step="1" className={classNames('!py-1.5', sinIva && 'bg-slate-50 text-slate-400')} value={it.iva} onChange={(e) => update(idx, { iva: e.target.value })} disabled={sinIva} /></td>
                  <td className="px-2 py-1.5 text-right text-ink-500">{formatCurrency(calcLineTotal(it))}</td>
                  <td className="px-2 py-1.5 text-right font-medium text-ink-700">{formatCurrency(calcLineTotal(it) * (1 + Number(it.iva || 0) / 100))}</td>
                  <td className="px-2 py-1.5 text-right"><button type="button" onClick={() => removeItem(idx)} className="text-slate-400 hover:text-rose-500 p-1"><Icons.Trash className="w-4 h-4" /></button></td>
                </tr>
                {permitirRecurrente && (
                  <tr><td colSpan="9" className="px-2 pb-2 pt-0">
                    <label className="inline-flex items-center gap-2 text-xs text-ink-600 cursor-pointer">
                      <input type="checkbox" checked={!!it.recurrente} className="rounded border-slate-300 text-brand-600"
                        onChange={(e) => update(idx, e.target.checked ? {
                          recurrente: true, recPeriodicidad: it.recPeriodicidad || 'anual', recInicio: it.recInicio || '',
                          recPrecio: it.recPrecio ?? Number(it.precioUnitario || 0), recRenovacionAuto: it.recRenovacionAuto ?? true,
                          recPrimeraGratis: Number(it.descuentoPct || 0) >= 100,
                        } : { recurrente: false })} />
                      <Icons.Repeat className="w-3.5 h-3.5 text-brand-600" /> Crear servicio recurrente para este cliente
                    </label>
                    {it.recurrente && (
                      <div className="mt-2 grid grid-cols-2 sm:grid-cols-4 gap-3 bg-brand-50/40 border border-brand-100 rounded-lg p-3">
                        <Field label="Periodicidad">
                          <Select value={it.recPeriodicidad || 'anual'} onChange={(e) => update(idx, { recPeriodicidad: e.target.value })}>
                            <option value="mensual">Mensual</option><option value="trimestral">Trimestral</option><option value="semestral">Semestral</option><option value="anual">Anual</option>
                          </Select>
                        </Field>
                        <Field label="Fecha de inicio (activación)" required><Input type="date" value={toDateInput(it.recInicio)} onChange={(e) => update(idx, { recInicio: e.target.value })} /></Field>
                        <Field label="Precio de renovación (sin IVA)" hint="Precio habitual, no el de esta factura"><Input type="number" min="0" step="0.01" value={it.recPrecio ?? ''} onChange={(e) => update(idx, { recPrecio: e.target.value })} /></Field>
                        <div className="space-y-1.5 pt-5 text-xs text-ink-600">
                          <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={!!it.recPrimeraGratis} onChange={(e) => update(idx, { recPrimeraGratis: e.target.checked })} className="rounded border-slate-300 text-brand-600" /> Primer periodo gratuito (promoción)</label>
                          <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={it.recRenovacionAuto !== false} onChange={(e) => update(idx, { recRenovacionAuto: e.target.checked })} className="rounded border-slate-300 text-brand-600" /> Renovación automática</label>
                        </div>
                        <p className="col-span-2 sm:col-span-4 text-[11px] text-slate-500">El servicio se registra al emitir la factura, con aviso 30 días antes de cada renovación. La renovación se genera como borrador para revisarla.</p>
                      </div>
                    )}
                  </td></tr>
                )}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      <button type="button" onClick={addItem} className="mt-2 text-xs font-medium text-brand-600 hover:underline flex items-center gap-1">
        <Icons.Plus className="w-3.5 h-3.5" /> Añadir línea manual
      </button>
    </div>
  );
}

// ---------- Copiar al portapapeles ----------
function CopyIconButton({ text, label, className }) {
  const toast = useToast();
  if (!text) return null;
  function copy(e) {
    e.preventDefault();
    e.stopPropagation();
    navigator.clipboard.writeText(String(text))
      .then(() => toast(`${label || 'Copiado'} copiado`))
      .catch(() => toast('No se pudo copiar', 'error'));
  }
  return (
    <button type="button" onClick={copy} title={`Copiar${label ? ' ' + label : ''}`}
      className={classNames('text-slate-400 hover:text-brand-600 shrink-0 p-0.5 rounded transition', className)}>
      <Icons.Copy className="w-3.5 h-3.5" />
    </button>
  );
}

// Input de texto con botón de copiar integrado (para nombre, email, teléfono, etc.)
function InputCopy({ value, copyLabel, className, ...props }) {
  const toast = useToast();
  function copy(e) {
    e.preventDefault();
    if (!value) return;
    navigator.clipboard.writeText(String(value))
      .then(() => toast(`${copyLabel || 'Valor'} copiado`))
      .catch(() => toast('No se pudo copiar', 'error'));
  }
  return (
    <div className="relative">
      <Input value={value} className={classNames(value ? 'pr-9' : '', className)} {...props} />
      {value && (
        <button type="button" onClick={copy} title={`Copiar ${copyLabel || ''}`.trim()}
          className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brand-600 p-0.5 rounded">
          <Icons.Copy className="w-3.5 h-3.5" />
        </button>
      )}
    </div>
  );
}

// ---------- Enlaces de contacto (web / email / whatsapp) ----------
function EmailLink({ email, className }) {
  if (!email) return <span className="text-slate-400">—</span>;
  return (
    <span className={classNames('inline-flex items-center gap-1.5 min-w-0', className)}>
      <a href={mailtoLink(email)} className="text-brand-600 hover:underline truncate">{email}</a>
      <CopyIconButton text={email} label="email" />

}
function WebLink({ url, className }) {
  if (!url) return <span className="text-slate-400">—</span>;
  return <a href={normalizeUrl(url)} target="_blank" rel="noopener noreferrer" className={classNames('text-brand-600 hover:underline break-all', className)}>{url}</a>;
}
function PhoneLink({ phone, className }) {
  if (!phone) return <span className="text-slate-400">—</span>;
  return (
    <span className={classNames('inline-flex items-center gap-2', className)}>
      <a href={telLink(phone)} className="text-ink-700 hover:text-brand-600 hover:underline">{phone}</a>
      <a href={waLink(phone)} target="_blank" rel="noopener noreferrer" title="Abrir en WhatsApp" className="text-emerald-600 hover:text-emerald-700">
        <Icons.WhatsApp className="w-4 h-4" />
      </a>
      <CopyIconButton text={phone} label="teléfono" />
    </span>
  );
}

// Avatar with initials
function Avatar({ name, className }) {
  const initials = (name || '?').split(' ').filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
  const colors = ['bg-brand-100 text-brand-700', 'bg-blue-100 text-blue-700', 'bg-emerald-100 text-emerald-700', 'bg-amber-100 text-amber-700', 'bg-rose-100 text-rose-700', 'bg-violet-100 text-violet-700'];
  let hash = 0; for (let i = 0; i < (name || '').length; i++) hash = (hash + name.charCodeAt(i)) % colors.length;
  return (
    <div className={classNames('w-8 h-8 rounded-full flex items-center justify-center text-[11px] font-bold shrink-0', colors[hash], className)}>
      {initials || '?'}
    </div>
  );
}

  const sd = searchData || {};
  const clienteById = {}; (sd.clientes || []).forEach((c) => { clienteById[c.id] = c; });
  const q = search.trim().toLowerCase();
  function matches(fields) { return fields.filter(Boolean).some((v) => String(v).toLowerCase().includes(q)); }
  const results = q.length >= 2 ? {
    clientes: (sd.clientes || []).filter((c) => matches([c.nombre, c.empresa, c.email, c.nif])).slice(0, 5),
    proyectos: (sd.proyectos || []).filter((p) => matches([p.nombre])).slice(0, 5),
    presupuestos: (sd.presupuestos || []).filter((p) => matches([p.numero])).slice(0, 5),
    facturas: (sd.facturas || []).filter((f) => matches([f.numero])).slice(0, 5),
    leads: (sd.leads || []).filter((l) => matches([l.nombre, l.empresa])).slice(0, 5),
    proveedores: (sd.proveedores || []).filter((p) => matches([p.nombre])).slice(0, 5),
  } : null;
  const totalResultados = results ? Object.values(results).reduce((a, arr) => a + arr.length, 0) : 0;

  function pick(ruta) { setSearch(''); setSearchOpen(false); navigate(ruta); }

                <SearchResultGroup label="Proyectos" icon={Icons.Briefcase} items={results.proyectos} onPick={pick}

                <SearchResultGroup label="Leads" icon={Icons.Target} items={results.leads} onPick={pick}

            <div className="absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-slate-100 py-1.5 fade-in">

            </div>
          )}
        </div>
      </div>
    </header>
  );
}

function Layout({ current, navigate, userEmail, onLogout, children }) {
  const [mobileOpen, setMobileOpen] = useState(false);
  const [collapsed, setCollapsed] = useState(() => {
    try { return window.localStorage.getItem('crm_sidebar_collapsed') === '1'; } catch (e) { return false; }
  });
  useEffect(() => {
    try { window.localStorage.setItem('crm_sidebar_collapsed', collapsed ? '1' : '0'); } catch (e) {}
  }, [collapsed]);

  const [avisos, setAvisos] = useState([]);
  const [cobrosPendientes, setCobrosPendientes] = useState([]);
  const [searchData, setSearchData] = useState({});
  useEffect(() => {
    let active = true;
    async function loadAvisos() {
      try {
        const [tareas, facturas, recurrentes, presupuestos, clientes, proyectos, leads, proveedores] = await Promise.all([
          api.list('Tarea'), api.list('Factura'), api.list('ServicioRecurrente'), api.list('Presupuesto'),
          api.list('Cliente'), api.list('Proyecto'), api.list('Lead'), api.list('Proveedor'),
        ]);
        if (!active) return;
        setAvisos(computeAvisos({ tareas, facturas, recurrentes, presupuestos, clientes, proyectos }));
        setSearchData({ clientes, proyectos, presupuestos, facturas, leads, proveedores });

        const clienteById = {}; clientes.forEach((c) => { clienteById[c.id] = c; });
        const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
        const cobros = facturas
          .filter((f) => ['emitida', 'pagada_parcial', 'vencida'].includes(f.estado))
          .map((f) => ({
            ...f,
            _clienteNombre: (clienteById[f.clienteId] || {}).nombre || 'Cliente',
            _vencida: f.estado === 'vencida' || (f.fechaVencimiento && parseDateOnly(f.fechaVencimiento) < hoy),
          }))
          .sort((a, b) => (a.fechaVencimiento || '9999-12-31').localeCompare(b.fechaVencimiento || '9999-12-31'));
        setCobrosPendientes(cobros);
      } catch (e) { /* silencioso: no bloquear la interfaz por un fallo de avisos */ }
    }
    loadAvisos();
    return () => { active = false; };
  }, [current]);

  const title = (NAV_ITEMS.find((n) => n.key === current) || {}).label || '';
  return (
    <div className="flex min-h-screen bg-[#f5f6fa]">
      <Sidebar current={current} navigate={navigate} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} collapsed={collapsed} setCollapsed={setCollapsed} />
      <div className="flex-1 min-w-0 flex flex-col">
        <Topbar setMobileOpen={setMobileOpen} collapsed={collapsed} setCollapsed={setCollapsed} title={title} userEmail={userEmail} onLogout={onLogout}
          avisos={avisos} cobrosPendientes={cobrosPendientes} searchData={searchData} navigate={navigate} />
        <main className="flex-1 w-full px-3 py-4 sm:px-5 sm:py-6 lg:px-8 2xl:px-10">{children}</main>
      </div>
    </div>
  );
}

const REMEMBER_LOGIN_KEY = 'crm_remember_login';

function ForgotPasswordForm({ initialEmail, onBack }) {
  const [email, setEmail] = useState(initialEmail || '');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [sent, setSent] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email.trim(), { redirectTo });
    setLoading(false);

      setError(error.status === 429 || /rate limit/i.test(error.message || '')
        ? 'Has pedido demasiados correos seguidos. Espera unos minutos e inténtalo de nuevo.'

            </div>
          ) : (
            <>

                <span className="text-sm font-semibold text-ink-600">Correo electrónico</span>

function ResetPasswordForm({ onDone }) {
  const [password, setPassword] = useState('');
  const [confirm, setConfirm] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    if (password.length < 6) { setError('La contraseña debe tener al menos 6 caracteres.'); return; }
    if (password !== confirm) { setError('Las contraseñas no coinciden.'); return; }
    setLoading(true);
    const { error } = await supabaseClient.auth.updateUser({ password });
    setLoading(false);
    if (error) { setError(error.message || 'No se pudo cambiar la contraseña.'); return; }
    try { window.localStorage.removeItem(REMEMBER_LOGIN_KEY); } catch (e) { /* ignorar */ }
    onDone();
  }

  const inputCls2 = 'w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-base text-ink-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/40 focus:border-brand-400 transition';
  return (
    <div className="min-h-screen flex items-center justify-center bg-ink-900 px-4">
      <div className="w-full max-w-md fade-in">
        <form onSubmit={handleSubmit} className="bg-white rounded-2xl shadow-2xl shadow-black/40 p-8 sm:p-11 space-y-6">
          <div className="text-center">
            <img src={LOGO_WORDMARK_DATA_URI} alt="Creadores Web" className="mx-auto h-14 object-contain mb-4" />
            <h1 className="text-ink-900 font-bold text-2xl">Nueva contraseña</h1>
            <p className="text-ink-500 text-base mt-1.5">Elige la contraseña con la que vas a acceder</p>
          </div>
          <input type="password" required autoFocus value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Nueva contraseña" className={inputCls2} />
          <input type="password" required value={confirm} onChange={(e) => setConfirm(e.target.value)} placeholder="Repite la contraseña" className={inputCls2} />
          {error && (
            <div className="flex items-center gap-2 text-rose-600 bg-rose-50 rounded-lg px-3.5 py-2.5 text-sm font-medium">
              <Icons.Alert className="w-4 h-4 shrink-0" /> {error}
            </div>
          )}
          <Button type="submit" className="w-full text-base py-3" size="lg" disabled={loading}>{loading ? 'Guardando...' : 'Guardar contraseña'}</Button>
        </form>
      </div>
    </div>
  );
}

function Login() {
  const [forgot, setForgot] = useState(false);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [showPassword, setShowPassword] = useState(false);
  const [remember, setRemember] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  useEffect(() => {
    try {
      const raw = window.localStorage.getItem(REMEMBER_LOGIN_KEY);
      if (raw) {
        const saved = JSON.parse(atob(raw));
        if (saved && saved.email) {
          setEmail(saved.email);
          setPassword(saved.password || '');
          setRemember(true);
        }
      }
    } catch (e) { /* datos guardados corruptos: se ignoran */ }
  }, []);

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setLoading(true);
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    setLoading(false);
    if (error) { setError('Email o contraseña incorrectos.'); return; }
    try {
      if (remember) window.localStorage.setItem(REMEMBER_LOGIN_KEY, btoa(JSON.stringify({ email, password })));
      else window.localStorage.removeItem(REMEMBER_LOGIN_KEY);
    } catch (e) { /* localStorage no disponible: no bloquear el login */ }
  }

  if (forgot) return <ForgotPasswordForm initialEmail={email} onBack={() => setForgot(false)} />;

  return (
    <div className="min-h-screen flex items-center justify-center bg-ink-900 px-4 relative overflow-hidden">
      <div className="absolute -top-32 -left-32 w-96 h-96 bg-brand-600/30 rounded-full blur-3xl"></div>
      <div className="absolute -bottom-32 -right-32 w-96 h-96 bg-brand-400/20 rounded-full blur-3xl"></div>
      <div className="absolute inset-0 opacity-[0.05]" style={{ backgroundImage: 'radial-gradient(circle, #fff 1px, transparent 1px)', backgroundSize: '26px 26px' }}></div>
      <div className="relative w-full max-w-md fade-in">
        <form onSubmit={handleSubmit} className="bg-white rounded-2xl shadow-2xl shadow-black/40 border border-white/10 p-8 sm:p-11 space-y-6">
          <div className="text-center">
            <img src={LOGO_WORDMARK_DATA_URI} alt="Creadores Web" className="mx-auto h-16 object-contain mb-4" />
            <h1 className="text-ink-900 font-bold text-xl sm:text-2xl tracking-wide">GESTIÓN Y CONTABILIDAD</h1>
          </div>
          <div className="flex flex-col gap-1.5">
            <span className="text-sm font-semibold text-ink-600">Correo electrónico <span className="text-rose-500">*</span></span>
            <div className="relative">
              <Icons.Mail className="w-[18px] h-[18px] text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" />
              <input
                type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="tucorreo@dominio.com" autoFocus
                className="w-full rounded-xl border border-slate-200 bg-white pl-11 pr-4 py-3 text-base text-ink-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/40 focus:border-brand-400 transition"
              />
            </div>
          </div>
          <div className="flex flex-col gap-1.5">
            <span className="text-sm font-semibold text-ink-600">Contraseña <span className="text-rose-500">*</span></span>
            <div className="relative">
              <Icons.Lock className="w-[18px] h-[18px] text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" />
              <input
                type={showPassword ? 'text' : 'password'} required value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••"
                className="w-full rounded-xl border border-slate-200 bg-white pl-11 pr-11 py-3 text-base text-ink-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/40 focus:border-brand-400 transition"
              />
              <button
                type="button"
                onClick={() => setShowPassword((v) => !v)}
                className="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-ink-600"
                tabIndex={-1}
                title={showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'}
              >
                {showPassword ? <Icons.EyeOff className="w-[18px] h-[18px]" /> : <Icons.Eye className="w-[18px] h-[18px]" />}
              </button>
            </div>
          </div>
          <label className="flex items-center gap-2 text-sm text-ink-600 select-none cursor-pointer">
            <input
              type="checkbox"
              checked={remember}
              onChange={(e) => setRemember(e.target.checked)}
              className="w-4 h-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500/40 focus:ring-offset-0"
            />
            Recordar mis datos
          </label>
          <button type="button" onClick={() => setForgot(true)} className="text-sm text-brand-600 hover:underline -mt-2 block">¿Has olvidado tu contraseña?</button>
          {error && (
            <div className="flex items-center gap-2 text-rose-600 bg-rose-50 rounded-lg px-3.5 py-2.5 text-sm font-medium">
              <Icons.Alert className="w-4 h-4 shrink-0" /> {error}
            </div>
          )}
          <Button type="submit" className="w-full text-base py-3" size="lg" disabled={loading}>
            {loading ? <Spinner className="w-4 h-4 border-white/40 border-t-white" /> : null}
            {loading ? 'Entrando...' : 'Iniciar sesión'}
          </Button>
        </form>
        <p className="text-center text-white/40 text-xs mt-6">© {new Date().getFullYear()} Creadores Web · Uso interno</p>
      </div>
    </div>
  );
}

      api.list('Cliente'),
      api.list('Proyecto'),
      api.list('Presupuesto'),
      api.list('Factura'),
      api.list('Pago'),
      api.list('Tarea'),
      api.list('Lead'),
    ]);
    setData({ clientes, proyectos, presupuestos, facturas, pagos, tareas, leads });
    setLoading(false);
  }

  useEffect(() => { load(); }, []);

  const anioActual = now.getFullYear();
  const facturadoMes = facturas
    .filter((f) => f.estado === 'pagada' && new Date(f.fechaEmision).getMonth() === now.getMonth() && new Date(f.fechaEmision).getFullYear() === now.getFullYear())
    .reduce((acc, f) => acc + Number(f.total || 0), 0);

    .filter((f) => f.estado !== 'cancelada' && f.fechaEmision && new Date(f.fechaEmision).getFullYear() === anioActual)
    .reduce((acc, f) => acc + Number(f.total || 0), 0);
  const cobradoAnio = pagos

        <StatCard label="Pendiente de cobro" value={formatCurrency(totalPendienteCobro)} icon={Icons.Euro} tone="amber" trend={`${facturasPendientes.length} facturas`} />
        <StatCard label="Facturado este mes" value={formatCurrency(facturadoMes)} icon={Icons.Receipt} tone="emerald" />
      </div>

      <div className="bg-white rounded-2xl border border-slate-100 shadow-card p-5 mb-6">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-sm font-semibold text-ink-800">Facturación {anioActual}</h3>
          <button onClick={() => navigate('contabilidad')} className="text-xs font-medium text-brand-600 hover:underline">Ver contabilidad</button>
        </div>
        <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
          <div>
            <p className="text-xs text-slate-400">Facturado</p>
            <p className="text-xl sm:text-2xl font-bold text-ink-900">{formatCurrency(facturadoAnio)}</p>
          </div>

          </div>

// Formulario de alta/edición de tarea, siempre dentro de una ventana modal.
function TareaForm({ initial, clientes, proyectos, onClienteCreado, onCancel, onSaved }) {
  const toast = useToast();
  function fechaHoy() { return toDateInput(new Date()); }
  function fechaEn7Dias() { const d = new Date(); d.setDate(d.getDate() + 7); return toDateInput(d); }

  const [form, setForm] = useState(initial ? {
    titulo: initial.titulo,
    fechaInicio: toDateInput(initial.fechaInicio) || fechaHoy(),
    fechaLimite: toDateInput(initial.fechaLimite) || fechaEn7Dias(),
    prioridad: initial.prioridad || 'media', estado: initial.estado || 'pendiente',
    clienteId: initial.clienteId || '', proyectoRelacionadoId: initial.proyectoRelacionadoId || '',
    destacada: !!initial.destacada,
  } : {
    titulo: '', fechaInicio: fechaHoy(), fechaLimite: fechaEn7Dias(), prioridad: 'media', estado: 'pendiente',
    clienteId: '', proyectoRelacionadoId: '', destacada: false,
  });
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  async function handleSubmit(e) {
    e.preventDefault();
    if (!form.titulo.trim()) { toast('Escribe un título para la tarea', 'error'); return; }
    setSaving(true);
    try {
      const payload = {
        titulo: form.titulo.trim(), estado: form.estado, prioridad: form.prioridad,
        fechaInicio: form.fechaInicio || null, fechaLimite: form.fechaLimite || null,
        clienteId: form.clienteId || null, proyectoRelacionadoId: form.proyectoRelacionadoId || null,
        destacada: !!form.destacada,
      };
      if (initial) await api.update('Tarea', initial.id, payload);
      else await api.insert('Tarea', { ...payload, orden: 0, proyectoId: null });
      toast(initial ? 'Tarea actualizada' : 'Tarea añadida');
      onSaved();
    } catch (err) { toast(err.message || 'Error al guardar', 'error'); }
    finally { setSaving(false); }
  }

  return (
    <form onSubmit={handleSubmit}>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <Field label="Título" required className="sm:col-span-2"><Input value={form.titulo} onChange={set('titulo')} autoFocus required /></Field>
        <Field label="Fecha de inicio"><Input type="date" value={form.fechaInicio} onChange={set('fechaInicio')} /></Field>
        <Field label="Fecha límite"><Input type="date" value={form.fechaLimite} onChange={set('fechaLimite')} /></Field>
        <Field label="Prioridad">
          <Select value={form.prioridad} onChange={set('prioridad')}>
            <option value="baja">Baja</option><option value="media">Media</option><option value="alta">Alta</option>
          </Select>
        </Field>
        <Field label="Estado">
          <Select value={form.estado} onChange={set('estado')}>
            <option value="pendiente">Pendiente</option><option value="en_progreso">En progreso</option>
            <option value="completada">Completada</option><option value="cancelada">Cancelada</option>
          </Select>
        </Field>
        <Field label="Cliente (opcional)" className="sm:col-span-2">
          <ClienteSelect value={form.clienteId} clientes={clientes} onChange={(v) => setForm((f) => ({ ...f, clienteId: v }))} onCreado={onClienteCreado} placeholder="Sin cliente" />
        </Field>
        <Field label="Proyecto (opcional)" className="sm:col-span-2">
          <ProyectoSelect value={form.proyectoRelacionadoId} proyectos={proyectos} clienteId={form.clienteId} onChange={(v) => setForm((f) => ({ ...f, proyectoRelacionadoId: v }))} placeholder="Sin proyecto" />
        </Field>
      </div>
      <label className="flex items-center gap-2 text-sm text-ink-700 mt-4">
        <input type="checkbox" checked={!!form.destacada} onChange={(e) => setForm((f) => ({ ...f, destacada: e.target.checked }))} className="rounded border-slate-300 text-brand-600 focus:ring-brand-500" />
        Destacar esta tarea
      </label>
      <div className="flex justify-end gap-2 mt-5">
        <Button variant="secondary" type="button" onClick={onCancel}>Cancelar</Button>
        <Button type="submit" disabled={saving}>{saving ? 'Guardando...' : 'Guardar tarea'}</Button>
      </div>
    </form>
  );
}

function Tareas({ navigate }) {
  const toast = useToast();
  const [loading, setLoading] = useState(true);
  const [items, setItems] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [proyectos, setProyectos] = useState([]);
  const [search, setSearch] = useState('');
  const [tab, setTab] = useState('pendientes');
  const [modal, setModal] = useState(null); // {mode:'new'|'edit', tarea}
  const [toDelete, setToDelete] = useState(null);
  const [sort, setSort] = useState({ key: 'fecha', dir: 'asc' });
  const onSort = (key) => setSort((s) => toggleSort(s, key));

  async function load() {
    setLoading(true);
    const [ta, cl, py] = await Promise.all([
      api.list('Tarea'), api.list('Cliente', { order: 'nombre', ascending: true }), api.list('Proyecto'),
    ]);
    setItems(ta.filter((t) => !t.proyectoId));
    setClientes(cl); setProyectos(py);
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const clienteById = Object.fromEntries(clientes.map((c) => [c.id, c]));
  const proyectoById = Object.fromEntries(proyectos.map((p) => [p.id, p]));

  function handleClienteCreado(c) {
    setClientes((cs) => [...cs, c]);
  }

  async function toggleDestacada(t) {
    await api.update('Tarea', t.id, { destacada: !t.destacada });
    load();
  }
  async function handleDelete() {
    try { await api.remove('Tarea', toDelete.id); toast('Tarea eliminada'); setToDelete(null); load(); }
    catch (err) { toast('No se pudo eliminar', 'error'); setToDelete(null); }
  }

  const filtered = items.filter((t) => {
    if (tab === 'pendientes' && !['pendiente', 'en_progreso'].includes(t.estado)) return false;
    if (tab === 'completadas' && t.estado !== 'completada') return false;
    const q = search.toLowerCase();
    if (!q) return true;
    return [t.titulo, (clienteById[t.clienteId] || {}).nombre, (proyectoById[t.proyectoRelacionadoId] || {}).nombre]
      .filter(Boolean).some((v) => v.toLowerCase().includes(q));
  });
  const sorted = sortRows(filtered, sort, {
    fecha: (t) => t.fechaLimite || t.fechaInicio || '9999-12-31',
    titulo: (t) => (t.titulo || '').toLowerCase(),
    prioridad: (t) => ({ alta: 0, media: 1, baja: 2 }[t.prioridad] ?? 1),
    estado: (t) => t.estado,
  });

  const pendientesCount = items.filter((t) => ['pendiente', 'en_progreso'].includes(t.estado)).length;
  const destacadasCount = items.filter((t) => t.destacada && t.estado !== 'completada').length;

  return (

            <h3 className="text-sm font-semibold text-ink-800 capitalize">{monthLabel}</h3>

            </div>

              <div className="grid grid-cols-7 gap-1 text-center text-[11px] font-semibold text-slate-400 mb-1">

                  const k = dateKey(d);

                    <button key={idx} type="button" onClick={() => setSelectedKey(isSelected ? null : k)}

                      {dayItems.length > 0 && (

                <div className="mt-4 border-t border-slate-100 pt-3">
                  <p className="text-xs font-semibold text-ink-600 mb-1.5">{formatDate(selectedKey)}</p>

        <div className="bg-white rounded-2xl border border-slate-100 shadow-card p-4 sm:p-5">
          <h3 className="text-sm font-semibold text-ink-800 mb-1">Próximos avisos</h3>
          <p className="text-xs text-slate-400 mb-3">Vencidos y próximos 7 días</p>
          {loading ? <PageLoader /> : proximos.length === 0 ? (
            <EmptyState icon={Icons.Bell} title="Todo al día" message="No hay tareas, facturas ni renovaciones próximas." />

            <div className="space-y-0.5 max-h-[420px] overflow-y-auto">
              {proximos.map((it) => <AvisoItem key={it.id} item={it} onClick={() => goToItem(it)} />)}

          )}
        </div>
      </div>
    </div>
  );
}

// Validación de NIF español: DNI, NIE y CIF (comprueba la letra o dígito de control). Devuelve { ok, tipo } o { ok: false, msg }.
function validarNifEspanol(valor) {
  const nif = String(valor || '').toUpperCase().replace(/[\s.-]/g, '');
  const LETRAS = 'TRWAGMYFPDXBNJZSQVHLCKE';
  if (/^\d{8}[A-Z]$/.test(nif)) {
    return LETRAS[parseInt(nif.slice(0, 8), 10) % 23] === nif[8] ? { ok: true, tipo: 'DNI' } : { ok: false, msg: 'La letra del DNI no coincide' };
  }
  if (/^[XYZ]\d{7}[A-Z]$/.test(nif)) {
    const n = parseInt('XYZ'.indexOf(nif[0]) + nif.slice(1, 8), 10);
    return LETRAS[n % 23] === nif[8] ? { ok: true, tipo: 'NIE' } : { ok: false, msg: 'La letra del NIE no coincide' };
  }
  if (/^[ABCDEFGHJKLMNPQRSUVW]\d{7}[0-9A-J]$/.test(nif)) {
    let suma = 0;
    for (let i = 0; i < 7; i++) {
      const d = parseInt(nif[i + 1], 10);
      if (i % 2 === 0) { const x = d * 2; suma += Math.floor(x / 10) + (x % 10); } else suma += d;
    }
    const control = (10 - (suma % 10)) % 10;
    const letra = 'JABCDEFGHI'[control];
    const ultimo = nif[8];
    const exigeLetra = 'PQRSNWKLM'.includes(nif[0]);
    const exigeNumero = 'ABEH'.includes(nif[0]);
    const valido = exigeLetra ? ultimo === letra : exigeNumero ? ultimo === String(control) : (ultimo === letra || ultimo === String(control));
    return valido ? { ok: true, tipo: 'CIF' } : { ok: false, msg: 'El dígito de control del CIF no coincide' };
  }
  return { ok: false, msg: 'Formato no válido (DNI 12345678Z, NIE X1234567L o CIF B12345678)' };
}
function validarNifIva(valor) {
  const v = String(valor || '').toUpperCase().replace(/[\s.-]/g, '');
  return /^[A-Z]{2}[A-Z0-9]{2,13}$/.test(v) ? { ok: true } : { ok: false, msg: 'Formato: código de país + número (por ejemplo DE123456789)' };
}
// Mensaje bajo el campo: ✓ válido o motivo del error
const avisoNif = (res) => (res ? (res.ok ? <span className="text-emerald-600">✓ {res.tipo ? `${res.tipo} válido` : 'Formato correcto'}</span> : <span className="text-rose-600">{res.msg}</span>) : undefined);

// Autocompletado "aprendido" de los propios clientes: CP → población y provincia más usadas, y listas de sugerencias
function construirAprendizajeClientes(clientes) {
  const porCP = {}; const poblaciones = new Set(); const etiquetas = new Set();
  (clientes || []).forEach((c) => {
    if (c.poblacion) poblaciones.add(c.poblacion);
    (c.etiquetas || []).forEach((t) => etiquetas.add(t));
    if (c.codigoPostal && c.poblacion) {
      const g = porCP[c.codigoPostal] = porCP[c.codigoPostal] || { pob: {}, prov: {} };
      g.pob[c.poblacion] = (g.pob[c.poblacion] || 0) + 1;
      if (c.provincia) g.prov[c.provincia] = (g.prov[c.provincia] || 0) + 1;
    }
  });
  const masFrecuente = (o) => Object.entries(o).sort((a, b) => b[1] - a[1])[0];
  const cpMap = {};
  Object.entries(porCP).forEach(([cp, g]) => { cpMap[cp] = { poblacion: (masFrecuente(g.pob) || [''])[0], provincia: (masFrecuente(g.prov) || [''])[0] }; });
  return { cpMap, poblaciones: Array.from(poblaciones).sort(), etiquetas: Array.from(etiquetas).sort() };
}

// "nombre" guarda siempre el nombre completo (así el resto de la app no cambia); nombrePila y apellidos son el desglose.
// Los clientes antiguos solo tienen "nombre": se muestra entero en el campo Nombre para que puedas separar los apellidos.
function clienteAFormulario(c) {
  if (!c) return { ...CLIENTE_EMPTY };
  const compuesto = [c.nombrePila, c.apellidos].filter(Boolean).join(' ');
  const desglosado = (c.nombrePila || c.apellidos) && compuesto === (c.nombre || '');
  return {
    ...CLIENTE_EMPTY, ...c,
    nombrePila: desglosado ? (c.nombrePila || '') : (c.nombre || ''),
    apellidos: desglosado ? (c.apellidos || '') : '',
    provincia: c.provincia || 'Sevilla', pais: c.pais || 'España',
    sitioWeb: c.sitioWeb || 'https://', sitioWeb2: c.sitioWeb2 || 'https://',
    etiquetas: c.etiquetas || [],
  };
}

// "https://" solo, o vacío, se guarda como sin web; si falta el protocolo se añade
function normalizarWeb(v) {
  const t = (v || '').trim();
  if (!t || /^https?:\/\/$/i.test(t)) return null;
  return /^https?:\/\//i.test(t) ? t : 'https://' + t;
}

        <h4 className="text-lg font-bold text-ink-900">{titulo}</h4>
      </div>
      <div className="grid grid-cols-1 sm:grid-cols-6 lg:grid-cols-12 gap-x-4 gap-y-4">{children}</div>
    </section>
  );
}

function TagInput({ value, onChange, placeholder, sugerencias }) {
  const [texto, setTexto] = useState('');
  const tags = value || [];
  function agregar(t) {
    const limpio = t.replace(/,/g, '').trim();
    if (limpio && !tags.some((x) => x.toLowerCase() === limpio.toLowerCase())) onChange([...tags, limpio]);
    setTexto('');
  }
  return (
    <div className={classNames(inputCls, 'flex flex-wrap items-center gap-1.5 !py-1.5 min-h-[40px]')}>
      {tags.map((t) => (
        <span key={t} className="inline-flex items-center gap-1 rounded-full bg-slate-100 text-slate-700 text-xs font-medium pl-2.5 pr-1.5 py-1">
          {t}
          <button type="button" aria-label={`Quitar ${t}`} onClick={() => onChange(tags.filter((x) => x !== t))} className="hover:text-rose-600"><Icons.X className="w-3 h-3" /></button>
        </span>
      ))}
      <input value={texto} placeholder={tags.length ? '' : placeholder}
        onChange={(e) => { if (e.target.value.includes(',')) agregar(e.target.value); else setTexto(e.target.value); }}
        onKeyDown={(e) => {
          if (e.key === 'Enter') { e.preventDefault(); agregar(texto); }
          else if (e.key === 'Backspace' && !texto && tags.length) onChange(tags.slice(0, -1));
        }}
        onBlur={() => { if (texto.trim()) agregar(texto); }}
        list={sugerencias ? 'lista-etiquetas' : undefined}
        className="flex-1 min-w-[6rem] bg-transparent outline-none text-sm py-0.5" />
      {sugerencias && <datalist id="lista-etiquetas">{sugerencias.filter((t) => !tags.includes(t)).map((t) => <option key={t} value={t} />)}</datalist>}
    </div>
  );
}

  particular: 'Particular', autonomo: 'Autónomo', empresa: 'Empresa', ue: 'Empresa de la UE', fuera_ue: 'Fuera de la UE',
};
const CLIENTE_TIPO_AYUDA = {
  particular: 'Sin retención de IRPF. Factura simplificada si no supera 400 €.',
  autonomo: 'Se aplica retención de IRPF en la factura.',
  empresa: 'Se aplica retención de IRPF en la factura.',
  ue: 'Factura sin IVA (inversión del sujeto pasivo).',
