// ---------- Historial (llamadas, reuniones, emails, notas de seguimiento) ----------
const INTERACCION_EMPTY = { tipo: 'nota', fecha: toDateInput(new Date()), descripcion: '' };
const INTERACCION_TIPOS = {
  llamada: { label: 'Llamada', icon: 'Phone', color: 'blue' },
  reunion: { label: 'Reunión', icon: 'Users', color: 'violet' },
  email: { label: 'Email', icon: 'Mail', color: 'amber' },
  nota: { label: 'Nota', icon: 'FileText', color: 'slate' },
  otro: { label: 'Otro', icon: 'Alert', color: 'rose' },
};
const TIPO_TONES = {
  blue: 'bg-blue-50 text-blue-600', violet: 'bg-violet-50 text-violet-600',
  amber: 'bg-amber-50 text-amber-600', slate: 'bg-slate-100 text-slate-500', rose: 'bg-rose-50 text-rose-600',
};

function InteraccionForm({ clienteId, initial, mode, onCancel, onSaved }) {
  const toast = useToast();
  const [form, setForm] = useState(initial
    ? { tipo: initial.tipo, fecha: mode === 'duplicate' ? toDateInput(new Date()) : toDateInput(initial.fecha), descripcion: initial.descripcion }
    : INTERACCION_EMPTY);
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  async function handleSubmit(e) {
    e.preventDefault();
    if (!form.descripcion.trim()) { toast('Describe brevemente la interacción', 'error'); return; }
    setSaving(true);
    try {
      if (mode === 'edit') {
        await api.update('ClienteInteraccion', initial.id, form);
        toast('Registro actualizado');
      } else {
        await api.insert('ClienteInteraccion', { ...form, clienteId });
        toast(mode === 'duplicate' ? 'Registro duplicado' : 'Registrado en el historial');
      }
      onSaved();
    } catch (err) {
      toast(err.message || 'Error al guardar', 'error');
    } finally {
      setSaving(false);
    }
  }

  return (
    <form onSubmit={handleSubmit} className="bg-slate-50 rounded-xl p-4 mb-4 border border-slate-100">
      <div className="grid grid-cols-1 sm:grid-cols-[140px_140px_1fr] gap-3">
        <Field label="Tipo">
          <Select value={form.tipo} onChange={set('tipo')}>
            {Object.entries(INTERACCION_TIPOS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
          </Select>
        </Field>
        <Field label="Fecha"><Input type="date" value={form.fecha} onChange={set('fecha')} autoFocus={mode === 'duplicate'} /></Field>
        <Field label="Descripción"><Input value={form.descripcion} onChange={set('descripcion')} placeholder="¿Qué se habló o hizo?" autoFocus={mode !== 'duplicate'} /></Field>
      </div>
      <div className="flex justify-end gap-2 mt-3">
        <Button variant="secondary" size="sm" type="button" onClick={onCancel}>Cancelar</Button>
        <Button size="sm" type="submit" disabled={saving}>
          {saving ? 'Guardando...' : mode === 'edit' ? 'Guardar cambios' : mode === 'duplicate' ? 'Crear duplicado' : 'Añadir al historial'}
        </Button>
      </div>
    </form>
  );
}

function ClienteHistorial({ clienteId }) {
  const toast = useToast();
  const [loading, setLoading] = useState(true);
  const [items, setItems] = useState([]);
  const [formState, setFormState] = useState(null); // null | 'new' | {mode:'edit'|'duplicate', item}
  const [toDelete, setToDelete] = useState(null);

  async function load() {
    setLoading(true);
    const all = await api.list('ClienteInteraccion', { order: 'fecha', ascending: false });
    setItems(all.filter((i) => i.clienteId === clienteId));
    setLoading(false);
  }
  useEffect(() => { load(); }, [clienteId]);

  async function handleDelete() {
    try {
      await api.remove('ClienteInteraccion', toDelete.id);
      toast('Registro eliminado');
      setToDelete(null);
      load();
    } catch (err) {
      toast(err.message || 'Error al eliminar', 'error');
    }
  }

  return (
    <div>
      <div className="flex items-center justify-between gap-3 mb-3">
        <p className="text-xs text-slate-400">Llamadas, reuniones, emails y notas de seguimiento con este cliente.</p>
        {!formState && <Button size="sm" variant="secondary" icon={Icons.Plus} type="button" onClick={() => setFormState('new')}>Añadir</Button>}
      </div>

      {formState && (
        <InteraccionForm
          clienteId={clienteId}
          initial={formState !== 'new' ? formState.item : null}
          mode={formState !== 'new' ? formState.mode : 'new'}
          onCancel={() => setFormState(null)}
          onSaved={() => { setFormState(null); load(); }}
        />
      )}

      {loading ? <PageLoader /> : items.length === 0 ? (
        <EmptyState icon={Icons.FileText} title="Sin historial todavía" message="Registra llamadas, reuniones o notas para llevar seguimiento de este cliente." />
      ) : (
        <div className="space-y-0.5">
          {items.map((it) => {
            const info = INTERACCION_TIPOS[it.tipo] || INTERACCION_TIPOS.nota;
            const Ic = Icons[info.icon] || Icons.FileText;
            return (
              <div key={it.id} className="flex items-center gap-3 py-2.5 border-b border-slate-100 last:border-0">
                <div className={classNames('w-8 h-8 rounded-lg flex items-center justify-center shrink-0', TIPO_TONES[info.color])}>
                  <Ic className="w-4 h-4" />
                </div>
                <span className="text-xs font-semibold text-ink-700 shrink-0 w-16 truncate">{info.label}</span>
                <span className="text-xs text-slate-400 shrink-0 w-20">{formatDate(it.fecha)}</span>
                <p className="text-sm text-ink-600 truncate min-w-0 flex-1">{it.descripcion}</p>
                <div className="flex items-center gap-1 shrink-0">

                  <button type="button" title="Editar" onClick={() => setFormState({ mode: 'edit', item: it })} className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-400"><Icons.Edit className="w-3.5 h-3.5" /></button>
                  <button type="button" title="Eliminar" onClick={() => setToDelete(it)} className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500"><Icons.Trash className="w-3.5 h-3.5" /></button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <ConfirmDialog open={!!toDelete} title="Eliminar registro" danger
        message="¿Eliminar esta entrada del historial?"
        onCancel={() => setToDelete(null)} onConfirm={handleDelete} />
    </div>
  );
}

function ClienteModalBody({ modal, onCancel, onSaved }) {
  const [tab, setTab] = useState('datos');

const PAGE_SIZE_CLIENTES = 25;

function Clientes() {
  const toast = useToast();
  const [loading, setLoading] = useState(true);
  const [clientes, setClientes] = useState([]);
  const [search, setSearch] = useState('');
  const [modal, setModal] = useState(null); // {mode:'new'|'edit', cliente}
  const [toDelete, setToDelete] = useState(null);
  const [filterEstado, setFilterEstado] = useState('todos');
  const [sort, setSort] = useState({ key: 'nombre', dir: 'asc' });
  const onSort = (key) => setSort((s) => toggleSort(s, key));
  const [page, setPage] = useState(1);

  async function load() {
    setLoading(true);
    setClientes(await api.list('Cliente', { order: 'nombre', ascending: true }));
    setLoading(false);
  }
  useEffect(() => { load(); }, []);
  useEffect(() => { setPage(1); }, [search, filterEstado, sort]);

  const filtered = clientes.filter((c) => {
    if (filterEstado !== 'todos' && c.estado !== filterEstado) return false;
    const q = search.toLowerCase();
    if (!q) return true;
    return [c.nombre, c.empresa, c.email, c.telefono, c.nif].filter(Boolean).some((v) => v.toLowerCase().includes(q));
  });
  const sorted = sortRows(filtered, sort, {
    nombre: (c) => (c.empresa || c.nombre || '').toLowerCase(),
    poblacion: (c) => c.poblacion,
    estado: (c) => c.estado,
  });
  const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE_CLIENTES));
  const paged = sorted.slice((page - 1) * PAGE_SIZE_CLIENTES, page * PAGE_SIZE_CLIENTES);

  async function handleDelete() {
    try {
      await api.remove('Cliente', toDelete.id);
      toast('Cliente eliminado');
      setToDelete(null);
      load();
    } catch (err) {
      toast('No se puede eliminar: tiene proyectos, presupuestos o facturas asociadas', 'error');
      setToDelete(null);
    }
  }

  return (
    <div className="fade-in">
      <PageHeader title="Clientes" subtitle={`${clientes.length} clientes registrados`}
        action={<Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo cliente</Button>} />

      <Toolbar search={search} onSearch={setSearch} placeholder="Buscar cliente, empresa, email..."
        right={
          <Select value={filterEstado} onChange={(e) => setFilterEstado(e.target.value)} className="!py-1.5 !text-xs w-auto">
            <option value="todos">Todos los estados</option>
            <option value="activo">Activos</option>
            <option value="potencial">Potenciales</option>
            <option value="inactivo">Inactivos</option>
          </Select>
        } />

      {loading ? <PageLoader /> : filtered.length === 0 ? (
        <CardTable><EmptyState icon={Icons.Users} title="No hay clientes" message="Añade tu primer cliente para empezar." action={<Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo cliente</Button>} /></CardTable>
      ) : (
        <CardTable footer={<Pagination page={page} totalPages={totalPages} onPageChange={setPage} totalItems={sorted.length} pageSize={PAGE_SIZE_CLIENTES} />}>
          <table className="w-full min-w-[720px]">
            <thead className="bg-slate-700 text-white"><tr>
              <SortableTh sortKey="nombre" sort={sort} onSort={onSort}>Cliente</SortableTh>
              <Th>Contacto</Th>
              <SortableTh sortKey="poblacion" sort={sort} onSort={onSort}>Población</SortableTh>
              <SortableTh sortKey="estado" sort={sort} onSort={onSort}>Estado</SortableTh>
              <Th className="text-right">Acciones</Th>
            </tr></thead>
            <tbody className="divide-y divide-slate-200">
              {paged.map((c) => (
                <tr key={c.id} className="hover:bg-slate-50/60 cursor-pointer" onClick={() => setModal({ mode: 'edit', cliente: c })}>
                  <Td>
                    <div className="flex items-center gap-3">
                      <Avatar name={c.nombre} />
                      <div className="min-w-0">
                        <div className="flex items-center gap-1">
                          <p className="font-medium text-ink-800 truncate">{c.empresa || c.nombre || '—'}</p>
                          <CopyIconButton text={c.nombre} label="nombre" />
                        </div>
                        {c.empresa && <p className="text-xs text-slate-400 truncate">{c.nombre}</p>}
                      </div>
                    </div>
                  </Td>
                  <Td onClick={(e) => e.stopPropagation()}>
                    <div className="text-xs"><EmailLink email={c.email} /></div>
                    <div className="text-xs mt-0.5"><PhoneLink phone={c.telefono} /></div>
                  </Td>
                  <Td>{c.poblacion || '—'}</Td>
                  <Td><EstadoBadge estado={c.estado} /></Td>
                  <Td className="text-right" onClick={(e) => e.stopPropagation()}>
                    <div className="flex justify-end gap-1">
                      <button className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500" onClick={() => setModal({ mode: 'edit', cliente: c })}><Icons.Edit className="w-4 h-4" /></button>
                      <button className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500" onClick={() => setToDelete(c)}><Icons.Trash className="w-4 h-4" /></button>
                    </div>
                  </Td>
                </tr>
              ))}
            </tbody>
          </table>
        </CardTable>
      )}

      <Modal open={!!modal} onClose={() => setModal(null)} title={modal?.mode === 'edit' ? 'Editar cliente' : 'Nuevo cliente'} size="xl">
        {modal && <ClienteModalBody modal={modal} onCancel={() => setModal(null)} onSaved={() => { setModal(null); load(); }} />}
      </Modal>

      <ConfirmDialog open={!!toDelete} title="Eliminar cliente" danger
        message={`¿Seguro que quieres eliminar a "${toDelete?.nombre}"? Esta acción no se puede deshacer.`}
        onCancel={() => setToDelete(null)} onConfirm={handleDelete} />
    </div>
  );
}

  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  async function handleSubmit(e) {
    e.preventDefault();
    if (!form.nombre.trim()) { toast('El nombre es obligatorio', 'error'); return; }
    setSaving(true);
    try {
      if (form.id) {
        const { id, createdAt, ...payload } = form;
        await api.update('Proveedor', form.id, payload);
        toast('Proveedor actualizado');
      } else {
        await api.insert('Proveedor', form);
        toast('Proveedor creado');
      }
      onSaved();

    <form onSubmit={handleSubmit}>

        <Field label="Persona de contacto"><Input value={form.personaContacto || ''} onChange={set('personaContacto')} /></Field>

        <Field label="Estado">

            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
          </Select>
        </Field>

        <Field label="Email"><Input type="email" value={form.email || ''} onChange={set('email')} /></Field>

        <Field label="Sitio web"><Input value={form.sitioWeb || ''} onChange={set('sitioWeb')} placeholder="https://" /></Field>

        <Field label="Población"><Input value={form.poblacion || ''} onChange={set('poblacion')} /></Field>
        <Field label="Provincia" className="lg:col-span-2"><Input value={form.provincia || ''} onChange={set('provincia')} /></Field>

        <Field label="Notas" className="sm:col-span-2 lg:col-span-3"><Textarea value={form.notas || ''} onChange={set('notas')} /></Field>

const PRODUCTO_EMPTY = { nombre: '', descripcion: '', categoria: '', tipo: 'servicio', precio: '', iva: 21, coste: '', activo: true, proveedorId: '' };

function ProductoForm({ initial, proveedores, categorias, onCategoriaCreada, onCancel, onSaved }) {
  const toast = useToast();
  const [form, setForm] = useState(initial || PRODUCTO_EMPTY);
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  async function handleSubmit(e) {
    e.preventDefault();
    if (!form.nombre.trim()) { toast('El nombre es obligatorio', 'error'); return; }
    setSaving(true);
    try {
      const payload = {
        ...form,
        precio: Number(form.precio || 0),
        iva: Number(form.iva || 0),
        coste: form.coste === '' ? null : Number(form.coste),
        proveedorId: form.proveedorId || null,
        activo: !!form.activo,
      };
      if (form.id) {
        const { id, createdAt, ...rest } = payload;
        await api.update('Producto', form.id, rest);
        toast('Producto actualizado');
      } else {
        await api.insert('Producto', payload);
        toast('Producto creado');
      }
      onSaved();
    } catch (err) { toast(err.message || 'Error al guardar', 'error'); }
    finally { setSaving(false); }
  }

  return (
    <form onSubmit={handleSubmit}>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <Field label="Nombre" required className="sm:col-span-2"><Input value={form.nombre} onChange={set('nombre')} required autoFocus /></Field>
        <Field label="Descripción" className="sm:col-span-2"><Textarea value={form.descripcion || ''} onChange={set('descripcion')} /></Field>
        <Field label="Tipo">
          <Select value={form.tipo} onChange={set('tipo')}>
            <option value="servicio">Servicio</option>
            <option value="producto">Producto</option>
            <option value="suscripcion">Suscripción</option>
          </Select>
        </Field>
        <Field label="Categoría">
          <CategoriaSelect value={form.categoria} categorias={categorias} onChange={(v) => setForm((f) => ({ ...f, categoria: v }))} onCreada={onCategoriaCreada} />
        </Field>
        <Field label="Precio de venta (€)" required hint={form.precio ? `Con IVA: ${formatCurrency(priceWithIVA(form.precio, form.iva))}` : undefined}>
          <Input type="number" step="0.01" min="0" value={form.precio} onChange={set('precio')} required />
        </Field>
        <Field label="IVA (%)"><Input type="number" step="0.01" min="0" value={form.iva} onChange={set('iva')} /></Field>
        <Field label="Coste (€)" hint="Si lo subcontratas a un proveedor"><Input type="number" step="0.01" min="0" value={form.coste ?? ''} onChange={set('coste')} /></Field>
        <Field label="Proveedor asociado">
          <Select value={form.proveedorId || ''} onChange={set('proveedorId')}>
            <option value="">Ninguno</option>
            {proveedores.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
          </Select>
        </Field>
        <Field label="Estado" className="sm:col-span-2">
          <label className="flex items-center gap-2 text-sm text-ink-700">
            <input type="checkbox" checked={!!form.activo} onChange={(e) => setForm((f) => ({ ...f, activo: e.target.checked }))} className="rounded border-slate-300 text-brand-600 focus:ring-brand-500" />
            Activo (visible al crear presupuestos/facturas)
          </label>
        </Field>
      </div>
      <div className="flex justify-end gap-2 mt-5">
        <Button variant="secondary" type="button" onClick={onCancel}>Cancelar</Button>
        <Button type="submit" disabled={saving}>{saving ? 'Guardando...' : 'Guardar producto'}</Button>
      </div>
    </form>
  );
}

const PAGE_SIZE_PRODUCTOS = 25;

function Productos() {
  const toast = useToast();
  const [loading, setLoading] = useState(true);
  const [items, setItems] = useState([]);
  const [proveedores, setProveedores] = useState([]);
  const [categorias, setCategorias] = useState([]);
  const [search, setSearch] = useState('');
  const [modal, setModal] = useState(null);
  const [toDelete, setToDelete] = useState(null);
  const [sort, setSort] = useState({ key: null, dir: 'asc' });
  const onSort = (key) => setSort((s) => toggleSort(s, key));
  const [page, setPage] = useState(1);

  async function load() {
    setLoading(true);
    const [prods, provs, cats] = await Promise.all([
      api.list('Producto', { order: 'nombre', ascending: true }),
      api.list('Proveedor', { order: 'nombre', ascending: true }),
      api.list('CategoriaServicio', { order: 'nombre', ascending: true }),
    ]);
    setItems(prods); setProveedores(provs); setCategorias(cats); setLoading(false);
  }
  useEffect(() => { load(); }, []);
  useEffect(() => { setPage(1); }, [search, sort]);

  const provById = Object.fromEntries(proveedores.map((p) => [p.id, p]));
  const filtered = items.filter((p) => {
    const q = search.toLowerCase();
    if (!q) return true;
    return [p.nombre, p.categoria, p.tipo].filter(Boolean).some((v) => v.toLowerCase().includes(q));
  });
  const sorted = sortRows(filtered, sort, {
    nombre: (p) => p.nombre,
    categoria: (p) => p.categoria,
    proveedor: (p) => (provById[p.proveedorId] || {}).nombre,
    precio: (p) => Number(p.precio || 0),
    precioIva: (p) => priceWithIVA(p.precio, p.iva),
    estado: (p) => (p.activo ? 1 : 0),
  });
  const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE_PRODUCTOS));
  const paged = sorted.slice((page - 1) * PAGE_SIZE_PRODUCTOS, page * PAGE_SIZE_PRODUCTOS);

  async function handleDelete() {
    try { await api.remove('Producto', toDelete.id); toast('Producto eliminado'); setToDelete(null); load(); }
    catch (err) { toast('No se puede eliminar este producto', 'error'); setToDelete(null); }
  }

  return (
    <div className="fade-in">
      <PageHeader title="Productos y servicios" subtitle={`${items.length} elementos en el catálogo`}
        action={<Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo producto</Button>} />
      <Toolbar search={search} onSearch={setSearch} placeholder="Buscar producto o servicio..." />
      {loading ? <PageLoader /> : filtered.length === 0 ? (
        <CardTable><EmptyState icon={Icons.Box} title="No hay productos" action={<Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo producto</Button>} /></CardTable>
      ) : (
        <CardTable footer={<Pagination page={page} totalPages={totalPages} onPageChange={setPage} totalItems={sorted.length} pageSize={PAGE_SIZE_PRODUCTOS} />}>
          <table className="w-full min-w-[800px]">
            <thead className="bg-slate-700 text-white"><tr>
              <SortableTh sortKey="nombre" sort={sort} onSort={onSort}>Nombre</SortableTh>
              <SortableTh sortKey="categoria" sort={sort} onSort={onSort}>Categoría</SortableTh>
              <SortableTh sortKey="proveedor" sort={sort} onSort={onSort}>Proveedor</SortableTh>
              <SortableTh sortKey="precio" sort={sort} onSort={onSort} className="text-right">Precio</SortableTh>
              <SortableTh sortKey="precioIva" sort={sort} onSort={onSort} className="text-right">Precio c/IVA</SortableTh>
              <SortableTh sortKey="estado" sort={sort} onSort={onSort}>Estado</SortableTh>
              <Th className="text-right">Acciones</Th>
            </tr></thead>
            <tbody className="divide-y divide-slate-200">
              {paged.map((p) => (
                <tr key={p.id} className="hover:bg-slate-50/60">
                  <Td><p className="font-medium text-ink-800">{p.nombre}</p><p className="text-xs text-slate-400 capitalize">{p.tipo}</p></Td>
                  <Td>{p.categoria || '—'}</Td>
                  <Td>{(provById[p.proveedorId] || {}).nombre || '—'}</Td>
                  <Td className="text-right">{formatCurrency(p.precio)}</Td>
                  <Td className="text-right font-medium">{formatCurrency(priceWithIVA(p.precio, p.iva))} <span className="text-slate-400 font-normal">({p.iva}%)</span></Td>
                  <Td>{p.activo ? <EstadoBadge estado="activo" /> : <EstadoBadge estado="inactivo" />}</Td>
                  <Td className="text-right">
                    <div className="flex justify-end gap-1">
                      <button className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500" onClick={() => setModal({ mode: 'edit', item: p })}><Icons.Edit className="w-4 h-4" /></button>
                      <button className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500" onClick={() => setToDelete(p)}><Icons.Trash className="w-4 h-4" /></button>
                    </div>
                  </Td>
                </tr>
              ))}
            </tbody>
          </table>
        </CardTable>
      )}
      <Modal open={!!modal} onClose={() => setModal(null)} title={modal?.mode === 'edit' ? 'Editar producto' : 'Nuevo producto'} wide>
        {modal && <ProductoForm initial={modal.mode === 'edit' ? modal.item : null} proveedores={proveedores} categorias={categorias}
          onCategoriaCreada={(c) => setCategorias((cs) => [...cs, c].sort((a, b) => a.nombre.localeCompare(b.nombre)))}
          onCancel={() => setModal(null)} onSaved={() => { setModal(null); load(); }} />}
      </Modal>
      <ConfirmDialog open={!!toDelete} title="Eliminar producto" danger message={`¿Eliminar "${toDelete?.nombre}"?`} onCancel={() => setToDelete(null)} onConfirm={handleDelete} />
    </div>
  );
}

function TareasPanel({ proyecto, onProgresoChange }) {
  const toast = useToast();
  const [tareas, setTareas] = useState([]);
  const [loading, setLoading] = useState(true);
  const [nueva, setNueva] = useState('');
  const [nuevaFecha, setNuevaFecha] = useState('');
  const [nuevaPrioridad, setNuevaPrioridad] = useState('media');
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState(null);

  async function load() {
    setLoading(true);
    const all = await api.list('Tarea', { order: 'orden', ascending: true });
    const mine = all.filter((t) => t.proyectoId === proyecto.id);
    setTareas(mine);
    setLoading(false);
    if (mine.length > 0) {
      const completadas = mine.filter((t) => t.estado === 'completada').length;
      const nuevoProgreso = Math.round((completadas / mine.length) * 100);
      if (nuevoProgreso !== Number(proyecto.progreso || 0)) {
        try {
          await api.update('Proyecto', proyecto.id, { progreso: nuevoProgreso });
          onProgresoChange && onProgresoChange(nuevoProgreso);
        } catch (e) { /* silencioso */ }
      }
    }
  }
  useEffect(() => { load(); }, [proyecto.id]);

  async function addTarea(e) {
    e.preventDefault();
    if (!nueva.trim()) return;
    try {
      await api.insert('Tarea', { titulo: nueva.trim(), proyectoId: proyecto.id, estado: 'pendiente', orden: tareas.length, fechaLimite: nuevaFecha || null, prioridad: nuevaPrioridad });
      setNueva(''); setNuevaFecha(''); setNuevaPrioridad('media');
      load();
    } catch (err) { toast(err.message || 'Error al crear la tarea', 'error'); }
  }

  const cycle = { pendiente: 'en_progreso', en_progreso: 'completada', completada: 'pendiente' };

  async function toggleEstado(t) {
    await api.update('Tarea', t.id, { estado: cycle[t.estado] || 'pendiente' });
    load();
  }
  async function removeTarea(t) {
    await api.remove('Tarea', t.id);
    load();
  }

  function startEdit(t) {
    setEditingId(t.id);
    setEditForm({ titulo: t.titulo, fechaLimite: toDateInput(t.fechaLimite) || '', prioridad: t.prioridad || 'media' });
  }
  async function saveEdit(t) {
    if (!editForm.titulo.trim()) { toast('El título no puede estar vacío', 'error'); return; }
    try {
      await api.update('Tarea', t.id, { titulo: editForm.titulo.trim(), fechaLimite: editForm.fechaLimite || null, prioridad: editForm.prioridad });
      setEditingId(null);
      load();
    } catch (err) { toast(err.message || 'Error al guardar', 'error'); }
  }

  if (loading) return <PageLoader />;

  return (
    <div>
      <form onSubmit={addTarea} className="flex flex-wrap gap-2 mb-4">
        <Input value={nueva} onChange={(e) => setNueva(e.target.value)} placeholder="Añadir una tarea..." className="flex-1 min-w-[160px]" />
        <Input type="date" value={nuevaFecha} onChange={(e) => setNuevaFecha(e.target.value)} className="!w-40" />
        <Select value={nuevaPrioridad} onChange={(e) => setNuevaPrioridad(e.target.value)} className="!w-32">
          <option value="baja">Baja</option><option value="media">Media</option><option value="alta">Alta</option>
        </Select>
        <Button type="submit" icon={Icons.Plus}>Añadir</Button>
      </form>
      {tareas.length === 0 ? <EmptyState icon={Icons.ListTasks} title="Sin tareas todavía" /> : (
        <div className="space-y-2">
          {tareas.map((t) => (
            editingId === t.id ? (
              <div key={t.id} className="bg-slate-50 rounded-lg px-3 py-2.5 space-y-2">
                <Input value={editForm.titulo} onChange={(e) => setEditForm((f) => ({ ...f, titulo: e.target.value }))} autoFocus />
                <div className="flex flex-wrap gap-2">
                  <Input type="date" value={editForm.fechaLimite} onChange={(e) => setEditForm((f) => ({ ...f, fechaLimite: e.target.value }))} className="!w-40" />
                  <Select value={editForm.prioridad} onChange={(e) => setEditForm((f) => ({ ...f, prioridad: e.target.value }))} className="!w-32">
                    <option value="baja">Baja</option><option value="media">Media</option><option value="alta">Alta</option>
                  </Select>
                  <Button size="sm" variant="secondary" type="button" onClick={() => setEditingId(null)}>Cancelar</Button>
                  <Button size="sm" type="button" onClick={() => saveEdit(t)}>Guardar</Button>
                </div>
              </div>
            ) : (
              <div key={t.id} className="flex items-center gap-3 bg-slate-50 rounded-lg px-3 py-2.5">
                <button onClick={() => toggleEstado(t)} className={classNames(
                  'w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 transition',
                  t.estado === 'completada' ? 'bg-emerald-500 border-emerald-500' : t.estado === 'en_progreso' ? 'border-blue-500' : 'border-slate-300'
                )}>
                  {t.estado === 'completada' && <Icons.Check className="w-3 h-3 text-white" strokeWidth={3} />}
                </button>
                <div className="min-w-0 flex-1">
                  <p className={classNames('text-sm', t.estado === 'completada' ? 'text-slate-400 line-through' : 'text-ink-700')}>{t.titulo}</p>
                  {t.fechaLimite && <p className="text-xs text-slate-400">Vence: {formatDate(t.fechaLimite)}</p>}
                </div>
                <EstadoBadge estado={t.prioridad || 'media'} />
                <EstadoBadge estado={t.estado} />
                <button onClick={() => startEdit(t)} className="p-1 text-slate-400 hover:text-brand-600"><Icons.Edit className="w-4 h-4" /></button>
                <button onClick={() => removeTarea(t)} className="p-1 text-slate-400 hover:text-rose-500"><Icons.Trash className="w-4 h-4" /></button>
              </div>
            )
          ))}
        </div>
      )}
    </div>
  );
}

function ProyectoDocumentos({ proyecto }) {
  const toast = useToast();
  const [files, setFiles] = useState([]);
  const [loading, setLoading] = useState(true);
  const [uploading, setUploading] = useState(false);

  async function load() {
    setLoading(true);
    const { data, error } = await supabaseClient.storage.from('proyecto-documentos').list(proyecto.id, { sortBy: { column: 'created_at', order: 'desc' } });
    if (!error) setFiles((data || []).filter((f) => f.name !== '.emptyFolderPlaceholder'));
    setLoading(false);
  }
  useEffect(() => { load(); }, [proyecto.id]);

  async function handleUpload(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setUploading(true);
    try {
      const path = `${proyecto.id}/${Date.now()}_${file.name}`;
      const { error } = await supabaseClient.storage.from('proyecto-documentos').upload(path, file);
      if (error) throw error;
      toast('Archivo subido');
      load();
    } catch (err) { toast(err.message || 'Error al subir el archivo', 'error'); }
    finally { setUploading(false); }
  }

  async function handleDownload(file) {
    try {
      const path = `${proyecto.id}/${file.name}`;
      const { data, error } = await supabaseClient.storage.from('proyecto-documentos').createSignedUrl(path, 60);
      if (error) throw error;
      window.open(data.signedUrl, '_blank');
    } catch (err) { toast('No se pudo abrir el archivo', 'error'); }
  }

  async function handleDelete(file) {
    try {
      const path = `${proyecto.id}/${file.name}`;
      const { error } = await supabaseClient.storage.from('proyecto-documentos').remove([path]);
      if (error) throw error;
      toast('Archivo eliminado');
      load();
    } catch (err) { toast('No se pudo eliminar', 'error'); }
  }

  function nombreLegible(name) {
    const idx = name.indexOf('_');
    return idx > 0 && /^\d+$/.test(name.slice(0, idx)) ? name.slice(idx + 1) : name;
  }
  function tamanoLegible(bytes) {
    if (!bytes && bytes !== 0) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  return (
    <div>
      <div className="flex items-center justify-between gap-3 mb-3">
        <p className="text-xs text-slate-400">Briefings, diseños, contratos o cualquier archivo relacionado con el proyecto.</p>
        <label className={classNames('inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-medium cursor-pointer',
          uploading ? 'bg-slate-100 text-slate-400' : 'bg-white text-ink-700 border border-slate-200 hover:bg-slate-50')}>
          <Icons.Plus className="w-4 h-4" /> {uploading ? 'Subiendo...' : 'Subir archivo'}
          <input type="file" className="hidden" onChange={handleUpload} disabled={uploading} />
        </label>
      </div>
      {loading ? <PageLoader /> : files.length === 0 ? (
        <EmptyState icon={Icons.FileText} title="Sin documentos" message="Sube el primer archivo de este proyecto." />
      ) : (
        <div className="space-y-1.5">
          {files.map((f) => (
            <div key={f.id || f.name} className="flex items-center gap-3 bg-slate-50 rounded-lg px-3 py-2.5">
              <Icons.FileText className="w-4 h-4 text-slate-400 shrink-0" />
              <div className="min-w-0 flex-1">
                <p className="text-sm text-ink-700 truncate">{nombreLegible(f.name)}</p>
                <p className="text-xs text-slate-400">{tamanoLegible(f.metadata && f.metadata.size)}</p>
              </div>
              <button onClick={() => handleDownload(f)} className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500" title="Descargar"><Icons.Download className="w-4 h-4" /></button>
              <button onClick={() => handleDelete(f)} className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500" title="Eliminar"><Icons.Trash className="w-4 h-4" /></button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ProyectoDocsComerciales({ proyecto, presupuestos, facturas, navigate }) {
  const misPresupuestos = presupuestos.filter((p) => p.proyectoId === proyecto.id);
  const misFacturas = facturas.filter((f) => f.proyectoId === proyecto.id);
  if (misPresupuestos.length === 0 && misFacturas.length === 0) {
    return <p className="text-xs text-slate-400">Sin presupuestos ni facturas ligados a este proyecto todavía.</p>;
  }
  return (
    <div className="space-y-1.5">
      {misPresupuestos.map((p) => (
        <div key={p.id} className="flex items-center gap-3 bg-slate-50 rounded-lg px-3 py-2 text-sm">
          <Icons.FileText className="w-4 h-4 text-slate-400 shrink-0" />
          <span className="text-ink-700">Presupuesto {p.numero}</span>
          <EstadoBadge estado={p.estado} />
          <span className="text-slate-400 ml-auto">{formatCurrency(p.total)}</span>
          <button onClick={() => navigate && navigate('presupuestos')} className="text-xs text-brand-600 hover:underline">Ver</button>
        </div>
      ))}
      {misFacturas.map((f) => (
        <div key={f.id} className="flex items-center gap-3 bg-slate-50 rounded-lg px-3 py-2 text-sm">
          <Icons.Receipt className="w-4 h-4 text-slate-400 shrink-0" />
          <span className="text-ink-700">Factura {f.numero}</span>
          <EstadoBadge estado={f.estado} />
          <span className="text-slate-400 ml-auto">{formatCurrency(f.total)}</span>
          <button onClick={() => navigate && navigate('facturas')} className="text-xs text-brand-600 hover:underline">Ver</button>
        </div>
      ))}
    </div>
  );
}

function Proyectos({ navigate }) {
  const toast = useToast();
  const [loading, setLoading] = useState(true);
  const [items, setItems] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [categorias, setCategorias] = useState([]);
  const [presupuestos, setPresupuestos] = useState([]);
  const [facturas, setFacturas] = useState([]);
  const [search, setSearch] = useState('');
  const [filterTab, setFilterTab] = useState('todos'); // 'todos' | 'pendientes' | 'completados'
  const [modal, setModal] = useState(null);
  const [detail, setDetail] = useState(null);
  const [detailTab, setDetailTab] = useState('tareas');
  const [toDelete, setToDelete] = useState(null);
  const [sort, setSort] = useState({ key: null, dir: 'asc' });
  const onSort = (key) => setSort((s) => toggleSort(s, key));

  async function load() {
    setLoading(true);
    const [pr, cl, cat, pre, fa] = await Promise.all([
      api.list('Proyecto'), api.list('Cliente', { order: 'nombre', ascending: true }),
      api.list('CategoriaServicio', { order: 'nombre', ascending: true }),
      api.list('Presupuesto'), api.list('Factura'),
    ]);
    setItems(pr); setClientes(cl); setCategorias(cat); setPresupuestos(pre); setFacturas(fa); setLoading(false);
  }
  useEffect(() => { load(); }, []);

  function abrirDetalle(p) { setDetail(p); setDetailTab('tareas'); }

  function handleProgresoChange(nuevoProgreso) {
    setDetail((d) => (d ? { ...d, progreso: nuevoProgreso } : d));
    setItems((its) => its.map((it) => (detail && it.id === detail.id ? { ...it, progreso: nuevoProgreso } : it)));
  }

  const clienteById = Object.fromEntries(clientes.map((c) => [c.id, c]));
  const pendientesCount = items.filter((p) => p.estado !== 'completado').length;
  const completadosCount = items.filter((p) => p.estado === 'completado').length;
  const filtered = items.filter((p) => {
    if (filterTab === 'pendientes' && p.estado === 'completado') return false;
    if (filterTab === 'completados' && p.estado !== 'completado') return false;
    const q = search.toLowerCase();
    if (!q) return true;
    return [p.nombre, (clienteById[p.clienteId] || {}).nombre].filter(Boolean).some((v) => v.toLowerCase().includes(q));
  });
  const sorted = sortRows(filtered, sort, {
    nombre: (p) => p.nombre,
    cliente: (p) => (clienteById[p.clienteId] || {}).nombre,
    progreso: (p) => Number(p.progreso || 0),
    prioridad: (p) => p.prioridad,
    estado: (p) => p.estado,
  });

  async function handleDelete() {
    try { await api.remove('Proyecto', toDelete.id); toast('Proyecto eliminado'); setToDelete(null); load(); }
    catch (err) { toast('No se puede eliminar: tiene tareas o facturas asociadas', 'error'); setToDelete(null); }
  }

  function handleClienteCreado(c) {
    setClientes((cs) => [...cs, c].sort((a, b) => a.nombre.localeCompare(b.nombre)));
  }

  function handleCategoriaCreada(c) {
    setCategorias((cs) => [...cs, c].sort((a, b) => a.nombre.localeCompare(b.nombre)));
  }

  const PROYECTO_TABS = [
    { key: 'todos', label: 'Todos', count: items.length, active: 'bg-slate-800 text-white border-slate-800', idle: 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50' },
    { key: 'pendientes', label: 'Pendientes', count: pendientesCount, active: 'bg-amber-500 text-white border-amber-500', idle: 'bg-white text-amber-600 border-amber-200 hover:bg-amber-50' },
    { key: 'completados', label: 'Completados', count: completadosCount, active: 'bg-emerald-600 text-white border-emerald-600', idle: 'bg-white text-emerald-600 border-emerald-200 hover:bg-emerald-50' },
  ];

  return (
    <div className="fade-in">
      <PageHeader title="Proyectos" subtitle={`${items.length} proyectos registrados`}
        action={<Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo proyecto</Button>} />

      <div className="flex items-center gap-2 mb-4 flex-wrap">
        {PROYECTO_TABS.map((t) => (
          <button key={t.key} type="button" onClick={() => setFilterTab(t.key)}
            className={classNames(
              'px-4 py-2 rounded-xl text-sm font-semibold border transition shadow-sm',
              filterTab === t.key ? t.active : t.idle
            )}>
            {t.label} <span className="opacity-75 font-normal">({t.count})</span>
          </button>
        ))}
      </div>

      <Toolbar search={search} onSearch={setSearch} placeholder="Buscar proyecto o cliente..." />

      {loading ? <PageLoader /> : filtered.length === 0 ? (
        <CardTable><EmptyState icon={Icons.Briefcase} title="No hay proyectos" action={<Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo proyecto</Button>} /></CardTable>
      ) : (
        <CardTable>
          <table className="w-full min-w-[760px]">
            <thead className="bg-slate-700 text-white"><tr>
              <SortableTh sortKey="nombre" sort={sort} onSort={onSort}>Proyecto</SortableTh>
              <SortableTh sortKey="cliente" sort={sort} onSort={onSort}>Cliente</SortableTh>
              <SortableTh sortKey="progreso" sort={sort} onSort={onSort}>Progreso</SortableTh>
              <SortableTh sortKey="prioridad" sort={sort} onSort={onSort}>Prioridad</SortableTh>
              <SortableTh sortKey="estado" sort={sort} onSort={onSort}>Estado</SortableTh>
              <Th className="text-right">Acciones</Th>
            </tr></thead>
            <tbody className="divide-y divide-slate-200">
              {sorted.map((p) => (
                <tr key={p.id} className="hover:bg-slate-50/60 cursor-pointer" onClick={() => abrirDetalle(p)}>
                  <Td><p className="font-medium text-ink-800">{p.nombre}</p><p className="text-xs text-slate-400">{p.tipo || ''}</p></Td>
                  <Td>{(clienteById[p.clienteId] || {}).nombre || '—'}</Td>
                  <Td>
                    <div className="flex items-center gap-2 w-28">
                      <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden flex-1"><div className="h-full bg-brand-500 rounded-full" style={{ width: (p.progreso || 0) + '%' }}></div></div>
                      <span className="text-xs text-slate-400 w-8">{p.progreso || 0}%</span>
                    </div>
                  </Td>
                  <Td><EstadoBadge estado={p.prioridad || 'media'} /></Td>
                  <Td><EstadoBadge estado={p.estado} /></Td>
                  <Td className="text-right" onClick={(e) => e.stopPropagation()}>
                    <div className="flex justify-end gap-1">
                      <button className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500" onClick={() => setModal({ mode: 'edit', item: p })}><Icons.Edit className="w-4 h-4" /></button>
                      <button className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500" onClick={() => setToDelete(p)}><Icons.Trash className="w-4 h-4" /></button>
                    </div>
                  </Td>
                </tr>
              ))}
            </tbody>
          </table>
        </CardTable>
      )}

      <Modal open={!!modal} onClose={() => setModal(null)} title={modal?.mode === 'edit' ? 'Editar proyecto' : 'Nuevo proyecto'} wide>
        {modal && <ProyectoForm initial={modal.mode === 'edit' ? modal.item : null} clientes={clientes} categorias={categorias}
          onClienteCreado={handleClienteCreado} onCategoriaCreada={handleCategoriaCreada}
          onCancel={() => setModal(null)} onSaved={() => { setModal(null); load(); }} />}
      </Modal>

      <Modal open={!!detail} onClose={() => setDetail(null)} title={detail?.nombre} size="xl"
        footer={<>
          <Button variant="secondary" onClick={() => setDetail(null)}>Cerrar</Button>
          <Button onClick={() => { setModal({ mode: 'edit', item: detail }); setDetail(null); }} icon={Icons.Edit}>Editar proyecto</Button>
        </>}>
        {detail && (
          <div className="space-y-4">
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
              <div><p className="text-xs text-slate-400">Cliente</p><p className="font-medium text-ink-800">{(clienteById[detail.clienteId] || {}).nombre || '—'}</p></div>
              <div><p className="text-xs text-slate-400">Estado</p><EstadoBadge estado={detail.estado} /></div>
              <div><p className="text-xs text-slate-400">Prioridad</p><EstadoBadge estado={detail.prioridad || 'media'} /></div>
              <div><p className="text-xs text-slate-400">Presupuesto</p><p className="font-medium text-ink-800">{detail.presupuestoTotal ? formatCurrency(detail.presupuestoTotal) : '—'}</p></div>
              <div><p className="text-xs text-slate-400">Inicio</p><p className="font-medium text-ink-800">{formatDate(detail.fechaInicio)}</p></div>
              <div><p className="text-xs text-slate-400">Entrega prevista</p><p className="font-medium text-ink-800">{formatDate(detail.fechaPrevista)}</p></div>
              <div className="col-span-2 sm:col-span-4">
                <p className="text-xs text-slate-400 mb-1">Progreso (automático según tareas completadas)</p>
                <div className="flex items-center gap-2">
                  <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden flex-1"><div className="h-full bg-brand-500 rounded-full" style={{ width: (detail.progreso || 0) + '%' }}></div></div>
                  <span className="text-xs text-slate-500 w-8">{detail.progreso || 0}%</span>
                </div>
              </div>
            </div>

            <div className="flex gap-1 border-b border-slate-100">
              {[['tareas', 'Tareas', Icons.ListTasks], ['documentos', 'Documentos', Icons.FileText], ['comercial', 'Presupuestos/Facturas', Icons.Receipt]].map(([key, label, Ic]) => (
                <button key={key} type="button" onClick={() => setDetailTab(key)}
                  className={classNames('px-3 py-2 text-sm font-medium border-b-2 -mb-px flex items-center gap-1.5 transition',
                    detailTab === key ? 'border-brand-600 text-brand-600' : 'border-transparent text-slate-400 hover:text-ink-600')}>
                  <Ic className="w-3.5 h-3.5" /> {label}
                </button>
              ))}
            </div>

            {detailTab === 'tareas' && <TareasPanel proyecto={detail} onProgresoChange={handleProgresoChange} />}
            {detailTab === 'documentos' && <ProyectoDocumentos proyecto={detail} />}
            {detailTab === 'comercial' && <ProyectoDocsComerciales proyecto={detail} presupuestos={presupuestos} facturas={facturas} navigate={navigate} />}
          </div>
        )}
      </Modal>

      <ConfirmDialog open={!!toDelete} title="Eliminar proyecto" danger message={`¿Eliminar "${toDelete?.nombre}"?`} onCancel={() => setToDelete(null)} onConfirm={handleDelete} />
    </div>
  );
}

function PresupuestoForm({ initial, clientes, proyectos, productos, existentesNumeros, prefillClienteId, onClienteCreado, onProductoCreado, onCancel, onSaved }) {
  const toast = useToast();
  const [saving, setSaving] = useState(true);
  const [header, setHeader] = useState(null);
  const [items, setItems] = useState([]);
  const [descuento, setDescuento] = useState(0);

  useEffect(() => {
    async function init() {
      if (initial) {
        setHeader({
          ...initial,
          fechaEmision: toDateInput(initial.fechaEmision) || toDateInput(new Date()),
          fechaValidez: toDateInput(initial.fechaValidez),
        });
        setDescuento(initial.descuento || 0);
        const its = await api.list('PresupuestoItem', { order: 'orden', ascending: true });
        setItems(its.filter((i) => i.presupuestoId === initial.id).map((i) => ({ ...i, _key: i.id })));
      } else {
        setHeader({
          numero: nextNumero('PRE', existentesNumeros), clienteId: prefillClienteId || '', proyectoId: '', estado: 'borrador',
          fechaEmision: toDateInput(new Date()), fechaValidez: '', condiciones: 'Presupuesto válido durante 30 días desde la fecha de emisión.',
        });
        setItems([]);
      }
      setSaving(false);
    }
    init();
  }, [initial]);

  const set = (k) => (e) => setHeader((f) => ({ ...f, [k]: e.target.value }));

  async function handleSubmit(e) {
    e.preventDefault();
    if (!header.clienteId) { toast('Selecciona un cliente', 'error'); return; }
    if (items.length === 0) { toast('Añade al menos una línea', 'error'); return; }
    setSaving(true);
    try {
      const { subtotal, ivaTotal, total } = calcTotales(items, descuento);
      const payload = {
        numero: header.numero, estado: header.estado, clienteId: header.clienteId,
        proyectoId: header.proyectoId || null, fechaEmision: header.fechaEmision || null,
        fechaValidez: header.fechaValidez || null, condiciones: header.condiciones || '',
        subtotal, ivaTotal, descuento: Number(descuento || 0), total,
      };
      let id = header.id;
      if (id) {
        await api.update('Presupuesto', id, payload);
        await api.removeWhere('PresupuestoItem', 'presupuestoId', id);
      } else {
        const created = await api.insert('Presupuesto', payload);
        id = created.id;
      }
      const itemsPayload = items.map((it, idx) => ({
        presupuestoId: id, concepto: it.concepto, descripcion: it.descripcion || '',
        cantidad: Number(it.cantidad || 0), precioUnitario: Number(it.precioUnitario || 0),
        iva: Number(it.iva || 0), orden: idx,
      }));
      if (itemsPayload.length) {
        const { error } = await supabaseClient.from('PresupuestoItem').insert(itemsPayload);
        if (error) throw error;
      }
      const esNuevo = !initial;
      toast(header.id ? 'Presupuesto actualizado' : 'Presupuesto creado');
      if (esNuevo) {
        try {
          const clienteObj = clientes.find((c) => c.id === header.clienteId);
          const empresaRows = await api.list('Empresa');
          const empresaObj = empresaRows[0];
          const pdfDoc = generateDocumentoPDF('Presupuesto', { ...payload, numero: header.numero }, items, clienteObj, empresaObj);
          const filename = `Presupuesto_${header.numero}.pdf`;
          pdfDoc.save(filename);
          if (clienteObj?.email) {
            const asunto = `Presupuesto ${header.numero} - ${empresaObj?.nombreFiscal || 'Creadores Web'}`;
            const cuerpo = `Hola ${clienteObj.nombre},\n\nAdjunto el presupuesto ${header.numero} por un importe total de ${formatCurrency(total)}.\nSe acaba de descargar el PDF (${filename}); adjúntalo antes de enviar este correo.\n\nUn saludo.`;
            window.open(mailtoLink(clienteObj.email, asunto, cuerpo), '_blank');
            toast('PDF descargado y correo abierto: adjunta el PDF antes de enviarlo', 'info');
          } else {
            toast('PDF descargado. Este cliente no tiene email para prellenar el correo', 'info');
          }
        } catch (pdfErr) {
          toast('El presupuesto se guardó, pero no se pudo generar el PDF', 'error');
        }
      }
      onSaved();
    } catch (err) { toast(err.message || 'Error al guardar', 'error'); }
    finally { setSaving(false); }
  }

  if (!header) return <PageLoader />;

  return (
    <form onSubmit={handleSubmit}>
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
        <Field label="Número"><Input value={header.numero} onChange={set('numero')} /></Field>
        <Field label="Cliente" required>
          <ClienteSelect value={header.clienteId} clientes={clientes} onChange={(v) => setHeader((f) => ({ ...f, clienteId: v }))} onCreado={onClienteCreado} required />
        </Field>
        <Field label="Proyecto (opcional)">
          <ProyectoSelect value={header.proyectoId || ''} proyectos={proyectos} clienteId={header.clienteId} onChange={(v) => setHeader((f) => ({ ...f, proyectoId: v }))} />
        </Field>
        <Field label="Estado">
          <Select value={header.estado} onChange={set('estado')}>
            <option value="borrador">Borrador</option><option value="enviado">Enviado</option>
            <option value="aceptado">Aceptado</option><option value="rechazado">Rechazado</option><option value="caducado">Caducado</option>
          </Select>
        </Field>
        <Field label="Fecha de emisión"><Input type="date" value={header.fechaEmision || ''} onChange={set('fechaEmision')} /></Field>
        <Field label="Válido hasta"><Input type="date" value={header.fechaValidez || ''} onChange={set('fechaValidez')} /></Field>
        <Field label="Condiciones" className="sm:col-span-2 lg:col-span-2"><Input value={header.condiciones || ''} onChange={set('condiciones')} /></Field>
      </div>

      <LineItemsEditor items={items} setItems={setItems} productos={productos} onProductoCreado={onProductoCreado} />
      <TotalsSummary items={items} descuento={descuento} setDescuento={setDescuento} />

      <div className="flex justify-end gap-2 mt-5">
        <Button variant="secondary" type="button" onClick={onCancel}>Cancelar</Button>
        <Button type="submit" disabled={saving}>{saving ? 'Guardando...' : 'Guardar presupuesto'}</Button>
      </div>
    </form>
  );
}

function PresupuestoDetail({ presupuesto, clienteById, navigate, onClose, onEdit, onChanged }) {
  const toast = useToast();
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [converting, setConverting] = useState(false);
  const [creandoProyecto, setCreandoProyecto] = useState(false);

  useEffect(() => {
    async function load() {
      setLoading(true);
      const its = await api.list('PresupuestoItem', { order: 'orden', ascending: true });
      setItems(its.filter((i) => i.presupuestoId === presupuesto.id));
      setLoading(false);
    }
    load();
  }, [presupuesto.id]);

  async function cambiarEstado(estado) {
    await api.update('Presupuesto', presupuesto.id, { estado });
    toast('Estado actualizado');
    onChanged();
  }

  async function descargarPDF() {
    try {
      const empresaRows = await api.list('Empresa');
      const cliente = clienteById[presupuesto.clienteId];
      const pdfDoc = generateDocumentoPDF('Presupuesto', presupuesto, items, cliente, empresaRows[0]);
      pdfDoc.save(`Presupuesto_${presupuesto.numero}.pdf`);
    } catch (err) { toast('No se pudo generar el PDF', 'error'); }
  }

  async function convertirEnFactura() {
    setConverting(true);
    try {
      const existentes = await api.list('Factura');
      const numero = nextNumero('FAC', existentes.map((f) => f.numero));
      const fecha = new Date(); const venc = new Date(); venc.setDate(venc.getDate() + 15);
      const factura = await api.insert('Factura', {
        numero, estado: 'emitida', clienteId: presupuesto.clienteId, proyectoId: presupuesto.proyectoId || null,
        presupuestoId: presupuesto.id, fechaEmision: toDateInput(fecha), fechaVencimiento: toDateInput(venc),
        subtotal: presupuesto.subtotal, ivaTotal: presupuesto.ivaTotal, descuento: presupuesto.descuento, total: presupuesto.total,
      });
      const itemsPayload = items.map((it, idx) => ({
        facturaId: factura.id, concepto: it.concepto, descripcion: it.descripcion || '',
        cantidad: it.cantidad, precioUnitario: it.precioUnitario, iva: it.iva, orden: idx,
      }));
      if (itemsPayload.length) await supabaseClient.from('FacturaItem').insert(itemsPayload);
      if (presupuesto.estado !== 'aceptado') await api.update('Presupuesto', presupuesto.id, { estado: 'aceptado' });
      toast(`Factura ${numero} creada a partir de este presupuesto`);
      onChanged();
      onClose();
    } catch (err) { toast(err.message || 'Error al convertir en factura', 'error'); }
    finally { setConverting(false); }
  }

  async function crearProyecto() {
    setCreandoProyecto(true);
    try {
      const cliente = clienteById[presupuesto.clienteId];
      const nombre = (items[0] && items[0].concepto ? items[0].concepto : 'Proyecto') + (cliente ? ' - ' + cliente.nombre : '');
      const nuevo = await api.insert('Proyecto', {
        nombre, clienteId: presupuesto.clienteId, estado: 'pendiente', prioridad: 'media', progreso: 0,
        presupuestoTotal: presupuesto.total, fechaInicio: toDateInput(new Date()),
        notas: `Creado a partir del presupuesto ${presupuesto.numero}.`,
      });
      await api.update('Presupuesto', presupuesto.id, {
        proyectoId: nuevo.id, estado: presupuesto.estado === 'aceptado' ? presupuesto.estado : 'aceptado',
      });
      toast(`Proyecto "${nombre}" creado`);
      onChanged();
      onClose();
      if (navigate) navigate('proyectos');
    } catch (err) { toast(err.message || 'Error al crear el proyecto', 'error'); }
    finally { setCreandoProyecto(false); }
  }

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <p className="text-xs text-slate-400">Cliente</p>
          <p className="font-semibold text-ink-900">{(clienteById[presupuesto.clienteId] || {}).nombre || '—'}</p>
        </div>
        <EstadoBadge estado={presupuesto.estado} />
      </div>
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
        <div><p className="text-xs text-slate-400">Emisión</p><p className="font-medium">{formatDate(presupuesto.fechaEmision)}</p></div>
        <div><p className="text-xs text-slate-400">Válido hasta</p><p className="font-medium">{formatDate(presupuesto.fechaValidez)}</p></div>
        <div><p className="text-xs text-slate-400">Subtotal</p><p className="font-medium">{formatCurrency(presupuesto.subtotal)}</p></div>
        <div><p className="text-xs text-slate-400">Total</p><p className="font-bold text-ink-900">{formatCurrency(presupuesto.total)}</p></div>
      </div>
      {loading ? <PageLoader /> : (
        <div className="border border-slate-200 rounded-lg overflow-hidden overflow-x-auto">
          <table className="w-full min-w-[480px] text-sm">
            <thead className="bg-slate-50 text-slate-400"><tr><Th>Concepto</Th><Th className="text-right">Cant.</Th><Th className="text-right">Precio</Th><Th className="text-right">IVA</Th><Th className="text-right">Total c/IVA</Th></tr></thead>
            <tbody className="divide-y divide-slate-100">
              {items.map((it) => (
                <tr key={it.id}><Td>{it.concepto}</Td><Td className="text-right">{it.cantidad}</Td><Td className="text-right">{formatCurrency(it.precioUnitario)}</Td><Td className="text-right">{it.iva}%</Td><Td className="text-right font-medium">{formatCurrency(calcLineTotal(it) * (1 + Number(it.iva || 0) / 100))}</Td></tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      <div className="flex flex-wrap gap-2 pt-2 border-t border-slate-100">
        {presupuesto.estado === 'borrador' && <Button size="sm" variant="secondary" onClick={() => cambiarEstado('enviado')}>Marcar como enviado</Button>}
        {['borrador', 'enviado'].includes(presupuesto.estado) && <Button size="sm" variant="secondary" onClick={() => cambiarEstado('aceptado')}>Marcar como aceptado</Button>}
        {['borrador', 'enviado'].includes(presupuesto.estado) && <Button size="sm" variant="danger" onClick={() => cambiarEstado('rechazado')}>Marcar como rechazado</Button>}
        <Button size="sm" icon={Icons.Receipt} onClick={convertirEnFactura} disabled={converting}>{converting ? 'Convirtiendo...' : 'Convertir en factura'}</Button>
        {presupuesto.proyectoId ? (
          <Button size="sm" variant="secondary" icon={Icons.Briefcase} onClick={() => { onClose(); if (navigate) navigate('proyectos'); }}>Ver proyecto</Button>
        ) : (
          <Button size="sm" variant="secondary" icon={Icons.Briefcase} onClick={crearProyecto} disabled={creandoProyecto}>{creandoProyecto ? 'Creando...' : 'Crear proyecto'}</Button>
        )}
        <Button size="sm" variant="secondary" icon={Icons.Download} onClick={descargarPDF}>Descargar PDF</Button>
        <Button size="sm" variant="ghost" icon={Icons.Print} onClick={() => window.print()}>Imprimir</Button>
        <Button size="sm" variant="ghost" icon={Icons.Edit} onClick={onEdit}>Editar</Button>
      </div>
    </div>
  );
}

function Presupuestos({ prefill, onConsumePrefill, navigate }) {
  const toast = useToast();
  const [loading, setLoading] = useState(true);
  const [items, setItems] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [proyectos, setProyectos] = useState([]);
  const [productos, setProductos] = useState([]);
  const [search, setSearch] = useState('');
  const [filterEstado, setFilterEstado] = useState('todos');
  const [modal, setModal] = useState(null);
  const [detail, setDetail] = useState(null);
  const [toDelete, setToDelete] = useState(null);
  const [sort, setSort] = useState({ key: null, dir: 'asc' });
  const onSort = (key) => setSort((s) => toggleSort(s, key));

  useEffect(() => {
    if (prefill && prefill.clienteId) {
      setModal({ mode: 'new', prefillClienteId: prefill.clienteId });
      onConsumePrefill && onConsumePrefill();
    }
    // eslint-disable-next-line
  }, [prefill]);

  async function load() {
    setLoading(true);
    const [pr, cl, py, pd] = await Promise.all([
      api.list('Presupuesto'), api.list('Cliente', { order: 'nombre', ascending: true }),
      api.list('Proyecto'), api.list('Producto', { order: 'nombre', ascending: true }),
    ]);
    setItems(pr); setClientes(cl); setProyectos(py); setProductos(pd.filter((p) => p.activo));
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const clienteById = Object.fromEntries(clientes.map((c) => [c.id, c]));
  const filtered = items.filter((p) => {
    if (filterEstado !== 'todos' && p.estado !== filterEstado) return false;
    const q = search.toLowerCase();
    if (!q) return true;
    return [p.numero, (clienteById[p.clienteId] || {}).nombre].filter(Boolean).some((v) => v.toLowerCase().includes(q));
  });
  const sorted = sortRows(filtered, sort, {
    numero: (p) => p.numero,
    cliente: (p) => (clienteById[p.clienteId] || {}).empresa || (clienteById[p.clienteId] || {}).nombre,
    subtotal: (p) => Number(p.subtotal || 0),
    fechaEmision: (p) => p.fechaEmision || '',
    total: (p) => Number(p.total || 0),
    estado: (p) => p.estado,
  });

  function handleClienteCreado(c) {
    setClientes((cs) => [...cs, c].sort((a, b) => a.nombre.localeCompare(b.nombre)));
  }
  function handleProductoCreado(p) {
    setProductos((ps) => [...ps, p].sort((a, b) => a.nombre.localeCompare(b.nombre)));
  }

  async function handleDelete() {
    try {
      await api.removeWhere('PresupuestoItem', 'presupuestoId', toDelete.id);
      await api.remove('Presupuesto', toDelete.id);
      toast('Presupuesto eliminado'); setToDelete(null); load();
    } catch (err) { toast('No se pudo eliminar', 'error'); setToDelete(null); }
  }

  async function cambiarEstado(p, nuevoEstado) {
    setItems((prev) => prev.map((x) => (x.id === p.id ? { ...x, estado: nuevoEstado } : x)));
    try {
      await api.update('Presupuesto', p.id, { estado: nuevoEstado });
      toast('Estado actualizado');
    } catch (err) {
      setItems((prev) => prev.map((x) => (x.id === p.id ? { ...x, estado: p.estado } : x)));
      toast('No se pudo actualizar el estado', 'error');
    }
  }

  return (
    <div className="fade-in">
      <PageHeader title="Presupuestos" subtitle={`${items.length} presupuestos`}
        action={<Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo presupuesto</Button>} />

      <Toolbar search={search} onSearch={setSearch} placeholder="Buscar por número o cliente..."
        right={
          <Select value={filterEstado} onChange={(e) => setFilterEstado(e.target.value)} className="!py-1.5 !text-xs w-auto">
            <option value="todos">Todos los estados</option>
            <option value="borrador">Borrador</option><option value="enviado">Enviado</option>
            <option value="aceptado">Aceptado</option><option value="rechazado">Rechazado</option><option value="caducado">Caducado</option>
          </Select>
        } />

      {loading ? <PageLoader /> : filtered.length === 0 ? (
        <CardTable><EmptyState icon={Icons.FileText} title="No hay presupuestos" action={<Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo presupuesto</Button>} /></CardTable>
      ) : (
        <CardTable>
          <table className="w-full min-w-[700px]">
            <thead className="bg-slate-700 text-white"><tr>
              <SortableTh sortKey="fechaEmision" sort={sort} onSort={onSort}>Fecha Emisión</SortableTh>
              <SortableTh sortKey="cliente" sort={sort} onSort={onSort}>Cliente</SortableTh>
              <SortableTh sortKey="subtotal" sort={sort} onSort={onSort} className="text-right">Total sin IVA</SortableTh>
              <SortableTh sortKey="total" sort={sort} onSort={onSort} className="text-right">Total</SortableTh>
              <SortableTh sortKey="estado" sort={sort} onSort={onSort}>Estado</SortableTh>
              <Th className="text-right">Acciones</Th>
            </tr></thead>
            <tbody className="divide-y divide-slate-200">
              {sorted.map((p) => (
                <tr key={p.id} className="hover:bg-slate-50/60 cursor-pointer" onClick={() => setDetail(p)}>
                  <Td className="font-medium text-ink-800">{formatDate(p.fechaEmision)}</Td>
                  <Td>
                    <p className="text-ink-800">{(clienteById[p.clienteId] || {}).empresa || (clienteById[p.clienteId] || {}).nombre || '—'}</p>
                    {(clienteById[p.clienteId] || {}).empresa && <p className="text-xs text-slate-400">{(clienteById[p.clienteId] || {}).nombre}</p>}
                  </Td>
                  <Td className="text-right text-ink-800">{formatCurrency(p.subtotal)}</Td>
                  <Td className="text-right font-semibold text-ink-800">{formatCurrency(p.total)}</Td>
                  <Td onClick={(e) => e.stopPropagation()}>
                    <EstadoSelect estado={p.estado} onChange={(v) => cambiarEstado(p, v)}
                      opciones={['borrador', 'enviado', 'aceptado', 'rechazado', 'caducado']} />
                  </Td>
                  <Td className="text-right" onClick={(e) => e.stopPropagation()}>
                    <div className="flex justify-end gap-1">
                      <button className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500" onClick={() => setModal({ mode: 'edit', item: p })}><Icons.Edit className="w-4 h-4" /></button>
                      <button className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500" onClick={() => setToDelete(p)}><Icons.Trash className="w-4 h-4" /></button>
                    </div>
                  </Td>
                </tr>
              ))}
            </tbody>
          </table>
        </CardTable>
      )}

      <Modal open={!!modal} onClose={() => setModal(null)} title={modal?.mode === 'edit' ? 'Editar presupuesto' : 'Nuevo presupuesto'} wide>
        {modal && <PresupuestoForm initial={modal.mode === 'edit' ? modal.item : null} clientes={clientes} proyectos={proyectos} productos={productos}
          prefillClienteId={modal.prefillClienteId} existentesNumeros={items.map((i) => i.numero)}
          onClienteCreado={handleClienteCreado} onProductoCreado={handleProductoCreado}
          onCancel={() => setModal(null)} onSaved={() => { setModal(null); load(); }} />}
      </Modal>

      <Modal open={!!detail} onClose={() => setDetail(null)} title={detail ? `Presupuesto ${detail.numero}` : ''} wide>
        {detail && <PresupuestoDetail presupuesto={detail} clienteById={clienteById} navigate={navigate}
          onClose={() => setDetail(null)} onEdit={() => { setModal({ mode: 'edit', item: detail }); setDetail(null); }}
          onChanged={load} />}
      </Modal>

      <ConfirmDialog open={!!toDelete} title="Eliminar presupuesto" danger message={`¿Eliminar el presupuesto "${toDelete?.numero}"?`} onCancel={() => setToDelete(null)} onConfirm={handleDelete} />
    </div>
  );
}
