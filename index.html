function FacturaForm({ initial, clientes, proyectos, productos, existentesNumeros, onClienteCreado, onProductoCreado, onCancel, onSaved }) {
  const toast = useToast();
  const [saving, setSaving] = useState(true);
  const [header, setHeader] = useState(null);
  const [items, setItems] = useState([]);
  const [descuento, setDescuento] = useState(0);
  const [gastosPendientes, setGastosPendientes] = useState([]);
  const [gastosAnadidosIds, setGastosAnadidosIds] = useState([]);

  useEffect(() => {
    async function loadGastos() {
      if (!header || !header.clienteId) { setGastosPendientes([]); return; }
      const todos = await api.list('Gasto');
      setGastosPendientes(todos.filter((g) => g.clienteId === header.clienteId && g.repercutible && !g.facturado && !gastosAnadidosIds.includes(g.id)));
    }
    loadGastos();
    // eslint-disable-next-line
  }, [header && header.clienteId]);

  function anadirGastoALinea(gasto) {
    setItems((its) => [...its, { _key: uid(), concepto: gasto.descripcion, descripcion: 'Gasto repercutido', cantidad: 1, precioUnitario: Number(gasto.importe || 0), iva: 21 }]);
    setGastosAnadidosIds((ids) => [...ids, gasto.id]);
    setGastosPendientes((gs) => gs.filter((g) => g.id !== gasto.id));
  }

  useEffect(() => {
    async function init() {
      if (initial) {
        setHeader({
          ...initial,
          fechaEmision: toDateInput(initial.fechaEmision) || toDateInput(new Date()),
          fechaVencimiento: toDateInput(initial.fechaVencimiento),
          sinIva: !!initial.sinIva,
        });
        setDescuento(initial.descuento || 0);
        const its = await api.list('FacturaItem', { order: 'orden', ascending: true });
        setItems(its.filter((i) => i.facturaId === initial.id).map((i) => ({ ...i, _key: i.id })));
      } else {
        const fecha = new Date(); const venc = new Date(); venc.setDate(venc.getDate() + 15);
        setHeader({
          numero: nextNumero('FAC', existentesNumeros), clienteId: '', proyectoId: '', estado: 'borrador',
          fechaEmision: toDateInput(fecha), fechaVencimiento: toDateInput(venc), notas: '', sinIva: true,
        });
        setItems([]);
      }
      setSaving(false);
    }
    init();
  }, [initial]);

  const set = (k) => (e) => setHeader((f) => ({ ...f, [k]: e.target.value }));

  function toggleSinIva(checked) {
    setHeader((f) => ({ ...f, sinIva: checked }));
    if (checked) setItems((its) => its.map((it) => ({ ...it, iva: 0 })));
  }

  async function handleSubmit(e) {
    e.preventDefault();
    if (!header.clienteId) { toast('Selecciona un cliente', 'error'); return; }
    if (items.length === 0) { toast('Añade al menos una línea', 'error'); return; }
    setSaving(true);
    try {
      const { subtotal, ivaTotal, total } = calcTotales(items, descuento);
      const payload = {
        numero: header.numero, estado: header.estado, clienteId: header.clienteId,
        proyectoId: header.proyectoId || null, fechaEmision: header.fechaEmision || null,
        fechaVencimiento: header.fechaVencimiento || null, notas: header.notas || '',
        subtotal, ivaTotal, descuento: Number(descuento || 0), total, sinIva: !!header.sinIva,
        beneficioReal: header.beneficioReal === '' || header.beneficioReal === undefined ? null : Number(header.beneficioReal),
      };
      let id = header.id;
      if (id) {
        await api.update('Factura', id, payload);
        await api.removeWhere('FacturaItem', 'facturaId', id);
      } else {
        const created = await api.insert('Factura', payload);
        id = created.id;
      }
      const itemsPayload = items.map((it, idx) => ({
        facturaId: id, concepto: it.concepto, descripcion: it.descripcion || '',
        cantidad: Number(it.cantidad || 0), precioUnitario: Number(it.precioUnitario || 0),
        iva: header.sinIva ? 0 : Number(it.iva || 0), orden: idx,
      }));
      if (itemsPayload.length) {
        const { error } = await supabaseClient.from('FacturaItem').insert(itemsPayload);
        if (error) throw error;
      }
      for (const gastoId of gastosAnadidosIds) {
        await api.update('Gasto', gastoId, { facturado: true });
      }
      toast(header.id ? 'Factura actualizada' : 'Factura creada');
      onSaved();
    } catch (err) { toast(err.message || 'Error al guardar', 'error'); }
    finally { setSaving(false); }
  }

  if (!header) return <PageLoader />;

  return (
    <form onSubmit={handleSubmit}>
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
        <Field label="Número"><Input value={header.numero} onChange={set('numero')} /></Field>
        <Field label="Cliente" required>
          <ClienteSelect value={header.clienteId} clientes={clientes} onChange={(v) => setHeader((f) => ({ ...f, clienteId: v }))} onCreado={onClienteCreado} required />
        </Field>
        <Field label="Proyecto (opcional)">
          <ProyectoSelect value={header.proyectoId || ''} proyectos={proyectos} clienteId={header.clienteId} onChange={(v) => setHeader((f) => ({ ...f, proyectoId: v }))} />
        </Field>
        <Field label="Estado">
          <Select value={header.estado} onChange={set('estado')}>
            <option value="borrador">Borrador</option><option value="emitida">Enviada</option>
            <option value="pagada_parcial">Pago parcial</option><option value="pagada">Pagada</option>
            <option value="vencida">Vencida</option><option value="cancelada">Cancelada</option>
          </Select>
        </Field>
        <Field label="Fecha de emisión"><Input type="date" value={header.fechaEmision || ''} onChange={set('fechaEmision')} /></Field>
        <Field label="Fecha de vencimiento"><Input type="date" value={header.fechaVencimiento || ''} onChange={set('fechaVencimiento')} /></Field>
        <Field label="Beneficio real (€)" className="sm:col-span-2 lg:col-span-2">
          <Input type="number" step="0.01" value={header.beneficioReal ?? ''} onChange={set('beneficioReal')} placeholder="Solo informativo, no se contabiliza" />
        </Field>
        <Field label="Notas" className="sm:col-span-2 lg:col-span-2"><Input value={header.notas || ''} onChange={set('notas')} /></Field>
      </div>

      <label className="flex items-center gap-2 text-sm text-ink-700 mb-4">
        <input type="checkbox" checked={!!header.sinIva} onChange={(e) => toggleSinIva(e.target.checked)} className="rounded border-slate-300 text-brand-600 focus:ring-brand-500" />
        Sin IVA (pago en efectivo u otro caso sin IVA)
      </label>

      {gastosPendientes.length > 0 && (
        <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-4">
          <p className="text-xs font-semibold text-amber-800 mb-2 flex items-center gap-1.5"><Icons.Alert className="w-4 h-4" /> Gastos pendientes de repercutir a este cliente</p>
          <div className="space-y-1.5">
            {gastosPendientes.map((g) => (
              <div key={g.id} className="flex items-center justify-between gap-2 text-sm bg-white rounded-lg px-3 py-2">
                <span className="text-ink-700">{g.descripcion} <span className="text-slate-400">· {formatCurrency(g.importe)}</span></span>
                <Button size="sm" variant="secondary" onClick={() => anadirGastoALinea(g)}>Añadir a la factura</Button>
              </div>
            ))}
          </div>
        </div>
      )}

      <LineItemsEditor items={items} setItems={setItems} productos={productos} onProductoCreado={onProductoCreado} sinIva={!!header.sinIva} />
      <TotalsSummary items={items} descuento={descuento} setDescuento={setDescuento} />

      <div className="flex justify-end gap-2 mt-5">
        <Button variant="secondary" type="button" onClick={onCancel}>Cancelar</Button>
        <Button type="submit" disabled={saving}>{saving ? 'Guardando...' : 'Guardar factura'}</Button>
      </div>
    </form>
  );
}

function PagosPanel({ factura, onChanged }) {
  const toast = useToast();
  const [pagos, setPagos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({ importe: '', fecha: toDateInput(new Date()), metodo: 'transferencia', notas: '' });
  const [saving, setSaving] = useState(false);

  async function load() {
    setLoading(true);
    const all = await api.list('Pago', { order: 'fecha', ascending: false });
    setPagos(all.filter((p) => p.facturaId === factura.id));
    setLoading(false);
  }
  useEffect(() => { load(); }, [factura.id]);

  const totalPagado = pagos.reduce((a, p) => a + Number(p.importe || 0), 0);
  const pendiente = Number(factura.total || 0) - totalPagado;

  async function addPago(e) {
    e.preventDefault();
    if (!form.importe || Number(form.importe) <= 0) { toast('Indica un importe válido', 'error'); return; }
    setSaving(true);
    try {
      await api.insert('Pago', { facturaId: factura.id, importe: Number(form.importe), fecha: form.fecha, metodo: form.metodo, notas: form.notas });
      const nuevoTotalPagado = totalPagado + Number(form.importe);
      const nuevoEstado = nuevoTotalPagado >= Number(factura.total || 0) - 0.005 ? 'pagada' : 'pagada_parcial';
      const cambios = { estado: nuevoEstado };
      if (nuevoEstado === 'pagada' && !factura.fechaPago) cambios.fechaPago = diaSiguiente(factura.fechaEmision);
      await api.update('Factura', factura.id, cambios);
      setForm({ importe: '', fecha: toDateInput(new Date()), metodo: 'transferencia', notas: '' });
      toast('Pago registrado');
      load(); onChanged();
    } catch (err) { toast(err.message || 'Error al registrar el pago', 'error'); }
    finally { setSaving(false); }
  }

  async function removePago(p) {
    await api.remove('Pago', p.id);
    load(); onChanged();
  }

  return (
    <div>
      <div className="grid grid-cols-3 gap-3 text-sm mb-4">
        <div className="bg-slate-50 rounded-lg p-3"><p className="text-xs text-slate-400">Total factura</p><p className="font-bold text-ink-900">{formatCurrency(factura.total)}</p></div>
        <div className="bg-emerald-50 rounded-lg p-3"><p className="text-xs text-emerald-600">Cobrado</p><p className="font-bold text-emerald-700">{formatCurrency(totalPagado)}</p></div>
        <div className={classNames('rounded-lg p-3', pendiente > 0.005 ? 'bg-amber-50' : 'bg-slate-50')}><p className={classNames('text-xs', pendiente > 0.005 ? 'text-amber-600' : 'text-slate-400')}>Pendiente</p><p className={classNames('font-bold', pendiente > 0.005 ? 'text-amber-700' : 'text-ink-900')}>{formatCurrency(Math.max(pendiente, 0))}</p></div>
      </div>

      {pendiente > 0.005 && (
        <form onSubmit={addPago} className="flex flex-wrap items-end gap-2 mb-4 bg-slate-50 rounded-lg p-3">
          <Field label="Importe (€)"><Input type="number" step="0.01" min="0" className="!w-28" value={form.importe} onChange={(e) => setForm((f) => ({ ...f, importe: e.target.value }))} /></Field>
          <Field label="Fecha"><Input type="date" className="!w-40" value={form.fecha} onChange={(e) => setForm((f) => ({ ...f, fecha: e.target.value }))} /></Field>
          <Field label="Método">
            <Select className="!w-36" value={form.metodo} onChange={(e) => setForm((f) => ({ ...f, metodo: e.target.value }))}>
              <option value="transferencia">Transferencia</option><option value="tarjeta">Tarjeta</option>
              <option value="efectivo">Efectivo</option><option value="paypal">PayPal</option><option value="bizum">Bizum</option><option value="otro">Otro</option>
            </Select>
          </Field>
          <Button type="submit" size="sm" disabled={saving} icon={Icons.Plus}>Registrar pago</Button>
        </form>
      )}

      {loading ? <PageLoader /> : pagos.length === 0 ? <p className="text-xs text-slate-400 text-center py-4">Sin pagos registrados</p> : (
        <div className="space-y-2">
          {pagos.map((p) => (
            <div key={p.id} className="flex items-center gap-3 text-sm bg-white border border-slate-100 rounded-lg px-3 py-2">
              <Icons.Euro className="w-4 h-4 text-emerald-500 shrink-0" />
              <span className="font-medium text-ink-800">{formatCurrency(p.importe)}</span>
              <span className="text-slate-400">· {formatDate(p.fecha)} · {ESTADO_LABELS[p.metodo] || p.metodo}</span>
              <button onClick={() => removePago(p)} className="ml-auto text-slate-400 hover:text-rose-500"><Icons.Trash className="w-4 h-4" /></button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function RecurrenteDesdeItemForm({ item, clienteId, fechaEmision, onCancel, onSaved }) {
  const toast = useToast();
  const base = fechaEmision || toDateInput(new Date());
  const [form, setForm] = useState({
    descripcion: item.concepto,
    precio: Number(item.precioUnitario || 0) * Number(item.cantidad || 1),
    iva: Number(item.iva || 21),
    periodicidad: 'anual',
    fechaInicio: base,
    proximaRenovacion: addMonths(base, PERIODICIDAD_MESES.anual),
    notas: '',
  });
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  function setPeriodicidad(e) {
    const periodicidad = e.target.value;
    setForm((f) => ({ ...f, periodicidad, proximaRenovacion: addMonths(base, PERIODICIDAD_MESES[periodicidad] || 12) }));
  }

  async function handleSubmit(e) {
    e.preventDefault();
    if (!form.descripcion.trim()) { toast('Indica una descripción', 'error'); return; }
    if (!form.proximaRenovacion) { toast('Indica la próxima renovación', 'error'); return; }
    setSaving(true);
    try {
      await api.insert('ServicioRecurrente', {
        clienteId, productoId: null, descripcion: form.descripcion,
        precio: Number(form.precio || 0), iva: Number(form.iva || 21),
        periodicidad: form.periodicidad, fechaInicio: form.fechaInicio || base,
        proximaRenovacion: form.proximaRenovacion, estado: 'activo', notas: form.notas || '',
      });
      toast('Servicio recurrente creado');
      onSaved();
    } catch (err) { toast(err.message || 'Error al guardar', 'error'); }
    finally { setSaving(false); }
  }

  return (
    <form onSubmit={handleSubmit} className="bg-slate-50 rounded-xl p-4 border border-slate-100">
      <p className="text-xs font-semibold text-ink-600 mb-3 flex items-center gap-1.5"><Icons.Repeat className="w-3.5 h-3.5" /> Nuevo servicio recurrente a partir de esta línea</p>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <Field label="Descripción" required className="sm:col-span-2"><Input value={form.descripcion} onChange={set('descripcion')} autoFocus /></Field>
        <Field label="Precio (€)"><Input type="number" step="0.01" min="0" value={form.precio} onChange={set('precio')} /></Field>
        <Field label="IVA (%)"><Input type="number" step="0.01" min="0" value={form.iva} onChange={set('iva')} /></Field>
        <Field label="Periodicidad">
          <Select value={form.periodicidad} onChange={setPeriodicidad}>
            <option value="mensual">Mensual</option>
            <option value="trimestral">Trimestral</option>
            <option value="anual">Anual</option>
          </Select>
        </Field>
        <Field label="Fecha de inicio"><Input type="date" value={form.fechaInicio} onChange={set('fechaInicio')} /></Field>
        <Field label="Próxima renovación" required hint="Calculada desde la fecha de la factura; ajústala si hace falta." className="sm:col-span-2">
          <Input type="date" value={form.proximaRenovacion} onChange={set('proximaRenovacion')} />
        </Field>
        <Field label="Notas" className="sm:col-span-2"><Textarea value={form.notas} onChange={set('notas')} /></Field>
      </div>
      <div className="flex justify-end gap-2 mt-3">
        <Button variant="secondary" size="sm" type="button" onClick={onCancel}>Cancelar</Button>
        <Button size="sm" type="submit" disabled={saving}>{saving ? 'Guardando...' : 'Crear servicio recurrente'}</Button>
      </div>
    </form>
  );
}

function Facturas() {
  const toast = useToast();
  const [loading, setLoading] = useState(true);
  const [items, setItems] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [proyectos, setProyectos] = useState([]);
  const [productos, setProductos] = useState([]);
  const [search, setSearch] = useState('');
  const [filterEstado, setFilterEstado] = useState('todos');
  const [filterYear, setFilterYear] = useState('todos');
  const [modal, setModal] = useState(null);
  const [detail, setDetail] = useState(null);
  const [toDelete, setToDelete] = useState(null);
  const [sort, setSort] = useState({ key: null, dir: 'asc' });
  const onSort = (key) => setSort((s) => toggleSort(s, key));

  async function load() {
    setLoading(true);
    const [fa, cl, py, pd] = await Promise.all([
      api.list('Factura'), api.list('Cliente', { order: 'nombre', ascending: true }),
      api.list('Proyecto'), api.list('Producto', { order: 'nombre', ascending: true }),
    ]);
    // Marcar automáticamente como vencidas las que hayan pasado de fecha
    const hoy = new Date();
    for (const f of fa) {
      if (f.estado === 'emitida' && f.fechaVencimiento && new Date(f.fechaVencimiento) < hoy) f.estado = 'vencida';
    }
    setItems(fa); setClientes(cl); setProyectos(py); setProductos(pd.filter((p) => p.activo));
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const clienteById = Object.fromEntries(clientes.map((c) => [c.id, c]));
  const anios = Array.from(new Set(items.map((f) => (f.fechaEmision || '').slice(0, 4)).filter(Boolean))).sort((a, b) => b.localeCompare(a));
  const filtered = items.filter((f) => {
    if (filterEstado !== 'todos' && f.estado !== filterEstado) return false;
    if (filterYear !== 'todos' && (f.fechaEmision || '').slice(0, 4) !== filterYear) return false;
    const q = search.toLowerCase();
    if (!q) return true;
    return [f.numero, (clienteById[f.clienteId] || {}).nombre, (clienteById[f.clienteId] || {}).empresa].filter(Boolean).some((v) => v.toLowerCase().includes(q));
  });

  async function handleDelete() {
    try {
      await api.removeWhere('FacturaItem', 'facturaId', toDelete.id);
      await api.removeWhere('Pago', 'facturaId', toDelete.id);
      await api.remove('Factura', toDelete.id);
      toast('Factura eliminada'); setToDelete(null); load();
    } catch (err) { toast('No se pudo eliminar', 'error'); setToDelete(null); }
  }

  function handleClienteCreado(c) {
    setClientes((cs) => [...cs, c].sort((a, b) => a.nombre.localeCompare(b.nombre)));
  }
  function handleProductoCreado(p) {
    setProductos((ps) => [...ps, p].sort((a, b) => a.nombre.localeCompare(b.nombre)));
  }

  async function cambiarEstado(f, nuevoEstado) {
    const cambios = { estado: nuevoEstado };
    if (nuevoEstado === 'pagada' && !f.fechaPago) cambios.fechaPago = diaSiguiente(f.fechaEmision);
    setItems((prev) => prev.map((x) => (x.id === f.id ? { ...x, ...cambios } : x)));
    try {
      await api.update('Factura', f.id, cambios);
      toast('Estado actualizado');
    } catch (err) {
      setItems((prev) => prev.map((x) => (x.id === f.id ? { ...x, estado: f.estado, fechaPago: f.fechaPago } : x)));
      toast('No se pudo actualizar el estado', 'error');
    }
  }

  const sortGetters = {
    numero: (f) => f.numero,
    cliente: (f) => (clienteById[f.clienteId] || {}).nombre,
    fechaEmision: (f) => f.fechaEmision || '',
    subtotal: (f) => Number(f.subtotal || 0),
    fechaVencimiento: (f) => f.fechaVencimiento || '',
    total: (f) => Number(f.total || 0),
    estado: (f) => f.estado,
  };
  const noPagadas = sortRows(filtered.filter((f) => f.estado !== 'pagada'), sort, sortGetters);
  const pagadas = sortRows(filtered.filter((f) => f.estado === 'pagada'), sort, sortGetters);

  function renderTablaFacturas(lista, emptyTitle) {
    if (lista.length === 0) {
      return <CardTable><EmptyState icon={Icons.Receipt} title={emptyTitle} /></CardTable>;
    }
    return (
      <CardTable>
        <table className="w-full min-w-[860px]">
          <thead className="bg-slate-700 text-white"><tr>
            <SortableTh sortKey="fechaEmision" sort={sort} onSort={onSort}>Fecha Emisión</SortableTh>
            <SortableTh sortKey="cliente" sort={sort} onSort={onSort}>Cliente</SortableTh>
            <SortableTh sortKey="subtotal" sort={sort} onSort={onSort} className="text-right">Total sin IVA</SortableTh>
            <SortableTh sortKey="total" sort={sort} onSort={onSort} className="text-right">Total</SortableTh>
            <Th className="text-right">Beneficio</Th>
            <SortableTh sortKey="estado" sort={sort} onSort={onSort}>Estado</SortableTh>
            <Th className="text-right">Acciones</Th>
          </tr></thead>
          <tbody className="divide-y divide-slate-200">
            {lista.map((f) => (
              <tr key={f.id} className="hover:bg-slate-50/60 cursor-pointer" onClick={() => setDetail(f)}>
                <Td className="font-medium text-ink-800">{formatDate(f.fechaEmision)}</Td>
                <Td>
                  <p className="text-ink-800">{(clienteById[f.clienteId] || {}).empresa || (clienteById[f.clienteId] || {}).nombre || '—'}</p>
                  {(clienteById[f.clienteId] || {}).empresa && <p className="text-xs text-rose-500">{(clienteById[f.clienteId] || {}).nombre}</p>}
                </Td>
                <Td className="text-right text-ink-800">{formatCurrency(f.subtotal)}</Td>
                <Td className="text-right font-semibold text-ink-800">{formatCurrency(f.total)}</Td>
                <Td className="text-right text-emerald-600">{f.beneficioReal !== null && f.beneficioReal !== undefined ? formatCurrency(f.beneficioReal) : '—'}</Td>
                <Td onClick={(e) => e.stopPropagation()}>
                  <EstadoSelect estado={f.estado} onChange={(v) => cambiarEstado(f, v)}
                    opciones={['borrador', 'emitida', 'pagada_parcial', 'pagada', 'vencida', 'cancelada']} />
                </Td>
                <Td className="text-right" onClick={(e) => e.stopPropagation()}>
                  <div className="flex justify-end gap-1">
                    <button className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500" onClick={() => setModal({ mode: 'edit', item: f })}><Icons.Edit className="w-4 h-4" /></button>
                    <button className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500" onClick={() => setToDelete(f)}><Icons.Trash className="w-4 h-4" /></button>
                  </div>
                </Td>
              </tr>
            ))}
          </tbody>
        </table>
      </CardTable>
    );
  }

  return (
    <div className="fade-in">
      <PageHeader title="Facturas y pagos" subtitle={`${items.length} facturas`}
        action={<Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nueva factura o pago</Button>} />

      <Toolbar search={search} onSearch={setSearch} placeholder="Buscar por número, cliente o empresa..."
        right={
          <div className="flex items-center gap-2 flex-nowrap shrink-0">
            <Select value={filterYear} onChange={(e) => setFilterYear(e.target.value)} className="!py-1.5 !text-xs w-auto">
              <option value="todos">Todos los años</option>
              {anios.map((a) => <option key={a} value={a}>{a}</option>)}
            </Select>
            <Select value={filterEstado} onChange={(e) => setFilterEstado(e.target.value)} className="!py-1.5 !text-xs w-auto">
              <option value="todos">Todos los estados</option>
              <option value="borrador">Borrador</option><option value="emitida">Enviada</option>
              <option value="pagada_parcial">Pago parcial</option><option value="pagada">Pagada</option>
              <option value="vencida">Vencida</option><option value="cancelada">Cancelada</option>
            </Select>
          </div>
        } />

      {loading ? <PageLoader /> : (
        <div className="space-y-6">
          <div>
            <h2 className="text-sm font-semibold text-ink-700 mb-2 flex items-center gap-2">
              Pendientes de cobro <span className="text-xs font-normal text-slate-400">({noPagadas.length})</span>
            </h2>
            {renderTablaFacturas(noPagadas, 'Ninguna factura')}
          </div>
          <div>
            <h2 className="text-sm font-semibold text-ink-700 mb-2 flex items-center gap-2">
              Pagadas <span className="text-xs font-normal text-slate-400">({pagadas.length})</span>
            </h2>
            {renderTablaFacturas(pagadas, 'Ninguna factura')}
          </div>
        </div>
      )}

      <Modal open={!!modal} onClose={() => setModal(null)} title={modal?.mode === 'edit' ? 'Editar factura o pago' : 'Nueva factura o pago'} wide>
        {modal && <FacturaForm initial={modal.mode === 'edit' ? modal.item : null} clientes={clientes} proyectos={proyectos} productos={productos}
          existentesNumeros={items.map((i) => i.numero)} onClienteCreado={handleClienteCreado} onProductoCreado={handleProductoCreado}
          onCancel={() => setModal(null)} onSaved={() => { setModal(null); load(); }} />}
      </Modal>

      <Modal open={!!detail} onClose={() => setDetail(null)} title={detail ? `Factura ${detail.numero}` : ''} wide>
        {detail && <FacturaDetail factura={detail} clienteById={clienteById}
          onClose={() => setDetail(null)} onEdit={() => { setModal({ mode: 'edit', item: detail }); setDetail(null); }}
          onChanged={load} />}
      </Modal>

      <ConfirmDialog open={!!toDelete} title="Eliminar factura" danger message={`¿Eliminar la factura "${toDelete?.numero}"?`} onCancel={() => setToDelete(null)} onConfirm={handleDelete} />
    </div>
  );
}

function Leads({ navigate }) {
  const toast = useToast();
  const [loading, setLoading] = useState(true);
  const [items, setItems] = useState([]);
  const [search, setSearch] = useState('');
  const [filterEstado, setFilterEstado] = useState('todos');
  const [modal, setModal] = useState(null);
  const [toDelete, setToDelete] = useState(null);
  const [working, setWorking] = useState(null);
  const [sort, setSort] = useState({ key: null, dir: 'asc' });
  const onSort = (key) => setSort((s) => toggleSort(s, key));

  async function load() { setLoading(true); setItems(await api.list('Lead')); setLoading(false); }
  useEffect(() => { load(); }, []);

  const activos = items.filter((l) => l.estado !== 'convertido');
  const filtered = items.filter((l) => {
    if (filterEstado === 'todos') { if (l.estado === 'convertido') return false; }
    else if (l.estado !== filterEstado) return false;
    const q = search.toLowerCase();
    if (!q) return true;
    return [l.nombre, l.empresa, l.email].filter(Boolean).some((v) => v.toLowerCase().includes(q));
  });
  const sorted = sortRows(filtered, sort, {
    nombre: (l) => l.nombre,
    estado: (l) => l.estado,
  });

  async function handleDelete() {
    try { await api.remove('Lead', toDelete.id); toast('Lead eliminado'); setToDelete(null); load(); }
    catch (err) { toast('No se pudo eliminar', 'error'); setToDelete(null); }
  }

  // Convierte el lead en cliente (si no lo está ya) y devuelve el id de cliente resultante
  async function asegurarCliente(l) {
    if (l.clienteId) return l.clienteId;
    const cliente = await api.insert('Cliente', {
      nombre: l.nombre, empresa: l.empresa || '', email: l.email || '', telefono: l.telefono || '',
      estado: 'activo', notas: l.notas || '',
    });
    await api.update('Lead', l.id, { estado: 'convertido', clienteId: cliente.id, fechaConversion: new Date().toISOString() });
    return cliente.id;
  }

  async function convertirACliente(l) {
    setWorking(l.id);
    try {
      await asegurarCliente(l);
      toast(`${l.nombre} convertido en cliente`);
      load();

const RECURRENTE_EMPTY = { clienteId: '', productoId: '', descripcion: '', precio: '', iva: 21, sinFactura: false, periodicidad: 'anual', fechaInicio: toDateInput(new Date()), proximaRenovacion: '', estado: 'activo', notas: '' };

function addPeriodo(fecha, periodicidad) {
  const d = new Date(fecha);
  if (periodicidad === 'mensual') d.setMonth(d.getMonth() + 1);
  else if (periodicidad === 'trimestral') d.setMonth(d.getMonth() + 3);
  else d.setFullYear(d.getFullYear() + 1);
  return toDateInput(d);
}

function RecurrenteForm({ initial, clientes, productos, onClienteCreado, onProductoCreado, onCancel, onSaved }) {
  const toast = useToast();
  const [form, setForm] = useState(initial ? { ...initial, fechaInicio: toDateInput(initial.fechaInicio), proximaRenovacion: toDateInput(initial.proximaRenovacion) } : RECURRENTE_EMPTY);

  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  function applyProducto(productoId) {
    const p = productos.find((x) => x.id === productoId);

function ServiciosRecurrentes() {

  const [clientes, setClientes] = useState([]);
  const [productos, setProductos] = useState([]);

  const [sort, setSort] = useState({ key: null, dir: 'asc' });
  const onSort = (key) => setSort((s) => toggleSort(s, key));

  async function load() {
    setLoading(true);
    const [it, cl, pd] = await Promise.all([api.list('ServicioRecurrente'), api.list('Cliente', { order: 'nombre', ascending: true }), api.list('Producto', { order: 'nombre', ascending: true })]);
    setItems(it); setClientes(cl); setProductos(pd.filter((p) => p.activo)); setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const clienteById = Object.fromEntries(clientes.map((c) => [c.id, c]));
  const filtered = items.filter((i) => {
    const q = search.toLowerCase();
    if (!q) return true;
    return [i.descripcion, (clienteById[i.clienteId] || {}).nombre].filter(Boolean).some((v) => v.toLowerCase().includes(q));
  });
  const sorted = sortRows(filtered, sort, {
    cliente: (i) => (clienteById[i.clienteId] || {}).nombre,
    servicio: (i) => i.descripcion,
    periodicidad: (i) => i.periodicidad,
    precio: (i) => Number(i.precio || 0),
    precioIva: (i) => (i.sinFactura ? Number(i.precio || 0) : priceWithIVA(i.precio, i.iva)),
    proximaRenovacion: (i) => i.proximaRenovacion || '',
    estado: (i) => i.estado,
  });

  const ingresosRecurrentesMes = items.filter((i) => i.estado === 'activo').reduce((acc, i) => {
    const p = Number(i.precio || 0);
    if (i.periodicidad === 'mensual') return acc + p;
    if (i.periodicidad === 'trimestral') return acc + p / 3;
    return acc + p / 12;
  }, 0);

  async function handleDelete() {
    try { await api.remove('ServicioRecurrente', toDelete.id); toast('Servicio eliminado'); setToDelete(null); load(); }
    catch (err) { toast('No se pudo eliminar', 'error'); setToDelete(null); }
  }

  function handleClienteCreado(c) {
    setClientes((cs) => [...cs, c].sort((a, b) => a.nombre.localeCompare(b.nombre)));
  }
  function handleProductoCreado(p) {
    setProductos((ps) => [...ps, p].sort((a, b) => a.nombre.localeCompare(b.nombre)));
  }

  const now = new Date();

  return (
    <div className="fade-in">

        action={<Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo servicio</Button>} />
      <Toolbar search={search} onSearch={setSearch} placeholder="Buscar servicio o cliente..." />
      {loading ? <PageLoader /> : filtered.length === 0 ? (
        <CardTable><EmptyState icon={Icons.Repeat} title="No hay servicios recurrentes" action={<Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo servicio</Button>} /></CardTable>
      ) : (
        <CardTable>
          <table className="w-full min-w-[820px]">
            <thead className="bg-slate-700 text-white"><tr>
              <SortableTh sortKey="cliente" sort={sort} onSort={onSort}>Cliente</SortableTh>
              <SortableTh sortKey="servicio" sort={sort} onSort={onSort}>Servicio</SortableTh>
              <SortableTh sortKey="periodicidad" sort={sort} onSort={onSort}>Periodicidad</SortableTh>
              <SortableTh sortKey="precio" sort={sort} onSort={onSort} className="text-right">Precio</SortableTh>
              <SortableTh sortKey="precioIva" sort={sort} onSort={onSort} className="text-right">Precio c/IVA</SortableTh>
              <SortableTh sortKey="proximaRenovacion" sort={sort} onSort={onSort}>Próxima renovación</SortableTh>
              <Th className="text-right">Acciones</Th>
            </tr></thead>
            <tbody className="divide-y divide-slate-200">
              {sorted.map((i) => {
                const vence = i.proximaRenovacion ? new Date(i.proximaRenovacion) : null;
                const proximo = vence && (vence - now) / (1000 * 3600 * 24) <= 15;
                return (
                  <tr key={i.id} className="hover:bg-slate-50/60">
                    <Td>
                      <p className="text-ink-800">{(clienteById[i.clienteId] || {}).empresa || (clienteById[i.clienteId] || {}).nombre || '—'}</p>
                      {(clienteById[i.clienteId] || {}).empresa && <p className="text-xs text-rose-500">{(clienteById[i.clienteId] || {}).nombre}</p>}
                    </Td>
                    <Td>
                      <div className="flex items-center gap-1.5">
                        <span>{i.descripcion}</span>
                        {i.sinFactura && (
                          <span title="Cobro en efectivo, sin factura ni IVA" className="inline-flex items-center justify-center w-4 h-4 rounded-full bg-amber-100 text-amber-700 shrink-0">
                            <Icons.X className="w-2.5 h-2.5" strokeWidth={3} />
                          </span>
                        )}
                      </div>
                    </Td>
                    <Td className="capitalize">{ESTADO_LABELS[i.periodicidad]}</Td>
                    <Td className={classNames('text-right', i.sinFactura && 'text-amber-700')}>{formatCurrency(i.precio)}</Td>
                    <Td className={classNames('text-right font-medium', i.sinFactura && 'text-amber-700')}>

                    </Td>
                    <Td><span className={proximo && i.estado === 'activo' ? 'text-amber-600 font-medium' : ''}>{formatDate(i.proximaRenovacion)}</span></Td>
                    <Td className="text-right">
                      <div className="flex justify-end gap-1">
                        <button className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500" onClick={() => setModal({ mode: 'edit', item: i })}><Icons.Edit className="w-4 h-4" /></button>
                        <button className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500" onClick={() => setToDelete(i)}><Icons.Trash className="w-4 h-4" /></button>
                      </div>
                    </Td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </CardTable>
      )}
      <Modal open={!!modal} onClose={() => setModal(null)} title={modal?.mode === 'edit' ? 'Editar servicio recurrente' : 'Nuevo servicio recurrente'} wide>
        {modal && <RecurrenteForm initial={modal.mode === 'edit' ? modal.item : null} clientes={clientes} productos={productos}
          onClienteCreado={handleClienteCreado} onProductoCreado={handleProductoCreado}
          onCancel={() => setModal(null)} onSaved={() => { setModal(null); load(); }} />}
      </Modal>
      <ConfirmDialog open={!!toDelete} title="Eliminar servicio" danger message="¿Eliminar este servicio recurrente?" onCancel={() => setToDelete(null)} onConfirm={handleDelete} />
    </div>
  );
}

const GASTO_EMPTY = {
  descripcion: '', categoria: 'otros', importe: '', periodicidad: 'puntual', fecha: toDateInput(new Date()),
  proximaRenovacion: '', proveedorId: '', clienteId: '', proyectoId: '', repercutible: false,
  estado: 'activo', pagado: true, notas: '',
};

const CATEGORIA_LABELS = {
  hosting: 'Hosting', dominios: 'Dominios', software: 'Software / Suscripciones',
  marketing: 'Marketing', oficina: 'Oficina', personal: 'Personal', impuestos: 'Impuestos', otros: 'Otros',
};
const CATEGORIA_STYLES = {
  hosting: 'bg-blue-50 text-blue-700 ring-blue-600/20',
  dominios: 'bg-violet-50 text-violet-700 ring-violet-600/20',
  software: 'bg-brand-50 text-brand-700 ring-brand-600/20',
  marketing: 'bg-sunset-50 text-sunset-700 ring-sunset-600/20',
  oficina: 'bg-slate-100 text-slate-600 ring-slate-500/20',
  personal: 'bg-emerald-50 text-emerald-700 ring-emerald-600/20',
  impuestos: 'bg-rose-50 text-rose-700 ring-rose-600/20',
  otros: 'bg-slate-100 text-slate-600 ring-slate-500/20',
};
function CategoriaBadge({ categoria }) {
  return <span className={classNames('inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ring-1 ring-inset', CATEGORIA_STYLES[categoria])}>{CATEGORIA_LABELS[categoria] || categoria}</span>;
}

function mensualEquivalente(gasto) {
  const importe = Number(gasto.importe || 0);
  if (gasto.periodicidad === 'mensual') return importe;
  if (gasto.periodicidad === 'trimestral') return importe / 3;
  if (gasto.periodicidad === 'semestral') return importe / 6;
  if (gasto.periodicidad === 'anual') return importe / 12;
  return 0; // puntual no cuenta como recurrente
}

// Un gasto recurrente ("plantilla") es la fila que crea el usuario: guarda la periodicidad
// y también representa el primer pago. Cada pago siguiente se genera como una fila aparte
// (gastoBaseId = id de la plantilla), con su propia fecha e importe, marcada pagada si ya pasó.
function siguientePeriodo(fecha, periodicidad) {
  const meses = PERIODICIDAD_MESES[periodicidad];
  return meses ? addMonths(fecha, meses) : '';
}

// Devuelve los pagos que faltan por crear para una plantilla activa, generando siempre
// como máximo un pago futuro por delante de hoy (nunca un histórico infinito).
// Recorre cada fecha de periodo desde el inicio hasta el horizonte y solo crea las que
// falten de verdad (por fecha exacta) — así, si se edita la fecha de inicio y quedan
// ocurrencias sueltas ya generadas más adelante, igualmente rellena todos los huecos.
function ocurrenciasFaltantes(plantilla, existentes) {
  if (plantilla.estado !== 'activo' || !plantilla.fecha) return [];
  const meses = PERIODICIDAD_MESES[plantilla.periodicidad];
  if (!meses) return [];
  const hoy = dateKey(new Date());
  const horizonte = siguientePeriodo(hoy, plantilla.periodicidad);
  const fechasExistentes = new Set([plantilla.fecha, ...existentes.map((o) => o.fecha)]);
  const nuevas = [];
  let cursor = siguientePeriodo(plantilla.fecha, plantilla.periodicidad);
  while (cursor && cursor <= horizonte) {
    if (!fechasExistentes.has(cursor)) {
      nuevas.push({
        descripcion: plantilla.descripcion, categoria: plantilla.categoria, importe: plantilla.importe,
        periodicidad: plantilla.periodicidad, fecha: cursor, proximaRenovacion: null,
        proveedorId: plantilla.proveedorId, clienteId: plantilla.clienteId, proyectoId: plantilla.proyectoId,
        repercutible: plantilla.repercutible, facturado: false, estado: 'activo',
        pagado: cursor <= hoy, notas: plantilla.notas, gastoBaseId: plantilla.id,
      });
      fechasExistentes.add(cursor);
    }
    cursor = siguientePeriodo(cursor, plantilla.periodicidad);
  }
  return nuevas;
}

function GastoForm({ initial, proveedores, clientes, proyectos, onClienteCreado, onCancel, onSaved }) {
  const toast = useToast();
  const [form, setForm] = useState(initial ? { ...initial, fecha: toDateInput(initial.fecha), proximaRenovacion: toDateInput(initial.proximaRenovacion) } : GASTO_EMPTY);
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  useEffect(() => {
    const meses = PERIODICIDAD_MESES[form.periodicidad];
    if (!meses || !form.fecha) return;
    const calculada = toDateInput(addMonths(form.fecha, meses));
    setForm((f) => (f.proximaRenovacion === calculada ? f : { ...f, proximaRenovacion: calculada }));
  }, [form.fecha, form.periodicidad]);

  async function handleSubmit(e) {
    e.preventDefault();
    if (!form.descripcion.trim()) { toast('La descripción es obligatoria', 'error'); return; }
    setSaving(true);
    try {
      const payload = {
        descripcion: form.descripcion, categoria: form.categoria, importe: Number(form.importe || 0),
        periodicidad: form.periodicidad, fecha: form.fecha || null,
        proximaRenovacion: form.periodicidad !== 'puntual' ? (form.proximaRenovacion || null) : null,
        proveedorId: form.proveedorId || null, clienteId: form.clienteId || null, proyectoId: form.proyectoId || null,
        repercutible: !!form.repercutible, estado: form.estado || 'activo', pagado: !!form.pagado, notas: form.notas || '',
      };
      if (form.id) await api.update('Gasto', form.id, payload);
      else await api.insert('Gasto', payload);
      toast(form.id ? 'Gasto actualizado' : 'Gasto creado');
      onSaved();
    } catch (err) { toast(err.message || 'Error al guardar', 'error'); }
    finally { setSaving(false); }
  }

  return (
    <form onSubmit={handleSubmit}>
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <Field label="Descripción" required className="sm:col-span-2 lg:col-span-3"><Input value={form.descripcion} onChange={set('descripcion')} required autoFocus placeholder="Ej: Hosting Cereria La Pasión, Adobe Creative Cloud..." /></Field>
        <Field label="Categoría">
          <Select value={form.categoria} onChange={set('categoria')}>
            {Object.keys(CATEGORIA_LABELS).map((k) => <option key={k} value={k}>{CATEGORIA_LABELS[k]}</option>)}
          </Select>
        </Field>
        <Field label="Importe (€)" required><Input type="number" step="0.01" min="0" value={form.importe} onChange={set('importe')} required /></Field>
        <Field label="Periodicidad">
          <Select value={form.periodicidad} onChange={set('periodicidad')}>
            <option value="puntual">Puntual (una vez)</option>
            <option value="mensual">Mensual</option><option value="trimestral">Trimestral</option>
            <option value="semestral">Semestral</option><option value="anual">Anual</option>
          </Select>
        </Field>
        <Field label="Estado">
          <Select value={form.estado || 'activo'} onChange={set('estado')}>
            <option value="activo">Activo</option>
            <option value="borrador">Borrador</option>
            {form.periodicidad !== 'puntual' && <option value="pausado">Pausado</option>}
            <option value="cancelado">Cancelado</option>
          </Select>
        </Field>
        <Field label={form.periodicidad === 'puntual' ? 'Fecha' : 'Fecha de inicio'}><Input type="date" value={form.fecha || ''} onChange={set('fecha')} /></Field>
        {form.periodicidad !== 'puntual' && (
          <Field label="Próxima renovación" hint="Se calcula sola a partir de la fecha de inicio y la periodicidad">
            <Input type="date" value={form.proximaRenovacion || ''} onChange={set('proximaRenovacion')} />
          </Field>
        )}
        <Field label="Proveedor asociado (opcional)">
          <Select value={form.proveedorId || ''} onChange={set('proveedorId')}>
            <option value="">Ninguno</option>
            {proveedores.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
          </Select>
        </Field>
        <Field label="Cliente atribuible (opcional)" hint="Si este gasto es para un cliente concreto (ej. su hosting)">
          <ClienteSelect value={form.clienteId || ''} clientes={clientes} onChange={(v) => setForm((f) => ({ ...f, clienteId: v }))} onCreado={onClienteCreado} placeholder="Gasto general de la agencia" />
        </Field>
        {form.clienteId && (
          <Field label="Proyecto asociado (opcional)">
            <ProyectoSelect value={form.proyectoId || ''} proyectos={proyectos} clienteId={form.clienteId} onChange={(v) => setForm((f) => ({ ...f, proyectoId: v }))} />
          </Field>
        )}
        {form.clienteId && (
          <Field label="Repercutir a cliente" className="sm:col-span-2 lg:col-span-3">
            <label className="flex items-center gap-2 text-sm text-ink-700">
              <input type="checkbox" checked={!!form.repercutible} onChange={(e) => setForm((f) => ({ ...f, repercutible: e.target.checked }))} className="rounded border-slate-300 text-brand-600 focus:ring-brand-500" />
              Marcar como pendiente de facturar a este cliente (aparecerá como sugerencia al crear su próxima factura)
            </label>
          </Field>
        )}
        <Field label="Pagado" className="sm:col-span-2 lg:col-span-3">
          <label className="flex items-center gap-2 text-sm text-ink-700">
            <input type="checkbox" checked={!!form.pagado} onChange={(e) => setForm((f) => ({ ...f, pagado: e.target.checked }))} className="rounded border-slate-300 text-brand-600 focus:ring-brand-500" />
            Ya se ha pagado este gasto
          </label>
        </Field>
        <Field label="Notas" className="sm:col-span-2 lg:col-span-3"><Textarea value={form.notas || ''} onChange={set('notas')} /></Field>
      </div>
      <div className="flex justify-end gap-2 mt-5">
        <Button variant="secondary" type="button" onClick={onCancel}>Cancelar</Button>
        <Button type="submit" disabled={saving}>{saving ? 'Guardando...' : 'Guardar gasto'}</Button>
      </div>
    </form>
  );
}

const PAGE_SIZE_GASTOS = 25;

// Modal de detalle de un gasto recurrente: lista todos sus pagos (pasados y futuros generados)
function GastoRecurrenteDetalle({ resumen, onTogglePagado, onEditar, onCambiarEstado, onClose }) {
  const { plantilla, todas } = resumen;
  const filas = [...todas].sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
  return (
    <Modal open title={plantilla.descripcion} size="lg" onClose={onClose}>
      <div className="flex items-center gap-2 mb-4">
        <CategoriaBadge categoria={plantilla.categoria} />
        <EstadoBadge estado={plantilla.periodicidad} />
        <EstadoSelect estado={plantilla.estado} opciones={['activo', 'pausado', 'cancelado']} onChange={onCambiarEstado} />
      </div>
      <div className="max-h-96 overflow-y-auto -mx-1 px-1">
        <table className="w-full text-sm">
          <thead><tr className="text-left text-slate-400 text-xs uppercase">
            <th className="py-1.5 font-medium">Fecha</th><th className="py-1.5 font-medium text-right">Importe</th><th className="py-1.5 font-medium text-right">Estado</th>
          </tr></thead>
          <tbody className="divide-y divide-slate-100">
            {filas.map((f) => (
              <tr key={f.id}>
                <td className="py-2 text-ink-700">{formatDate(f.fecha)}</td>
                <td className="py-2 text-right font-medium">{formatCurrency(f.importe)}</td>
                <td className="py-2 text-right">
                  <button
                    className={classNames('inline-flex items-center gap-1 text-xs font-medium px-2.5 py-0.5 rounded-full ring-1 ring-inset',
                      f.pagado ? 'bg-emerald-50 text-emerald-700 ring-emerald-600/20' : 'bg-amber-50 text-amber-700 ring-amber-600/20')}
                    onClick={() => onTogglePagado(f)}
                  >
                    {f.pagado ? <Icons.Check className="w-3 h-3" /> : null}{f.pagado ? 'Pagado' : 'Pendiente'}
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="flex justify-end gap-2 mt-5">
        <Button variant="secondary" onClick={onClose}>Cerrar</Button>
        <Button onClick={onEditar}>Editar gasto recurrente</Button>
      </div>
    </Modal>
  );
}

function Gastos() {
  const toast = useToast();
  const [loading, setLoading] = useState(true);
  const [items, setItems] = useState([]);
  const [proveedores, setProveedores] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [proyectos, setProyectos] = useState([]);
  const [search, setSearch] = useState('');
  const [filterCategoria, setFilterCategoria] = useState('todas');
  const [filterPago, setFilterPago] = useState('todos');
  const [filterYear, setFilterYear] = useState('todos');
  const [tab, setTab] = useState('proximos');
  const [modal, setModal] = useState(null);
  const [detalle, setDetalle] = useState(null); // id de plantilla recurrente cuyo detalle se muestra
  const [toDelete, setToDelete] = useState(null);
  // Por defecto, tanto "Próximos" como "Pasados" se ordenan por fecha más cercana a hoy
  const [sort, setSort] = useState({ key: 'proximaRenovacion', dir: 'asc' });
  const onSort = (key) => setSort((s) => toggleSort(s, key));
  const [page, setPage] = useState(1);

  // Genera los pagos futuros/pasados que falten para las plantillas recurrentes activas,
  // manteniendo siempre como máximo un pago futuro por delante de hoy.
  async function generarPendientes(gastos) {
    const porPlantilla = {};
    gastos.forEach((g) => { if (g.gastoBaseId) (porPlantilla[g.gastoBaseId] = porPlantilla[g.gastoBaseId] || []).push(g); });
    const plantillas = gastos.filter((g) => !g.gastoBaseId && g.periodicidad !== 'puntual');
    const nuevas = [];
    plantillas.forEach((p) => nuevas.push(...ocurrenciasFaltantes(p, porPlantilla[p.id] || [])));
    if (!nuevas.length) return gastos;
    const insertadas = await Promise.all(nuevas.map((n) => api.insert('Gasto', n).catch(() => null)));
    return [...gastos, ...insertadas.filter(Boolean)];
  }

  async function load() {
    setLoading(true);
    const [g0, pv, cl, py] = await Promise.all([
      api.list('Gasto'), api.list('Proveedor', { order: 'nombre', ascending: true }),
      api.list('Cliente', { order: 'nombre', ascending: true }), api.list('Proyecto'),
    ]);
    const g = await generarPendientes(g0);
    setItems(g); setProveedores(pv); setClientes(cl); setProyectos(py);
    setLoading(false);
  }
  useEffect(() => { load(); }, []);
  useEffect(() => { setPage(1); }, [search, filterCategoria, filterPago, filterYear, tab, sort]);

  const clienteById = Object.fromEntries(clientes.map((c) => [c.id, c]));
  const proveedorById = Object.fromEntries(proveedores.map((p) => [p.id, p]));

  const plantillas = items.filter((g) => !g.gastoBaseId && g.periodicidad !== 'puntual');
  const ocurrenciasPorPlantilla = {};
  items.forEach((g) => { if (g.gastoBaseId) (ocurrenciasPorPlantilla[g.gastoBaseId] = ocurrenciasPorPlantilla[g.gastoBaseId] || []).push(g); });
  const anioActual = new Date().getFullYear();

  const hoyKey = dateKey(new Date());
  function resumenDe(plantilla) {
    const todas = [plantilla, ...(ocurrenciasPorPlantilla[plantilla.id] || [])];
    const delAnio = todas.filter((o) => o.fecha && parseDateOnly(o.fecha) && parseDateOnly(o.fecha).getFullYear() === anioActual);
    const pagadasAnio = delAnio.filter((o) => o.pagado);
    // "Próximo pago" es el primer pendiente cuya fecha aún no ha llegado; uno pendiente con fecha
    // ya pasada es un atrasado (dato antiguo sin marcar), no un "próximo".
    const futuros = todas.filter((o) => !o.pagado && o.fecha && o.fecha >= hoyKey).sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
    const conHistorial = todas.filter((o) => o.fecha && o.fecha < hoyKey).sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
    const atrasados = todas.filter((o) => !o.pagado && o.fecha && o.fecha < hoyKey);
    return {
      plantilla, todas,
      proximaPendiente: futuros[0] ? futuros[0].fecha : null,
      ultimaPagada: conHistorial.length ? conHistorial[conHistorial.length - 1].fecha : null,
      tieneHistorial: conHistorial.length > 0,
      atrasadosCount: atrasados.length,
      resumenAnioTexto: `Este año: ${pagadasAnio.length}/${delAnio.length} pagados`,
      totalAnio: pagadasAnio.reduce((a, o) => a + Number(o.importe || 0), 0),
    };
  }

  // Filas a mostrar: gastos puntuales tal cual, y un único resumen por cada gasto recurrente.
  // Un recurrente activo tiene a la vez historial (aparece en Pasados) y próximo pago (aparece en Próximos).
  const filasPuntuales = items.filter((g) => g.periodicidad === 'puntual').map((g) => ({ tipo: 'simple', gasto: g }));
  const filasRecurrentes = plantillas.map((p) => ({ tipo: 'recurrente', ...resumenDe(p) }));
  const todasLasFilas = [...filasPuntuales, ...filasRecurrentes];

  const hoyDate = new Date(); hoyDate.setHours(0, 0, 0, 0);
  const descripcionDe = (r) => (r.tipo === 'simple' ? r.gasto.descripcion : r.plantilla.descripcion);
  const categoriaDe = (r) => (r.tipo === 'simple' ? r.gasto.categoria : r.plantilla.categoria);
  const clienteIdDe = (r) => (r.tipo === 'simple' ? r.gasto.clienteId : r.plantilla.clienteId);
  const importeDe = (r) => (r.tipo === 'simple' ? r.gasto.importe : r.plantilla.importe);
  const estadoDe = (r) => (r.tipo === 'simple' ? r.gasto.estado : r.plantilla.estado);
  const pagadoDe = (r) => (r.tipo === 'simple' ? r.gasto.pagado : !r.proximaPendiente);
  const fechaRelevanteDe = (r) => {
    if (r.tipo === 'simple') return r.gasto.fecha;
    return tab === 'pasados' ? (r.ultimaPagada || r.plantilla.fecha) : (r.proximaPendiente || r.plantilla.fecha);
  };
  function perteneceATab(r) {
    if (r.tipo === 'simple') {
      const d = parseDateOnly(r.gasto.fecha);
      if (!d) return tab === 'proximos';
      return tab === 'pasados' ? d < hoyDate : d >= hoyDate;
    }
    // recurrente: puede aparecer en las dos pestañas a la vez (tiene historial y próximo pago)
    return tab === 'pasados' ? r.tieneHistorial : !!r.proximaPendiente;
  }

  const filtered = todasLasFilas.filter((r) => {
    if (!perteneceATab(r)) return false;
    if (filterYear !== 'todos') {
      const f = fechaRelevanteDe(r);
      if (!f || String(new Date(f).getFullYear()) !== filterYear) return false;
    }
    if (filterCategoria !== 'todas' && categoriaDe(r) !== filterCategoria) return false;
    if (filterPago === 'anuales_pendientes' && !(r.tipo === 'recurrente' && r.plantilla.periodicidad === 'anual' && estadoDe(r) === 'activo' && !pagadoDe(r))) return false;
    if (filterPago === 'pagados' && !pagadoDe(r)) return false;
    const q = search.toLowerCase();
    if (!q) return true;
    return [descripcionDe(r), CATEGORIA_LABELS[categoriaDe(r)], (clienteById[clienteIdDe(r)] || {}).nombre].filter(Boolean).some((v) => v.toLowerCase().includes(q));
  });
  const sorted = sortRows(filtered, sort, {
    descripcion: descripcionDe,
    cliente: (r) => (clienteById[clienteIdDe(r)] || {}).nombre,
    periodicidad: (r) => (r.tipo === 'simple' ? 'puntual' : r.plantilla.periodicidad),
    importe: (r) => Number(importeDe(r) || 0),
    proximaRenovacion: fechaRelevanteDe,
  });
  const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE_GASTOS));
  const paged = sorted.slice((page - 1) * PAGE_SIZE_GASTOS, page * PAGE_SIZE_GASTOS);

  // Los gastos en borrador, pausados o cancelados no se calculan ni contabilizan en los totales
  const gastoMensualEstimado = plantillas.filter((p) => p.estado === 'activo').reduce((acc, p) => acc + mensualEquivalente(p), 0);
  const gastoAnualEstimado = gastoMensualEstimado * 12;
  const esteMes = new Date();
  // Cada fila (puntual, o un pago concreto de un recurrente) tiene su propia fecha e importe reales,
  // así que basta sumar por fecha sin amortizar nada ni distinguir tipo (evita contar dos veces).
  const gastosDelMes = items.filter((g) => g.estado === 'activo' && g.fecha &&
    new Date(g.fecha).getMonth() === esteMes.getMonth() && new Date(g.fecha).getFullYear() === esteMes.getFullYear());
  const gastoEsteMes = gastosDelMes.reduce((acc, g) => acc + Number(g.importe || 0), 0);
  const gastosDelAnio = items.filter((g) => g.estado === 'activo' && g.fecha && parseDateOnly(g.fecha) && parseDateOnly(g.fecha).getFullYear() === anioActual);
  const gastadoAnioHastaHoy = gastosDelAnio.filter((g) => g.pagado).reduce((acc, g) => acc + Number(g.importe || 0), 0);
  const pendienteEsteAnio = gastosDelAnio.filter((g) => !g.pagado).reduce((acc, g) => acc + Number(g.importe || 0), 0);
  const pendientesRepercutir = items.filter((g) => g.estado === 'activo' && g.repercutible && !g.facturado);

  // Resumen de gasto por proveedor, año en curso
  const gastoPorProveedor = {};
  gastosDelAnio.forEach((g) => { if (g.proveedorId) gastoPorProveedor[g.proveedorId] = (gastoPorProveedor[g.proveedorId] || 0) + Number(g.importe || 0); });
  const resumenProveedores = Object.entries(gastoPorProveedor)
    .map(([id, total]) => ({ proveedor: proveedorById[id], total }))
    .filter((r) => r.proveedor)
    .sort((a, b) => b.total - a.total);
  const maxGastoProveedor = resumenProveedores.length ? resumenProveedores[0].total : 0;

  async function handleDelete() {
    try { await api.remove('Gasto', toDelete.id); toast('Gasto eliminado'); setToDelete(null); load(); }
    catch (err) { toast('No se pudo eliminar', 'error'); setToDelete(null); }
  }

  function handleClienteCreado(c) {
    setClientes((cs) => [...cs, c].sort((a, b) => a.nombre.localeCompare(b.nombre)));
  }

  async function handleDuplicar(g) {
    try {
      const { id, createdAt, ...rest } = g;
      const nuevo = await api.insert('Gasto', { ...rest, estado: 'borrador', pagado: false });
      toast('Gasto duplicado en modo borrador');
      await load();
      setModal({ mode: 'edit', item: nuevo });
    } catch (err) { toast(err.message || 'No se pudo duplicar', 'error'); }
  }

  async function handleTogglePagado(g) {
    try { await api.update('Gasto', g.id, { pagado: !g.pagado }); load(); }
    catch (err) { toast('No se pudo actualizar', 'error'); }
  }

  async function handleCambiarEstado(plantilla, estado) {
    try { await api.update('Gasto', plantilla.id, { estado }); toast(estado === 'pausado' ? 'Gasto recurrente pausado' : 'Estado actualizado'); load(); }
    catch (err) { toast('No se pudo actualizar', 'error'); }
  }

  // Código de color por urgencia del próximo pago: rojo pastel (<=2 meses), naranja (<=6 meses), verde (más lejos)
  function filaRenovacionClass(fecha) {
    if (!fecha) return '';
    const renovacion = parseDateOnly(fecha);
    if (!renovacion) return '';
    const limite2m = new Date(hoyDate.getFullYear(), hoyDate.getMonth() + 2, hoyDate.getDate());
    const limite6m = new Date(hoyDate.getFullYear(), hoyDate.getMonth() + 6, hoyDate.getDate());
    if (renovacion <= limite2m) return 'bg-rose-50';
    if (renovacion <= limite6m) return 'bg-amber-50';
    return 'bg-emerald-50';
  }

  const detalleResumen = detalle ? filasRecurrentes.find((r) => r.plantilla.id === detalle) : null;

  function csvCell(value) {
    const s = value === null || value === undefined ? '' : String(value);
    return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }

  function exportarCSV() {
    const filas = sorted.map((r) => ({
      descripcion: descripcionDe(r),
      cliente: (clienteById[clienteIdDe(r)] || {}).empresa || (clienteById[clienteIdDe(r)] || {}).nombre || '',
      categoria: CATEGORIA_LABELS[categoriaDe(r)] || categoriaDe(r) || '',
      periodicidad: r.tipo === 'simple' ? 'Puntual' : ESTADO_LABELS[r.plantilla.periodicidad],
      importe: Number(importeDe(r) || 0).toFixed(2),
      fecha: fechaRelevanteDe(r) ? formatDate(fechaRelevanteDe(r)) : '',
      pagado: pagadoDe(r) ? 'Sí' : 'No',
    }));
    const cabecera = ['Descripción', 'Cliente', 'Categoría', 'Periodicidad', 'Importe', 'Fecha', 'Pagado'];
    const lineas = [cabecera, ...filas.map((f) => [f.descripcion, f.cliente, f.categoria, f.periodicidad, f.importe, f.fecha, f.pagado])]
      .map((fila) => fila.map(csvCell).join(';'));
    const csv = '﻿' + lineas.join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `gastos_${filterYear === 'todos' ? 'todos' : filterYear}_${tab}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  return (
    <div className="fade-in">
      <PageHeader title="Gastos" subtitle={`${sorted.length} gasto${sorted.length === 1 ? '' : 's'} ${tab === 'pasados' ? 'pasados' : 'próximos'}`}
        action={
          <div className="flex gap-2">
            <Button variant="secondary" icon={Icons.Download} onClick={exportarCSV}>Exportar CSV</Button>
            <Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo gasto</Button>
          </div>
        } />

      <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-4">
        <StatCard label="Gasto anual estimado" value={formatCurrency(gastoAnualEstimado)} icon={Icons.Wallet} tone="rose" trend={`${formatCurrency(gastoMensualEstimado)} / mes en recurrentes`} />
        <StatCard label="Gastos este mes" value={formatCurrency(gastoEsteMes)} icon={Icons.Euro} tone="amber" />
        <StatCard label="Gastado este año" value={formatCurrency(gastadoAnioHastaHoy)} icon={Icons.BarChart} tone="emerald" trend={`Hasta hoy, ${anioActual}`} />
        <StatCard label="Pendiente este año" value={formatCurrency(pendienteEsteAnio)} icon={Icons.Alert} tone={pendienteEsteAnio ? 'amber' : 'emerald'} />
      </div>

      {resumenProveedores.length > 0 && (
        <div className="bg-white rounded-2xl border border-slate-100 shadow-card p-4 sm:p-5 mb-6">
          <h3 className="text-sm font-semibold text-ink-800 mb-3">Gasto por proveedor · {anioActual}</h3>
          <div className="space-y-2">
            {resumenProveedores.slice(0, 6).map(({ proveedor, total }) => (
              <div key={proveedor.id} className="flex items-center gap-3 text-sm">
                <span className="w-32 sm:w-40 shrink-0 truncate text-ink-700">{proveedor.nombre}</span>
                <div className="flex-1 h-2 rounded-full bg-slate-100 overflow-hidden">
                  <div className="h-full bg-brand-500 rounded-full" style={{ width: `${maxGastoProveedor ? (total / maxGastoProveedor) * 100 : 0}%` }} />
                </div>
                <span className="w-24 shrink-0 text-right font-medium text-ink-800">{formatCurrency(total)}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {pendientesRepercutir.length > 0 && (
        <div className="flex items-center gap-2 text-sm text-blue-700 bg-blue-50 rounded-xl px-4 py-2.5 mb-6">
          <Icons.Receipt className="w-4 h-4 shrink-0" />
          {pendientesRepercutir.length} gasto{pendientesRepercutir.length > 1 ? 's' : ''} pendiente{pendientesRepercutir.length > 1 ? 's' : ''} de repercutir a cliente, por {formatCurrency(pendientesRepercutir.reduce((a, g) => a + Number(g.importe || 0), 0))}
        </div>
      )}

      <div className="flex flex-wrap gap-3 mb-4">
        <div className="flex gap-1 bg-slate-100 rounded-xl p-1 w-fit">

const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

// Cada fila de Gasto (puntual, o un pago concreto de uno recurrente) tiene su propia fecha real;
// ya no hace falta amortizar los recurrentes mes a mes, cada pago cuenta en su propio mes.
function gastoAplicaEnMes(gasto, year, month) {
  if (!gasto.fecha) return false;
  const inicio = new Date(gasto.fecha);
  return inicio.getFullYear() === year && inicio.getMonth() === month;
}

function Contabilidad() {
  const [loading, setLoading] = useState(true);
  const [facturas, setFacturas] = useState([]);
  const [pagos, setPagos] = useState([]);
  const [gastos, setGastos] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [year, setYear] = useState(new Date().getFullYear());

  async function load() {
    setLoading(true);
    const [fa, pg, ga, cl] = await Promise.all([
      api.list('Factura'), api.list('Pago'), api.list('Gasto'), api.list('Cliente'),
    ]);
    setFacturas(fa); setPagos(pg); setGastos(ga); setClientes(cl);
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  if (loading) return <PageLoader />;

  const clienteById = Object.fromEntries(clientes.map((c) => [c.id, c]));
  const facturaById = Object.fromEntries(facturas.map((f) => [f.id, f]));

  const years = new Set([new Date().getFullYear()]);
  facturas.forEach((f) => f.fechaEmision && years.add(new Date(f.fechaEmision).getFullYear()));
  pagos.forEach((p) => p.fecha && years.add(new Date(p.fecha).getFullYear()));
  const yearsList = Array.from(years).sort((a, b) => b - a);

  const filas = MESES.map((label, month) => {
    const facturado = facturas
      .filter((f) => f.estado !== 'cancelada' && f.fechaEmision && new Date(f.fechaEmision).getFullYear() === year && new Date(f.fechaEmision).getMonth() === month)
      .reduce((acc, f) => acc + Number(f.total || 0), 0);
    const cobrado = pagos
      .filter((p) => p.fecha && new Date(p.fecha).getFullYear() === year && new Date(p.fecha).getMonth() === month)
      .reduce((acc, p) => acc + Number(p.importe || 0), 0);
    const gastoMes = gastos
      .filter((g) => gastoAplicaEnMes(g, year, month))
      .reduce((acc, g) => acc + Number(g.importe || 0), 0);
    return { label, facturado, cobrado, gastoMes, beneficio: cobrado - gastoMes };
  });

  const totalFacturado = filas.reduce((a, f) => a + f.facturado, 0);
  const totalCobrado = filas.reduce((a, f) => a + f.cobrado, 0);
  const totalGastos = filas.reduce((a, f) => a + f.gastoMes, 0);
  const totalBeneficio = totalCobrado - totalGastos;

  const pendienteCobro = facturas
    .filter((f) => ['emitida', 'pagada_parcial', 'vencida'].includes(f.estado))
    .reduce((acc, f) => acc + Number(f.total || 0), 0);

  const pagosDelAnio = pagos
    .filter((p) => p.fecha && new Date(p.fecha).getFullYear() === year)
    .sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));

  return (
    <div className="fade-in">
      <PageHeader title="Contabilidad" subtitle="Resumen de facturación, cobros y gastos"
        action={
          <Select value={year} onChange={(e) => setYear(Number(e.target.value))} className="!w-auto">
            {yearsList.map((y) => <option key={y} value={y}>{y}</option>)}
          </Select>
        } />

      <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-6">
        <StatCard label="Facturado" value={formatCurrency(totalFacturado)} icon={Icons.FileText} tone="blue" trend={`Año ${year}`} />
        <StatCard label="Cobrado" value={formatCurrency(totalCobrado)} icon={Icons.Euro} tone="emerald" trend="Base caja" />
        <StatCard label="Gastos" value={formatCurrency(totalGastos)} icon={Icons.Wallet} tone="rose" />
        <StatCard label="Beneficio (cobrado - gastos)" value={formatCurrency(totalBeneficio)} icon={Icons.BarChart} tone={totalBeneficio >= 0 ? 'emerald' : 'rose'} />
      </div>

      <div className="bg-white rounded-2xl border border-slate-100 shadow-card p-3 sm:p-5 mb-6">
        <h3 className="text-sm font-semibold text-ink-800 mb-3 px-2">Desglose mensual {year}</h3>
        <div className="overflow-x-auto">
          <table className="w-full min-w-[560px]">
            <thead className="bg-slate-700 text-white"><tr><Th>Mes</Th><Th className="text-right">Facturado</Th><Th className="text-right">Cobrado</Th><Th className="text-right">Gastos</Th><Th className="text-right">Beneficio</Th></tr></thead>
            <tbody className="divide-y divide-slate-200">
              {filas.map((f) => (
                <tr key={f.label} className="hover:bg-slate-50/60">
                  <Td className="font-medium text-ink-800">{f.label}</Td>
                  <Td className="text-right">{f.facturado ? formatCurrency(f.facturado) : <span className="text-slate-300">—</span>}</Td>
                  <Td className="text-right text-emerald-700">{f.cobrado ? formatCurrency(f.cobrado) : <span className="text-slate-300">—</span>}</Td>
                  <Td className="text-right text-rose-600">{f.gastoMes ? formatCurrency(f.gastoMes) : <span className="text-slate-300">—</span>}</Td>
                  <Td className={classNames('text-right font-medium', f.beneficio >= 0 ? 'text-ink-800' : 'text-rose-600')}>{formatCurrency(f.beneficio)}</Td>
                </tr>
              ))}
            </tbody>
            <tfoot>
              <tr className="border-t-2 border-slate-200 font-bold">
                <Td>Total</Td>
                <Td className="text-right">{formatCurrency(totalFacturado)}</Td>
                <Td className="text-right text-emerald-700">{formatCurrency(totalCobrado)}</Td>
                <Td className="text-right text-rose-600">{formatCurrency(totalGastos)}</Td>
                <Td className={classNames('text-right', totalBeneficio >= 0 ? 'text-ink-900' : 'text-rose-600')}>{formatCurrency(totalBeneficio)}</Td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div className="lg:col-span-2 bg-white rounded-2xl border border-slate-100 shadow-card p-5">
          <h3 className="text-sm font-semibold text-ink-800 mb-3">Pagos recibidos en {year}</h3>
          {pagosDelAnio.length === 0 ? <EmptyState icon={Icons.Euro} title="Sin pagos registrados este año" /> : (
            <div className="space-y-2 max-h-96 overflow-y-auto">
              {pagosDelAnio.map((p) => {
                const factura = facturaById[p.facturaId];
                return (
                  <div key={p.id} className="flex items-center gap-3 text-sm border-b border-slate-50 pb-2">
                    <Icons.Euro className="w-4 h-4 text-emerald-500 shrink-0" />
                    <div className="min-w-0 flex-1">
                      <p className="text-ink-700 truncate">{factura ? `Factura ${factura.numero}` : 'Factura'} — {(clienteById[factura?.clienteId] || {}).nombre || ''}</p>
                      <p className="text-xs text-slate-400">{formatDate(p.fecha)} · {ESTADO_LABELS[p.metodo] || p.metodo}</p>
                    </div>
                    <span className="font-medium text-emerald-700">{formatCurrency(p.importe)}</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
        <div className="bg-white rounded-2xl border border-slate-100 shadow-card p-5">
          <h3 className="text-sm font-semibold text-ink-800 mb-1">Pendiente de cobro (total)</h3>
          <p className="text-3xl font-bold text-amber-600">{formatCurrency(pendienteCobro)}</p>
          <p className="text-xs text-slate-400 mt-2">Suma de facturas emitidas, con pago parcial o vencidas, sin importar el año.</p>
        </div>
      </div>
    </div>
  );
}

function Ajustes() {
  const toast = useToast();
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState(null);

  async function load() {
    setLoading(true);
    const rows = await api.list('Empresa');
    setForm(rows[0] || { nombreFiscal: 'Creadores Web' });
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  async function handleSubmit(e) {
    e.preventDefault();
    setSaving(true);
    try {
      const { id, createdAt, ...payload } = form;
      if (id) await api.update('Empresa', id, payload);
      else await api.insert('Empresa', payload);
      toast('Datos de la empresa guardados');
      load();
    } catch (err) { toast(err.message || 'Error al guardar', 'error'); }
    finally { setSaving(false); }

  if (loading || !form) return <PageLoader />;

  return (
    <div className="fade-in max-w-2xl">
      <PageHeader title="Ajustes" subtitle="Datos fiscales de tu agencia, usados en los PDF de presupuestos y facturas" />
      <form onSubmit={handleSubmit} className="bg-white rounded-2xl border border-slate-100 shadow-card p-5 sm:p-6">

          <img src={LOGO_DATA_URI} alt="Creadores Web" className="w-12 h-12 object-contain" />
          <div>
            <p className="font-semibold text-ink-900">Ficha fiscal de la empresa</p>
            <p className="text-xs text-slate-400">Aparecerá en la cabecera de cada presupuesto y factura</p>
          </div>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <Field label="Nombre fiscal / Razón social" required className="sm:col-span-2">
            <Input value={form.nombreFiscal || ''} onChange={set('nombreFiscal')} required />
          </Field>
          <Field label="NIF / CIF" hint="Formato UE: ES12345678A">
            <Input value={form.nif || ''} onChange={(e) => setForm((f) => ({ ...f, nif: e.target.value.toUpperCase() }))} maxLength={15} className="uppercase" />
          </Field>
          <Field label="Sitio web"><Input value={form.sitioWeb || ''} onChange={set('sitioWeb')} placeholder="https://" /></Field>
          <Field label="Dirección" className="sm:col-span-2"><Input value={form.direccion || ''} onChange={set('direccion')} /></Field>
          <Field label="Código postal"><Input value={form.codigoPostal || ''} onChange={set('codigoPostal')} maxLength={5} inputMode="numeric" /></Field>
          <Field label="Población"><Input value={form.poblacion || ''} onChange={set('poblacion')} /></Field>
          <Field label="Provincia"><Input value={form.provincia || ''} onChange={set('provincia')} /></Field>
          <Field label="Email"><Input type="email" value={form.email || ''} onChange={set('email')} /></Field>
          <Field label="Teléfono"><Input type="tel" inputMode="tel" maxLength={12} value={form.telefono || ''} onChange={set('telefono')} /></Field>
          <Field label="IBAN (opcional)" hint="Si quieres mostrarlo en las facturas"><Input value={form.iban || ''} onChange={set('iban')} /></Field>
          <Field label="Texto de pie de página" className="sm:col-span-2" hint="Aparece al final de cada PDF">
            <Textarea value={form.notasPie || ''} onChange={set('notasPie')} />
          </Field>
        </div>
        <div className="flex justify-end mt-5">
          <Button type="submit" disabled={saving}>{saving ? 'Guardando...' : 'Guardar cambios'}</Button>
        </div>
      </form>
    </div>
  );
}

// ===================== App.js =====================
function getRouteFromHash() {
  const h = (window.location.hash || '').replace('#', '').trim();
  return h || 'dashboard';
}

function AppShell({ session }) {
  const [route, setRoute] = useState(getRouteFromHash());
  const [navParams, setNavParams] = useState(null);

  useEffect(() => {
    function onHashChange() { setRoute(getRouteFromHash()); }
    window.addEventListener('hashchange', onHashChange);
    return () => window.removeEventListener('hashchange', onHashChange);
  }, []);

  function navigate(key, params) {
    window.location.hash = key;
    setRoute(key);
    setNavParams(params || null);
  }

  async function handleLogout() {
    await supabaseClient.auth.signOut();
  }

  function renderPage() {
    switch (route) {
      case 'dashboard': return <Dashboard navigate={navigate} />;
      case 'tareas': return <Tareas navigate={navigate} />;
      case 'calendario': return <Calendario navigate={navigate} />;
      case 'clientes': return <Clientes />;
      case 'leads': return <Leads navigate={navigate} />;
      case 'proyectos': return <Proyectos navigate={navigate} />;
      case 'presupuestos': return <Presupuestos prefill={navParams} onConsumePrefill={() => setNavParams(null)} navigate={navigate} />;
      case 'facturas': return <Facturas />;
      case 'recurrentes': return <ServiciosRecurrentes />;
      case 'productos': return <Productos />;
      case 'proveedores': return <Proveedores />;
      case 'gastos': return <Gastos />;
      case 'contabilidad': return <Contabilidad />;
      case 'ajustes': return <Ajustes />;
      default: return <Dashboard navigate={navigate} />;
    }
  }

  return (
    <Layout current={route} navigate={navigate} userEmail={session.user.email} onLogout={handleLogout}>
      {renderPage()}
    </Layout>
  );
}

function App() {
  const [session, setSession] = useState(undefined); // undefined = cargando, null = sin sesión

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = supabaseClient.auth.onAuthStateChange((_event, sess) => {
      setSession(sess);
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  if (session === undefined) {
    return <div className="min-h-screen flex items-center justify-center bg-ink-900"><Spinner className="w-8 h-8 border-white/30 border-t-white" /></div>;
  }
  if (!session) return <Login />;

  return (
    <ToastProvider>
      <AppShell session={session} />
    </ToastProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
