// ===================== pages/ServiciosRecurrentes.js =====================
const RECURRENTE_EMPTY = { clienteId: '', productoId: '', descripcion: '', precio: '', iva: 21, sinFactura: false, periodicidad: 'anual', fechaInicio: toDateInput(new Date()), proximaRenovacion: '', estado: 'activo', notas: '' };

function addPeriodo(fecha, periodicidad) {
  const d = new Date(fecha);
  if (periodicidad === 'mensual') d.setMonth(d.getMonth() + 1);
  else if (periodicidad === 'trimestral') d.setMonth(d.getMonth() + 3);
  else if (periodicidad === 'semestral') d.setMonth(d.getMonth() + 6);
  else d.setFullYear(d.getFullYear() + 1);
  return toDateInput(d);
}

function RecurrenteForm({ initial, clientes, productos, onClienteCreado, onProductoCreado, onCancel, onSaved }) {
  const toast = useToast();
  const [form, setForm] = useState(initial ? { ...initial, fechaInicio: toDateInput(initial.fechaInicio), proximaRenovacion: toDateInput(initial.proximaRenovacion) } : RECURRENTE_EMPTY);
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  function applyProducto(productoId) {
    const p = productos.find((x) => x.id === productoId);
    setForm((f) => ({ ...f, productoId, descripcion: p ? p.nombre : f.descripcion, precio: p ? p.precio : f.precio, iva: p ? p.iva : f.iva }));
  }

  async function handleSubmit(e) {
    e.preventDefault();
    if (!form.clienteId) { toast('Selecciona un cliente', 'error'); return; }
    if (!form.descripcion.trim()) { toast('La descripción es obligatoria', 'error'); return; }
    setSaving(true);
    try {
      const payload = {
        clienteId: form.clienteId, productoId: form.productoId || null, descripcion: form.descripcion,
        precio: Number(form.precio || 0), iva: form.sinFactura ? 0 : Number(form.iva || 0), sinFactura: !!form.sinFactura,
        periodicidad: form.periodicidad,
        fechaInicio: form.fechaInicio || null,
        proximaRenovacion: form.proximaRenovacion || addPeriodo(form.fechaInicio || new Date(), form.periodicidad),
        estado: form.estado, notas: form.notas || '',
      };
      if (form.id) await api.update('ServicioRecurrente', form.id, payload);
      else await api.insert('ServicioRecurrente', payload);
      toast(form.id ? 'Servicio actualizado' : 'Servicio creado');
      onSaved();
    } catch (err) { toast(err.message || 'Error al guardar', 'error'); }
    finally { setSaving(false); }
  }

  return (
    <form onSubmit={handleSubmit}>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <Field label="Cliente" required>
          <ClienteSelect value={form.clienteId} clientes={clientes} onChange={(v) => setForm((f) => ({ ...f, clienteId: v }))} onCreado={onClienteCreado} required />
        </Field>
        <Field label="Producto del catálogo (opcional)">
          <ProductoSelect value={form.productoId || ''} productos={productos} onChange={applyProducto}
            onCreado={(p) => { onProductoCreado(p); setForm((f) => ({ ...f, productoId: p.id, descripcion: p.nombre, precio: p.precio, iva: p.iva })); }} />
        </Field>
        <Field label="Descripción" required className="sm:col-span-2"><Input value={form.descripcion} onChange={set('descripcion')} required /></Field>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 sm:col-span-2">
          <Field label="Precio sin IVA (€)" required>
            <Input type="number" step="0.01" min="0" value={form.precio} onChange={set('precio')} required />
          </Field>
          <Field label="IVA (%)">
            <Input type="number" step="0.01" min="0" value={form.iva} onChange={set('iva')} disabled={form.sinFactura} className={form.sinFactura ? 'bg-slate-50 text-slate-400' : undefined} />
          </Field>
          <Field label="Precio con IVA (€)">
            <Input value={form.precio ? formatCurrency(priceWithIVA(form.precio, form.sinFactura ? 0 : form.iva)) : ''} disabled className="bg-slate-50 text-ink-700 font-medium" />
          </Field>
        </div>
        <Field label="Cobro en efectivo, sin factura" className="sm:col-span-2">
          <label className="flex items-start gap-2 text-sm text-ink-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2.5 cursor-pointer">
            <input
              type="checkbox"
              checked={!!form.sinFactura}
              onChange={(e) => setForm((f) => ({ ...f, sinFactura: e.target.checked, iva: e.target.checked ? 0 : f.iva }))}
              className="mt-0.5 rounded border-amber-300 text-amber-600 focus:ring-amber-500"
            />
            <span>Se cobra en efectivo, sin factura ni IVA. Se marcará con una <Icons.X className="w-3 h-3 inline text-amber-700" strokeWidth={3} /> en el listado, solo para control interno.</span>
          </label>
        </Field>
        <Field label="Periodicidad">
          <Select value={form.periodicidad} onChange={(e) => {
            const periodicidad = e.target.value;
            setForm((f) => ({ ...f, periodicidad, proximaRenovacion: addPeriodo(f.fechaInicio || new Date(), periodicidad) }));
          }}>
            <option value="mensual">Mensual</option><option value="trimestral">Trimestral</option><option value="semestral">Semestral</option><option value="anual">Anual</option>
          </Select>
        </Field>
        <Field label="Fecha de inicio">
          <Input type="date" value={form.fechaInicio || ''} onChange={(e) => {
            const fechaInicio = e.target.value;
            setForm((f) => ({ ...f, fechaInicio, proximaRenovacion: addPeriodo(fechaInicio || new Date(), f.periodicidad) }));
          }} />
        </Field>
        <Field label="Próxima renovación" hint="Calculada según periodicidad y fecha de inicio. Puedes cambiarla a mano.">
          <Input type="date" value={form.proximaRenovacion || ''} onChange={set('proximaRenovacion')} />
        </Field>
        <Field label="Estado">
          <Select value={form.estado} onChange={set('estado')}>
            <option value="activo">Activo</option><option value="pausado">Pausado</option><option value="cancelado">Cancelado</option>
          </Select>
        </Field>
        <Field label="Notas"><Input value={form.notas || ''} onChange={set('notas')} /></Field>
      </div>
      <div className="flex justify-end gap-2 mt-5">
        <Button variant="secondary" type="button" onClick={onCancel}>Cancelar</Button>
        <Button type="submit" disabled={saving}>{saving ? 'Guardando...' : 'Guardar servicio'}</Button>
      </div>
    </form>
  );
}

// Estado visible de un servicio: activo, próximo a vencer (dentro del aviso), vencido, pausado o cancelado
function estadoServicio(i) {
  if (i.estado !== 'activo') return { key: i.estado, label: ESTADO_LABELS[i.estado] || i.estado, dias: null };
  const dias = i.proximaRenovacion ? Math.round((new Date(i.proximaRenovacion + 'T00:00:00') - new Date(new Date().toDateString())) / 86400000) : null;
  if (dias === null) return { key: 'activo', label: 'Activo', dias };
  if (dias < 0) return { key: 'vencido', label: 'Vencido', dias };
  if (dias <= Number(i.avisoDias || 30)) return { key: 'proximo', label: 'Próximo a vencer', dias };
  return { key: 'activo', label: 'Activo', dias };
}
const SERVICIO_BADGE = {
  activo: 'bg-emerald-50 text-emerald-700 ring-emerald-600/20', proximo: 'bg-amber-50 text-amber-700 ring-amber-600/20',
  vencido: 'bg-rose-50 text-rose-700 ring-rose-600/20', pausado: 'bg-slate-100 text-slate-500 ring-slate-500/20', cancelado: 'bg-slate-100 text-slate-500 ring-slate-500/20',
};

function ServiciosRecurrentes() {
  const toast = useToast();
  const [facturas, setFacturas] = useState([]);
  const [renovaciones, setRenovaciones] = useState([]);
  const [filtroEstado, setFiltroEstado] = useState('todos');
  const [historialDe, setHistorialDe] = useState(null);
  const [generando, setGenerando] = useState(null);
  const [loading, setLoading] = useState(true);
  const [items, setItems] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [productos, setProductos] = useState([]);
  const [search, setSearch] = useState('');
  const [modal, setModal] = useState(null);
  const [toDelete, setToDelete] = useState(null);
  const [sort, setSort] = useState({ key: null, dir: 'asc' });
  const onSort = (key) => setSort((s) => toggleSort(s, key));

  async function load() {
    setLoading(true);
    const [it, cl, pd, fa, rn] = await Promise.all([api.list('ServicioRecurrente'), api.list('Cliente', { order: 'nombre', ascending: true }), api.list('Producto', { order: 'nombre', ascending: true }), api.list('Factura'), api.list('RenovacionServicio')]);
    setItems(it); setClientes(cl); setProductos(pd.filter((p) => p.activo)); setFacturas(fa); setRenovaciones(rn); setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const clienteById = Object.fromEntries(clientes.map((c) => [c.id, c]));
  const facturaById = Object.fromEntries(facturas.map((f) => [f.id, f]));
  const filtered = items.filter((i) => {
    if (filtroEstado !== 'todos' && estadoServicio(i).key !== filtroEstado) return false;
    if (filtroEstado === 'todos' && false) return false;
    const q = search.toLowerCase();
    if (!q) return true;
    return [i.descripcion, (clienteById[i.clienteId] || {}).nombre, (clienteById[i.clienteId] || {}).empresa].filter(Boolean).some((v) => v.toLowerCase().includes(q));
  });
  async function generarRenovacion(i) {
    setGenerando(i.id);
    try {
      const { data, error } = await supabaseClient.rpc('generar_renovacion_servicio', { p_servicio_id: i.id });
      if (error) await manejarError(error);
      toast(`Borrador de renovación creado${data && data.id ? ': revísalo y emítelo en Facturas y pagos' : ''}`);
      load();
    } catch (err) { toast(err.message || 'No se pudo generar la renovación', 'error'); }
    finally { setGenerando(null); }
  }
  const sorted = sortRows(filtered, sort, {
    dias: (i) => (estadoServicio(i).dias ?? 99999),
    estadoVisible: (i) => estadoServicio(i).label,
    cliente: (i) => (clienteById[i.clienteId] || {}).nombre,
    servicio: (i) => i.descripcion,
    periodicidad: (i) => i.periodicidad,
    precio: (i) => Number(i.precio || 0),
    precioIva: (i) => (i.sinFactura ? Number(i.precio || 0) : priceWithIVA(i.precio, i.iva)),
    proximaRenovacion: (i) => i.proximaRenovacion || '',
    estado: (i) => i.estado,
  });

  const ingresosRecurrentesMes = items.filter((i) => i.estado === 'activo').reduce((acc, i) => {
    const p = Number(i.precio || 0);
    if (i.periodicidad === 'mensual') return acc + p;
    if (i.periodicidad === 'trimestral') return acc + p / 3;
    return acc + p / 12;
  }, 0);

  async function guardarServicio(i, cambios) {
    const actualizado = await api.update('ServicioRecurrente', i.id, cambios);
    setItems((prev) => prev.map((x) => (x.id === i.id ? { ...x, ...actualizado } : x)));
  }

  async function handleDelete() {
    try { await api.remove('ServicioRecurrente', toDelete.id); toast('Servicio eliminado'); setToDelete(null); load(); }
    catch (err) { toast('No se pudo eliminar', 'error'); setToDelete(null); }
  }

  function handleClienteCreado(c) {
    setClientes((cs) => [...cs, c].sort((a, b) => a.nombre.localeCompare(b.nombre)));
  }
  function handleProductoCreado(p) {
    setProductos((ps) => [...ps, p].sort((a, b) => a.nombre.localeCompare(b.nombre)));
  }

  const now = new Date();

  return (
    <div className="fade-in">
      <PageHeader title="Servicios recurrentes" subtitle={`${filtered.length} servicio${filtered.length === 1 ? '' : 's'} · Ingreso recurrente estimado: ${formatCurrency(ingresosRecurrentesMes)} / mes`}
        action={<div className="flex gap-2">
          <ExportCsvButton nombre="servicios_recurrentes" filas={sorted} columnas={[
            { titulo: 'Cliente', valor: (i) => csvCliente(clienteById[i.clienteId]) }, { titulo: 'Descripción', valor: (i) => i.descripcion },
            { titulo: 'Periodicidad', valor: (i) => i.periodicidad }, { titulo: 'Precio', valor: (i) => Number(i.precio || 0) }, { titulo: 'IVA %', valor: (i) => Number(i.iva || 0) },
            { titulo: 'Sin factura', valor: (i) => csvSiNo(i.sinFactura) }, { titulo: 'Fecha inicio', valor: (i) => csvFecha(i.fechaInicio) },
            { titulo: 'Próxima renovación', valor: (i) => csvFecha(i.proximaRenovacion) }, { titulo: 'Estado', valor: (i) => i.estado }, { titulo: 'Notas', valor: (i) => i.notas }]} />
          <Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo servicio</Button>
        </div>} />
      <Toolbar search={search} onSearch={setSearch} placeholder="Buscar servicio o cliente..."
        right={
          <Select value={filtroEstado} onChange={(e) => setFiltroEstado(e.target.value)} className="!py-1.5 !text-xs w-auto">
            <option value="todos">Todos los estados</option><option value="activo">Activos</option><option value="proximo">Próximos a vencer</option>
            <option value="vencido">Vencidos</option><option value="pausado">Pausados</option><option value="cancelado">Cancelados</option>
          </Select>
        } />
      {loading ? <PageLoader /> : filtered.length === 0 ? (
        <CardTable><EmptyState icon={Icons.Repeat} title="No hay servicios recurrentes" action={<Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo servicio</Button>} /></CardTable>
      ) : (
        <CardTable>
          <table className="w-full min-w-[1100px]">
            <thead className="bg-slate-700 text-white"><tr>
              <SortableTh sortKey="cliente" sort={sort} onSort={onSort}>Cliente</SortableTh>
              <SortableTh sortKey="servicio" sort={sort} onSort={onSort}>Servicio</SortableTh>
              <SortableTh sortKey="periodicidad" sort={sort} onSort={onSort}>Periodicidad</SortableTh>
              <SortableTh sortKey="precio" sort={sort} onSort={onSort} className="text-right">Precio</SortableTh>
              <SortableTh sortKey="precioIva" sort={sort} onSort={onSort} className="text-right">Precio c/IVA</SortableTh>
              <SortableTh sortKey="proximaRenovacion" sort={sort} onSort={onSort}>Próxima renovación</SortableTh>
              <SortableTh sortKey="dias" sort={sort} onSort={onSort} className="text-right">Días</SortableTh>
              <SortableTh sortKey="estadoVisible" sort={sort} onSort={onSort}>Estado</SortableTh>
              <Th>Última factura</Th>
              <Th className="text-right">Acciones</Th>
            </tr></thead>
            <tbody className="divide-y divide-slate-200">
              {sorted.map((i) => {
                const vence = i.proximaRenovacion ? new Date(i.proximaRenovacion) : null;
                const proximo = vence && (vence - now) / (1000 * 3600 * 24) <= 15;
                return (
                  <tr key={i.id} className="hover:bg-slate-50/60">
                    <Td>
                      <ClienteCeldaEditable cliente={clienteById[i.clienteId]} claseNombre="text-ink-800" claseSub="text-xs text-rose-500" onSaved={load}
                        onUpdated={(u) => setClientes((cs) => cs.map((x) => (x.id === u.id ? { ...x, ...u } : x)))} />
                    </Td>
                    <Td>
                      <div className="flex items-center gap-1.5">
                        <EditableCell value={i.descripcion || ''} required onSave={(v) => guardarServicio(i, { descripcion: v })} />
                        {i.sinFactura && (
                          <span title="Cobro en efectivo, sin factura ni IVA" className="inline-flex items-center justify-center w-4 h-4 rounded-full bg-amber-100 text-amber-700 shrink-0">
                            <Icons.X className="w-2.5 h-2.5" strokeWidth={3} />
                          </span>
                        )}
                      </div>
                    </Td>
                    <Td><EditableCell value={i.periodicidad || 'anual'} options={[['mensual', 'Mensual'], ['trimestral', 'Trimestral'], ['semestral', 'Semestral'], ['anual', 'Anual']]} display={<span className="capitalize">{i.periodicidad}</span>} onSave={(v) => guardarServicio(i, { periodicidad: v })} /></Td>
                    <Td className={classNames('text-right', i.sinFactura && 'text-amber-700')}><EditableCell type="number" step="0.01" value={String(i.precio ?? '')} validate={validarImporte} display={formatCurrency(i.precio)} onSave={(v) => guardarServicio(i, { precio: Number(v) })} /></Td>
                    <Td className={classNames('text-right font-medium', i.sinFactura && 'text-amber-700')}>

                        <button className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500" onClick={() => setModal({ mode: 'edit', item: i })}><Icons.Edit className="w-4 h-4" /></button>
                        <button className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500" onClick={() => setToDelete(i)}><Icons.Trash className="w-4 h-4" /></button>
                      </div>
                    </Td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </CardTable>
      )}
      <Modal open={!!modal} onClose={() => setModal(null)} title={modal?.mode === 'edit' ? 'Editar servicio recurrente' : 'Nuevo servicio recurrente'} wide>
        {modal && <RecurrenteForm initial={modal.mode === 'edit' ? modal.item : null} clientes={clientes} productos={productos}
          onClienteCreado={handleClienteCreado} onProductoCreado={handleProductoCreado}
          onCancel={() => setModal(null)} onSaved={() => { setModal(null); load(); }} />}
      </Modal>
      <Modal open={!!historialDe} onClose={() => setHistorialDe(null)} title={historialDe ? `Historial · ${historialDe.descripcion}` : ''}>
        {historialDe && (() => {
          const orig = facturaById[historialDe.facturaOrigenId];
          const filas = renovaciones.filter((r) => r.servicioId === historialDe.id).sort((a, b) => String(b.periodoDesde).localeCompare(String(a.periodoDesde)));
          return (
            <div className="space-y-2 text-sm">
              <p className="text-xs text-slate-500">Para cancelar un servicio conservando su historial, cambia su estado a «Cancelado» en lugar de eliminarlo.</p>
              {orig && <div className="flex justify-between border border-slate-200 rounded-lg px-3 py-2"><span>Alta · factura {orig.numero || 'borrador'}{historialDe.primeraAnualidadGratis ? ' (1.er periodo gratis)' : ''}</span><span className="text-slate-500">{formatDate(historialDe.fechaInicio)}</span></div>}
              {filas.length === 0 && <p className="text-xs text-slate-400 text-center py-3">Sin renovaciones generadas todavía</p>}
              {filas.map((r) => { const f = facturaById[r.facturaId]; return (
                <div key={r.id} className="flex justify-between border border-slate-200 rounded-lg px-3 py-2">
                  <span>Renovación desde {formatDate(r.periodoDesde)} · {f ? (f.numero || 'Borrador') : '—'} {r.aplicada ? '' : <span className="text-amber-600 text-xs">(pendiente de emitir)</span>}</span>
                  <span className="text-slate-500">{f ? formatCurrency(f.total) : ''}</span>
                </div>); })}
            </div>
          );
        })()}
      </Modal>
      <ConfirmDialog open={!!toDelete} title="Eliminar servicio" danger message="¿Eliminar este servicio recurrente? Se borra también su historial de renovaciones. Si solo quieres darlo de baja, cámbialo a «Cancelado»." onCancel={() => setToDelete(null)} onConfirm={handleDelete} />
    </div>
  );
}

function mensualEquivalente(gasto) {
  const importe = Number(gasto.importe || 0);
  if (gasto.periodicidad === 'mensual') return importe;
  if (gasto.periodicidad === 'trimestral') return importe / 3;
  if (gasto.periodicidad === 'semestral') return importe / 6;
  if (gasto.periodicidad === 'anual') return importe / 12;
  return 0; // puntual no cuenta como recurrente
}

// Un gasto recurrente ("plantilla") es la fila que crea el usuario: guarda la periodicidad
// y también representa el primer pago. Cada pago siguiente se genera como una fila aparte
// (gastoBaseId = id de la plantilla), con su propia fecha e importe, marcada pagada si ya pasó.
function siguientePeriodo(fecha, periodicidad) {
  const meses = PERIODICIDAD_MESES[periodicidad];
  return meses ? addMonths(fecha, meses) : '';
}

// Devuelve los pagos que faltan por crear para una plantilla activa, generando siempre
// como máximo un pago futuro por delante de hoy (nunca un histórico infinito).
// Recorre cada fecha de periodo desde el inicio hasta el horizonte y solo crea las que
// falten de verdad (por fecha exacta) — así, si se edita la fecha de inicio y quedan
// ocurrencias sueltas ya generadas más adelante, igualmente rellena todos los huecos.
// Un pago generado de un gasto recurrente hereda siempre si es deducible o no de su gasto base
function gastoDeducibleEfectivo(g, porId) {
  const base = g.gastoBaseId ? porId[g.gastoBaseId] : null;
  return (base ? base.deducible : g.deducible) !== false;
}

function ocurrenciasFaltantes(plantilla, existentes) {
  if (plantilla.estado !== 'activo' || !plantilla.fecha) return [];
  const meses = PERIODICIDAD_MESES[plantilla.periodicidad];
  if (!meses) return [];
  const hoy = dateKey(new Date());
  const horizonte = siguientePeriodo(hoy, plantilla.periodicidad);
  const fechasExistentes = new Set([plantilla.fecha, ...existentes.map((o) => o.fecha)]);
  const nuevas = [];
  let cursor = siguientePeriodo(plantilla.fecha, plantilla.periodicidad);
  while (cursor && cursor <= horizonte) {
    if (!fechasExistentes.has(cursor)) {
      nuevas.push({
        descripcion: plantilla.descripcion, categoria: plantilla.categoria, importe: plantilla.importe,
        periodicidad: plantilla.periodicidad, fecha: cursor, proximaRenovacion: null,
        proveedorId: plantilla.proveedorId, clienteId: plantilla.clienteId, proyectoId: plantilla.proyectoId,
        repercutible: plantilla.repercutible, facturado: false, estado: 'activo',
        deducible: plantilla.deducible !== false, ivaSoportado: plantilla.ivaSoportado || 0,
        pagado: cursor <= hoy, notas: plantilla.notas, gastoBaseId: plantilla.id,
        ivaSoportado: plantilla.ivaSoportado, deducible: plantilla.deducible,
      });
      fechasExistentes.add(cursor);
    }
    cursor = siguientePeriodo(cursor, plantilla.periodicidad);
  }
  return nuevas;
}

function Gastos({ modo = 'deducible' }) {
  const toast = useToast();
  const esND = modo === 'no_deducible';
  const [loading, setLoading] = useState(true);
  const [items, setItems] = useState([]);
  const [proveedores, setProveedores] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [proyectos, setProyectos] = useState([]);
  const [search, setSearch] = useState('');
  const [filterCategoria, setFilterCategoria] = useState('todas');
  const [filterPago, setFilterPago] = useState('todos');
  const [filterYear, setFilterYear] = useState('todos');
  const [tab, setTab] = useState('todos');
  const [modal, setModal] = useState(null);
  const [detalle, setDetalle] = useState(null); // id de plantilla recurrente cuyo detalle se muestra
  const [toDelete, setToDelete] = useState(null);
  // Por defecto, tanto "Próximos" como "Pasados" se ordenan por fecha más cercana a hoy
  const [sort, setSort] = useState({ key: 'proximaRenovacion', dir: 'desc' });
  const onSort = (key) => setSort((s) => toggleSort(s, key));
  const [page, setPage] = useState(1);

  // Genera los pagos futuros/pasados que falten para las plantillas recurrentes activas,
  // manteniendo siempre como máximo un pago futuro por delante de hoy.
  async function generarPendientes(gastos) {
    const porPlantilla = {};
    gastos.forEach((g) => { if (g.gastoBaseId) (porPlantilla[g.gastoBaseId] = porPlantilla[g.gastoBaseId] || []).push(g); });
    const plantillas = gastos.filter((g) => !g.gastoBaseId && g.periodicidad !== 'puntual');
    const nuevas = [];
    plantillas.forEach((p) => nuevas.push(...ocurrenciasFaltantes(p, porPlantilla[p.id] || [])));
    if (!nuevas.length) return gastos;
    const insertadas = await Promise.all(nuevas.map((n) => api.insert('Gasto', n).catch(() => null)));
    return [...gastos, ...insertadas.filter(Boolean)];
  }

  async function load() {
    setLoading(true);
    const [g0, pv, cl, py] = await Promise.all([
      api.list('Gasto'), api.list('Proveedor', { order: 'nombre', ascending: true }),
      api.list('Cliente', { order: 'nombre', ascending: true }), api.list('Proyecto'),
    ]);
    const g1 = await generarPendientes(g0);
    // Los gastos recurrentes se cobran automáticamente: al llegar su fecha se marcan siempre como pagados.
    const hoyK = dateKey(new Date());
    const sinMarcar = g1.filter((x) => (x.periodicidad !== 'puntual' || x.gastoBaseId) && !x.pagado && x.estado === 'activo' && x.fecha && String(x.fecha).slice(0, 10) <= hoyK);
    await Promise.all(sinMarcar.map((x) => api.update('Gasto', x.id, { pagado: true }).catch(() => null)));
    const ids = new Set(sinMarcar.map((x) => x.id));
    const g2 = ids.size ? g1.map((x) => (ids.has(x.id) ? { ...x, pagado: true } : x)) : g1;
    // Los pagos generados heredan "deducible / no deducible" de su gasto base (así nunca se mezclan)
    const porIdG = Object.fromEntries(g2.map((x) => [x.id, x]));
    const desajustados = g2.filter((x) => x.gastoBaseId && porIdG[x.gastoBaseId] && (x.deducible !== false) !== (porIdG[x.gastoBaseId].deducible !== false));
    await Promise.all(desajustados.map((x) => api.update('Gasto', x.id, { deducible: porIdG[x.gastoBaseId].deducible !== false }).catch(() => null)));
    const dsIds = new Set(desajustados.map((x) => x.id));
    const g3 = dsIds.size ? g2.map((x) => (dsIds.has(x.id) ? { ...x, deducible: porIdG[x.gastoBaseId].deducible !== false } : x)) : g2;
    // Esta pantalla solo muestra su mitad: deducibles o no deducibles
    const g = g3.filter((x) => (x.deducible === false) === esND);
    setItems(g); setProveedores(pv); setClientes(cl); setProyectos(py);
    setLoading(false);
  }
  useEffect(() => { load(); }, []);
  useEffect(() => { setPage(1); }, [search, filterCategoria, filterPago, filterYear, tab, sort]);

  const clienteById = Object.fromEntries(clientes.map((c) => [c.id, c]));
  const proveedorById = Object.fromEntries(proveedores.map((p) => [p.id, p]));

  const plantillas = items.filter((g) => !g.gastoBaseId && g.periodicidad !== 'puntual');
  const ocurrenciasPorPlantilla = {};
  items.forEach((g) => { if (g.gastoBaseId) (ocurrenciasPorPlantilla[g.gastoBaseId] = ocurrenciasPorPlantilla[g.gastoBaseId] || []).push(g); });
  const anioActual = new Date().getFullYear();

  const hoyKey = dateKey(new Date());
  function resumenDe(plantilla) {
    const todas = [plantilla, ...(ocurrenciasPorPlantilla[plantilla.id] || [])];
    const delAnio = todas.filter((o) => o.fecha && parseDateOnly(o.fecha) && parseDateOnly(o.fecha).getFullYear() === anioActual);
    const pagadasAnio = delAnio.filter((o) => o.pagado);
    // "Próximo pago" es el primer pendiente cuya fecha aún no ha llegado; uno pendiente con fecha
    // ya pasada es un atrasado (dato antiguo sin marcar), no un "próximo".
    const futuros = todas.filter((o) => !o.pagado && o.fecha && o.fecha >= hoyKey).sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
    const conHistorial = todas.filter((o) => o.fecha && o.fecha < hoyKey).sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
    const atrasados = todas.filter((o) => !o.pagado && o.fecha && o.fecha < hoyKey);
    return {
      plantilla, todas,
      proximaPendiente: futuros[0] ? futuros[0].fecha : null,
      ultimaPagada: conHistorial.length ? conHistorial[conHistorial.length - 1].fecha : null,
      tieneHistorial: conHistorial.length > 0,
      atrasadosCount: atrasados.length,
      resumenAnioTexto: `Este año: ${pagadasAnio.length}/${delAnio.length} pagados`,
      totalAnio: pagadasAnio.reduce((a, o) => a + Number(o.importe || 0), 0),
    };
  }

  // Filas a mostrar: gastos puntuales tal cual, y un único resumen por cada gasto recurrente.
  // Un recurrente activo tiene a la vez historial (aparece en Pasados) y próximo pago (aparece en Próximos).
  const filasPuntuales = items.filter((g) => g.periodicidad === 'puntual').map((g) => ({ tipo: 'simple', gasto: g }));
  const filasRecurrentes = plantillas.map((p) => ({ tipo: 'recurrente', ...resumenDe(p) }));
  const todasLasFilas = [...filasPuntuales, ...filasRecurrentes];

  const hoyDate = new Date(); hoyDate.setHours(0, 0, 0, 0);
  const descripcionDe = (r) => (r.tipo === 'simple' ? r.gasto.descripcion : r.plantilla.descripcion);
  const categoriaDe = (r) => (r.tipo === 'simple' ? r.gasto.categoria : r.plantilla.categoria);
  const clienteIdDe = (r) => (r.tipo === 'simple' ? r.gasto.clienteId : r.plantilla.clienteId);
  const importeDe = (r) => (r.tipo === 'simple' ? r.gasto.importe : r.plantilla.importe);
  const estadoDe = (r) => (r.tipo === 'simple' ? r.gasto.estado : r.plantilla.estado);
  const pagadoDe = (r) => (r.tipo === 'simple' ? r.gasto.pagado : !r.proximaPendiente);
  const fechaRelevanteDe = (r) => {
    if (r.tipo === 'simple') return r.gasto.fecha;
    return tab === 'pasados' ? (r.ultimaPagada || r.plantilla.fecha) : (r.proximaPendiente || r.plantilla.fecha);
  };
  function perteneceATab(r) {
    if (tab === 'todos') return true;
    if (r.tipo === 'simple') {
      const d = parseDateOnly(r.gasto.fecha);
      if (!d) return tab === 'proximos';
      return tab === 'pasados' ? d < hoyDate : d >= hoyDate;
    }
    // recurrente: puede aparecer en las dos pestañas a la vez (tiene historial y próximo pago)
    return tab === 'pasados' ? r.tieneHistorial : !!r.proximaPendiente;
  }

  const filtered = todasLasFilas.filter((r) => {
    if (!perteneceATab(r)) return false;
    if (filterYear !== 'todos') {
      const f = fechaRelevanteDe(r);
      if (!f || String(new Date(f).getFullYear()) !== filterYear) return false;
    }
    if (filterCategoria !== 'todas' && categoriaDe(r) !== filterCategoria) return false;
    if (filterPago === 'anuales_pendientes' && !(r.tipo === 'recurrente' && r.plantilla.periodicidad === 'anual' && estadoDe(r) === 'activo' && !pagadoDe(r))) return false;
    if (filterPago === 'pagados' && !pagadoDe(r)) return false;
    const q = search.toLowerCase();
    if (!q) return true;
    return [descripcionDe(r), CATEGORIA_LABELS[categoriaDe(r)], (clienteById[clienteIdDe(r)] || {}).nombre].filter(Boolean).some((v) => v.toLowerCase().includes(q));
  });
  const sorted = sortRows(filtered, sort, {
    descripcion: descripcionDe,
    cliente: (r) => (clienteById[clienteIdDe(r)] || {}).nombre,
    periodicidad: (r) => (r.tipo === 'simple' ? 'puntual' : r.plantilla.periodicidad),
    importe: (r) => Number(importeDe(r) || 0),
    proximaRenovacion: fechaRelevanteDe,
  });
  const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE_GASTOS));
  const paged = sorted.slice((page - 1) * PAGE_SIZE_GASTOS, page * PAGE_SIZE_GASTOS);

  // Los gastos en borrador, pausados o cancelados no se calculan ni contabilizan en los totales
  const gastoMensualEstimado = plantillas.filter((p) => p.estado === 'activo').reduce((acc, p) => acc + mensualEquivalente(p), 0);
  const gastoAnualEstimado = gastoMensualEstimado * 12;
  const esteMes = new Date();
  // Cada fila (puntual, o un pago concreto de un recurrente) tiene su propia fecha e importe reales,
  // así que basta sumar por fecha sin amortizar nada ni distinguir tipo (evita contar dos veces).
  const gastosDelMes = items.filter((g) => g.estado === 'activo' && g.fecha &&
    new Date(g.fecha).getMonth() === esteMes.getMonth() && new Date(g.fecha).getFullYear() === esteMes.getFullYear());
  const gastoEsteMes = gastosDelMes.reduce((acc, g) => acc + Number(g.importe || 0), 0);
  const gastosDelAnio = items.filter((g) => g.estado === 'activo' && g.fecha && parseDateOnly(g.fecha) && parseDateOnly(g.fecha).getFullYear() === anioActual);
  const gastadoAnioHastaHoy = gastosDelAnio.filter((g) => g.pagado).reduce((acc, g) => acc + Number(g.importe || 0), 0);
  const pendienteEsteAnio = gastosDelAnio.filter((g) => !g.pagado).reduce((acc, g) => acc + Number(g.importe || 0), 0);
  const pendientesRepercutir = items.filter((g) => g.estado === 'activo' && g.repercutible && !g.facturado);

  // Resumen de gasto por proveedor, año en curso
  const gastoPorProveedor = {};
  gastosDelAnio.forEach((g) => { if (g.proveedorId) gastoPorProveedor[g.proveedorId] = (gastoPorProveedor[g.proveedorId] || 0) + Number(g.importe || 0); });
  const resumenProveedores = Object.entries(gastoPorProveedor)
    .map(([id, total]) => ({ proveedor: proveedorById[id], total }))
    .filter((r) => r.proveedor)
    .sort((a, b) => b.total - a.total);
  const maxGastoProveedor = resumenProveedores.length ? resumenProveedores[0].total : 0;

  async function handleDelete() {
    try { await api.remove('Gasto', toDelete.id); toast('Gasto eliminado'); setToDelete(null); load(); }
    catch (err) { toast('No se pudo eliminar', 'error'); setToDelete(null); }
  }

  function handleClienteCreado(c) {
    setClientes((cs) => [...cs, c].sort((a, b) => a.nombre.localeCompare(b.nombre)));
  }

  async function guardarGasto(g, cambios) {
    const importe = cambios.importe !== undefined ? cambios.importe : Number(g.importe || 0);
    const iva = cambios.ivaSoportado !== undefined ? cambios.ivaSoportado : Number(g.ivaSoportado || 0);
    if (iva > importe) throw new Error('El IVA no puede ser mayor que el importe pagado');
    const actualizado = await api.update('Gasto', g.id, cambios);
    setItems((prev) => prev.map((x) => (x.id === g.id ? { ...x, ...actualizado } : x)));
  }

  async function handleDuplicar(g) {
    try {
      const { id, createdAt, ...rest } = g;
      const nuevo = await api.insert('Gasto', { ...rest, estado: 'borrador', pagado: false });
      toast('Gasto duplicado en modo borrador');
      await load();
      setModal({ mode: 'edit', item: nuevo });
    } catch (err) { toast(err.message || 'No se pudo duplicar', 'error'); }
  }

  async function handleTogglePagado(g) {
    try { await api.update('Gasto', g.id, { pagado: !g.pagado }); load(); }
    catch (err) { toast('No se pudo actualizar', 'error'); }
  }

  async function handleCambiarEstado(plantilla, estado) {
    try { await api.update('Gasto', plantilla.id, { estado }); toast(estado === 'pausado' ? 'Gasto recurrente pausado' : 'Estado actualizado'); load(); }
    catch (err) { toast('No se pudo actualizar', 'error'); }
  }

  // Código de color por urgencia del próximo pago: rojo pastel (<=2 meses), naranja (<=6 meses), verde (más lejos)
  function filaRenovacionClass(fecha) {
    if (!fecha) return '';
    const renovacion = parseDateOnly(fecha);
    if (!renovacion) return '';
    const limite2m = new Date(hoyDate.getFullYear(), hoyDate.getMonth() + 2, hoyDate.getDate());
    const limite6m = new Date(hoyDate.getFullYear(), hoyDate.getMonth() + 6, hoyDate.getDate());
    if (renovacion <= limite2m) return 'bg-rose-50';
    if (renovacion <= limite6m) return 'bg-amber-50';
    return 'bg-emerald-50';
  }

  const detalleResumen = detalle ? filasRecurrentes.find((r) => r.plantilla.id === detalle) : null;

  const columnasGastos = [
    { titulo: 'Descripción', valor: (r) => descripcionDe(r) },
    { titulo: 'Cliente', valor: (r) => csvCliente(clienteById[clienteIdDe(r)]) },
    { titulo: 'Categoría', valor: (r) => CATEGORIA_LABELS[categoriaDe(r)] || categoriaDe(r) || '' },
    { titulo: 'Periodicidad', valor: (r) => (r.tipo === 'simple' ? 'Puntual' : ESTADO_LABELS[r.plantilla.periodicidad]) },
    { titulo: 'Importe', valor: (r) => Number(importeDe(r) || 0) },
    { titulo: 'IVA', valor: (r) => Number((r.tipo === 'simple' ? r.gasto : r.plantilla).ivaSoportado || 0) },
    { titulo: 'Deducible', valor: (r) => csvSiNo((r.tipo === 'simple' ? r.gasto : r.plantilla).deducible !== false) },
    { titulo: 'Fecha', valor: (r) => csvFecha(fechaRelevanteDe(r)) },
    { titulo: 'Pagado', valor: (r) => csvSiNo(pagadoDe(r)) },
  ];

  return (
    <div className="fade-in">
      <div className={classNames('flex items-start gap-2 rounded-xl px-4 py-2.5 text-sm mb-4 border', esND ? 'bg-slate-100 border-slate-300 text-slate-700' : 'bg-emerald-50 border-emerald-200 text-emerald-800')}>
        <Icons.Lock className="w-4 h-4 shrink-0 mt-0.5" />
        <span>{esND
          ? <><b>Gastos NO deducibles</b> · control aparte: no entran en el beneficio, ni en el IVA, ni en el Resumen trimestral.</>
          : <><b>Gastos deducibles</b> · son los que se declaran a Hacienda (beneficio, IVA y Resumen trimestral).</>}</span>
      </div>
      <PageHeader title={esND ? 'Gastos no deducibles' : 'Gastos deducibles'} subtitle={`${sorted.length} gasto${sorted.length === 1 ? '' : 's'}${tab === 'todos' ? ' grabados' : tab === 'pasados' ? ' pasados' : ' próximos'}`}
        action={
          <div className="flex gap-2">
            <ExportCsvButton nombre={`gastos_${filterYear === 'todos' ? 'todos' : filterYear}_${tab}`} filas={sorted} columnas={columnasGastos} />
            <Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo gasto</Button>
          </div>
        } />

      <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-4">
        <StatCard label="Gasto anual estimado" value={formatCurrency(gastoAnualEstimado)} icon={Icons.Wallet} tone="rose" trend={`${formatCurrency(gastoMensualEstimado)} / mes en recurrentes`} />
        <StatCard label="Gastos este mes" value={formatCurrency(gastoEsteMes)} icon={Icons.Euro} tone="amber" />
        <StatCard label="Gastado este año" value={formatCurrency(gastadoAnioHastaHoy)} icon={Icons.BarChart} tone="emerald" trend={`Hasta hoy, ${anioActual}`} />
        <StatCard label="Pendiente este año" value={formatCurrency(pendienteEsteAnio)} icon={Icons.Alert} tone={pendienteEsteAnio ? 'amber' : 'emerald'} />
      </div>

      {resumenProveedores.length > 0 && (
        <div className="bg-white rounded-2xl border border-slate-100 shadow-card p-4 sm:p-5 mb-6">
          <h3 className="text-sm font-semibold text-ink-800 mb-3">Gasto por proveedor · {anioActual}</h3>
          <div className="space-y-2">
            {resumenProveedores.slice(0, 6).map(({ proveedor, total }) => (
              <div key={proveedor.id} className="flex items-center gap-3 text-sm">
                <span className="w-32 sm:w-40 shrink-0 truncate text-ink-700">{proveedor.nombre}</span>
                <div className="flex-1 h-2 rounded-full bg-slate-100 overflow-hidden">
                  <div className="h-full bg-brand-500 rounded-full" style={{ width: `${maxGastoProveedor ? (total / maxGastoProveedor) * 100 : 0}%` }} />
                </div>
                <span className="w-24 shrink-0 text-right font-medium text-ink-800">{formatCurrency(total)}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {pendientesRepercutir.length > 0 && (
        <div className="flex items-center gap-2 text-sm text-blue-700 bg-blue-50 rounded-xl px-4 py-2.5 mb-6">
          <Icons.Receipt className="w-4 h-4 shrink-0" />
          {pendientesRepercutir.length} gasto{pendientesRepercutir.length > 1 ? 's' : ''} pendiente{pendientesRepercutir.length > 1 ? 's' : ''} de repercutir a cliente, por {formatCurrency(pendientesRepercutir.reduce((a, g) => a + Number(g.importe || 0), 0))}
        </div>
      )}

      <div className="flex flex-wrap gap-3 mb-4">
        <div className="flex gap-1 bg-slate-100 rounded-xl p-1 w-fit">
          <button className={classNames('px-4 py-1.5 rounded-lg text-sm font-medium transition', tab === 'todos' ? 'bg-white shadow-sm text-ink-800' : 'text-slate-500')} onClick={() => { setTab('todos'); setSort({ key: 'proximaRenovacion', dir: 'desc' }); }}>Todos</button>
          <button className={classNames('px-4 py-1.5 rounded-lg text-sm font-medium transition', tab === 'proximos' ? 'bg-white shadow-sm text-ink-800' : 'text-slate-500')} onClick={() => { setTab('proximos'); setSort({ key: 'proximaRenovacion', dir: 'asc' }); }}>Próximos</button>
          <button className={classNames('px-4 py-1.5 rounded-lg text-sm font-medium transition', tab === 'pasados' ? 'bg-white shadow-sm text-ink-800' : 'text-slate-500')} onClick={() => { setTab('pasados'); setSort({ key: 'proximaRenovacion', dir: 'asc' }); }}>Pasados</button>
        </div>
        <div className="flex gap-1 bg-slate-100 rounded-xl p-1 w-fit">
          <button className={classNames('px-3 py-1.5 rounded-lg text-sm font-medium transition', filterYear === 'todos' ? 'bg-white shadow-sm text-ink-800' : 'text-slate-500')} onClick={() => setFilterYear('todos')}>Todos</button>
          {['2025', '2026', '2027', '2028'].map((y) => (
            <button key={y} className={classNames('px-3 py-1.5 rounded-lg text-sm font-medium transition', filterYear === y ? 'bg-white shadow-sm text-ink-800' : 'text-slate-500')} onClick={() => setFilterYear(y)}>{y}</button>
          ))}
        </div>
      </div>

      <Toolbar search={search} onSearch={setSearch} placeholder="Buscar gasto..."
        right={
          <div className="flex items-center gap-2 flex-nowrap shrink-0">
            <Select value={filterPago} onChange={(e) => setFilterPago(e.target.value)} className="!py-1.5 !text-xs w-auto">
              <option value="todos">Todos</option>
              <option value="anuales_pendientes">Anuales pendientes</option>
              <option value="pagados">Pagados</option>
            </Select>
            <Select value={filterCategoria} onChange={(e) => setFilterCategoria(e.target.value)} className="!py-1.5 !text-xs w-auto">
              <option value="todas">Todas las categorías</option>
              {Object.keys(CATEGORIA_LABELS).map((k) => <option key={k} value={k}>{CATEGORIA_LABELS[k]}</option>)}
            </Select>
          </div>
        } />

      {loading ? <PageLoader /> : filtered.length === 0 ? (
        <CardTable><EmptyState icon={Icons.Wallet} title={tab === 'todos' ? 'Aún no has grabado ningún gasto' : tab === 'pasados' ? 'No hay gastos pasados' : 'No hay gastos próximos'} action={<Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo gasto</Button>} /></CardTable>
      ) : (
        <CardTable footer={<Pagination page={page} totalPages={totalPages} onPageChange={setPage} totalItems={sorted.length} pageSize={PAGE_SIZE_GASTOS} />}>
          <table className="w-full min-w-[760px]">
            <thead className="bg-slate-700 text-white"><tr>
              <SortableTh sortKey="descripcion" sort={sort} onSort={onSort}>Descripción</SortableTh>
              <SortableTh sortKey="cliente" sort={sort} onSort={onSort}>Cliente</SortableTh>
              <SortableTh sortKey="periodicidad" sort={sort} onSort={onSort}>Periodicidad</SortableTh>
              <SortableTh sortKey="importe" sort={sort} onSort={onSort} className="text-right">Importe</SortableTh>
              <Th className="text-right">IVA</Th>
              <SortableTh sortKey="proximaRenovacion" sort={sort} onSort={onSort}>{tab === 'pasados' ? 'Fecha' : 'Próximo pago'}</SortableTh>
              <Th className="text-right">Acciones</Th>
            </tr></thead>
            <tbody className="divide-y divide-slate-200">
              {paged.map((r) => {
                if (r.tipo === 'simple') {
                  const g = r.gasto;
                  return (
                    <tr key={g.id} className={classNames(filaRenovacionClass(null), 'hover:brightness-95 transition cursor-pointer')} onClick={() => setModal({ mode: 'edit', item: g })}>
                      <Td>
                        <EditableCell value={g.descripcion || ''} required className="font-medium text-ink-800" onSave={(v) => guardarGasto(g, { descripcion: v })} />
                        <div className="flex items-center gap-1.5 mt-0.5">
                          {(proveedorById[g.proveedorId] || {}).nombre && <span className="text-xs text-slate-400">{(proveedorById[g.proveedorId] || {}).nombre}</span>}
                          <CategoriaBadge categoria={g.categoria} />
                        </div>
                      </Td>
                      <Td>
                        <ClienteCeldaEditable cliente={clienteById[g.clienteId]} vacio={<span className="text-slate-400">General</span>} onSaved={load}
                          onUpdated={(u) => setClientes((cs) => cs.map((x) => (x.id === u.id ? { ...x, ...u } : x)))} />
                      </Td>
                      <Td>Puntual</Td>
                      <Td className="text-right font-medium" onClick={(e) => e.stopPropagation()}><EditableCell type="number" step="0.01" value={String(g.importe ?? '')} validate={validarImporte} display={formatCurrency(g.importe)} onSave={(v) => guardarGasto(g, { importe: Number(v) })} /></Td>
                      <Td className="text-right text-slate-600" onClick={(e) => e.stopPropagation()}>
                        <EditableCell type="number" step="0.01" value={String(g.ivaSoportado ?? 0)} validate={validarImporte} display={formatCurrency(g.ivaSoportado)} onSave={(v) => guardarGasto(g, { ivaSoportado: Number(v) })} />
                        {g.deducible === false && <p className="text-[11px] text-slate-400">No deducible</p>}
                      </Td>
                      <Td onClick={(e) => e.stopPropagation()}><EditableCell type="date" value={toDateInput(g.fecha)} display={g.fecha ? formatDate(g.fecha) : <span className="text-slate-300">—</span>} onSave={(v) => guardarGasto(g, { fecha: v || null })} /></Td>
                      <Td className="text-right" onClick={(e) => e.stopPropagation()}>
                        <div className="flex justify-end gap-1">
                          {!g.pagado && <button className="p-1.5 rounded-lg hover:bg-emerald-50 text-emerald-600" title="Marcar como pagado" onClick={() => handleTogglePagado(g)}><Icons.Check className="w-4 h-4" /></button>}
                          <button className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500" title="Duplicar gasto" onClick={() => handleDuplicar(g)}><Icons.Copy className="w-4 h-4" /></button>
                          <button className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500" onClick={() => setModal({ mode: 'edit', item: g })}><Icons.Edit className="w-4 h-4" /></button>
                          <button className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500" onClick={() => setToDelete(g)}><Icons.Trash className="w-4 h-4" /></button>
                        </div>
                      </Td>
                    </tr>
                  );
                }
                const { plantilla: p } = r;
                const fechaMostrada = tab === 'pasados' ? r.ultimaPagada : r.proximaPendiente;
                return (
                  <tr key={p.id} className={classNames(filaRenovacionClass(tab === 'proximos' ? r.proximaPendiente : null), 'hover:brightness-95 transition cursor-pointer')} onClick={() => setDetalle(p.id)}>
                    <Td>
                      <EditableCell value={p.descripcion || ''} required className="font-medium text-ink-800" onSave={(v) => guardarGasto(p, { descripcion: v })} />
                      <div className="flex items-center gap-1.5 mt-0.5">
                        {(proveedorById[p.proveedorId] || {}).nombre && <span className="text-xs text-slate-400">{(proveedorById[p.proveedorId] || {}).nombre}</span>}
                        <CategoriaBadge categoria={p.categoria} />
                        <span className="text-xs text-slate-400">{r.resumenAnioTexto}</span>
                        {r.atrasadosCount > 0 && <span className="text-xs font-medium text-rose-600">· {r.atrasadosCount} atrasado{r.atrasadosCount > 1 ? 's' : ''} sin marcar</span>}
                      </div>
                    </Td>
                    <Td>
                      <ClienteCeldaEditable cliente={clienteById[p.clienteId]} vacio={<span className="text-slate-400">General</span>} onSaved={load}
                          onUpdated={(u) => setClientes((cs) => cs.map((x) => (x.id === u.id ? { ...x, ...u } : x)))} />
                    </Td>
                    <Td className="capitalize">{ESTADO_LABELS[p.periodicidad]}</Td>
                    <Td className="text-right font-medium" onClick={(e) => e.stopPropagation()}>
                      <EditableCell type="number" step="0.01" value={String(p.importe ?? '')} validate={validarImporte} display={formatCurrency(p.importe)} onSave={(v) => guardarGasto(p, { importe: Number(v) })} />
                      {p.periodicidad === 'mensual' && <p className="text-xs font-normal text-slate-400">{formatCurrency(Number(p.importe || 0) * 12)} / año</p>}
                    </Td>
                    <Td className="text-right text-slate-600" onClick={(e) => e.stopPropagation()}>
                      <EditableCell type="number" step="0.01" value={String(p.ivaSoportado ?? 0)} validate={validarImporte} display={formatCurrency(p.ivaSoportado)} onSave={(v) => guardarGasto(p, { ivaSoportado: Number(v) })} />
                      {p.deducible === false && <p className="text-[11px] text-slate-400">No deducible</p>}
                    </Td>
                    <Td>{fechaMostrada ? formatDate(fechaMostrada) : <EstadoBadge estado={p.estado} />}</Td>

      <Modal open={!!modal} onClose={() => setModal(null)} title={modal?.mode === 'edit' ? 'Editar gasto' : 'Nuevo gasto'} size="xl">

          : `¿Eliminar "${toDelete?.descripcion}"?`}

// ===================== pages/FacturasProveedores.js =====================
// Área interna para guardar las facturas que te emiten tus proveedores (bucket privado de Supabase Storage).
// Los archivos se guardan como  <id del proveedor | sin-proveedor>/<marca de tiempo>_<nombre>.
const BUCKET_FACTURAS_PROV = 'facturas-proveedores';
const SIN_PROVEEDOR = 'sin-proveedor';

function nombreSeguroArchivo(nombre) {
  return nombre.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9._-]+/g, '_');
}
function nombreLegibleArchivo(name) {
  const i = name.indexOf('_');
  return i > 0 && /^\d+$/.test(name.slice(0, i)) ? name.slice(i + 1) : name;
}
function tamanoLegible(bytes) {
  if (!bytes && bytes !== 0) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function FacturasProveedores() {
  const toast = useToast();
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [archivos, setArchivos] = useState([]);
  const [proveedores, setProveedores] = useState([]);
  const [search, setSearch] = useState('');
  const [filterProv, setFilterProv] = useState('todos');
  const [subirProv, setSubirProv] = useState('');
  const [uploading, setUploading] = useState(false);
  const [toDelete, setToDelete] = useState(null);
  const [sort, setSort] = useState({ key: 'subido', dir: 'desc' });
  const onSort = (key) => setSort((s) => toggleSort(s, key));

  async function load() {
    setLoading(true); setError('');
    try {
      setProveedores(await api.list('Proveedor', { order: 'nombre', ascending: true }));
      const bucket = supabaseClient.storage.from(BUCKET_FACTURAS_PROV);
      const { data: raiz, error: e1 } = await bucket.list('', { limit: 1000 });
      if (e1) throw e1;
      const carpetas = (raiz || []).filter((x) => !x.id);
      const listas = await Promise.all(carpetas.map(async (c) => {
        const { data, error: e2 } = await bucket.list(c.name, { limit: 1000 });
        if (e2) throw e2;
        return (data || []).filter((f) => f.id && f.name !== '.emptyFolderPlaceholder').map((f) => ({
          carpeta: c.name, name: f.name, path: `${c.name}/${f.name}`, size: f.metadata && f.metadata.size, subido: f.created_at,
        }));
      }));
      setArchivos(listas.flat());
    } catch (err) {
      setError(/bucket not found|not found/i.test(err.message || '')
        ? `Falta crear el bucket «${BUCKET_FACTURAS_PROV}» en Supabase. Ejecuta el SQL de supabase/migrations/20261113000000_bucket_facturas_proveedores.sql en el editor SQL de Supabase.`
        : (err.message || 'No se pudo cargar el área de facturas'));
    }
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const provById = Object.fromEntries(proveedores.map((p) => [p.id, p]));
  const nombreProv = (carpeta) => (carpeta === SIN_PROVEEDOR ? 'Sin proveedor' : ((provById[carpeta] || {}).nombre || 'Proveedor eliminado'));

  async function handleUpload(e) {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if (files.length === 0) return;
    setUploading(true);
    let ok = 0;
    try {
      for (const file of files) {
        const path = `${subirProv || SIN_PROVEEDOR}/${Date.now()}_${nombreSeguroArchivo(file.name)}`;
        const { error: err } = await supabaseClient.storage.from(BUCKET_FACTURAS_PROV).upload(path, file, { contentType: file.type || undefined });
        if (err) throw err;
        ok += 1;
      }
      toast(ok === 1 ? 'Factura subida' : `${ok} facturas subidas`);
    } catch (err) {
      toast(/bucket not found|row-level security|not authorized|unauthorized/i.test(err.message || '')
        ? `El bucket «${BUCKET_FACTURAS_PROV}» no está configurado: ejecuta en Supabase (SQL Editor) el archivo supabase/migrations/20261113000000_bucket_facturas_proveedores.sql`
        : (err.message || 'Error al subir el archivo'), 'error');
    }
    finally { setUploading(false); load(); }
  }

  async function abrir(f) {
    try {
      const { data, error: err } = await supabaseClient.storage.from(BUCKET_FACTURAS_PROV).createSignedUrl(f.path, 60);
      if (err) throw err;
      window.open(data.signedUrl, '_blank');
    } catch (err) { toast('No se pudo abrir el archivo', 'error'); }
  }

  async function handleDelete() {
    try {
      const { error: err } = await supabaseClient.storage.from(BUCKET_FACTURAS_PROV).remove([toDelete.path]);
      if (err) throw err;
      toast('Archivo eliminado'); setToDelete(null); load();
    } catch (err) { toast('No se pudo eliminar', 'error'); setToDelete(null); }
  }

  const filtered = archivos.filter((f) => {
    if (filterProv !== 'todos' && f.carpeta !== filterProv) return false;
    const q = search.toLowerCase();
    if (!q) return true;
    return [nombreLegibleArchivo(f.name), nombreProv(f.carpeta)].some((v) => v.toLowerCase().includes(q));
  });
  const sorted = sortRows(filtered, sort, {
    archivo: (f) => nombreLegibleArchivo(f.name).toLowerCase(),
    proveedor: (f) => nombreProv(f.carpeta).toLowerCase(),
    subido: (f) => f.subido || '',
    tamano: (f) => Number(f.size || 0),
  });
  const carpetasUsadas = Array.from(new Set(archivos.map((f) => f.carpeta)));

  return (
    <div className="fade-in">
      <PageHeader title="Facturas de proveedores" subtitle={`${archivos.length} archivo${archivos.length === 1 ? '' : 's'} guardado${archivos.length === 1 ? '' : 's'}`}
        action={<div className="flex flex-wrap gap-2 items-center">
          <ExportCsvButton nombre="facturas_proveedores" filas={sorted} columnas={[
            { titulo: 'Archivo', valor: (f) => nombreLegibleArchivo(f.name) }, { titulo: 'Proveedor', valor: (f) => nombreProv(f.carpeta) },
            { titulo: 'Subido', valor: (f) => csvFecha(f.subido) }, { titulo: 'Tamaño', valor: (f) => tamanoLegible(f.size) }]} />
          <Select value={subirProv} onChange={(e) => setSubirProv(e.target.value)} className="!py-2 !text-sm w-auto" title="Proveedor al que se asignan los archivos que subas">
            <option value="">Subir sin proveedor</option>
            {proveedores.map((p) => <option key={p.id} value={p.id}>Subir a: {p.nombre}</option>)}
          </Select>
          <label className={classNames('inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-medium cursor-pointer',
            uploading ? 'bg-slate-100 text-slate-400' : 'bg-brand-600 text-white hover:bg-brand-700 shadow-sm shadow-brand-600/20')}>
            <Icons.Plus className="w-4 h-4" /> {uploading ? 'Subiendo...' : 'Subir facturas'}
            <input type="file" multiple accept=".pdf,image/*" className="hidden" onChange={handleUpload} disabled={uploading || !!error} />
          </label>
        </div>} />

      <Toolbar search={search} onSearch={setSearch} placeholder="Buscar por archivo o proveedor..."
        right={
          <Select value={filterProv} onChange={(e) => setFilterProv(e.target.value)} className="!py-1.5 !text-xs w-auto">
            <option value="todos">Todos los proveedores</option>
            {carpetasUsadas.map((c) => <option key={c} value={c}>{nombreProv(c)}</option>)}
          </Select>
        } />

      {error ? (
        <div className="text-amber-900 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 text-sm">{error}</div>
      ) : loading ? <PageLoader /> : sorted.length === 0 ? (
        <CardTable><EmptyState icon={Icons.FileText} title="Sin facturas de proveedores" message="Sube aquí los PDF o fotos de las facturas que te emiten tus proveedores. Si al subir da error, falta crear el bucket en Supabase (ver supabase/migrations/20261113000000_bucket_facturas_proveedores.sql)." /></CardTable>
      ) : (
        <CardTable>
          <table className="w-full min-w-[700px]">
            <thead className="bg-slate-700 text-white"><tr>
              <SortableTh sortKey="archivo" sort={sort} onSort={onSort}>Archivo</SortableTh>
              <SortableTh sortKey="proveedor" sort={sort} onSort={onSort}>Proveedor</SortableTh>
              <SortableTh sortKey="subido" sort={sort} onSort={onSort}>Subido</SortableTh>
              <SortableTh sortKey="tamano" sort={sort} onSort={onSort} className="text-right">Tamaño</SortableTh>
              <Th className="text-right">Acciones</Th>
            </tr></thead>
            <tbody className="divide-y divide-slate-200">
              {sorted.map((f) => (
                <tr key={f.path} className="hover:bg-slate-50/60 cursor-pointer" onClick={() => abrir(f)}>
                  <Td><span className="inline-flex items-center gap-2 font-medium text-ink-800"><Icons.FileText className="w-4 h-4 text-slate-400 shrink-0" />{nombreLegibleArchivo(f.name)}</span></Td>
                  <Td className={f.carpeta === SIN_PROVEEDOR ? 'text-slate-400' : ''}>{nombreProv(f.carpeta)}</Td>
                  <Td>{csvFecha(f.subido) || '—'}</Td>
                  <Td className="text-right text-slate-500">{tamanoLegible(f.size) || '—'}</Td>
                  <Td className="text-right" onClick={(e) => e.stopPropagation()}>
                    <div className="flex justify-end gap-1">
                      <button className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500" title="Abrir / descargar" onClick={() => abrir(f)}><Icons.Download className="w-4 h-4" /></button>
                      <button className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500" title="Eliminar" onClick={() => setToDelete(f)}><Icons.Trash className="w-4 h-4" /></button>
                    </div>
                  </Td>
                </tr>
              ))}
            </tbody>
          </table>
        </CardTable>
      )}

      <ConfirmDialog open={!!toDelete} title="Eliminar archivo" danger message={`¿Eliminar "${toDelete ? nombreLegibleArchivo(toDelete.name) : ''}"? No se puede deshacer.`}
        onCancel={() => setToDelete(null)} onConfirm={handleDelete} />
    </div>
  );
}

// ===================== Archivo de facturas emitidas a clientes =====================
// Al emitir una factura se guarda una copia en PDF en un bucket privado de Supabase Storage (solo se puede subir y leer,
// no modificar ni borrar), como  <año>/<número>.pdf. Así queda conservada la factura tal y como se emitió.
const BUCKET_FACTURAS_CLIENTES = 'facturas-clientes';

function rutaArchivoFactura(factura) {
  return `${String(factura.fechaEmision || '').slice(0, 4) || 'sin-fecha'}/${nombreSeguroArchivo(factura.numero)}.pdf`;
}

// Genera el PDF de una factura emitida y lo sube al archivo. Devuelve true si se ha guardado (o ya estaba guardada).
async function archivarFacturaPDF(facturaId) {
  const factura = await api.get('Factura', facturaId);
  if (!factura.numero || factura.estado === 'borrador') throw new Error('Solo se archivan facturas ya emitidas');
  const [items, cliente, empresas, original] = await Promise.all([
    api.list('FacturaItem', { order: 'orden', ascending: true }),
    api.get('Cliente', factura.clienteId),
    api.list('Empresa'),
    factura.facturaRectificadaId ? api.get('Factura', factura.facturaRectificadaId) : Promise.resolve(null),
  ]);
  const pdf = generarFacturaPDFBlob(factura, items.filter((i) => i.facturaId === factura.id), cliente, empresas[0] || {}, original);
  const { error } = await supabaseClient.storage.from(BUCKET_FACTURAS_CLIENTES).upload(rutaArchivoFactura(factura), pdf, { contentType: 'application/pdf', upsert: false });
  if (error && !/already exists|duplicate/i.test(error.message || '')) throw error;
  return true;
}

function generarFacturaPDFBlob(factura, items, cliente, empresa, original) {
  return generateDocumentoPDF('Factura', factura, items, cliente, empresa, { facturaOriginal: original }).output('blob');
}

async function abrirFacturaArchivada(factura) {
  const { data, error } = await supabaseClient.storage.from(BUCKET_FACTURAS_CLIENTES).createSignedUrl(rutaArchivoFactura(factura), 60);
  if (error) throw error;
  window.open(data.signedUrl, '_blank');
}

function FacturasEmitidasArchivo() {
  const toast = useToast();
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [facturas, setFacturas] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [guardadas, setGuardadas] = useState(new Set());
  const [search, setSearch] = useState('');
  const [filtro, setFiltro] = useState('todas');
  const [archivando, setArchivando] = useState(false);
  const [sort, setSort] = useState({ key: 'fecha', dir: 'desc' });
  const onSort = (key) => setSort((s) => toggleSort(s, key));

  async function load() {
    setLoading(true); setError('');
    try {
      const [fa, cl] = await Promise.all([api.list('Factura'), api.list('Cliente')]);
      setFacturas(fa.filter((f) => f.numero && f.estado !== 'borrador'));
      setClientes(cl);
      const bucket = supabaseClient.storage.from(BUCKET_FACTURAS_CLIENTES);
      const { data: raiz, error: e1 } = await bucket.list('', { limit: 1000 });
      if (e1) throw e1;
      const rutas = new Set();
      await Promise.all((raiz || []).filter((x) => !x.id).map(async (c) => {
        const { data, error: e2 } = await bucket.list(c.name, { limit: 1000 });
        if (e2) throw e2;
        (data || []).filter((f) => f.id).forEach((f) => rutas.add(`${c.name}/${f.name}`));
      }));
      setGuardadas(rutas);
    } catch (err) { setError(err.message || 'No se pudo cargar el archivo de facturas'); }
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const clienteById = Object.fromEntries(clientes.map((c) => [c.id, c]));
  const filas = facturas.map((f) => ({ ...f, archivada: guardadas.has(rutaArchivoFactura(f)) }));
  const faltan = filas.filter((f) => !f.archivada && f.enviadaAt);
  const filtered = filas.filter((f) => {
    if (filtro === 'faltan' && f.archivada) return false;
    const q = search.toLowerCase();
    if (!q) return true;
    return [f.numero, csvCliente(clienteById[f.clienteId])].some((v) => String(v || '').toLowerCase().includes(q));
  });
  const sorted = sortRows(filtered, sort, {
    numero: (f) => f.numero, cliente: (f) => csvCliente(clienteById[f.clienteId]).toLowerCase(),
    fecha: (f) => f.fechaEmision || '', total: (f) => Number(f.total || 0), pdf: (f) => (f.archivada ? 1 : 0),
  });

  async function archivarFaltantes() {
    setArchivando(true);
    let ok = 0; let fallos = 0;
    for (const f of faltan) {
      try { await archivarFacturaPDF(f.id); ok += 1; } catch (err) { fallos += 1; }
    }
    setArchivando(false);
    toast(fallos ? `${ok} archivadas, ${fallos} con error` : `${ok} factura${ok === 1 ? '' : 's'} archivada${ok === 1 ? '' : 's'}`, fallos ? 'error' : undefined);
    load();
  }

  async function abrir(f) {
    try { await abrirFacturaArchivada(f); } catch (err) { toast('No se pudo abrir el PDF archivado', 'error'); }
  }

  return (
    <div className="fade-in">
      <PageHeader title="Facturas emitidas a clientes" subtitle={`${filas.filter((f) => f.archivada).length} de ${facturas.length} con copia en PDF archivada`}
        action={<div className="flex flex-wrap gap-2">
          <ExportCsvButton nombre="facturas_emitidas_archivo" filas={sorted} columnas={[
            { titulo: 'Número', valor: (f) => f.numero }, { titulo: 'Cliente', valor: (f) => csvCliente(clienteById[f.clienteId]) },
            { titulo: 'Fecha emisión', valor: (f) => csvFecha(f.fechaEmision) }, { titulo: 'Total', valor: (f) => Number(f.total || 0) },
            { titulo: 'PDF archivado', valor: (f) => csvSiNo(f.archivada) }]} />
          <Button icon={Icons.Download} onClick={archivarFaltantes} disabled={archivando || faltan.length === 0 || !!error}>
            {archivando ? 'Archivando...' : `Archivar las que faltan (${faltan.length})`}
          </Button>
        </div>} />

      <Toolbar search={search} onSearch={setSearch} placeholder="Buscar por número o cliente..."
        right={
          <Select value={filtro} onChange={(e) => setFiltro(e.target.value)} className="!py-1.5 !text-xs w-auto">
            <option value="todas">Todas</option><option value="faltan">Sin PDF archivado</option>
          </Select>
        } />

      {error ? (
        <div className="text-amber-900 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 text-sm">{error}</div>
      ) : loading ? <PageLoader /> : sorted.length === 0 ? (
        <CardTable><EmptyState icon={Icons.Receipt} title="Sin facturas emitidas" message="Las facturas aparecerán aquí cuando las emitas." /></CardTable>
      ) : (
        <CardTable>
          <table className="w-full min-w-[720px]">
            <thead className="bg-slate-700 text-white"><tr>
              <SortableTh sortKey="numero" sort={sort} onSort={onSort}>Número</SortableTh>
              <SortableTh sortKey="cliente" sort={sort} onSort={onSort}>Cliente</SortableTh>
              <SortableTh sortKey="fecha" sort={sort} onSort={onSort}>Emisión</SortableTh>
              <SortableTh sortKey="total" sort={sort} onSort={onSort} className="text-right">Total</SortableTh>
              <Th>Estado</Th>
              <SortableTh sortKey="pdf" sort={sort} onSort={onSort}>PDF archivado</SortableTh>
            </tr></thead>
            <tbody className="divide-y divide-slate-200">
              {sorted.map((f) => (
                <tr key={f.id} className="hover:bg-slate-50/60">
                  <Td className="font-medium text-ink-800">{f.numero}</Td>
                  <Td>{csvCliente(clienteById[f.clienteId]) || '—'}</Td>
                  <Td>{formatDate(f.fechaEmision)}</Td>
                  <Td className="text-right font-medium">{formatCurrency(f.total)}</Td>
                  <Td><FacturaEstadoBadge estado={f.estado} /></Td>
                  <Td>
                    {f.archivada
                      ? <button type="button" onClick={() => abrir(f)} className="inline-flex items-center gap-1.5 text-sm text-brand-600 hover:underline"><Icons.FileText className="w-4 h-4" /> Abrir PDF</button>
                      : f.enviadaAt ? <span className="text-xs text-amber-700 bg-amber-50 ring-1 ring-inset ring-amber-600/20 rounded-full px-2.5 py-1">Falta archivar</span>
                      : <span className="text-xs text-slate-500">Pendiente de enviar</span>}
                  </Td>
                </tr>
              ))}
            </tbody>
          </table>
        </CardTable>
      )}
    </div>
  );
}
