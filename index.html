<div id="boot-error" style="position:fixed;inset:0;background:#14100f;color:#fca5a5;font-family:ui-monospace,monospace;font-size:13px;padding:24px;overflow:auto;white-space:pre-wrap;z-index:9999;"></div>

<script>
  function mostrarErrorBoot(titulo, detalle) {
    var box = document.getElementById('boot-error');
    if (!box) return;
    box.style.display = 'block';
    box.textContent = titulo + '\n\n' + detalle;
  }
  window.addEventListener('error', function (e) {
    var detalle = e.error && e.error.stack ? e.error.stack : (e.message || 'Error desconocido');
    if (e.filename) detalle += '\n\nArchivo: ' + e.filename + (e.lineno ? (':' + e.lineno + ':' + e.colno) : '');
    mostrarErrorBoot('Error al cargar el CRM:', detalle);
  });
  function describirError(reason) {
    if (!reason) return 'Error desconocido';
    if (reason.stack) return reason.stack;
    if (typeof reason === 'string') return reason;
    var partes = [];
    if (reason.message) partes.push('message: ' + reason.message);
    if (reason.details) partes.push('details: ' + reason.details);
    if (reason.hint) partes.push('hint: ' + reason.hint);
    if (reason.code) partes.push('code: ' + reason.code);
    if (partes.length) return partes.join('\n');
    try { return JSON.stringify(reason); } catch (err) { return String(reason); }
  }
  function esErrorDeSesionBoot(reason) {
    if (!reason) return false;
    var msg = ((reason.message || '') + ' ' + (reason.code || '')).toLowerCase();
    return reason.status === 401 || msg.indexOf('jwt') !== -1 || msg.indexOf('pgrst301') !== -1 || msg.indexOf('session') !== -1;
  }
  window.addEventListener('unhandledrejection', function (e) {
    // La sesión caducada se resuelve mostrando el login (ver api.js); no tapar la pantalla con el overlay de error.
    if (esErrorDeSesionBoot(e.reason)) { console.warn('Sesión caducada, redirigiendo a login.', e.reason); return; }
    mostrarErrorBoot('Error (promesa) al cargar el CRM:', describirError(e.reason));
  });
</script>

// ===================== utils.js =====================
// Utilidades compartidas

function formatCurrency(value) {
  const n = Number(value || 0);
  return n.toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
}

function formatDate(value) {
  if (!value) return '—';
  const d = new Date(value);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function formatDateTime(value) {
  if (!value) return '—';
  const d = new Date(value);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' +
    d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
}

function toDateInput(value) {
  if (!value) return '';
  const d = new Date(value);
  if (isNaN(d.getTime())) return '';
  return d.toISOString().slice(0, 10);
}

function diaSiguiente(value) {
  if (!value) return toDateInput(new Date());
  const d = new Date(value);
  if (isNaN(d.getTime())) return toDateInput(new Date());
  d.setDate(d.getDate() + 1);
  return toDateInput(d);
}

function priceWithIVA(precio, iva) {

function normalizeUrl(url) {
  if (!url) return '';
  const u = url.trim();

}

function waNumber(phone) {
  if (!phone) return '';
  let digits = String(phone).replace(/[^\d]/g, '');
  if (!digits) return '';
  if (digits.startsWith('00')) digits = digits.slice(2);
  // Números españoles de 9 dígitos sin prefijo de país -> anteponer 34
  if (digits.length === 9 && /^[67689]/.test(digits)) digits = '34' + digits;
  return digits;
}

function waLink(phone) {
  const n = waNumber(phone);
  return n ? `https://wa.me/${n}` : '';
}

function telLink(phone) {
  if (!phone) return '';
  return 'tel:' + String(phone).replace(/[^\d+]/g, '');
}

// Genera un PDF (jsPDF) para un presupuesto o factura. Devuelve la instancia de jsPDF.
function generateDocumentoPDF(tipo, documento, items, cliente, empresa) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const margin = 15;
  let y = 18;

  doc.setFontSize(16); doc.setFont(undefined, 'bold'); doc.setTextColor(224, 17, 88);
  doc.text(empresa?.nombreFiscal || 'Creadores Web', margin, y);
  doc.setFont(undefined, 'normal'); doc.setFontSize(9); doc.setTextColor(90);
  y += 6;
  const empresaLines = [
    empresa?.nif ? `NIF: ${empresa.nif}` : null,
    [empresa?.direccion, empresa?.codigoPostal, empresa?.poblacion, empresa?.provincia].filter(Boolean).join(', ') || null,
    [empresa?.email, empresa?.telefono].filter(Boolean).join('  ·  ') || null,
  ].filter(Boolean);
  empresaLines.forEach((line) => { doc.text(line, margin, y); y += 4.5; });

  doc.setFontSize(18); doc.setFont(undefined, 'bold'); doc.setTextColor(20);
  doc.text(tipo.toUpperCase(), pageWidth - margin, 18, { align: 'right' });
  doc.setFont(undefined, 'normal'); doc.setFontSize(10); doc.setTextColor(90);
  doc.text(`Nº ${documento.numero}`, pageWidth - margin, 25, { align: 'right' });
  doc.text(`Fecha: ${formatDate(documento.fechaEmision)}`, pageWidth - margin, 30, { align: 'right' });
  const fechaSecundaria = documento.fechaValidez
    ? `Válido hasta: ${formatDate(documento.fechaValidez)}`
    : (documento.fechaVencimiento ? `Vencimiento: ${formatDate(documento.fechaVencimiento)}` : null);
  if (fechaSecundaria) doc.text(fechaSecundaria, pageWidth - margin, 35, { align: 'right' });

  y = Math.max(y, 40) + 4;
  doc.setFillColor(255, 241, 244);
  doc.roundedRect(margin, y, pageWidth - margin * 2, 24, 2, 2, 'F');
  doc.setFontSize(8); doc.setTextColor(160); doc.text('CLIENTE', margin + 4, y + 6);
  doc.setFontSize(11); doc.setTextColor(20); doc.setFont(undefined, 'bold');
  doc.text(cliente?.empresa || cliente?.nombre || '', margin + 4, y + 12.5);
  doc.setFont(undefined, 'normal'); doc.setFontSize(9); doc.setTextColor(90);
  const clienteLine = [cliente?.empresa ? cliente?.nombre : null, cliente?.nif, [cliente?.direccion, cliente?.poblacion].filter(Boolean).join(', '), cliente?.email].filter(Boolean).join('   ·   ');
  doc.text(clienteLine, margin + 4, y + 18.5);
  y += 24 + 8;

  // Tabla de líneas dibujada a mano (sin plugins adicionales, para máxima compatibilidad)
  const pageHeight = doc.internal.pageSize.getHeight();
  const colConcepto = margin + 2, colCant = margin + 100, colPrecio = margin + 128, colIva = margin + 155, colTotal = pageWidth - margin - 2;
  function drawHeaderRow(yy) {
    doc.setFillColor(224, 17, 88);
    doc.rect(margin, yy, pageWidth - margin * 2, 8, 'F');
    doc.setFont(undefined, 'bold'); doc.setFontSize(9); doc.setTextColor(255);
    doc.text('Concepto', colConcepto, yy + 5.5);
    doc.text('Cant.', colCant, yy + 5.5, { align: 'right' });
    doc.text('Precio', colPrecio, yy + 5.5, { align: 'right' });
    doc.text('IVA', colIva, yy + 5.5, { align: 'right' });
    doc.text('Total', colTotal, yy + 5.5, { align: 'right' });
    return yy + 8;
  }
  y = drawHeaderRow(y);
  doc.setFont(undefined, 'normal'); doc.setTextColor(40);
  (items || []).forEach((it, idx) => {
    const conceptoLines = doc.splitTextToSize(it.concepto || '', 88);
    const rowHeight = Math.max(7, conceptoLines.length * 4 + 3) + (it.descripcion ? 4 : 0);
    if (y + rowHeight > pageHeight - 45) { doc.addPage(); y = 18; y = drawHeaderRow(y); doc.setFont(undefined, 'normal'); doc.setTextColor(40); }
    if (idx % 2 === 1) { doc.setFillColor(250, 246, 248); doc.rect(margin, y, pageWidth - margin * 2, rowHeight, 'F'); }
    doc.setFontSize(9);
    doc.text(conceptoLines, colConcepto, y + 5);
    doc.text(String(it.cantidad), colCant, y + 5, { align: 'right' });
    doc.text(formatCurrency(it.precioUnitario), colPrecio, y + 5, { align: 'right' });
    doc.text((it.iva || 0) + '%', colIva, y + 5, { align: 'right' });
    doc.text(formatCurrency(calcLineTotal(it) * (1 + Number(it.iva || 0) / 100)), colTotal, y + 5, { align: 'right' });
    if (it.descripcion) {
      doc.setFontSize(7.5); doc.setTextColor(140);
      doc.text(it.descripcion, colConcepto, y + 5 + conceptoLines.length * 4);
      doc.setFontSize(9); doc.setTextColor(40);
    }
    y += rowHeight;
  });
  doc.setDrawColor(230); doc.line(margin, y, pageWidth - margin, y);

  let finalY = y + 8;
  const totalsX = pageWidth - margin - 62;
  doc.setFontSize(9); doc.setTextColor(90); doc.setFont(undefined, 'normal');
  doc.text('Subtotal', totalsX, finalY); doc.text(formatCurrency(documento.subtotal), pageWidth - margin, finalY, { align: 'right' });
  finalY += 5;
  doc.text('IVA', totalsX, finalY); doc.text(formatCurrency(documento.ivaTotal), pageWidth - margin, finalY, { align: 'right' });
  finalY += 5;
  if (documento.descuento) {
    doc.text('Descuento', totalsX, finalY); doc.text('-' + formatCurrency(documento.descuento), pageWidth - margin, finalY, { align: 'right' });
    finalY += 5;
  }
  doc.setDrawColor(230); doc.line(totalsX, finalY, pageWidth - margin, finalY);
  finalY += 5.5;
  doc.setFont(undefined, 'bold'); doc.setFontSize(11); doc.setTextColor(20);
  doc.text('TOTAL', totalsX, finalY); doc.text(formatCurrency(documento.total), pageWidth - margin, finalY, { align: 'right' });
  finalY += 10;

  const textoLibre = documento.condiciones || documento.notas;
  if (textoLibre) {
    doc.setFont(undefined, 'normal'); doc.setFontSize(9); doc.setTextColor(110);
    const split = doc.splitTextToSize(textoLibre, pageWidth - margin * 2);
    doc.text(split, margin, finalY);
  }

  doc.setFontSize(8); doc.setTextColor(160);
  doc.text(empresa?.notasPie || 'Gracias por confiar en nosotros.', margin, doc.internal.pageSize.getHeight() - 12);

  return doc;
}

// ---------- Fechas locales (sin desfases de zona horaria) ----------
function parseDateOnly(str) {
  if (!str) return null;
  const s = String(str).slice(0, 10);
  const [y, m, d] = s.split('-').map(Number);
  // y < 1000 descarta años a medio escribir en un <input type="date"> (ej. "0002" mientras
  // se teclea "2026"): new Date(2, ...) los interpretaría como 1900+2 = 1902.
  if (!y || !m || !d || y < 1000) return null;
  return new Date(y, m - 1, d);
}

function dateKey(d) {
  const dt = (d instanceof Date) ? d : parseDateOnly(d);
  if (!dt || isNaN(dt.getTime())) return '';
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const day = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function addMonths(dateStr, months) {
  const d = parseDateOnly(dateStr);
  if (!d) return '';
  const nd = new Date(d.getFullYear(), d.getMonth() + Number(months || 0), d.getDate());
  return dateKey(nd);
}

function addDays(dateStr, days) {
  const d = parseDateOnly(dateStr);
  if (!d) return '';
  const nd = new Date(d.getFullYear(), d.getMonth(), d.getDate() + Number(days || 0));
  return dateKey(nd);
}

const PERIODICIDAD_MESES = { mensual: 1, trimestral: 3, semestral: 6, anual: 12 };

function getMonthMatrix(year, month) {
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay() + 6) % 7; // Lunes = 0
  const start = new Date(year, month, 1 - startOffset);
  const days = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    days.push(d);
  }
  return days;
}

  proyecto: { label: 'Entrega de proyecto', icon: 'Briefcase', color: 'emerald', ruta: 'proyectos' },
};

function computeAvisos({ tareas, facturas, recurrentes, presupuestos, clientes, proyectos }) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const clienteById = {}; (clientes || []).forEach((c) => { clienteById[c.id] = c; });
  const proyectoById = {}; (proyectos || []).forEach((p) => { proyectoById[p.id] = p; });
  const items = [];

  (tareas || []).forEach((t) => {
    if (!t.fechaLimite || t.estado === 'completada' || t.estado === 'cancelada') return;
    const fecha = parseDateOnly(t.fechaLimite);
    if (!fecha) return;
    const proyecto = proyectoById[t.proyectoId];
    items.push({ id: 'tarea-' + t.id, tipo: 'tarea', fecha, fechaStr: t.fechaLimite, titulo: t.titulo, contexto: proyecto ? proyecto.nombre : '', ruta: 'proyectos' });
  });

  (facturas || []).forEach((f) => {
    if (!f.fechaVencimiento || f.estado === 'pagada' || f.estado === 'cancelada') return;
    const fecha = parseDateOnly(f.fechaVencimiento);
    if (!fecha) return;
    const cliente = clienteById[f.clienteId];
    items.push({ id: 'factura-' + f.id, tipo: 'factura', fecha, fechaStr: f.fechaVencimiento, titulo: `Factura ${f.numero}`, contexto: cliente ? cliente.nombre : '', ruta: 'facturas' });
  });

  (recurrentes || []).forEach((r) => {
    if (!r.proximaRenovacion || r.estado !== 'activo') return;
    const fecha = parseDateOnly(r.proximaRenovacion);
    if (!fecha) return;
    const cliente = clienteById[r.clienteId];
    items.push({ id: 'recurrente-' + r.id, tipo: 'renovacion', fecha, fechaStr: r.proximaRenovacion, titulo: r.descripcion, contexto: cliente ? cliente.nombre : '', ruta: 'recurrentes' });
  });

  (presupuestos || []).forEach((p) => {
    if (!p.fechaValidez || (p.estado !== 'borrador' && p.estado !== 'enviado')) return;
    const fecha = parseDateOnly(p.fechaValidez);
    if (!fecha) return;
    const cliente = clienteById[p.clienteId];
    items.push({ id: 'presupuesto-' + p.id, tipo: 'presupuesto', fecha, fechaStr: p.fechaValidez, titulo: `Presupuesto ${p.numero}`, contexto: cliente ? cliente.nombre : '', ruta: 'presupuestos' });
  });

  (proyectos || []).forEach((p) => {
    if (!p.fechaPrevista || p.estado === 'completado' || p.estado === 'cancelado') return;
    const fecha = parseDateOnly(p.fechaPrevista);
    if (!fecha) return;
    const cliente = clienteById[p.clienteId];
    items.push({ id: 'proyecto-' + p.id, tipo: 'proyecto', fecha, fechaStr: p.fechaPrevista, titulo: `Entrega: ${p.nombre}`, contexto: cliente ? cliente.nombre : '', ruta: 'proyectos' });
  });

  items.forEach((it) => {
    const diffDays = Math.round((it.fecha - today) / 86400000);
    it.diffDays = diffDays;
    it.urgencia = diffDays < 0 ? 'vencido' : diffDays <= 7 ? 'proximo' : 'normal';
  });

  items.sort((a, b) => a.fecha - b.fecha);
  return items;
}

function uid() {

// Genera el siguiente número correlativo tipo PRE-2026-0001 / FAC-2026-0001
function nextNumero(prefix, existentes) {
  const year = new Date().getFullYear();
  const pattern = new RegExp('^' + prefix + '-' + year + '-(\\d{4})$');
  let max = 0;
  (existentes || []).forEach((n) => {
    const m = pattern.exec(n || '');
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  const next = String(max + 1).padStart(4, '0');
  return prefix + '-' + year + '-' + next;
}

function calcLineTotal(item) {
  const cantidad = Number(item.cantidad || 0);
  const precio = Number(item.precioUnitario || 0);
  return cantidad * precio;
}

function calcTotales(items, descuento) {
  const subtotal = (items || []).reduce((acc, it) => acc + calcLineTotal(it), 0);
  const ivaTotal = (items || []).reduce((acc, it) => acc + calcLineTotal(it) * (Number(it.iva || 0) / 100), 0);
  const desc = Number(descuento || 0);
  const total = subtotal + ivaTotal - desc;
  return { subtotal, ivaTotal, total };
}

// ---------- Ordenación de listados (cabeceras clicables) ----------
function toggleSort(sort, key) {
  return sort && sort.key === key ? { key, dir: sort.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' };
}

function compareValues(a, b) {
  if (typeof a === 'number' && typeof b === 'number') return a - b;
  return String(a ?? '').localeCompare(String(b ?? ''), 'es', { numeric: true, sensitivity: 'base' });
}

// getters: { [sortKey]: (item) => valor comparable }
function sortRows(items, sort, getters) {
  if (!sort || !sort.key || !getters || !getters[sort.key]) return items;
  const getter = getters[sort.key];
  const sorted = [...items].sort((a, b) => compareValues(getter(a), getter(b)));
  return sort.dir === 'desc' ? sorted.reverse() : sorted;
}

// ===================== api.js =====================
// Capa de acceso a datos (Supabase)

// Detecta errores por sesión caducada/token inválido (401 / JWT / PGRST301).
// Cuando la pestaña lleva mucho tiempo abierta, el token puede caducar antes de refrescarse;
// forzamos el cierre de sesión para que App.js muestre el login limpiamente en vez de
// dejar la petición como un rechazo de promesa sin gestionar.
function esErrorDeSesion(error) {
  if (!error) return false;
  const msg = ((error.message || '') + ' ' + (error.code || '')).toLowerCase();
  return error.status === 401 || msg.includes('jwt') || msg.includes('pgrst301') || msg.includes('session');
}

async function manejarError(error) {
  if (esErrorDeSesion(error)) {
    await supabaseClient.auth.signOut();
  }
  throw error;
}

const api = {
  async list(table, { order = 'createdAt', ascending = false, select = '*' } = {}) {
    let q = supabaseClient.from(table).select(select);
    if (order) q = q.order(order, { ascending });
    const { data, error } = await q;
    if (error) await manejarError(error);
    return data || [];
  },
  async get(table, id) {
    const { data, error } = await supabaseClient.from(table).select('*').eq('id', id).single();
    if (error) await manejarError(error);
    return data;
  },
  async insert(table, payload) {
    const { data, error } = await supabaseClient.from(table).insert(payload).select().single();
    if (error) await manejarError(error);
    return data;
  },
  async update(table, id, payload) {
    const { data, error } = await supabaseClient.from(table).update(payload).eq('id', id).select().single();
    if (error) await manejarError(error);
    return data;
  },
  async remove(table, id) {
    const { error } = await supabaseClient.from(table).delete().eq('id', id);
    if (error) await manejarError(error);
    return true;
  },
  async removeWhere(table, column, value) {
    const { error } = await supabaseClient.from(table).delete().eq(column, value);
    if (error) await manejarError(error);
    return true;
  },
};

const { useState, useEffect, useRef, useContext, createContext, useCallback } = React;

// ---------- Toasts ----------
const ToastCtx = createContext(null);
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((msg, type = 'success') => {
    const id = uid();
    setToasts((t) => [...t, { id, msg, type }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3500);
  }, []);
  return (
    <ToastCtx.Provider value={push}>
      {children}
      <div className="fixed bottom-4 right-4 z-[100] flex flex-col gap-2 w-[min(92vw,360px)]">
        {toasts.map((t) => (
          <div key={t.id} className={classNames(
            'fade-in rounded-lg shadow-lg px-4 py-3 text-sm font-medium text-white flex items-start gap-2',
            t.type === 'error' ? 'bg-rose-600' : t.type === 'info' ? 'bg-ink-800' : 'bg-emerald-600'
          )}>
            {t.type === 'error' ? <Icons.Alert className="w-4 h-4 mt-0.5 shrink-0" /> : <Icons.Check className="w-4 h-4 mt-0.5 shrink-0" />}
            <span>{t.msg}</span>
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}
function useToast() { return useContext(ToastCtx); }

// ---------- Button ----------
function Button({ variant = 'primary', size = 'md', className, children, icon: Ic, ...props }) {
  const base = 'inline-flex items-center justify-center gap-1.5 font-medium rounded-lg transition disabled:opacity-50 disabled:pointer-events-none whitespace-nowrap';
  const sizes = { sm: 'px-2.5 py-1.5 text-xs', md: 'px-3.5 py-2 text-sm', lg: 'px-5 py-2.5 text-sm' };
  const variants = {
    primary: 'bg-brand-600 text-white hover:bg-brand-700 shadow-sm shadow-brand-600/20',
    secondary: 'bg-white text-ink-700 border border-slate-200 hover:bg-slate-50',
    ghost: 'text-ink-600 hover:bg-slate-100',
    danger: 'bg-white text-rose-600 border border-rose-200 hover:bg-rose-50',
    dangerSolid: 'bg-rose-600 text-white hover:bg-rose-700',
  };
  return (
    <button className={classNames(base, sizes[size], variants[variant], className)} {...props}>
      {Ic ? <Ic className="w-4 h-4" /> : null}
      {children}
    </button>
  );
}

function Field({ label, hint, required, children, className }) {

}

function Textarea(props) { return <textarea {...props} className={classNames(inputCls, 'min-h-[80px] resize-y', props.className)} />; }
function Select({ children, ...props }) {
  return <select {...props} className={classNames(inputCls, 'pr-8', props.className)}>{children}</select>;
}

// Select de categoría alimentado por la tabla CategoriaServicio, con alta rápida de categorías nuevas
function CategoriaSelect({ value, categorias, onChange, onCreada }) {
  const toast = useToast();
  const [adding, setAdding] = useState(false);
  const [nuevo, setNuevo] = useState('');
  const [creating, setCreating] = useState(false);

  async function crear() {
    const nombre = nuevo.trim();
    if (!nombre) { setAdding(false); return; }
    setCreating(true);
    try {
      const creada = await api.insert('CategoriaServicio', { nombre });
      onCreada(creada);
      onChange(creada.nombre);
      setAdding(false); setNuevo('');
    } catch (err) {
      toast(err.message && err.message.includes('duplicate') ? 'Esa categoría ya existe' : (err.message || 'No se pudo crear la categoría'), 'error');
    } finally { setCreating(false); }
  }

  if (adding) {
    return (
      <div className="flex gap-1.5">
        <Input
          value={nuevo} onChange={(e) => setNuevo(e.target.value)} placeholder="Nombre de la categoría" autoFocus
          onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); crear(); } if (e.key === 'Escape') { setAdding(false); setNuevo(''); } }}
        />
        <Button type="button" size="sm" onClick={crear} disabled={creating}>OK</Button>
        <Button type="button" size="sm" variant="secondary" onClick={() => { setAdding(false); setNuevo(''); }}>
          <Icons.X className="w-3.5 h-3.5" />
        </Button>
      </div>
    );
  }

  return (
    <Select value={value || ''} onChange={(e) => { if (e.target.value === '__nueva__') setAdding(true); else onChange(e.target.value); }}>
      <option value="">Sin categoría</option>
      {categorias.map((c) => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
      <option value="__nueva__">+ Añadir categoría nueva...</option>
    </Select>
  );
}

// Formulario mínimo para crear un cliente al vuelo, sin salir del formulario donde se necesita
function ClienteQuickForm({ onCancel, onCreated }) {
  const toast = useToast();
  const [form, setForm] = useState({ nombre: '', empresa: '', telefono: '', email: '' });
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  async function handleSubmit(e) {
    e.preventDefault();
    if (!form.nombre.trim()) { toast('El nombre es obligatorio', 'error'); return; }
    setSaving(true);
    try {
      const creado = await api.insert('Cliente', { ...form, estado: 'activo' });
      toast('Cliente creado');
      onCreated(creado);
    } catch (err) {
      toast(err.message || 'No se pudo crear el cliente', 'error');
    } finally { setSaving(false); }
  }

  return (
    <form onSubmit={handleSubmit}>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <Field label="Nombre" required className="sm:col-span-2">
          <Input value={form.nombre} onChange={set('nombre')} placeholder="Nombre del cliente" required autoFocus />
        </Field>
        <Field label="Empresa"><Input value={form.empresa} onChange={set('empresa')} placeholder="Razón social" /></Field>
        <Field label="Teléfono"><Input type="tel" inputMode="tel" maxLength={12} value={form.telefono} onChange={set('telefono')} /></Field>

      </div>
      <p className="text-[11px] text-slate-400 mt-2">Podrás completar el resto de datos más tarde desde la ficha del cliente.</p>

        <Button variant="secondary" type="button" onClick={onCancel}>Cancelar</Button>
        <Button type="submit" disabled={saving}>{saving ? 'Creando...' : 'Crear cliente'}</Button>
      </div>
    </form>
  );
}

// Calcula la posición (fixed) del desplegable de un combobox a partir de su elemento ancla.
// Se usa junto a un portal a document.body para que el desplegable nunca quede recortado
// por el overflow-hidden/overflow-x-auto de las tablas (CardTable) o de un Modal.
function useDropdownPosition(open, anchorRef) {
  const [pos, setPos] = useState(null);
  useEffect(() => {
    if (!open || !anchorRef.current) { setPos(null); return; }
    function update() {
      if (!anchorRef.current) return;
      const r = anchorRef.current.getBoundingClientRect();
      setPos({ top: r.bottom + 4, left: r.left, width: r.width });
    }
    update();
    window.addEventListener('resize', update);
    document.addEventListener('scroll', update, true);
    return () => { window.removeEventListener('resize', update); document.removeEventListener('scroll', update, true); };
  }, [open]);
  return pos;
}

// Combobox de cliente con buscador y alta rápida: evita salir del presupuesto/factura/servicio para crear el cliente.
// Los clientes se ordenan siempre por empresa (o nombre si no tiene empresa) para facilitar encontrarlos en listados largos.
function ClienteSelect({ value, clientes, onChange, onCreado, required, placeholder, className }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState('');
  const [modalOpen, setModalOpen] = useState(false);
  const anchorRef = useRef(null);
  const dropdownRef = useRef(null);
  const pos = useDropdownPosition(open, anchorRef);

  const labelDe = (c) => (c.empresa ? `${c.empresa} — ${c.nombre}` : c.nombre);
  const ordenados = [...clientes].sort((a, b) => compareValues(a.empresa || a.nombre, b.empresa || b.nombre));
  const seleccionado = clientes.find((c) => c.id === value);

  useEffect(() => {
    if (!open) return;
    function onDocClick(e) {
      if (anchorRef.current && anchorRef.current.contains(e.target)) return;
      if (dropdownRef.current && dropdownRef.current.contains(e.target)) return;
      setOpen(false); setQuery('');
    }
    document.addEventListener('mousedown', onDocClick);
    return () => document.removeEventListener('mousedown', onDocClick);
  }, [open]);

  const q = query.trim().toLowerCase();
  const filtrados = q ? ordenados.filter((c) => labelDe(c).toLowerCase().includes(q)) : ordenados;

  function seleccionar(c) {
    onChange(c.id);
    setOpen(false); setQuery('');
  }

  return (
    <>
      <div className={classNames('flex gap-1.5', className)}>
        <div ref={anchorRef} className="relative flex-1">
          {open ? (
            <Input autoFocus value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Buscar cliente o empresa..."
              onKeyDown={(e) => { if (e.key === 'Escape') { setOpen(false); setQuery(''); } }} />
          ) : (
            <button type="button" onClick={() => setOpen(true)} required={required}
              className={classNames(inputCls, 'w-full text-left flex items-center justify-between', !seleccionado && 'text-slate-400')}>
              <span className="truncate">{seleccionado ? labelDe(seleccionado) : (placeholder || 'Selecciona un cliente')}</span>
              <Icons.ChevronDown className="w-4 h-4 text-slate-400 shrink-0" />
            </button>
          )}
          {open && pos && ReactDOM.createPortal(
            <div ref={dropdownRef} style={{ position: 'fixed', top: pos.top, left: pos.left, width: pos.width }}
              className="z-50 bg-white rounded-lg border border-slate-200 shadow-xl max-h-64 overflow-y-auto py-1">
              {filtrados.length === 0 ? (
                <p className="px-3 py-2 text-xs text-slate-400">Sin resultados</p>
              ) : filtrados.map((c) => (
                <button key={c.id} type="button" onClick={() => seleccionar(c)}
                  className={classNames('w-full text-left px-3 py-1.5 text-sm hover:bg-slate-50 truncate', c.id === value ? 'bg-brand-50 text-brand-700' : 'text-ink-700')}>
                  {labelDe(c)}
                </button>
              ))}
            </div>, document.body
          )}
        </div>
        <Button type="button" size="sm" variant="secondary" title="Crear cliente nuevo" onClick={() => setModalOpen(true)} className="!px-2.5 shrink-0">

// Formulario mínimo para crear un producto/servicio al vuelo, sin salir del formulario donde se necesita
function ProductoQuickForm({ onCancel, onCreated }) {
  const toast = useToast();
  const [form, setForm] = useState({ nombre: '', tipo: 'servicio', precio: '', iva: 21 });
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  async function handleSubmit(e) {
    e.preventDefault();
    if (!form.nombre.trim()) { toast('El nombre es obligatorio', 'error'); return; }
    setSaving(true);
    try {
      const creado = await api.insert('Producto', {
        nombre: form.nombre, tipo: form.tipo, precio: Number(form.precio || 0), iva: Number(form.iva || 0), activo: true,
      });
      toast('Producto creado');
      onCreated(creado);
    } catch (err) {
      toast(err.message || 'No se pudo crear el producto', 'error');
    } finally { setSaving(false); }
  }

  return (
    <form onSubmit={handleSubmit}>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <Field label="Nombre" required className="sm:col-span-2">
          <Input value={form.nombre} onChange={set('nombre')} placeholder="Nombre del producto o servicio" required autoFocus />
        </Field>
        <Field label="Tipo">
          <Select value={form.tipo} onChange={set('tipo')}>
            <option value="servicio">Servicio</option>
            <option value="producto">Producto</option>
            <option value="suscripcion">Suscripción</option>
          </Select>
        </Field>
        <Field label="Precio de venta (€)" required><Input type="number" step="0.01" min="0" value={form.precio} onChange={set('precio')} required /></Field>
        <Field label="IVA (%)" className="sm:col-span-2"><Input type="number" step="0.01" min="0" value={form.iva} onChange={set('iva')} /></Field>
      </div>
      <p className="text-[11px] text-slate-400 mt-2">Podrás completar categoría, coste y proveedor más tarde desde el catálogo.</p>
      <div className="flex justify-end gap-2 mt-4">
        <Button variant="secondary" type="button" onClick={onCancel}>Cancelar</Button>
        <Button type="submit" disabled={saving}>{saving ? 'Creando...' : 'Crear producto'}</Button>
      </div>
    </form>
  );
}

// Combobox de producto con buscador y alta rápida: evita salir del formulario para dar de alta el producto en el catálogo
function ProductoSelect({ value, productos, onChange, onCreado, placeholder, className }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState('');
  const [modalOpen, setModalOpen] = useState(false);
  const anchorRef = useRef(null);
  const dropdownRef = useRef(null);
  const pos = useDropdownPosition(open, anchorRef);

  const ordenados = [...productos].sort((a, b) => compareValues(a.nombre, b.nombre));
  const seleccionado = productos.find((p) => p.id === value);

  useEffect(() => {
    if (!open) return;
    function onDocClick(e) {
      if (anchorRef.current && anchorRef.current.contains(e.target)) return;
      if (dropdownRef.current && dropdownRef.current.contains(e.target)) return;
      setOpen(false); setQuery('');
    }
    document.addEventListener('mousedown', onDocClick);
    return () => document.removeEventListener('mousedown', onDocClick);
  }, [open]);

  const q = query.trim().toLowerCase();
  const filtrados = q ? ordenados.filter((p) => p.nombre.toLowerCase().includes(q)) : ordenados;

  function seleccionar(p) {
    onChange(p.id);
    setOpen(false); setQuery('');
  }

  return (
    <>
      <div className={classNames('flex gap-1.5', className)}>
        <div ref={anchorRef} className="relative flex-1">
          {open ? (
            <Input autoFocus value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Buscar producto..."
              onKeyDown={(e) => { if (e.key === 'Escape') { setOpen(false); setQuery(''); } }} />
          ) : (
            <button type="button" onClick={() => setOpen(true)}
              className={classNames(inputCls, 'w-full text-left flex items-center justify-between', !seleccionado && 'text-slate-400')}>
              <span className="truncate">{seleccionado ? seleccionado.nombre : (placeholder || 'Ninguno')}</span>
              <Icons.ChevronDown className="w-4 h-4 text-slate-400 shrink-0" />
            </button>
          )}
          {open && pos && ReactDOM.createPortal(
            <div ref={dropdownRef} style={{ position: 'fixed', top: pos.top, left: pos.left, width: pos.width }}
              className="z-50 bg-white rounded-lg border border-slate-200 shadow-xl max-h-64 overflow-y-auto py-1">
              {filtrados.length === 0 ? (
                <p className="px-3 py-2 text-xs text-slate-400">Sin resultados</p>
              ) : filtrados.map((p) => (
                <button key={p.id} type="button" onClick={() => seleccionar(p)}
                  className={classNames('w-full text-left px-3 py-1.5 text-sm hover:bg-slate-50 truncate', p.id === value ? 'bg-brand-50 text-brand-700' : 'text-ink-700')}>
                  {p.nombre}
                </button>
              ))}
            </div>, document.body
          )}
        </div>
        <Button type="button" size="sm" variant="secondary" title="Crear producto nuevo" onClick={() => setModalOpen(true)} className="!px-2.5 shrink-0">
          <Icons.Plus className="w-4 h-4" />
        </Button>
      </div>
      <Modal open={modalOpen} onClose={() => setModalOpen(false)} title="Nuevo producto">
        <ProductoQuickForm onCancel={() => setModalOpen(false)} onCreated={(p) => { onCreado(p); onChange(p.id); setModalOpen(false); }} />
      </Modal>
    </>
  );
}

// ---------- Modal ----------
// Se renderiza con un portal a document.body: los formularios de alta rápida (cliente/producto)
// abren su propio <Modal> desde dentro de otro formulario, y sin portal quedaría un <form> anidado
// dentro de otro <form> (HTML inválido) que rompe el submit. El portal saca el DOM fuera del <form> padre.
function Modal({ open, onClose, title, children, footer, wide, size }) {
  if (!open) return null;
  const sizeCls = size === 'xl' ? 'sm:max-w-5xl' : (wide || size === 'lg') ? 'sm:max-w-3xl' : 'sm:max-w-lg';
  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-50 flex items-start sm:items-center justify-center p-0 sm:p-4">
      <div className="absolute inset-0 bg-ink-900/50 backdrop-blur-[2px]" onClick={onClose}></div>
      <div className={classNames(
        'relative bg-white w-full sm:rounded-2xl shadow-2xl fade-in flex flex-col max-h-full sm:max-h-[95vh]',
        sizeCls
      )}>
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100 shrink-0">
          <h3 className="text-base font-semibold text-ink-900">{title}</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-ink-700 rounded-lg p-1 hover:bg-slate-100">
            <Icons.X className="w-5 h-5" />
          </button>
        </div>
        <div className="px-5 py-4 overflow-y-auto">{children}</div>
        {footer && <div className="px-5 py-3.5 border-t border-slate-100 flex justify-end gap-2 shrink-0">{footer}</div>}
      </div>
    </div>,
    document.body
  );
}

// ---------- Paginación de listados ----------
function Pagination({ page, totalPages, onPageChange, totalItems, pageSize }) {
  if (totalPages <= 1) return null;
  const start = (page - 1) * pageSize + 1;
  const end = Math.min(page * pageSize, totalItems);
  return (
    <div className="flex items-center justify-between px-4 py-3 border-t border-slate-100 text-xs text-slate-500">
      <span>{start}–{end} de {totalItems}</span>
      <div className="flex items-center gap-2">
        <Button size="sm" variant="secondary" disabled={page <= 1} onClick={() => onPageChange(page - 1)}>
          <Icons.ChevronLeft className="w-4 h-4" />
        </Button>
        <span>Página {page} de {totalPages}</span>
        <Button size="sm" variant="secondary" disabled={page >= totalPages} onClick={() => onPageChange(page + 1)}>
          <Icons.ChevronRight className="w-4 h-4" />
        </Button>
      </div>
    </div>
  );
}

// Cabecera de columna ordenable: al pulsar el nombre del campo, ordena asc/desc (y alterna al volver a pulsar)
function SortableTh({ children, sortKey, sort, onSort, className }) {
  const active = sort && sort.key === sortKey;
  return (
    <Th className={classNames('cursor-pointer select-none hover:text-white/80', className)} onClick={() => onSort(sortKey)}>
      <span className="inline-flex items-center gap-1">

        <Icons.ArrowUp className={classNames('w-3 h-3 shrink-0 transition-transform', active ? 'opacity-100' : 'opacity-30', active && sort.dir === 'desc' && 'rotate-180')} />
      </span>

  );
}

// ---------- Editor de líneas (presupuestos / facturas) ----------
function LineItemsEditor({ items, setItems, productos, onProductoCreado, sinIva }) {
  const [creandoProducto, setCreandoProducto] = useState(false);

  function update(idx, patch) {
    setItems(items.map((it, i) => (i === idx ? { ...it, ...patch } : it)));
  }
  function addItem() {
    setItems([...items, { _key: uid(), concepto: '', descripcion: '', cantidad: 1, precioUnitario: 0, iva: sinIva ? 0 : 21 }]);
  }
  function addFromProducto(p) {
    setItems([...items, { _key: uid(), concepto: p.nombre, descripcion: p.descripcion || '', cantidad: 1, precioUnitario: Number(p.precio || 0), iva: sinIva ? 0 : Number(p.iva || 21) }]);
  }
  function removeItem(idx) {
    setItems(items.filter((_, i) => i !== idx));
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-2">
        <span className="text-xs font-semibold text-ink-600">Líneas del documento</span>
        <div className="flex items-center gap-1.5">
          {productos && productos.length > 0 && (
            <Select className="!w-auto !py-1 !text-xs" onChange={(e) => {
              const p = productos.find((x) => x.id === e.target.value);
              if (p) addFromProducto(p);
              e.target.value = '';
            }} defaultValue="">
              <option value="" disabled>+ Añadir desde catálogo</option>
              {productos.map((p) => <option key={p.id} value={p.id}>{p.nombre} — {formatCurrency(p.precio)}</option>)}
            </Select>
          )}
          <Button type="button" size="sm" variant="secondary" title="Crear producto nuevo" onClick={() => setCreandoProducto(true)} className="!px-2.5">
            <Icons.Plus className="w-3.5 h-3.5" />
          </Button>
        </div>
      </div>
      <Modal open={creandoProducto} onClose={() => setCreandoProducto(false)} title="Nuevo producto">
        <ProductoQuickForm onCancel={() => setCreandoProducto(false)} onCreated={(p) => {
          addFromProducto(p);
          onProductoCreado && onProductoCreado(p);
          setCreandoProducto(false);
        }} />
      </Modal>
      <div className="border border-slate-200 rounded-lg overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full min-w-[560px] text-sm">
            <thead className="bg-slate-50 text-slate-400"><tr>
              <Th className="!py-2">Concepto</Th>
              <Th className="!py-2 w-20">Cant.</Th>
              <Th className="!py-2 w-28">Precio (€)</Th>
              <Th className="!py-2 w-20">IVA %</Th>
              <Th className="!py-2 w-28 text-right">Total</Th>
              <Th className="!py-2 w-28 text-right">Total c/IVA</Th>
              <Th className="!py-2 w-10"></Th>
            </tr></thead>
            <tbody className="divide-y divide-slate-100">
              {items.length === 0 && (
                <tr><td colSpan="7" className="text-center text-xs text-slate-400 py-6">Sin líneas. Añade una línea o un producto del catálogo.</td></tr>
              )}
              {items.map((it, idx) => (
                <tr key={it._key || it.id || idx}>
                  <td className="px-2 py-1.5"><Input className="!py-1.5" value={it.concepto} onChange={(e) => update(idx, { concepto: e.target.value })} placeholder="Concepto" /></td>
                  <td className="px-2 py-1.5"><Input type="number" min="0" step="1" className="!py-1.5" value={it.cantidad} onChange={(e) => update(idx, { cantidad: e.target.value })} /></td>
                  <td className="px-2 py-1.5"><Input type="number" min="0" step="0.01" className="!py-1.5" value={it.precioUnitario} onChange={(e) => update(idx, { precioUnitario: e.target.value })} /></td>
                  <td className="px-2 py-1.5"><Input type="number" min="0" step="1" className={classNames('!py-1.5', sinIva && 'bg-slate-50 text-slate-400')} value={it.iva} onChange={(e) => update(idx, { iva: e.target.value })} disabled={sinIva} /></td>
                  <td className="px-2 py-1.5 text-right text-ink-500">{formatCurrency(calcLineTotal(it))}</td>
                  <td className="px-2 py-1.5 text-right font-medium text-ink-700">{formatCurrency(calcLineTotal(it) * (1 + Number(it.iva || 0) / 100))}</td>
                  <td className="px-2 py-1.5 text-right"><button type="button" onClick={() => removeItem(idx)} className="text-slate-400 hover:text-rose-500 p-1"><Icons.Trash className="w-4 h-4" /></button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      <button type="button" onClick={addItem} className="mt-2 text-xs font-medium text-brand-600 hover:underline flex items-center gap-1">
        <Icons.Plus className="w-3.5 h-3.5" /> Añadir línea manual
      </button>
    </div>
  );
}

// ---------- Copiar al portapapeles ----------
function CopyIconButton({ text, label, className }) {
  const toast = useToast();
  if (!text) return null;
  function copy(e) {
    e.preventDefault();
    e.stopPropagation();
    navigator.clipboard.writeText(String(text))
      .then(() => toast(`${label || 'Copiado'} copiado`))
      .catch(() => toast('No se pudo copiar', 'error'));
  }
  return (
    <button type="button" onClick={copy} title={`Copiar${label ? ' ' + label : ''}`}
      className={classNames('text-slate-400 hover:text-brand-600 shrink-0 p-0.5 rounded transition', className)}>
      <Icons.Copy className="w-3.5 h-3.5" />
    </button>
  );
}

// Input de texto con botón de copiar integrado (para nombre, email, teléfono, etc.)
function InputCopy({ value, copyLabel, className, ...props }) {
  const toast = useToast();
  function copy(e) {
    e.preventDefault();
    if (!value) return;
    navigator.clipboard.writeText(String(value))
      .then(() => toast(`${copyLabel || 'Valor'} copiado`))
      .catch(() => toast('No se pudo copiar', 'error'));
  }
  return (
    <div className="relative">
      <Input value={value} className={classNames(value ? 'pr-9' : '', className)} {...props} />
      {value && (
        <button type="button" onClick={copy} title={`Copiar ${copyLabel || ''}`.trim()}
          className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brand-600 p-0.5 rounded">
          <Icons.Copy className="w-3.5 h-3.5" />
        </button>
      )}
    </div>
  );
}

// Avatar with initials
function Avatar({ name, className }) {
  const initials = (name || '?').split(' ').filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
  const colors = ['bg-brand-100 text-brand-700', 'bg-blue-100 text-blue-700', 'bg-emerald-100 text-emerald-700', 'bg-amber-100 text-amber-700', 'bg-rose-100 text-rose-700', 'bg-violet-100 text-violet-700'];
  let hash = 0; for (let i = 0; i < (name || '').length; i++) hash = (hash + name.charCodeAt(i)) % colors.length;
  return (
    <div className={classNames('w-8 h-8 rounded-full flex items-center justify-center text-[11px] font-bold shrink-0', colors[hash], className)}>
      {initials || '?'}
    </div>
  );
}

function Layout({ current, navigate, userEmail, onLogout, children }) {
  const [mobileOpen, setMobileOpen] = useState(false);
  const [collapsed, setCollapsed] = useState(() => {
    try { return window.localStorage.getItem('crm_sidebar_collapsed') === '1'; } catch (e) { return false; }
  });
  useEffect(() => {
    try { window.localStorage.setItem('crm_sidebar_collapsed', collapsed ? '1' : '0'); } catch (e) {}
  }, [collapsed]);

  const [avisos, setAvisos] = useState([]);
  const [cobrosPendientes, setCobrosPendientes] = useState([]);
  const [searchData, setSearchData] = useState({});
  useEffect(() => {
    let active = true;
    async function loadAvisos() {
      try {
        const [tareas, facturas, recurrentes, presupuestos, clientes, proyectos, leads, proveedores] = await Promise.all([
          api.list('Tarea'), api.list('Factura'), api.list('ServicioRecurrente'), api.list('Presupuesto'),
          api.list('Cliente'), api.list('Proyecto'), api.list('Lead'), api.list('Proveedor'),
        ]);
        if (!active) return;
        setAvisos(computeAvisos({ tareas, facturas, recurrentes, presupuestos, clientes, proyectos }));
        setSearchData({ clientes, proyectos, presupuestos, facturas, leads, proveedores });

        const clienteById = {}; clientes.forEach((c) => { clienteById[c.id] = c; });
        const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
        const cobros = facturas
          .filter((f) => ['emitida', 'pagada_parcial', 'vencida'].includes(f.estado))
          .map((f) => ({
            ...f,
            _clienteNombre: (clienteById[f.clienteId] || {}).nombre || 'Cliente',
            _vencida: f.estado === 'vencida' || (f.fechaVencimiento && parseDateOnly(f.fechaVencimiento) < hoy),
          }))
          .sort((a, b) => (a.fechaVencimiento || '9999-12-31').localeCompare(b.fechaVencimiento || '9999-12-31'));
        setCobrosPendientes(cobros);
      } catch (e) { /* silencioso: no bloquear la interfaz por un fallo de avisos */ }
    }
    loadAvisos();
    return () => { active = false; };
  }, [current]);

  const title = (NAV_ITEMS.find((n) => n.key === current) || {}).label || '';
  return (
    <div className="flex min-h-screen bg-[#f5f6fa]">
      <Sidebar current={current} navigate={navigate} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} collapsed={collapsed} setCollapsed={setCollapsed} />
      <div className="flex-1 min-w-0 flex flex-col">
        <Topbar setMobileOpen={setMobileOpen} collapsed={collapsed} setCollapsed={setCollapsed} title={title} userEmail={userEmail} onLogout={onLogout}
          avisos={avisos} cobrosPendientes={cobrosPendientes} searchData={searchData} navigate={navigate} />
        <main className="flex-1 w-full px-3 py-4 sm:px-5 sm:py-6 lg:px-8 2xl:px-10">{children}</main>
      </div>
    </div>
  );
}

const REMEMBER_LOGIN_KEY = 'crm_remember_login';

function Login() {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [showPassword, setShowPassword] = useState(false);
  const [remember, setRemember] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  useEffect(() => {
    try {
      const raw = window.localStorage.getItem(REMEMBER_LOGIN_KEY);
      if (raw) {
        const saved = JSON.parse(atob(raw));
        if (saved && saved.email) {
          setEmail(saved.email);
          setPassword(saved.password || '');
          setRemember(true);
        }
      }
    } catch (e) { /* datos guardados corruptos: se ignoran */ }
  }, []);

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    setLoading(true);
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    setLoading(false);
    if (error) { setError('Email o contraseña incorrectos.'); return; }
    try {
      if (remember) window.localStorage.setItem(REMEMBER_LOGIN_KEY, btoa(JSON.stringify({ email, password })));
      else window.localStorage.removeItem(REMEMBER_LOGIN_KEY);
    } catch (e) { /* localStorage no disponible: no bloquear el login */ }
  }

  return (
    <div className="min-h-screen flex items-center justify-center bg-ink-900 px-4 relative overflow-hidden">
      <div className="absolute -top-32 -left-32 w-96 h-96 bg-brand-600/30 rounded-full blur-3xl"></div>

      <div className="absolute inset-0 opacity-[0.05]" style={{ backgroundImage: 'radial-gradient(circle, #fff 1px, transparent 1px)', backgroundSize: '26px 26px' }}></div>
      <div className="relative w-full max-w-md fade-in">
        <form onSubmit={handleSubmit} className="bg-white rounded-2xl shadow-2xl shadow-black/40 border border-white/10 p-8 sm:p-11 space-y-6">
          <div className="text-center">
            <h1 className="text-ink-900 font-bold text-2xl sm:text-[26px]">CRM Creadores Web</h1>
            <p className="text-ink-500 text-base mt-1.5">Accede a tu panel de gestión</p>
          </div>
          <div className="flex flex-col gap-1.5">
            <span className="text-sm font-semibold text-ink-600">Correo electrónico <span className="text-rose-500">*</span></span>
            <div className="relative">
              <Icons.Mail className="w-[18px] h-[18px] text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" />
              <input
                type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="tucorreo@dominio.com" autoFocus
                className="w-full rounded-xl border border-slate-200 bg-white pl-11 pr-4 py-3 text-base text-ink-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/40 focus:border-brand-400 transition"
              />
            </div>
          </div>
          <div className="flex flex-col gap-1.5">
            <span className="text-sm font-semibold text-ink-600">Contraseña <span className="text-rose-500">*</span></span>
            <div className="relative">
              <Icons.Lock className="w-[18px] h-[18px] text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" />
              <input
                type={showPassword ? 'text' : 'password'} required value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••"
                className="w-full rounded-xl border border-slate-200 bg-white pl-11 pr-11 py-3 text-base text-ink-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/40 focus:border-brand-400 transition"
              />
              <button
                type="button"
                onClick={() => setShowPassword((v) => !v)}
                className="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-ink-600"
                tabIndex={-1}
                title={showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'}
              >
                {showPassword ? <Icons.EyeOff className="w-[18px] h-[18px]" /> : <Icons.Eye className="w-[18px] h-[18px]" />}
              </button>
            </div>
          </div>
          <label className="flex items-center gap-2 text-sm text-ink-600 select-none cursor-pointer">
            <input
              type="checkbox"
              checked={remember}
              onChange={(e) => setRemember(e.target.checked)}
              className="w-4 h-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500/40 focus:ring-offset-0"
            />
            Recordar mis datos
          </label>
          {error && (
            <div className="flex items-center gap-2 text-rose-600 bg-rose-50 rounded-lg px-3.5 py-2.5 text-sm font-medium">
              <Icons.Alert className="w-4 h-4 shrink-0" /> {error}
            </div>
          )}
          <Button type="submit" className="w-full text-base py-3" size="lg" disabled={loading}>
            {loading ? <Spinner className="w-4 h-4 border-white/40 border-t-white" /> : null}
            {loading ? 'Entrando...' : 'Iniciar sesión'}
          </Button>
        </form>
        <p className="text-center text-white/40 text-xs mt-6">© {new Date().getFullYear()} Creadores Web · Uso interno</p>
      </div>
    </div>
  );
}

function Dashboard({ navigate }) {
  const [loading, setLoading] = useState(true);

  async function load() {
    setLoading(true);
    const [clientes, proyectos, presupuestos, facturas, pagos, tareas, leads] = await Promise.all([
      api.list('Cliente'),
      api.list('Proyecto'),
      api.list('Presupuesto'),
      api.list('Factura'),
      api.list('Pago'),
      api.list('Tarea'),
      api.list('Lead'),
    ]);
    setData({ clientes, proyectos, presupuestos, facturas, pagos, tareas, leads });
    setLoading(false);
  }

  useEffect(() => { load(); }, []);

  if (loading || !data) return <PageLoader />;

  const { clientes, proyectos, presupuestos, facturas, pagos, tareas, leads } = data;

  const clientesActivos = clientes.filter((c) => c.estado === 'activo').length;
  const proyectosActivos = proyectos.filter((p) => ['activo', 'pendiente'].includes(p.estado));
  const facturasPendientes = facturas.filter((f) => ['emitida', 'pagada_parcial', 'vencida'].includes(f.estado));
  const totalPendienteCobro = facturasPendientes.reduce((acc, f) => acc + Number(f.total || 0), 0);
  const now = new Date();
  const anioActual = now.getFullYear();
  const facturadoMes = facturas
    .filter((f) => f.estado === 'pagada' && new Date(f.fechaEmision).getMonth() === now.getMonth() && new Date(f.fechaEmision).getFullYear() === now.getFullYear())
    .reduce((acc, f) => acc + Number(f.total || 0), 0);
  const facturadoAnio = facturas
    .filter((f) => f.estado !== 'cancelada' && f.fechaEmision && new Date(f.fechaEmision).getFullYear() === anioActual)
    .reduce((acc, f) => acc + Number(f.total || 0), 0);
  const cobradoAnio = pagos
    .filter((p) => p.fecha && new Date(p.fecha).getFullYear() === anioActual)
    .reduce((acc, p) => acc + Number(p.importe || 0), 0);
  const facturasPorEstado = facturas.reduce((acc, f) => { acc[f.estado] = (acc[f.estado] || 0) + 1; return acc; }, {});
  const presupuestosAbiertos = presupuestos.filter((p) => p.estado === 'enviado' || p.estado === 'borrador').length;
  const tareasPendientes = tareas.filter((t) => t.estado !== 'completada' && t.estado !== 'cancelada')
    .sort((a, b) => {
      if (!!b.destacada !== !!a.destacada) return b.destacada ? 1 : -1;
      return (a.fechaLimite || '9999').localeCompare(b.fechaLimite || '9999');
    }).slice(0, 6);
  const leadsAbiertos = leads.filter((l) => !['convertido', 'perdido'].includes(l.estado)).length;
  const clienteById = Object.fromEntries(clientes.map((c) => [c.id, c]));
  const proyectoById = Object.fromEntries(proyectos.map((p) => [p.id, p]));

  const cobrosPendientes = facturasPendientes
    .slice()
    .sort((a, b) => (a.fechaVencimiento || '9999-12-31').localeCompare(b.fechaVencimiento || '9999-12-31'))
    .slice(0, 8);

    <div className="fade-in">

        <StatCard label="Proyectos en curso" value={proyectosActivos.length} icon={Icons.Briefcase} tone="blue" trend={`${proyectos.length} en total`} />
        <StatCard label="Pendiente de cobro" value={formatCurrency(totalPendienteCobro)} icon={Icons.Euro} tone="amber" trend={`${facturasPendientes.length} facturas`} />
        <StatCard label="Facturado este mes" value={formatCurrency(facturadoMes)} icon={Icons.Receipt} tone="emerald" />
      </div>

      <div className="bg-white rounded-2xl border border-slate-100 shadow-card p-5 mb-6">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-sm font-semibold text-ink-800">Facturación {anioActual}</h3>
          <button onClick={() => navigate('contabilidad')} className="text-xs font-medium text-brand-600 hover:underline">Ver contabilidad</button>
        </div>
        <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
          <div>
            <p className="text-xs text-slate-400">Facturado</p>
            <p className="text-xl sm:text-2xl font-bold text-ink-900">{formatCurrency(facturadoAnio)}</p>
          </div>
          <div>
            <p className="text-xs text-slate-400">Cobrado</p>
            <p className="text-xl sm:text-2xl font-bold text-emerald-600">{formatCurrency(cobradoAnio)}</p>
          </div>
          <div>
            <p className="text-xs text-slate-400">Pendiente de cobro</p>
            <p className="text-xl sm:text-2xl font-bold text-amber-600">{formatCurrency(totalPendienteCobro)}</p>
          </div>
        </div>
        <div className="flex flex-wrap gap-2 mt-4 pt-4 border-t border-slate-100">
          {Object.keys(facturasPorEstado).length === 0 ? (
            <span className="text-xs text-slate-400">Sin facturas todavía</span>
          ) : (
            Object.entries(facturasPorEstado).map(([estado, count]) => (
              <span key={estado} className={classNames('inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium ring-1 ring-inset', ESTADO_STYLES[estado] || 'bg-slate-100 text-slate-600 ring-slate-500/20')}>

// Formulario de alta/edición de tarea, siempre dentro de una ventana modal.
function TareaForm({ initial, clientes, proyectos, onClienteCreado, onCancel, onSaved }) {
  const toast = useToast();
  function fechaHoy() { return toDateInput(new Date()); }
  function fechaEn7Dias() { const d = new Date(); d.setDate(d.getDate() + 7); return toDateInput(d); }

  const [form, setForm] = useState(initial ? {
    titulo: initial.titulo,
    fechaInicio: toDateInput(initial.fechaInicio) || fechaHoy(),
    fechaLimite: toDateInput(initial.fechaLimite) || fechaEn7Dias(),
    prioridad: initial.prioridad || 'media', estado: initial.estado || 'pendiente',
    clienteId: initial.clienteId || '', proyectoRelacionadoId: initial.proyectoRelacionadoId || '',
    destacada: !!initial.destacada,
  } : {
    titulo: '', fechaInicio: fechaHoy(), fechaLimite: fechaEn7Dias(), prioridad: 'media', estado: 'pendiente',
    clienteId: '', proyectoRelacionadoId: '', destacada: false,
  });
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  async function handleSubmit(e) {
    e.preventDefault();
    if (!form.titulo.trim()) { toast('Escribe un título para la tarea', 'error'); return; }
    setSaving(true);
    try {
      const payload = {
        titulo: form.titulo.trim(), estado: form.estado, prioridad: form.prioridad,
        fechaInicio: form.fechaInicio || null, fechaLimite: form.fechaLimite || null,
        clienteId: form.clienteId || null, proyectoRelacionadoId: form.proyectoRelacionadoId || null,
        destacada: !!form.destacada,
      };
      if (initial) await api.update('Tarea', initial.id, payload);
      else await api.insert('Tarea', { ...payload, orden: 0, proyectoId: null });
      toast(initial ? 'Tarea actualizada' : 'Tarea añadida');
      onSaved();
    } catch (err) { toast(err.message || 'Error al guardar', 'error'); }
    finally { setSaving(false); }
  }

  return (
    <form onSubmit={handleSubmit}>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <Field label="Título" required className="sm:col-span-2"><Input value={form.titulo} onChange={set('titulo')} autoFocus required /></Field>
        <Field label="Fecha de inicio"><Input type="date" value={form.fechaInicio} onChange={set('fechaInicio')} /></Field>
        <Field label="Fecha límite"><Input type="date" value={form.fechaLimite} onChange={set('fechaLimite')} /></Field>
        <Field label="Prioridad">
          <Select value={form.prioridad} onChange={set('prioridad')}>
            <option value="baja">Baja</option><option value="media">Media</option><option value="alta">Alta</option>
          </Select>
        </Field>
        <Field label="Estado">
          <Select value={form.estado} onChange={set('estado')}>
            <option value="pendiente">Pendiente</option><option value="en_progreso">En progreso</option>
            <option value="completada">Completada</option><option value="cancelada">Cancelada</option>
          </Select>
        </Field>
        <Field label="Cliente (opcional)" className="sm:col-span-2">
          <ClienteSelect value={form.clienteId} clientes={clientes} onChange={(v) => setForm((f) => ({ ...f, clienteId: v }))} onCreado={onClienteCreado} placeholder="Sin cliente" />
        </Field>
        <Field label="Proyecto (opcional)" className="sm:col-span-2">
          <ProyectoSelect value={form.proyectoRelacionadoId} proyectos={proyectos} clienteId={form.clienteId} onChange={(v) => setForm((f) => ({ ...f, proyectoRelacionadoId: v }))} placeholder="Sin proyecto" />
        </Field>
      </div>
      <label className="flex items-center gap-2 text-sm text-ink-700 mt-4">
        <input type="checkbox" checked={!!form.destacada} onChange={(e) => setForm((f) => ({ ...f, destacada: e.target.checked }))} className="rounded border-slate-300 text-brand-600 focus:ring-brand-500" />
        Destacar esta tarea
      </label>
      <div className="flex justify-end gap-2 mt-5">
        <Button variant="secondary" type="button" onClick={onCancel}>Cancelar</Button>
        <Button type="submit" disabled={saving}>{saving ? 'Guardando...' : 'Guardar tarea'}</Button>
      </div>
    </form>
  );
}

function Tareas({ navigate }) {
  const toast = useToast();
  const [loading, setLoading] = useState(true);
  const [items, setItems] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [proyectos, setProyectos] = useState([]);
  const [search, setSearch] = useState('');
  const [tab, setTab] = useState('pendientes');
  const [modal, setModal] = useState(null); // {mode:'new'|'edit', tarea}
  const [toDelete, setToDelete] = useState(null);
  const [sort, setSort] = useState({ key: 'fecha', dir: 'asc' });
  const onSort = (key) => setSort((s) => toggleSort(s, key));

  async function load() {
    setLoading(true);
    const [ta, cl, py] = await Promise.all([
      api.list('Tarea'), api.list('Cliente', { order: 'nombre', ascending: true }), api.list('Proyecto'),
    ]);
    setItems(ta.filter((t) => !t.proyectoId));
    setClientes(cl); setProyectos(py);
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const clienteById = Object.fromEntries(clientes.map((c) => [c.id, c]));
  const proyectoById = Object.fromEntries(proyectos.map((p) => [p.id, p]));

  function handleClienteCreado(c) {
    setClientes((cs) => [...cs, c]);
  }

  async function toggleDestacada(t) {
    await api.update('Tarea', t.id, { destacada: !t.destacada });
    load();
  }
  async function handleDelete() {
    try { await api.remove('Tarea', toDelete.id); toast('Tarea eliminada'); setToDelete(null); load(); }
    catch (err) { toast('No se pudo eliminar', 'error'); setToDelete(null); }
  }

  const filtered = items.filter((t) => {
    if (tab === 'pendientes' && !['pendiente', 'en_progreso'].includes(t.estado)) return false;
    if (tab === 'completadas' && t.estado !== 'completada') return false;
    const q = search.toLowerCase();
    if (!q) return true;
    return [t.titulo, (clienteById[t.clienteId] || {}).nombre, (proyectoById[t.proyectoRelacionadoId] || {}).nombre]
      .filter(Boolean).some((v) => v.toLowerCase().includes(q));
  });
  const sorted = sortRows(filtered, sort, {
    fecha: (t) => t.fechaLimite || t.fechaInicio || '9999-12-31',
    titulo: (t) => (t.titulo || '').toLowerCase(),
    prioridad: (t) => ({ alta: 0, media: 1, baja: 2 }[t.prioridad] ?? 1),
    estado: (t) => t.estado,
  });

  const pendientesCount = items.filter((t) => ['pendiente', 'en_progreso'].includes(t.estado)).length;
  const destacadasCount = items.filter((t) => t.destacada && t.estado !== 'completada').length;

  return (
    <div className="fade-in">
      <PageHeader title="Tareas" subtitle={`${pendientesCount} pendiente${pendientesCount === 1 ? '' : 's'} · ${destacadasCount} destacada${destacadasCount === 1 ? '' : 's'}`}
        action={<Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nueva tarea</Button>} />

      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div className="flex gap-1 bg-slate-100 rounded-xl p-1 w-fit">
          <button className={classNames('px-4 py-1.5 rounded-lg text-sm font-medium transition', tab === 'pendientes' ? 'bg-white shadow-sm text-ink-800' : 'text-slate-500')} onClick={() => setTab('pendientes')}>Pendientes</button>
          <button className={classNames('px-4 py-1.5 rounded-lg text-sm font-medium transition', tab === 'completadas' ? 'bg-white shadow-sm text-ink-800' : 'text-slate-500')} onClick={() => setTab('completadas')}>Completadas</button>
          <button className={classNames('px-4 py-1.5 rounded-lg text-sm font-medium transition', tab === 'todas' ? 'bg-white shadow-sm text-ink-800' : 'text-slate-500')} onClick={() => setTab('todas')}>Todas</button>
        </div>
        <Toolbar search={search} onSearch={setSearch} placeholder="Buscar tarea, cliente o proyecto..." />
      </div>

      {loading ? <PageLoader /> : sorted.length === 0 ? (
        <CardTable><EmptyState icon={Icons.ListTasks} title="No hay tareas" message="Añade una tarea rápida o recordatorio puntual." action={<Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nueva tarea</Button>} /></CardTable>
      ) : (
        <CardTable>
          <table className="w-full min-w-[920px]">
            <thead className="bg-slate-700 text-white"><tr>
              <Th></Th>
              <SortableTh sortKey="titulo" sort={sort} onSort={onSort}>Tarea</SortableTh>
              <Th>Cliente / Proyecto</Th>
              <SortableTh sortKey="fecha" sort={sort} onSort={onSort}>Fechas</SortableTh>
              <SortableTh sortKey="prioridad" sort={sort} onSort={onSort}>Prioridad</SortableTh>
              <Th>Estado</Th>
              <Th className="text-right">Acciones</Th>
            </tr></thead>
            <tbody className="divide-y divide-slate-200">
              {sorted.map((t) => {
                const cliente = clienteById[t.clienteId];
                const proyecto = proyectoById[t.proyectoRelacionadoId];
                return (
                  <tr key={t.id} className={classNames('hover:bg-slate-50/60 cursor-pointer', t.destacada && 'bg-amber-50/40')} onClick={() => setModal({ mode: 'edit', tarea: t })}>
                    <Td onClick={(e) => e.stopPropagation()}>
                      <button onClick={() => toggleDestacada(t)} title="Destacar" className={classNames('p-1', t.destacada ? 'text-amber-500' : 'text-slate-300 hover:text-amber-400')}>
                        <Icons.Star className="w-4 h-4" fill={t.destacada ? 'currentColor' : 'none'} />
                      </button>
                    </Td>
                    <Td>
                      <p className={classNames('text-sm font-medium', t.estado === 'completada' ? 'text-slate-400 line-through' : 'text-ink-800')}>{t.titulo}</p>
                    </Td>
                    <Td onClick={(e) => e.stopPropagation()}>
                      {cliente && (
                        <button type="button" onClick={() => navigate && navigate('clientes')} className="text-xs text-brand-600 hover:underline block">{cliente.empresa || cliente.nombre}</button>
                      )}
                      {proyecto && (
                        <button type="button" onClick={() => navigate && navigate('proyectos')} className="text-xs text-violet-600 hover:underline block">{proyecto.nombre}</button>
                      )}
                      {!cliente && !proyecto && <span className="text-xs text-slate-300">—</span>}
                    </Td>
                    <Td>
                      <span className="text-xs text-slate-500">
                        {t.fechaInicio ? formatDate(t.fechaInicio) : '—'} → {t.fechaLimite ? formatDate(t.fechaLimite) : '—'}
                      </span>
                    </Td>
                    <Td><EstadoBadge estado={t.prioridad || 'media'} /></Td>
                    <Td onClick={(e) => e.stopPropagation()}>
                      <EstadoSelect estado={t.estado} onChange={(v) => api.update('Tarea', t.id, { estado: v }).then(load)}
                        opciones={['pendiente', 'en_progreso', 'completada', 'cancelada']} />
                    </Td>
                    <Td className="text-right" onClick={(e) => e.stopPropagation()}>
                      <div className="flex justify-end gap-1">
                        <button onClick={() => setModal({ mode: 'edit', tarea: t })} className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-400 hover:text-brand-600"><Icons.Edit className="w-4 h-4" /></button>
                        <button onClick={() => setToDelete(t)} className="p-1.5 rounded-lg hover:bg-rose-50 text-slate-400 hover:text-rose-500"><Icons.Trash className="w-4 h-4" /></button>
                      </div>
                    </Td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </CardTable>
      )}

      <Modal open={!!modal} onClose={() => setModal(null)} title={modal?.mode === 'edit' ? 'Editar tarea' : 'Nueva tarea'} wide>
        {modal && <TareaForm initial={modal.mode === 'edit' ? modal.tarea : null} clientes={clientes} proyectos={proyectos}
          onClienteCreado={handleClienteCreado} onCancel={() => setModal(null)} onSaved={() => { setModal(null); load(); }} />}
      </Modal>

      <ConfirmDialog open={!!toDelete} title="Eliminar tarea" danger
        message={`¿Eliminar la tarea "${toDelete?.titulo}"? Esta acción no se puede deshacer.`}
        onCancel={() => setToDelete(null)} onConfirm={handleDelete} />
    </div>
  );
}

function AvisoDot({ tipo }) {
  const info = AVISO_TIPOS[tipo] || {};
  const colors = { blue: 'bg-blue-500', rose: 'bg-rose-500', violet: 'bg-violet-500', amber: 'bg-amber-500', emerald: 'bg-emerald-500' };
  return <span className={classNames('w-1.5 h-1.5 rounded-full', colors[info.color] || 'bg-slate-400')}></span>;
}

function AvisoItem({ item, onClick }) {
  const info = AVISO_TIPOS[item.tipo] || {};
  const Ic = Icons[info.icon] || Icons.Bell;
  const urgTone = item.urgencia === 'vencido' ? 'text-rose-600 bg-rose-50' : item.urgencia === 'proximo' ? 'text-amber-600 bg-amber-50' : 'text-slate-500 bg-slate-100';
  return (
    <button type="button" onClick={onClick} className="w-full flex items-start gap-3 px-2.5 py-2.5 rounded-xl hover:bg-slate-50 text-left transition">
      <div className={classNames('w-8 h-8 rounded-lg flex items-center justify-center shrink-0', urgTone)}>
        <Ic className="w-4 h-4" />
      </div>
      <div className="min-w-0 flex-1">
        <p className="text-sm font-medium text-ink-800 truncate">{item.titulo}</p>
        <p className="text-xs text-slate-400 truncate">{item.contexto || (AVISO_TIPOS[item.tipo] || {}).label}</p>
      </div>
      <div className="text-right shrink-0">
        <p className={classNames('text-xs font-semibold', item.urgencia === 'vencido' ? 'text-rose-600' : item.urgencia === 'proximo' ? 'text-amber-600' : 'text-slate-400')}>
          {item.urgencia === 'vencido' ? `Vencido hace ${Math.abs(item.diffDays)}d` : item.diffDays === 0 ? 'Hoy' : item.diffDays === 1 ? 'Mañana' : `En ${item.diffDays} días`}
        </p>
        <p className="text-[11px] text-slate-400">{formatDate(item.fechaStr)}</p>
      </div>
    </button>
  );
}

function Calendario({ navigate }) {
  const [loading, setLoading] = useState(true);
  const [avisos, setAvisos] = useState([]);
  const [cursor, setCursor] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
  const [selectedKey, setSelectedKey] = useState(null);

  async function load() {
    setLoading(true);
    const [tareas, facturas, recurrentes, presupuestos, clientes, proyectos] = await Promise.all([
      api.list('Tarea'), api.list('Factura'), api.list('ServicioRecurrente'), api.list('Presupuesto'), api.list('Cliente'), api.list('Proyecto'),
    ]);
    setAvisos(computeAvisos({ tareas, facturas, recurrentes, presupuestos, clientes, proyectos }));
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const days = getMonthMatrix(cursor.getFullYear(), cursor.getMonth());
  const byDay = {};
  avisos.forEach((a) => {
    const k = dateKey(a.fecha);
    (byDay[k] = byDay[k] || []).push(a);
  });

  const todayKey = dateKey(new Date());
  const monthLabel = cursor.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
  const selectedItems = selectedKey ? (byDay[selectedKey] || []) : null;
  const proximos = avisos.filter((a) => a.urgencia !== 'normal');

  function goToItem(item) { navigate(item.ruta); }

  return (
    <div className="fade-in">
      <PageHeader title="Calendario" subtitle="Tareas, vencimientos de facturas, renovaciones y presupuestos" />

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <div className="lg:col-span-2 bg-white rounded-2xl border border-slate-100 shadow-card p-4 sm:p-5">
          <div className="flex items-center justify-between mb-4">
            <h3 className="text-sm font-semibold text-ink-800 capitalize">{monthLabel}</h3>
            <div className="flex items-center gap-1">
              <button onClick={() => setCursor((c) => new Date(c.getFullYear(), c.getMonth() - 1, 1))} className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500"><Icons.ChevronLeft className="w-4 h-4" /></button>
              <button onClick={() => { const d = new Date(); setCursor(new Date(d.getFullYear(), d.getMonth(), 1)); setSelectedKey(null); }} className="px-2.5 py-1 rounded-lg hover:bg-slate-100 text-xs font-medium text-ink-600">Hoy</button>
              <button onClick={() => setCursor((c) => new Date(c.getFullYear(), c.getMonth() + 1, 1))} className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500"><Icons.ChevronRight className="w-4 h-4" /></button>
            </div>
          </div>

          {loading ? <PageLoader /> : (
            <>
              <div className="grid grid-cols-7 gap-1 text-center text-[11px] font-semibold text-slate-400 mb-1">
                {['L', 'M', 'X', 'J', 'V', 'S', 'D'].map((d) => <div key={d}>{d}</div>)}
              </div>
              <div className="grid grid-cols-7 gap-1">
                {days.map((d, idx) => {
                  const k = dateKey(d);
                  const inMonth = d.getMonth() === cursor.getMonth();
                  const dayItems = byDay[k] || [];
                  const isToday = k === todayKey;
                  const isSelected = k === selectedKey;
                  return (
                    <button key={idx} type="button" onClick={() => setSelectedKey(isSelected ? null : k)}
                      className={classNames(
                        'aspect-square rounded-lg p-1 flex flex-col items-center justify-start text-xs transition border',
                        inMonth ? 'text-ink-700' : 'text-slate-300',
                        isSelected ? 'border-brand-500 bg-brand-50' : isToday ? 'border-brand-200 bg-brand-50/40' : 'border-transparent hover:bg-slate-50'
                      )}>
                      <span className={classNames('mb-0.5', isToday && 'font-bold text-brand-600')}>{d.getDate()}</span>
                      {dayItems.length > 0 && (
                        <div className="flex items-center gap-0.5 flex-wrap justify-center">
                          {dayItems.slice(0, 3).map((it) => <AvisoDot key={it.id} tipo={it.tipo} />)}
                          {dayItems.length > 3 && <span className="text-[9px] text-slate-400">+{dayItems.length - 3}</span>}
                        </div>
                      )}
                    </button>
                  );
                })}
              </div>

              {selectedKey && (
                <div className="mt-4 border-t border-slate-100 pt-3">
                  <p className="text-xs font-semibold text-ink-600 mb-1.5">{formatDate(selectedKey)}</p>
                  {selectedItems && selectedItems.length > 0 ? (
                    <div className="space-y-1">{selectedItems.map((it) => <AvisoItem key={it.id} item={it} onClick={() => goToItem(it)} />)}</div>
                  ) : <p className="text-xs text-slate-400">Sin eventos este día.</p>}
                </div>
              )}

              <div className="flex items-center gap-4 mt-4 pt-3 border-t border-slate-100 flex-wrap">
                {Object.entries(AVISO_TIPOS).map(([k, v]) => (
                  <div key={k} className="flex items-center gap-1.5 text-[11px] text-slate-400">
                    <AvisoDot tipo={k} /> {v.label}
                  </div>
                ))}
              </div>
            </>
          )}
        </div>

        <div className="bg-white rounded-2xl border border-slate-100 shadow-card p-4 sm:p-5">
          <h3 className="text-sm font-semibold text-ink-800 mb-1">Próximos avisos</h3>
          <p className="text-xs text-slate-400 mb-3">Vencidos y próximos 7 días</p>
          {loading ? <PageLoader /> : proximos.length === 0 ? (
            <EmptyState icon={Icons.Bell} title="Todo al día" message="No hay tareas, facturas ni renovaciones próximas." />
          ) : (
            <div className="space-y-0.5 max-h-[420px] overflow-y-auto">
              {proximos.map((it) => <AvisoItem key={it.id} item={it} onClick={() => goToItem(it)} />)}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function ClienteForm({ initial, onCancel, onSaved, onVerHistorial }) {

      setHistorialReciente(all.filter((i) => i.clienteId === form.id).slice(0, 3));

        <Field label="Email secundario"><InputCopy type="email" value={form.email2 || ''} onChange={set('email2')} copyLabel="email" /></Field>
        <Field label="Email adicional"><InputCopy type="email" value={form.email3 || ''} onChange={set('email3')} copyLabel="email" /></Field>
        <Field label="Sitio web principal"><InputCopy value={form.sitioWeb || ''} onChange={set('sitioWeb')} copyLabel="sitio web" placeholder="https://" /></Field>
        <Field label="Sitio web secundario"><InputCopy value={form.sitioWeb2 || ''} onChange={set('sitioWeb2')} copyLabel="sitio web" placeholder="https://" /></Field>
        <Field label="Sitio web adicional"><InputCopy value={form.sitioWeb3 || ''} onChange={set('sitioWeb3')} copyLabel="sitio web" placeholder="https://" /></Field>
        <Field label="Dirección"><InputCopy value={form.direccion || ''} onChange={set('direccion')} copyLabel="dirección" /></Field>
        <Field label="Código postal"><InputCopy value={form.codigoPostal || ''} onChange={set('codigoPostal')} copyLabel="código postal" maxLength={5} inputMode="numeric" /></Field>
        <Field label="Población"><InputCopy value={form.poblacion || ''} onChange={set('poblacion')} copyLabel="población" /></Field>
        <Field label="Provincia"><InputCopy value={form.provincia || ''} onChange={set('provincia')} copyLabel="provincia" /></Field>

            {onVerHistorial && <button type="button" onClick={onVerHistorial} className="text-xs text-brand-600 hover:underline">Ver todo</button>}

      <div className="flex justify-end gap-2 mt-5">
        <Button variant="secondary" type="button" onClick={onCancel}>Cancelar</Button>
        <Button type="submit" disabled={saving}>{saving ? 'Guardando...' : 'Guardar cliente'}</Button>
      </div>
    </form>
  );
}
