// ===================== pages/Contabilidad.js =====================
const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

// Cada fila de Gasto (puntual, o un pago concreto de uno recurrente) tiene su propia fecha real;
// ya no hace falta amortizar los recurrentes mes a mes, cada pago cuenta en su propio mes.
function gastoAplicaEnMes(gasto, year, month) {
  if (!gasto.fecha) return false;
  const inicio = new Date(gasto.fecha);
  return inicio.getFullYear() === year && inicio.getMonth() === month;
}

function Contabilidad() {
  const [loading, setLoading] = useState(true);
  const [facturas, setFacturas] = useState([]);
  const [pagos, setPagos] = useState([]);
  const [gastos, setGastos] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [year, setYear] = useState(new Date().getFullYear());

  async function load() {
    setLoading(true);
    const [fa, pg, ga, cl] = await Promise.all([
      api.list('Factura'), api.list('Pago'), api.list('Gasto'), api.list('Cliente'),
    ]);
    setFacturas(fa); setPagos(pg); setGastos(ga); setClientes(cl);
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  if (loading) return <PageLoader />;

  const clienteById = Object.fromEntries(clientes.map((c) => [c.id, c]));
  const facturaById = Object.fromEntries(facturas.map((f) => [f.id, f]));

  const years = new Set([new Date().getFullYear()]);
  facturas.forEach((f) => f.fechaEmision && years.add(new Date(f.fechaEmision).getFullYear()));
  pagos.forEach((p) => p.fecha && years.add(new Date(p.fecha).getFullYear()));
  const yearsList = Array.from(years).sort((a, b) => b - a);

  // Todo se muestra SIN IVA: el IVA de las facturas no es dinero tuyo (se ingresa a Hacienda en el modelo 303).
  const gastoPorId = Object.fromEntries(gastos.map((g) => [g.id, g]));
  const baseDe = (f) => Number(f.subtotal || 0) - Number(f.descuento || 0);
  const facturaDelMes = (f, month) => f.estado !== 'cancelada' && f.estado !== 'borrador' && f.fechaEmision
    && new Date(f.fechaEmision).getFullYear() === year && new Date(f.fechaEmision).getMonth() === month;
  const filas = MESES.map((label, month) => {
    const delMes = facturas.filter((f) => facturaDelMes(f, month));
    const ingresos = delMes.reduce((acc, f) => acc + baseDe(f), 0);
    const ivaCobrado = delMes.reduce((acc, f) => acc + (f.sinIva ? 0 : Number(f.ivaTotal || 0)), 0);
    const cobrado = pagos
      .filter((p) => p.fecha && new Date(p.fecha).getFullYear() === year && new Date(p.fecha).getMonth() === month)
      .reduce((acc, p) => acc + Number(p.importe || 0), 0);
    const gastosMes = gastos.filter((g) => g.estado === 'activo' && gastoDeducibleEfectivo(g, gastoPorId) && gastoAplicaEnMes(g, year, month));
    const gastoBase = gastosMes.reduce((acc, g) => acc + Number(g.importe || 0) - Number(g.ivaSoportado || 0), 0);
    const ivaGastos = gastosMes.reduce((acc, g) => acc + Number(g.ivaSoportado || 0), 0);
    return { label, ingresos, ivaCobrado, cobrado, gastoBase, ivaGastos, beneficio: ingresos - gastoBase };
  });

  const totalIngresos = filas.reduce((a, f) => a + f.ingresos, 0);
  const totalIvaCobrado = filas.reduce((a, f) => a + f.ivaCobrado, 0);
  const totalIvaGastos = filas.reduce((a, f) => a + f.ivaGastos, 0);
  const totalCobrado = filas.reduce((a, f) => a + f.cobrado, 0);
  const totalGastos = filas.reduce((a, f) => a + f.gastoBase, 0);
  const totalBeneficio = totalIngresos - totalGastos;

  // Gastos NO deducibles: se controlan aparte y no entran en el beneficio ni en el IVA
  const noDeducibles = gastos.filter((g) => g.estado === 'activo' && !gastoDeducibleEfectivo(g, gastoPorId) && g.fecha && new Date(g.fecha).getFullYear() === year)
    .sort((a, b) => Number(b.importe || 0) - Number(a.importe || 0));
  const totalNoDeducibles = noDeducibles.reduce((acc, g) => acc + Number(g.importe || 0), 0);
  const noDeduciblesPorMes = MESES.map((label, month) => ({ label, total: noDeducibles.filter((g) => new Date(g.fecha).getMonth() === month).reduce((acc, g) => acc + Number(g.importe || 0), 0) }));
  const ivaAHacienda = totalIvaCobrado - totalIvaGastos;

  const pendienteCobro = facturas
    .filter((f) => ['emitida', 'pagada_parcial', 'vencida'].includes(f.estado))
    .reduce((acc, f) => acc + Number(f.total || 0), 0);

  const pagosDelAnio = pagos
    .filter((p) => p.fecha && new Date(p.fecha).getFullYear() === year)
    .sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));

  return (
    <div className="fade-in">
      <PageHeader title="Contabilidad" subtitle="Ingresos, gastos y beneficio sin IVA, y el IVA aparte"
        action={
          <Select value={year} onChange={(e) => setYear(Number(e.target.value))} className="!w-auto">
            {yearsList.map((y) => <option key={y} value={y}>{y}</option>)}
          </Select>
        } />

      <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-6">
        <StatCard label="Ingresos (sin IVA)" value={formatCurrency(totalIngresos)} icon={Icons.FileText} tone="blue" trend={`Facturado en ${year}`} />
        <StatCard label="Gastos (sin IVA)" value={formatCurrency(totalGastos)} icon={Icons.Wallet} tone="rose" trend="Solo gastos deducibles" />
        <StatCard label="Beneficio (ingresos - gastos)" value={formatCurrency(totalBeneficio)} icon={Icons.BarChart} tone={totalBeneficio >= 0 ? 'emerald' : 'rose'} trend="Esto sí es tuyo" />
        <StatCard label="IVA que debes a Hacienda" value={formatCurrency(ivaAHacienda)} icon={Icons.Alert} tone="amber" trend={`${formatCurrency(totalIvaCobrado)} cobrado - ${formatCurrency(totalIvaGastos)} de tus gastos`} />
      </div>
      <p className="text-xs text-slate-500 -mt-3 mb-6">El IVA de tus facturas no es dinero tuyo: lo cobras por cuenta de Hacienda y lo ingresas en el modelo 303. Por eso no cuenta como ingreso ni como beneficio. Cifras orientativas.</p>

      <div className="bg-white rounded-2xl border border-slate-100 shadow-card p-3 sm:p-5 mb-6">
        <h3 className="text-sm font-semibold text-ink-800 mb-3 px-2">Desglose mensual {year}</h3>
        <div className="overflow-x-auto">
          <table className="w-full min-w-[560px]">
            <thead className="bg-slate-700 text-white"><tr><Th>Mes</Th><Th className="text-right">Ingresos (sin IVA)</Th><Th className="text-right">IVA de clientes</Th><Th className="text-right">Gastos (sin IVA)</Th><Th className="text-right">Beneficio</Th></tr></thead>
            <tbody className="divide-y divide-slate-200">
              {filas.map((f) => (
                <tr key={f.label} className="hover:bg-slate-50/60">
                  <Td className="font-medium text-ink-800">{f.label}</Td>
                  <Td className="text-right">{f.ingresos ? formatCurrency(f.ingresos) : <span className="text-slate-300">—</span>}</Td>
                  <Td className="text-right text-amber-600">{f.ivaCobrado ? formatCurrency(f.ivaCobrado) : <span className="text-slate-300">—</span>}</Td>
                  <Td className="text-right text-rose-600">{f.gastoBase ? formatCurrency(f.gastoBase) : <span className="text-slate-300">—</span>}</Td>
                  <Td className={classNames('text-right font-medium', f.beneficio >= 0 ? 'text-ink-800' : 'text-rose-600')}>{formatCurrency(f.beneficio)}</Td>
                </tr>
              ))}
            </tbody>
            <tfoot>
              <tr className="border-t-2 border-slate-200 font-bold">
                <Td>Total</Td>
                <Td className="text-right">{formatCurrency(totalIngresos)}</Td>
                <Td className="text-right text-amber-600">{formatCurrency(totalIvaCobrado)}</Td>
                <Td className="text-right text-rose-600">{formatCurrency(totalGastos)}</Td>
                <Td className={classNames('text-right', totalBeneficio >= 0 ? 'text-ink-900' : 'text-rose-600')}>{formatCurrency(totalBeneficio)}</Td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 border-l-4 border-l-slate-400 shadow-card p-3 sm:p-5 mb-6">
        <div className="flex flex-wrap items-baseline justify-between gap-2 px-2 mb-1">
          <h3 className="text-sm font-semibold text-ink-800">Gastos no deducibles {year}</h3>
          <span className="text-lg font-bold text-slate-600">{formatCurrency(totalNoDeducibles)}</span>
        </div>
        <p className="text-xs text-slate-500 px-2 mb-3">Control aparte: no entran en el beneficio, ni en el IVA, ni en el Resumen trimestral. Se marcan con la casilla «deducible» de cada gasto.</p>
        {noDeducibles.length === 0 ? <p className="text-xs text-slate-400 px-2 py-3">No hay gastos no deducibles este año.</p> : (
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <div className="overflow-x-auto">
              <table className="w-full min-w-[240px]">
                <thead className="bg-slate-100 text-slate-500"><tr><Th>Mes</Th><Th className="text-right">Importe</Th></tr></thead>
                <tbody className="divide-y divide-slate-100">
                  {noDeduciblesPorMes.filter((m) => m.total > 0).map((m) => <tr key={m.label}><Td>{m.label}</Td><Td className="text-right text-slate-600">{formatCurrency(m.total)}</Td></tr>)}
                </tbody>
              </table>
            </div>
            <div>
              <p className="text-[11px] font-semibold uppercase tracking-wide text-slate-400 mb-1.5">Los {Math.min(8, noDeducibles.length)} mayores</p>
              <div className="space-y-1.5">
                {noDeducibles.slice(0, 8).map((g) => (
                  <div key={g.id} className="flex items-center justify-between gap-3 text-sm border-b border-slate-50 pb-1.5">
                    <span className="truncate text-ink-700">{g.descripcion} <span className="text-xs text-slate-400">· {formatDate(g.fecha)}</span></span>
                    <span className="shrink-0 font-medium text-slate-600">{formatCurrency(g.importe)}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div className="lg:col-span-2 bg-white rounded-2xl border border-slate-100 shadow-card p-5">
          <h3 className="text-sm font-semibold text-ink-800 mb-3">Pagos recibidos en {year}</h3>
          {pagosDelAnio.length === 0 ? <EmptyState icon={Icons.Euro} title="Sin pagos registrados este año" /> : (
            <div className="space-y-2 max-h-96 overflow-y-auto">
              {pagosDelAnio.map((p) => {
                const factura = facturaById[p.facturaId];
                return (
                  <div key={p.id} className="flex items-center gap-3 text-sm border-b border-slate-50 pb-2">
                    <Icons.Euro className="w-4 h-4 text-emerald-500 shrink-0" />
                    <div className="min-w-0 flex-1">
                      <p className="text-ink-700 truncate">{factura ? `Factura ${factura.numero}` : 'Factura'} — {(clienteById[factura?.clienteId] || {}).nombre || ''}</p>
                      <p className="text-xs text-slate-400">{formatDate(p.fecha)} · {ESTADO_LABELS[p.metodo] || p.metodo}</p>
                    </div>
                    <span className="font-medium text-emerald-700">{formatCurrency(p.importe)}</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
        <div className="bg-white rounded-2xl border border-slate-100 shadow-card p-5">
          <h3 className="text-sm font-semibold text-ink-800 mb-1">Pendiente de cobro (total)</h3>
          <p className="text-3xl font-bold text-amber-600">{formatCurrency(pendienteCobro)}</p>
          <p className="text-xs text-slate-400 mt-2">Suma de facturas emitidas, con pago parcial o vencidas, sin importar el año.</p>
        </div>
      </div>
    </div>
  );

// ===================== pages/ResumenTrimestral.js =====================
const TRIM_MESES = { 1: 'Enero – marzo', 2: 'Abril – junio', 3: 'Julio – septiembre', 4: 'Octubre – diciembre' };
const TRIM_PLAZO_BASE = { 1: [3, 20], 2: [6, 20], 3: [9, 20], 4: [0, 30] }; // [mes 0-11, día]; el 4.º vence en enero del año siguiente
const FESTIVOS_NACIONALES = ['01-01', '01-06', '05-01', '08-15', '10-12', '11-01', '12-06', '12-08', '12-25'];
// Si el último día cae en sábado, domingo o festivo nacional, pasa al siguiente día hábil
function vencimientoTrimestre(anio, q) {
  const [mes, dia] = TRIM_PLAZO_BASE[q];
  const d = new Date(Date.UTC(q === 4 ? anio + 1 : anio, mes, dia));
  const inhabil = (x) => x.getUTCDay() === 0 || x.getUTCDay() === 6 || FESTIVOS_NACIONALES.includes(x.toISOString().slice(5, 10));
  while (inhabil(d)) d.setUTCDate(d.getUTCDate() + 1);
  return d;
}
function textoVencimiento(anio, q) {
  const d = vencimientoTrimestre(anio, q);
  const base = TRIM_PLAZO_BASE[q];
  const orig = new Date(Date.UTC(q === 4 ? anio + 1 : anio, base[0], base[1]));
  const fmt = d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
  return { fmt, desplazado: d.getTime() !== orig.getTime(), original: orig.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', timeZone: 'UTC' }) };
}
const redondea2 = (n) => Math.round((Number(n || 0) + Number.EPSILON) * 100) / 100;

// Calcula los 4 trimestres de un año: IVA (303) y pago fraccionado acumulado (130) con lo ya pagado en trimestres anteriores
function calcularTrimestres(anio, filasVista, facturas, minoracionTrim, aplicarMinoracion) {
  const porT = {};
  filasVista.filter((f) => Number(f.anio) === anio).forEach((f) => { porT[f.trimestre] = f; });
  let acumRend = 0; let acumRet = 0; let acumIng = 0; let acumGas = 0; let pagadoAntes = 0;
  return [1, 2, 3, 4].map((q) => {
    const v = porT[q] || {};
    const ingresos = Number(v.ingresos_base || 0); const gastos = Number(v.gastos_base || 0);
    const ivaRep = Number(v.iva_repercutido || 0); const ivaSop = Number(v.iva_soportado || 0); const ret = Number(v.retenciones_soportadas || 0);
    const delT = facturas.filter((f) => new Date(f.fechaEmision).getFullYear() === anio && Math.ceil((new Date(f.fechaEmision).getMonth() + 1) / 3) === q);
    const baseConIva = redondea2(delT.filter((f) => !f.sinIva).reduce((a, f) => a + Number(f.subtotal || 0) - Number(f.descuento || 0), 0));
    acumIng += ingresos; acumGas += gastos; acumRend = acumIng - acumGas; acumRet += ret;
    const veinte = redondea2(Math.max(0, acumRend) * 0.20);
    const previo = redondea2(Math.max(0, veinte - pagadoAntes - acumRet));
    const minoracion = aplicarMinoracion ? redondea2(Math.min(previo, Math.max(0, Number(minoracionTrim || 0)))) : 0;
    const pago130 = redondea2(previo - minoracion);
    const r = {
      q, hayDatos: !!porT[q], numFacturas: delT.length, ingresos, gastos, rendimiento: redondea2(ingresos - gastos), ivaRep, ivaSop, ret, baseConIva,
      iva303: redondea2(ivaRep - ivaSop),
      acumIng: redondea2(acumIng), acumGas: redondea2(acumGas), acumRend: redondea2(acumRend), acumRet: redondea2(acumRet), veinte, pagadoAntes: redondea2(pagadoAntes), previo, minoracion, pago130,
    };
    r.reservar = redondea2(Math.max(0, r.iva303) + r.pago130);
    pagadoAntes += pago130;
    return r;
  });
}

function ResumenTrimestral() {
  const toast = useToast();
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [filas, setFilas] = useState([]);
  const [facturas, setFacturas] = useState([]);
  const [empresa, setEmpresa] = useState(null);
  const [anio, setAnio] = useState('');
  const [trim, setTrim] = useState(4);
  const [explicar, setExplicar] = useState(false);
  const [preparar, setPreparar] = useState(false);

  useEffect(() => {
    async function load() {
      try {
        const [{ data, error }, facs, emps] = await Promise.all([
          supabaseClient.from('resumen_trimestral').select('*').order('anio').order('trimestre'),
          api.list('Factura'), api.list('Empresa'),
        ]);
        if (error) throw error;
        const emp = emps[0] || null;
        const desde = emp && emp.fechaAltaActividad ? String(emp.fechaAltaActividad).slice(0, 10) : '';
        setEmpresa(emp);
        setFacturas((facs || []).filter((f) => !['borrador', 'cancelada'].includes(f.estado) && (!desde || String(f.fechaEmision).slice(0, 10) >= desde)));
        setFilas(data || []);
        const anios = Array.from(new Set((data || []).map((f) => f.anio))).sort((a, b) => b - a);
        const hoy = new Date(); const actual = hoy.getFullYear();
        setAnio(String(anios.includes(actual) ? actual : (anios[0] || actual)));
        setTrim(Math.ceil((hoy.getMonth() + 1) / 3));
      } catch (err) { setError(err.message || 'No se pudo cargar el resumen'); }
      setLoading(false);
    }
    load();
  }, []);

  const anios = Array.from(new Set(filas.map((f) => f.anio))).sort((a, b) => b - a);
  const trimestres = anio ? calcularTrimestres(Number(anio), filas, facturas, empresa ? empresa.minoracion130 : 0, !!(empresa && empresa.aplicarMinoracion130)) : [];
  const t = trimestres.find((x) => x.q === trim) || null;
  const minoracionAnual = Number((empresa && empresa.minoracion130) || 0);
  const minoracionPendiente = minoracionAnual === 0 || !(empresa && empresa.aplicarMinoracion130);
  const vence = t ? textoVencimiento(Number(anio), t.q) : null;

  function copiar(valor) {
    const txt = String(valor).replace('.', ',');
    try { navigator.clipboard.writeText(txt); toast(`Copiado: ${txt}`); } catch { toast('No se pudo copiar', 'error'); }
  }

  const Fila = ({ label, value, fuerte, signo }) => (
    <div className={classNames('flex items-baseline justify-between gap-3', fuerte && 'font-semibold text-ink-900 border-t border-slate-200 pt-1.5 mt-1')}>
      <span className="text-sm text-ink-500">{label}</span>
      <span className="text-sm tabular-nums text-ink-800">{signo}{formatCurrency(value)}</span>
    </div>
  );

  function Modelo({ titulo, subtitulo, resultado, children, nota }) {
    return (
      <div className="bg-white rounded-2xl border border-slate-100 shadow-card p-5 flex flex-col">
        <p className="text-xs font-semibold tracking-wide text-slate-400 uppercase">{titulo}</p>
        <p className="text-sm text-ink-500 mt-0.5">{subtitulo}</p>
        <div className="mt-3 space-y-1">{children}</div>
        <div className="mt-auto pt-4">
          <p className="text-2xl font-bold text-ink-900 tabular-nums">{resultado}</p>
          {nota && <p className="text-xs text-slate-400 mt-1">{nota}</p>}
        </div>
      </div>
    );
  }

  return (
    <div className="fade-in max-w-5xl">
      <PageHeader title="Resumen trimestral" subtitle={t ? `${TRIM_MESES[t.q]} de ${anio}` : 'Tus impuestos del trimestre, explicados'}
        action={anios.length > 0 && (
          <Select value={anio} onChange={(e) => setAnio(e.target.value)} className="!py-1.5 !text-sm w-auto">
            {anios.map((a) => <option key={a} value={a}>{a}</option>)}
          </Select>
        )} />

      {error ? (
        <div className="text-rose-600 bg-rose-50 rounded-lg px-4 py-3 text-sm font-medium">{error}</div>
      ) : loading ? <PageLoader /> : anios.length === 0 ? (
        <CardTable><EmptyState icon={Icons.BarChart} title="Sin datos todavía" message="Aún no hay facturas ni gastos en ningún trimestre." /></CardTable>
      ) : t && (
        <div className="space-y-8">
          <div className="flex flex-wrap items-center gap-2">
            {[1, 2, 3, 4].map((q) => (
              <button key={q} type="button" onClick={() => setTrim(q)}
                className={classNames('px-4 py-1.5 rounded-full text-sm font-medium border transition-colors', trim === q ? 'bg-brand-600 text-white border-brand-600' : 'bg-white text-ink-600 border-slate-200 hover:bg-slate-50')}>
                {q}.º trimestre
              </button>
            ))}
            <span className="text-xs text-slate-400 ml-1">Vence el {vence.fmt}{vence.desplazado ? ` (el ${vence.original} no es día hábil)` : ''}</span>
          </div>

          <section>
            <h2 className="text-sm font-semibold text-ink-900 mb-3">1. Tu actividad</h2>
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
              {[
                ['Facturas emitidas', String(t.numFacturas)],
                ['Ingresos sin IVA', formatCurrency(t.ingresos)],
                ['Gastos deducibles', formatCurrency(t.gastos)],

              ].map(([l, v]) => (
                <div key={l} className="bg-white rounded-2xl border border-slate-100 shadow-card px-4 py-3.5">

            </div>
          </section>

          <section>
            <h2 className="text-sm font-semibold text-ink-900 mb-3">2. Impuestos que presentarás antes del {vence.fmt}</h2>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <Modelo titulo="Modelo 303 · IVA" subtitulo={`${formatCurrency(t.ivaRep)} cobrado − ${formatCurrency(t.ivaSop)} de tus gastos`}
                resultado={t.iva303 >= 0 ? formatCurrency(t.iva303) : `${formatCurrency(Math.abs(t.iva303))} a compensar`}
                nota={t.iva303 >= 0 ? 'IVA que has cobrado a clientes y debes entregar a Hacienda.' : 'Sale negativo: no pagas, se compensa en próximos trimestres.'}>
                <Fila label="IVA cobrado a clientes" value={t.ivaRep} />
                <Fila label="IVA pagado en tus gastos" value={t.ivaSop} signo="-" />
              </Modelo>
              <Modelo titulo="Modelo 130 · IRPF" subtitulo="Pago fraccionado (20 % del rendimiento acumulado)"
                resultado={formatCurrency(t.pago130)}
                nota={minoracionPendiente ? 'Minoración pendiente de verificar: si te corresponde (hasta 100 €), indícala en Ajustes y el importe se recalcula.' : (t.pago130 === 0 && t.previo === 0 ? 'Las retenciones que te aplicaron tus clientes ya cubren este pago.' : null)}>
                <Fila label={`20 % de ${formatCurrency(t.acumRend)}`} value={t.veinte} />
                <Fila label="Retenciones que te han aplicado" value={t.acumRet} signo="-" />

              </Modelo>
              {t.q === 4 ? (
                <Modelo titulo="Modelo 390 · Resumen anual" subtitulo="Solo informativo, si corresponde" resultado="Sin pago"
                  nota="Resume el IVA de todo el año. Consulta con tu gestor si debes presentarlo.">
                  <Fila label="IVA cobrado en el año" value={trimestres.reduce((a, x) => a + x.ivaRep, 0)} />
                  <Fila label="IVA de gastos en el año" value={trimestres.reduce((a, x) => a + x.ivaSop, 0)} signo="-" />
                </Modelo>
              ) : (
                <div className="rounded-2xl border border-dashed border-slate-200 px-5 py-5 text-sm text-slate-400">El modelo 390 (resumen anual) solo se prepara tras el 4.º trimestre.</div>
              )}

// ===================== Copia de seguridad y borrado de datos (Ajustes) =====================
const COPIA_TABLAS = [
  ['Cliente', 'clientes'], ['Proveedor', 'proveedores'], ['Producto', 'productos'], ['Proyecto', 'proyectos'], ['Tarea', 'tareas'], ['Lead', 'leads'],
  ['Presupuesto', 'presupuestos'], ['PresupuestoItem', 'presupuestos_lineas'], ['Factura', 'facturas'], ['FacturaItem', 'facturas_lineas'], ['Pago', 'pagos'],
  ['ServicioRecurrente', 'servicios_recurrentes'], ['Gasto', 'gastos'], ['ClienteInteraccion', 'clientes_historial'], ['ClienteAcceso', 'clientes_accesos'], ['Empresa', 'empresa'],
];

function DatosYCopias() {
  const toast = useToast();
  const [exportando, setExportando] = useState(false);
  const [abierto, setAbierto] = useState(false);
  const [texto, setTexto] = useState('');
  const [borrando, setBorrando] = useState(false);
  const [informe, setInforme] = useState(null);

  async function exportarTodo() {
    setExportando(true);
    try {
      for (const [tabla, nombre] of COPIA_TABLAS) {
        const filas = await api.list(tabla);
        if (filas.length === 0) continue;
        // Las contraseñas guardadas de los accesos de cliente no se vuelcan a un fichero de texto plano
        const claves = Array.from(new Set(filas.flatMap((f) => Object.keys(f)))).filter((k) => k !== 'contrasena');
        descargarCSV(nombre, claves.map((k) => ({ titulo: k, valor: (f) => (f[k] !== null && typeof f[k] === 'object' ? JSON.stringify(f[k]) : f[k]) })), filas);
        await new Promise((r) => setTimeout(r, 400));
      }
      toast('Copia exportada: un CSV por listado');
    } catch (err) { toast(err.message || 'No se pudo exportar', 'error'); }
    finally { setExportando(false); }
  }

  async function borrarTodo() {
    setBorrando(true);
    const resultado = [];
    async function borrar(tabla, filtro) {
      try {
        let q = supabaseClient.from(tabla).delete({ count: 'exact' });
        q = filtro ? filtro(q) : q.neq('id', '');
        const { error, count } = await q;
        if (error) throw error;
        resultado.push({ tabla, ok: true, n: count || 0 });
      } catch (err) { resultado.push({ tabla, ok: false, msg: err.message || 'Error' }); }
    }
    try {
      // Las facturas emitidas no se pueden borrar (la base de datos lo impide y hay obligación legal de conservarlas):
      // se conservan junto con lo que referencian (cliente, proyecto, presupuesto), sus líneas y sus pagos.
      const facturas = await api.list('Factura');
      const emitidas = facturas.filter((f) => f.estado !== 'borrador');
      const borradorIds = facturas.filter((f) => f.estado === 'borrador').map((f) => f.id);
      const presupuestos = await api.list('Presupuesto');
      const presKeepIds = new Set(emitidas.map((f) => f.presupuestoId).filter(Boolean));
      const presKeep = presupuestos.filter((p) => presKeepIds.has(p.id));
      const keepClientes = new Set([...emitidas.map((f) => f.clienteId), ...presKeep.map((p) => p.clienteId)].filter(Boolean));
      const keepProyectos = new Set([...emitidas.map((f) => f.proyectoId), ...presKeep.map((p) => p.proyectoId)].filter(Boolean));
      const noEn = (set, col) => (q) => (set.size ? q.not(col || 'id', 'in', `(${[...set].join(',')})`) : q.neq('id', ''));

      for (const tabla of ['Tarea', 'ServicioRecurrente', 'Gasto', 'ClienteInteraccion', 'ClienteAcceso']) await borrar(tabla);
      if (borradorIds.length) {
        await borrar('FacturaItem', (q) => q.in('facturaId', borradorIds));
        await borrar('Factura', (q) => q.eq('estado', 'borrador'));
      }
      await borrar('PresupuestoItem', noEn(presKeepIds, 'presupuestoId'));
      await borrar('Presupuesto', noEn(presKeepIds));
      await borrar('Proyecto', noEn(keepProyectos));
      for (const tabla of ['Lead', 'Producto', 'Proveedor']) await borrar(tabla);
      await borrar('Cliente', noEn(keepClientes));
      setInforme({ resultado, conservadas: emitidas.length, clientes: keepClientes.size });
    } catch (err) {
      toast(err.message || 'No se pudo completar el borrado', 'error');
    } finally { setBorrando(false); }
  }

  function cerrar() { if (borrando) return; setAbierto(false); setTexto(''); setInforme(null); }

  return (
    <div className="mt-6 space-y-4 pb-8">
      <div className="bg-white rounded-2xl border border-slate-100 shadow-card p-5 sm:p-6">
        <h3 className="text-sm font-semibold text-ink-900">Copia de seguridad</h3>
        <p className="text-xs text-slate-500 mt-1">Descarga un CSV por cada listado (clientes, facturas, gastos…). Cada listado también tiene su propio botón "Exportar CSV". Las contraseñas de accesos no se incluyen. El navegador puede pedirte permiso para descargar varios archivos.</p>
        <div className="mt-3"><Button variant="secondary" icon={Icons.Download} onClick={exportarTodo} disabled={exportando}>{exportando ? 'Exportando...' : 'Exportar todos los datos (CSV)'}</Button></div>
      </div>

      <div className="bg-white rounded-2xl border border-rose-200 shadow-card p-5 sm:p-6">
        <h3 className="text-sm font-semibold text-rose-700">Zona de peligro</h3>
        <p className="text-xs text-slate-500 mt-1">Borra clientes, proveedores, productos, proyectos, tareas, leads, presupuestos, gastos, servicios recurrentes y borradores de factura. No se puede deshacer.</p>
        <div className="mt-3"><Button variant="danger" icon={Icons.Trash} onClick={() => setAbierto(true)}>Borrar todos los datos…</Button></div>
      </div>

      <Modal open={abierto} onClose={cerrar} title={informe ? 'Borrado completado' : 'Borrar todos los datos'}>
        {informe ? (
          <div className="space-y-3 text-sm">
            <ul className="divide-y divide-slate-100 border border-slate-200 rounded-lg">
              {informe.resultado.map((r) => (
                <li key={r.tabla} className="flex items-center justify-between px-3 py-1.5">
                  <span className="text-ink-700">{r.tabla}</span>
                  {r.ok ? <span className="text-slate-500">{r.n} eliminados</span> : <span className="text-rose-600 text-xs text-right max-w-[60%]">{r.msg}</span>}
                </li>
              ))}
            </ul>
            {informe.conservadas > 0 && (
              <p className="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
                Se han conservado {informe.conservadas} factura{informe.conservadas === 1 ? '' : 's'} emitida{informe.conservadas === 1 ? '' : 's'} (con sus líneas y pagos) y {informe.clientes} cliente{informe.clientes === 1 ? '' : 's'} vinculado{informe.clientes === 1 ? '' : 's'}: las facturas emitidas no se pueden borrar y hay que conservarlas por ley.
              </p>
            )}
            <p className="text-xs text-slate-400">No se han tocado los datos de Empresa, las categorías, los archivos subidos a proyectos ni los usuarios.</p>
            <div className="flex justify-end"><Button onClick={() => { cerrar(); window.location.reload(); }}>Cerrar</Button></div>
          </div>
        ) : (
          <div className="space-y-4">
            <div className="flex items-start gap-2 text-rose-700 bg-rose-50 rounded-lg px-3.5 py-3 text-sm">
              <Icons.Alert className="w-4 h-4 shrink-0 mt-0.5" />
              <span>Vas a eliminar todos los datos de la aplicación. Esta acción no se puede deshacer. Las facturas emitidas no se borran (hay que conservarlas por ley) y se mantendrán con sus clientes. Exporta antes una copia si la necesitas.</span>
            </div>
            <Field label="Escribe BORRAR para confirmar">
              <Input value={texto} onChange={(e) => setTexto(e.target.value)} autoFocus placeholder="BORRAR" />
            </Field>
            <div className="flex justify-end gap-2">
              <Button variant="secondary" type="button" onClick={cerrar} disabled={borrando}>Cancelar</Button>
              <Button variant="dangerSolid" type="button" disabled={texto.trim() !== 'BORRAR' || borrando} onClick={borrarTodo}>{borrando ? 'Borrando...' : 'Borrar todos los datos'}</Button>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

function Ajustes() {

  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState(null);

  async function load() {
    setLoading(true);
    const rows = await api.list('Empresa');
    setForm(rows[0] || { nombreFiscal: '', nombreComercial: '', retencionPorDefecto: 15 });
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  async function handleSubmit(e) {
    e.preventDefault();
    if (!(form.nombreFiscal || '').trim()) { toast('El nombre fiscal es obligatorio', 'error'); return; }
    if (!(form.nif || '').trim()) { toast('El NIF es obligatorio', 'error'); return; }
    const nifEmpresa = validarNifEspanol(form.nif);
    if (!nifEmpresa.ok) { toast(`Tu NIF no es válido: ${nifEmpresa.msg}`, 'error'); return; }
    if (!(form.direccion || '').trim()) { toast('La dirección es obligatoria', 'error'); return; }
    setSaving(true);
    try {
      const { id, createdAt, ...resto } = form;
      const payload = {
        ...resto,
        retencionPorDefecto: Number(form.retencionPorDefecto ?? 15),
        fechaAltaActividad: form.fechaAltaActividad || null,
        minoracion130: Math.max(0, Number(form.minoracion130 || 0)),
        rendimiento2025: Number(form.rendimiento2025 || 0),
        aplicarMinoracion130: !!form.aplicarMinoracion130,
      };
      if (id) await api.update('Empresa', id, payload);
      else await api.insert('Empresa', payload);
      toast('Datos de la empresa guardados');
      load();
    } catch (err) { toast(err.message || 'Error al guardar', 'error'); }
    finally { setSaving(false); }
  }

  return (

        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <Field label="Nombre y apellidos (nombre fiscal)" required className="sm:col-span-2" hint="Es el que sale en la factura. No pongas aquí 'Creadores Web'.">
            <Input value={form.nombreFiscal || ''} onChange={set('nombreFiscal')} required />
          </Field>
          <Field label="Nombre comercial" className="sm:col-span-2" hint="Se muestra como marca en la factura.">
            <Input value={form.nombreComercial || ''} onChange={set('nombreComercial')} />
          </Field>
          <Field label="NIF / CIF" required hint={avisoNif((form.nif || '').trim() ? validarNifEspanol(form.nif) : null) || 'Tu NIF: se valida la letra de control'}>
            <Input value={form.nif || ''} onChange={(e) => setForm((f) => ({ ...f, nif: e.target.value.toUpperCase() }))} maxLength={15} className="uppercase" required />
          </Field>

          <Field label="Rendimientos de actividades económicas en 2025 (€)" hint="Año anterior. 0 si no tuviste actividad.">
            <Input type="number" step="0.01" value={form.rendimiento2025 ?? 0} onChange={set('rendimiento2025')} />
          </Field>
          <Field label="Minoración trimestral del modelo 130 (€)" hint="Importe máximo por trimestre (p. ej. 100). Nunca deja el resultado por debajo de 0. Confírmalo con tu gestor.">
            <Input type="number" min="0" step="0.01" value={form.minoracion130 ?? 0} onChange={set('minoracion130')} />
          </Field>
          <Field label="Aplicar automáticamente la minoración">
            <Select value={form.aplicarMinoracion130 ? 'si' : 'no'} onChange={(e) => setForm((f) => ({ ...f, aplicarMinoracion130: e.target.value === 'si' }))}>
              <option value="si">Sí</option>
              <option value="no">No</option>
            </Select>
          </Field>
          <Field label="Texto de pie de página" className="sm:col-span-2" hint="Aparece al final de cada PDF">
            <Textarea value={form.notasPie || ''} onChange={set('notasPie')} />
          </Field>
        </div>
        <div className="flex justify-end mt-5">
          <Button type="submit" disabled={saving}>{saving ? 'Guardando...' : 'Guardar cambios'}</Button>
        </div>
      </form>
      <DatosYCopias />
    </div>
  );
}

// Ruta #facturas/:id/imprimir — factura en formato A4 lista para imprimir o guardar como PDF desde el navegador.
const FACTURA_TITULOS = { completa: 'FACTURA', simplificada: 'FACTURA SIMPLIFICADA', rectificativa: 'FACTURA RECTIFICATIVA' };

function formatIban(iban) {
  return String(iban || '').replace(/\s+/g, '').replace(/(.{4})/g, '$1 ').trim();
}

// Hoja A4 de la factura (solo presentación: recibe los datos ya cargados)
function FacturaHoja({ datos }) {
  const { factura, items, cliente, empresa, original, pagos } = datos;
  const tipo = factura.tipoFactura || 'completa';
  const esBorrador = factura.estado === 'borrador';
  const base = Number(factura.subtotal || 0) - Number(factura.descuento || 0);
  const retPct = Number(factura.retencionPorcentaje || 0);
  const retImporte = Number(factura.retencionImporte || 0);
  const tiposIva = Array.from(new Set(items.map((i) => Number(i.iva || 0))));
  const etiquetaIva = tiposIva.length === 1 ? `IVA ${tiposIva[0]} %` : 'IVA';
  const nifCliente = cliente.tipoCliente === 'ue'
    ? (cliente.nifIntracomunitario ? `NIF-IVA: ${cliente.nifIntracomunitario}` : '')
    : (cliente.nif ? `NIF: ${cliente.nif}` : '');
  const ciudad = (c) => [c.codigoPostal, c.poblacion].filter(Boolean).join(' ') + (c.provincia ? ` (${c.provincia})` : '');
  const importePago = retImporte > 0 ? factura.totalATransferir : factura.total;
  const ultimoPago = (pagos || []).slice().sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)))[0];
  const pagada = factura.estado === 'pagada';
  const nombreCliente = cliente.empresa || cliente.nombre;
  const pieEmpresa = [empresa.nombreComercial, empresa.nombreFiscal, empresa.nif ? `NIF ${empresa.nif}` : null,
    [empresa.direccion, [empresa.codigoPostal, empresa.poblacion].filter(Boolean).join(' ')].filter(Boolean).join(', '),
    empresa.email].filter(Boolean).join(' · ');
  const etiqueta = { fontSize: '10px', textTransform: 'uppercase', letterSpacing: '0.12em', color: '#6b7280', fontWeight: 600, marginBottom: '4px' };
  const oscuro = '#111827';

  return (
    <div className="factura-hoja relative bg-white mx-auto shadow-lg text-[13px] overflow-hidden"
      style={{ width: '210mm', minHeight: '296mm', boxSizing: 'border-box', padding: '14mm', display: 'flex', flexDirection: 'column', color: '#1f2937',
        WebkitPrintColorAdjust: 'exact', printColorAdjust: 'exact' }}>
      {esBorrador && (
        <div aria-hidden="true" className="absolute inset-0 flex items-center justify-center pointer-events-none select-none" style={{ zIndex: 0 }}>
          <span style={{ transform: 'rotate(-35deg)', fontSize: '110px', fontWeight: 800, letterSpacing: '0.1em', color: 'rgba(148,163,184,0.16)' }}>BORRADOR</span>
        </div>
      )}

      <div style={{ position: 'relative', zIndex: 1, flex: 1, display: 'flex', flexDirection: 'column' }}>
        {/* 1. Cabecera */}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '24px' }}>
          <img src={LOGO_WORDMARK_DATA_URI} alt={empresa.nombreComercial || ''} style={{ height: '17mm' }} />
          <div style={{ textAlign: 'right' }}>
            <p style={{ fontSize: '20px', fontWeight: 700, letterSpacing: '0.04em', color: oscuro }}>{FACTURA_TITULOS[tipo] || 'FACTURA'}</p>
            <p style={{ marginTop: '2px', fontSize: '15px', fontWeight: 600 }}>{factura.numero || 'BORRADOR'}</p>
            <p style={{ marginTop: '8px', fontSize: '12px', color: '#4b5563' }}>Fecha de emisión: {formatDate(factura.fechaEmision)}</p>
            <p style={{ fontSize: '12px', color: '#4b5563' }}>Fecha de la operación: {formatDate(factura.fechaOperacion || factura.fechaEmision)}</p>
          </div>
        </div>

        {/* 2. Partes: emisor a la izquierda, cliente a la derecha, misma línea */}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', alignItems: 'start', gap: '24px', marginTop: '9mm' }}>
          <div style={{ fontSize: '12px', lineHeight: 1.45 }}>
            <p style={etiqueta}>Emisor</p>
            {empresa.nombreFiscal && <p style={{ fontWeight: 700, fontSize: '13px' }}>{empresa.nombreFiscal}</p>}
            {empresa.nif && <p>NIF: {empresa.nif}</p>}
            {empresa.direccion && <p>{empresa.direccion}</p>}
            {ciudad(empresa).trim() && <p>{ciudad(empresa)}</p>}
            {empresa.email && <p>{empresa.email}</p>}
          </div>
          {tipo !== 'simplificada' ? (
            <div style={{ fontSize: '12px', lineHeight: 1.45, textAlign: 'right' }}>
              <p style={etiqueta}>Cliente</p>
              <p style={{ fontWeight: 700, fontSize: '13px' }}>{nombreCliente}</p>
              {nifCliente && <p>{nifCliente}</p>}
              {cliente.direccion && <p>{cliente.direccion}</p>}
              {ciudad(cliente).trim() && <p>{ciudad(cliente)}</p>}
            </div>
          ) : <div></div>}
        </div>

        {tipo === 'rectificativa' && (
          <p style={{ marginTop: '6mm', fontSize: '12px', border: '1px solid #d1d5db', borderRadius: '4px', padding: '8px 12px' }}>
            Rectifica la factura {original ? (original.numero || 'Borrador') : '—'}.{factura.motivoRectificacion ? ` Motivo: ${factura.motivoRectificacion}` : ''}
          </p>
        )}

        {/* 3. Tabla de conceptos */}
        <table style={{ width: '100%', marginTop: '10mm', borderCollapse: 'collapse', breakInside: 'avoid' }}>
          <thead>
            <tr style={{ borderBottom: `2px solid ${oscuro}`, fontSize: '11px', textTransform: 'uppercase', letterSpacing: '0.04em', color: '#4b5563' }}>
              <th style={{ textAlign: 'left', padding: '6px 0', fontWeight: 600 }}>Concepto</th>
              <th style={{ textAlign: 'right', padding: '6px 0', fontWeight: 600, width: '16mm' }}>Cant.</th>
              <th style={{ textAlign: 'right', padding: '6px 0', fontWeight: 600, width: '28mm' }}>Precio unit.</th>
              <th style={{ textAlign: 'right', padding: '6px 0', fontWeight: 600, width: '16mm' }}>IVA %</th>
              <th style={{ textAlign: 'right', padding: '6px 0', fontWeight: 600, width: '28mm' }}>Importe</th>
            </tr>
          </thead>
          <tbody>
            {items.map((it) => (
              <tr key={it.id} style={{ borderBottom: '1px solid #e5e7eb', verticalAlign: 'top' }}>
                <td style={{ padding: '7px 12px 7px 0' }}>
                  <p style={{ fontWeight: 500 }}>{it.concepto}</p>
                  {it.descripcion && <p style={{ fontSize: '11px', color: '#6b7280' }}>{it.descripcion}</p>}
                  {descuentoLineaTexto(it) && <p style={{ fontSize: '11px', color: '#059669' }}>{descuentoLineaTexto(it)}</p>}
                </td>
                <td style={{ padding: '7px 0', textAlign: 'right' }}>{it.cantidad}</td>
                <td style={{ padding: '7px 0', textAlign: 'right' }}>{formatCurrency(it.precioUnitario)}</td>
                <td style={{ padding: '7px 0', textAlign: 'right' }}>{factura.sinIva ? '—' : `${Number(it.iva || 0)} %`}</td>
                <td style={{ padding: '7px 0', textAlign: 'right', fontWeight: 500 }}>{formatCurrency(calcLineTotal(it))}</td>
              </tr>
            ))}
          </tbody>
        </table>

        {/* 4. Totales */}
        <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: '5mm', breakInside: 'avoid' }}>
          <div style={{ width: '85mm', display: 'flex', flexDirection: 'column', gap: '4px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>Base imponible</span><span>{formatCurrency(base)}</span></div>
            {descuentoTotalLineas(items) > 0 && (
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '12px', color: '#059669' }}><span>Descuentos aplicados</span><span>-{formatCurrency(descuentoTotalLineas(items))}</span></div>
            )}
            {Number(factura.descuento || 0) > 0 && (
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '12px', color: '#6b7280' }}><span>Descuento aplicado</span><span>-{formatCurrency(factura.descuento)}</span></div>
            )}
            {factura.sinIva ? (
              <div>
                <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>Sin IVA</span><span>{formatCurrency(0)}</span></div>
                {factura.mencionIva && <p style={{ fontSize: '10.5px', color: '#6b7280', marginTop: '2px', lineHeight: 1.35 }}>{factura.mencionIva}</p>}
              </div>
            ) : (
              <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>{etiquetaIva}</span><span>{formatCurrency(factura.ivaTotal)}</span></div>
            )}
            {retPct > 0 && (
              <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>Retención IRPF {retPct} %</span><span>-{formatCurrency(retImporte)}</span></div>
            )}
            <div style={{ display: 'flex', justifyContent: 'space-between', borderTop: `1px solid ${oscuro}`, paddingTop: '6px', marginTop: '4px', fontSize: '15px', fontWeight: 700 }}>
              <span>Total</span><span>{formatCurrency(factura.total)}</span>
            </div>
            {retImporte > 0 && (
              <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '6px', padding: '8px 12px', background: '#fee2e2', border: '1.5px solid #f3a5a5', color: '#991b1b', fontSize: '14px', fontWeight: 700 }}>
                <span>Total a transferir</span><span>{formatCurrency(factura.totalATransferir)}</span>
              </div>
            )}
          </div>
        </div>

        {/* 5a. Observaciones de la factura (justo encima de los detalles de pago) */}
        {(factura.notas || '').trim() && (
          <div style={{ marginTop: '8mm', breakInside: 'avoid' }}>
            <p style={{ fontSize: '14px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: '4px' }}>Observaciones</p>
            <p style={{ fontSize: '13.5px', lineHeight: 1.5, whiteSpace: 'pre-line' }}>{factura.notas}</p>
          </div>
        )}

        {/* 5. Detalles de pago (o sello de pagada) */}
        {pagada ? (
          <div style={{ marginTop: '10mm', breakInside: 'avoid' }}>
            <div style={{ display: 'inline-block', border: `2px solid ${oscuro}`, borderRadius: '6px', padding: '10px 18px', fontSize: '15px', fontWeight: 700, color: oscuro }}>
              PAGADA{factura.fechaPago ? ` el ${formatDate(factura.fechaPago)}` : ''}{ultimoPago ? ` · ${METODOS_PAGO[ultimoPago.metodo] || ultimoPago.metodo}` : ''}
            </div>
          </div>
        ) : (
          <div style={{ marginTop: '10mm', border: `2px solid ${oscuro}`, background: '#f4f6f8', borderRadius: '6px', padding: '16px 18px', breakInside: 'avoid' }}>
            <p style={{ fontSize: '13px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.04em', color: oscuro }}>Detalles de pago</p>
            <p style={{ fontSize: '12px', color: '#374151', marginTop: '6px', lineHeight: 1.45 }}>{TEXTO_PAGO_FACTURA}</p>
            <div style={{ marginTop: '10px', border: `1.5px solid ${oscuro}`, background: '#fff', borderRadius: '4px', padding: '10px 14px', fontSize: '14px', fontWeight: 700, lineHeight: 1.7 }}>
              <p style={{ fontVariantNumeric: 'tabular-nums', wordBreak: 'break-word' }}>IBAN {empresa.iban ? formatIban(empresa.iban) : '—'}</p>
              <p>{titularPago(empresa)}</p>
              <p>Concepto: {factura.numero || 'Factura (nº al emitir)'}</p>
              <p>Importe: {formatCurrency(importePago)}</p>
            </div>
          </div>
        )}

        {/* 6. Pie: siempre al final de la hoja */}
        <div style={{ marginTop: 'auto', borderTop: '1px solid #d9dee3', paddingTop: '6mm', textAlign: 'center', fontSize: '11px', color: '#6b7280' }}>
          {empresa.notasPie && <p style={{ whiteSpace: 'pre-line' }}>{empresa.notasPie}</p>}
          {pieEmpresa && <p style={{ fontSize: '9.5px', marginTop: '3px' }}>{pieEmpresa}</p>}
        </div>
      </div>
    </div>
  );
}

function FacturaImprimir({ id, autoPrint }) {
  const [datos, setDatos] = useState(null);
  const [error, setError] = useState('');

  useEffect(() => {
    async function cargar() {
      try {
        const factura = await api.get('Factura', id);
        const [its, cliente, empresas, original, pagos] = await Promise.all([
          api.list('FacturaItem', { order: 'orden', ascending: true }),
          api.get('Cliente', factura.clienteId),
          api.list('Empresa'),
          factura.facturaRectificadaId ? api.get('Factura', factura.facturaRectificadaId) : Promise.resolve(null),
          api.list('Pago', { order: 'fecha', ascending: false }),
        ]);
        setDatos({ factura, items: its.filter((i) => i.facturaId === id), cliente, empresa: empresas[0] || {}, original, pagos: pagos.filter((p) => p.facturaId === id) });
      } catch (err) { setError(err.message || 'No se pudo cargar la factura'); }
    }
    cargar();
  }, [id]);

  useEffect(() => {
    if (!datos) return undefined;
    const anterior = document.title;
    document.title = `Factura ${datos.factura.numero || 'Borrador'}`;
    let t;
    if (autoPrint) t = setTimeout(() => window.print(), 600);
    return () => { document.title = anterior; if (t) clearTimeout(t); };
  }, [datos]);

  if (error) return <div className="min-h-screen flex items-center justify-center text-rose-600 text-sm">{error}</div>;
  if (!datos) return <PageLoader />;

  return (
    <div className="factura-pagina bg-slate-100 min-h-screen py-6">
      <style>{`
        @page { size: A4; margin: 0; }
        .factura-hoja, .factura-hoja * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        @media screen and (max-width: 600px) { .pago-grid { grid-template-columns: 1fr 1fr !important; } }
        @media print {
          html, body { background: #fff !important; margin: 0 !important; }
          .no-print { display: none !important; }
          .factura-pagina { background: #fff !important; padding: 0 !important; min-height: 0 !important; }
          .factura-hoja { box-shadow: none !important; margin: 0 !important; height: 296mm !important; min-height: 0 !important; overflow: hidden !important; }
        }
      `}</style>

      <div className="no-print max-w-[210mm] mx-auto mb-4 flex justify-between items-center px-2">
        <button type="button" onClick={() => { window.location.hash = 'facturas'; }} className="text-sm text-brand-600 hover:underline">← Volver a facturas</button>
        <Button size="sm" icon={Icons.Print} onClick={() => window.print()}>Imprimir / PDF</Button>
      </div>

      <FacturaHoja datos={datos} />
    </div>
  );
}

// ===================== App.js =====================
function getRouteFromHash() {
  const h = (window.location.hash || '').replace('#', '').trim();
  return h || 'dashboard';
}

function AppShell({ session }) {
  const [route, setRoute] = useState(getRouteFromHash());
  const [navParams, setNavParams] = useState(null);

  useEffect(() => {
    function onHashChange() { setRoute(getRouteFromHash()); }
    window.addEventListener('hashchange', onHashChange);
    return () => window.removeEventListener('hashchange', onHashChange);
  }, []);

  function navigate(key, params) {
    window.location.hash = key;
    setRoute(key);
    setNavParams(params || null);
  }

  async function handleLogout() {
    await supabaseClient.auth.signOut();
  }

  function renderPage() {
    switch (route) {
      case 'dashboard': return <Dashboard navigate={navigate} />;
      case 'tareas': return <Tareas navigate={navigate} />;
      case 'calendario': return <Calendario navigate={navigate} />;
      case 'clientes': return <Clientes />;
      case 'leads': return <Leads navigate={navigate} />;
      case 'proyectos': return <Proyectos navigate={navigate} />;
      case 'presupuestos': return <Presupuestos prefill={navParams} onConsumePrefill={() => setNavParams(null)} navigate={navigate} />;
      case 'facturas': return <Facturas prefill={navParams} onConsumePrefill={() => setNavParams(null)} />;
      case 'recurrentes': return <ServiciosRecurrentes />;
      case 'productos': return <Productos />;
      case 'proveedores': return <Proveedores />;
      case 'gastos': return <Gastos key="gastos" modo="deducible" />;
      case 'gastosnd': return <Gastos key="gastosnd" modo="no_deducible" />;
      case 'archivofacturas': return <ArchivoFacturas />;
      case 'contabilidad': return <Contabilidad />;
      case 'resumen': return <ResumenTrimestral />;
      case 'ajustes': return <Ajustes />;
      default: return <Dashboard navigate={navigate} />;
    }
  }

  // Página de impresión de factura: sin menú lateral ni cabecera de la app
  const imprimir = route.match(/^facturas\/([^/?]+)\/imprimir(\?.*)?$/);
  if (imprimir) return <FacturaImprimir id={imprimir[1]} autoPrint={/[?&]print=1/.test(imprimir[2] || '')} />;

  return (
    <Layout current={route} navigate={navigate} userEmail={session.user.email} onLogout={handleLogout}>
      {renderPage()}
    </Layout>
  );
}

function App() {
  const [session, setSession] = useState(undefined); // undefined = cargando, null = sin sesión
  const [recovering, setRecovering] = useState(RECOVERY_IN_URL);

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = supabaseClient.auth.onAuthStateChange((event, sess) => {
      if (event === 'PASSWORD_RECOVERY') setRecovering(true);
      setSession(sess);
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  if (session === undefined) {
    return <div className="min-h-screen flex items-center justify-center bg-ink-900"><Spinner className="w-8 h-8 border-white/30 border-t-white" /></div>;
  }
  if (recovering && session) return <ResetPasswordForm onDone={() => setRecovering(false)} />;
  if (!session) return <Login />;

  return (
    <ToastProvider>
      <AppShell session={session} />
    </ToastProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// PWA: registra el service worker (solo en https o localhost)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

</script>
