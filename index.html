function PresupuestoForm({ initial, clientes, proyectos, productos, existentesNumeros, prefillClienteId, onClienteCreado, onClienteActualizado, onProductoCreado, onCancel, onSaved }) {
  const toast = useToast();
  const [saving, setSaving] = useState(true);
  const [header, setHeader] = useState(null);
  const [items, setItems] = useState([]);
  const [descuento, setDescuento] = useState(0);
  const [retencionPorDefecto, setRetencionPorDefecto] = useState(15);

  useEffect(() => {
    api.list('Empresa').then((rows) => { if (rows[0] && rows[0].retencionPorDefecto != null) setRetencionPorDefecto(Number(rows[0].retencionPorDefecto)); }).catch(() => {});
  }, []);

  useEffect(() => {
    async function init() {
      if (initial) {
        setHeader({
          ...initial,
          fechaEmision: toDateInput(initial.fechaEmision) || toDateInput(new Date()),
          fechaValidez: toDateInput(initial.fechaValidez),
        });
        setDescuento(initial.descuento || 0);
        const its = await api.list('PresupuestoItem', { order: 'orden', ascending: true });
        setItems(its.filter((i) => i.presupuestoId === initial.id).map((i) => ({ ...i, _key: i.id })));
      } else {
        setHeader({
          numero: nextNumero('PRE', existentesNumeros), clienteId: prefillClienteId || '', proyectoId: '', estado: 'borrador',
          fechaEmision: toDateInput(new Date()), fechaValidez: '', condiciones: '', retencionManual: false, retencionPorcentaje: 0,
        });
        setItems([]);
      }
      setSaving(false);
    }
    init();
  }, [initial]);

  const set = (k) => (e) => setHeader((f) => ({ ...f, [k]: e.target.value }));

  const clienteSel = header ? clientes.find((c) => c.id === header.clienteId) : null;
  const fiscal = calcFiscalidad({
    items, descuento, tipoCliente: clienteSel ? clienteSel.tipoCliente : null, retencionPorDefecto,
    retencionManual: header && header.retencionManual, retencionPorcentaje: header && header.retencionPorcentaje,
  });

  useEffect(() => {
    if (fiscal.sinIva) setItems((its) => (its.some((it) => Number(it.iva || 0) !== 0) ? its.map((it) => ({ ...it, iva: 0 })) : its));
    // eslint-disable-next-line
  }, [fiscal.sinIva, items.length]);

  async function cambiarTipoCliente(e) {
    const tipo = e.target.value || null;
    try {
      const actualizado = await api.update('Cliente', clienteSel.id, { tipoCliente: tipo, ...(tipo !== 'ue' ? { nifIntracomunitario: null } : {}) });
      onClienteActualizado && onClienteActualizado(actualizado);
      toast('Tipo de cliente actualizado');
    } catch (err) { toast(err.message || 'No se pudo cambiar el tipo de cliente', 'error'); }
  }

  async function handleSubmit(e) {
    e.preventDefault();
    if (!header.clienteId) { toast('Selecciona un cliente', 'error'); return; }
    if (items.length === 0) { toast('Añade al menos una línea', 'error'); return; }
    setSaving(true);
    try {
      const payload = {
        numero: header.numero, estado: header.estado, clienteId: header.clienteId,
        proyectoId: header.proyectoId || null, fechaEmision: header.fechaEmision || null,
        fechaValidez: header.fechaValidez || null,
        subtotal: fiscal.subtotal, ivaTotal: fiscal.ivaTotal, descuento: Number(descuento || 0), total: fiscal.total,
        retencionManual: !!header.retencionManual,
      };
      if (header.condiciones && header.condiciones.trim()) payload.condiciones = header.condiciones;
      if (header.retencionManual) payload.retencionPorcentaje = Number(header.retencionPorcentaje || 0);
      let id = header.id;
      if (id) {
        await api.update('Presupuesto', id, payload);
        await api.removeWhere('PresupuestoItem', 'presupuestoId', id);
      } else {
        const created = await api.insert('Presupuesto', payload);
        id = created.id;
      }
      const itemsPayload = items.map((it, idx) => ({
        presupuestoId: id, concepto: it.concepto, descripcion: it.descripcion || '',
        cantidad: Number(it.cantidad || 0), precioUnitario: Number(it.precioUnitario || 0),
        descuentoPct: Number(it.descuentoPct || 0), descuentoImporte: Number(it.descuentoImporte || 0),
        iva: fiscal.sinIva ? 0 : Number(it.iva || 0), orden: idx,
      }));
      if (itemsPayload.length) {
        const { error } = await supabaseClient.from('PresupuestoItem').insert(itemsPayload);
        if (error) throw error;
      }
      const guardado = await api.get('Presupuesto', id);
      const esNuevo = !initial;
      toast(`${header.id ? 'Presupuesto actualizado' : 'Presupuesto creado'}. A transferir según la base de datos: ${formatCurrency(guardado.totalATransferir)}`);
      if (Math.abs(Number(guardado.totalATransferir) - fiscal.aTransferir) > 0.01) {
        toast(`Aviso: el cálculo en pantalla (${formatCurrency(fiscal.aTransferir)}) no coincide con el de la base de datos (${formatCurrency(guardado.totalATransferir)})`, 'error');
      }
      if (esNuevo) {
        try {
          const clienteObj = clientes.find((c) => c.id === header.clienteId);
          const empresaRows = await api.list('Empresa');
          const empresaObj = empresaRows[0];
          const pdfDoc = generateDocumentoPDF('Presupuesto', { ...guardado, numero: header.numero }, items, clienteObj, empresaObj);
          const filename = `Presupuesto_${header.numero}.pdf`;
          pdfDoc.save(filename);
          if (clienteObj?.email) {
            const asunto = `Presupuesto ${header.numero} - ${empresaObj?.nombreFiscal || 'Creadores Web'}`;
            const cuerpo = `Hola ${clienteObj.nombre},\n\nAdjunto el presupuesto ${header.numero} por un importe a transferir de ${formatCurrency(guardado.totalATransferir)}.\nSe acaba de descargar el PDF (${filename}); adjúntalo antes de enviar este correo.\n\nUn saludo.`;
            window.open(mailtoLink(clienteObj.email, asunto, cuerpo), '_blank');
            toast('PDF descargado y correo abierto: adjunta el PDF antes de enviarlo', 'info');
          } else {
            toast('PDF descargado. Este cliente no tiene email para prellenar el correo', 'info');
          }
        } catch (pdfErr) {
          toast('El presupuesto se guardó, pero no se pudo generar el PDF', 'error');
        }
      }
      onSaved();
    } catch (err) { toast(err.message || 'Error al guardar', 'error'); }
    finally { setSaving(false); }
  }

  if (!header) return <PageLoader />;

  return (
    <form onSubmit={handleSubmit}>
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
        <Field label="Número"><Input value={header.numero} onChange={set('numero')} /></Field>
        <Field label="Cliente" required className="sm:col-span-2">
          <ClienteSelect value={header.clienteId} clientes={clientes} onChange={(v) => setHeader((f) => ({ ...f, clienteId: v }))} onCreado={onClienteCreado} required />
        </Field>
        <Field label="Estado">
          <Select value={header.estado} onChange={set('estado')}>
            <option value="borrador">Borrador</option><option value="enviado">Enviado</option>
            <option value="aceptado">Aceptado</option><option value="facturado">Facturado</option><option value="rechazado">Rechazado</option><option value="caducado">Caducado</option>
          </Select>
        </Field>
        <Field label="Proyecto (opcional)">
          <ProyectoSelect value={header.proyectoId || ''} proyectos={proyectos} clienteId={header.clienteId} onChange={(v) => setHeader((f) => ({ ...f, proyectoId: v }))} />
        </Field>
        <Field label="Fecha de emisión"><Input type="date" value={header.fechaEmision || ''} onChange={set('fechaEmision')} /></Field>
        <Field label="Válido hasta"><Input type="date" value={header.fechaValidez || ''} onChange={set('fechaValidez')} /></Field>
        <Field label="Condiciones"><Input value={header.condiciones || ''} onChange={set('condiciones')} placeholder={header.id ? '' : 'Vacío = texto por defecto'} /></Field>
      </div>

      <LineItemsEditor items={items} setItems={setItems} productos={productos} onProductoCreado={onProductoCreado} sinIva={fiscal.sinIva} />
      <TotalsSummary items={fiscal.sinIva ? items.map((it) => ({ ...it, iva: 0 })) : items} descuento={descuento} setDescuento={setDescuento} />

      {clienteSel && (
        <div className="mt-4 space-y-3">
          {!clienteSel.tipoCliente && (
            <div className="flex items-center gap-2 text-rose-600 bg-rose-50 rounded-lg px-3.5 py-2.5 text-sm font-medium">
              <Icons.Alert className="w-4 h-4 shrink-0" /> Elige el tipo de cliente antes de enviar el presupuesto
            </div>
          )}
          <div className="flex justify-end">
            <div className="w-full sm:w-96 space-y-3">
              <Field label="Tipo de cliente" hint={clienteSel.tipoCliente === 'ue' && !clienteSel.nifIntracomunitario ? 'Falta el NIF-IVA intracomunitario: complétalo en la ficha del cliente.' : CLIENTE_TIPO_AYUDA[clienteSel.tipoCliente]}>
                <Select value={clienteSel.tipoCliente || ''} onChange={cambiarTipoCliente}>
                  <option value="">Selecciona un tipo</option>
                  {Object.entries(CLIENTE_TIPOS).map(([k, label]) => <option key={k} value={k}>{label}</option>)}
                </Select>
              </Field>
              <Field label="Retención de IRPF">
                <Select value={String(fiscal.pct)}
                  onChange={(e) => setHeader((f) => ({ ...f, retencionManual: true, retencionPorcentaje: Number(e.target.value) }))}>
                  <option value="15">15 %</option><option value="7">7 %</option><option value="0">0 %</option>
                </Select>
              </Field>
              <ResumenFiscal r={fiscal} origen="Cálculo en pantalla; al guardar lo recalcula la base de datos" />
            </div>
          </div>
        </div>
      )}

      <div className="flex justify-end gap-2 mt-5">
        <Button variant="secondary" type="button" onClick={onCancel}>Cancelar</Button>
        <Button type="submit" disabled={saving}>{saving ? 'Guardando...' : 'Guardar presupuesto'}</Button>
      </div>
    </form>
  );
}

function PresupuestoDetail({ presupuesto, clienteById, navigate, onClose, onEdit, onChanged }) {
  const toast = useToast();
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [converting, setConverting] = useState(false);
  const [creandoProyecto, setCreandoProyecto] = useState(false);

  useEffect(() => {
    async function load() {
      setLoading(true);
      const its = await api.list('PresupuestoItem', { order: 'orden', ascending: true });
      setItems(its.filter((i) => i.presupuestoId === presupuesto.id));
      setLoading(false);
    }
    load();
  }, [presupuesto.id]);

  async function cambiarEstado(estado) {
    await api.update('Presupuesto', presupuesto.id, { estado });
    toast('Estado actualizado');
    onChanged();
  }

  async function descargarPDF() {
    try {
      const empresaRows = await api.list('Empresa');
      const cliente = clienteById[presupuesto.clienteId];
      const pdfDoc = generateDocumentoPDF('Presupuesto', presupuesto, items, cliente, empresaRows[0]);
      pdfDoc.save(`Presupuesto_${presupuesto.numero}.pdf`);
    } catch (err) { toast('No se pudo generar el PDF', 'error'); }
  }

  async function crearFactura() {
    setConverting(true);
    try {
      const { data, error } = await supabaseClient.rpc('crear_factura_desde_presupuesto', { p_presupuesto_id: presupuesto.id });
      if (error) await manejarError(error);
      toast('Factura creada a partir de este presupuesto');
      onChanged();
      onClose();
      if (navigate) navigate('facturas', { facturaId: data.id });
    } catch (err) { toast(err.message || 'Error al crear la factura', 'error'); }
    finally { setConverting(false); }
  }

  const resumenBD = {
    base: Number(presupuesto.subtotal || 0) - Number(presupuesto.descuento || 0), ivaTotal: Number(presupuesto.ivaTotal || 0),
    sinIva: !!presupuesto.sinIva, mencionIva: presupuesto.mencionIva, pct: Number(presupuesto.retencionPorcentaje || 0),
    retencion: Number(presupuesto.retencionImporte || 0), total: Number(presupuesto.total || 0), aTransferir: Number(presupuesto.totalATransferir || 0), descuentosLineas: descuentoTotalLineas(items),
  };

  async function crearProyecto() {
    setCreandoProyecto(true);
    try {
      const cliente = clienteById[presupuesto.clienteId];
      const nombre = (items[0] && items[0].concepto ? items[0].concepto : 'Proyecto') + (cliente ? ' - ' + cliente.nombre : '');
      const nuevo = await api.insert('Proyecto', {
        nombre, clienteId: presupuesto.clienteId, estado: 'pendiente', prioridad: 'media', progreso: 0,
        presupuestoTotal: presupuesto.total, fechaInicio: toDateInput(new Date()),
        notas: `Creado a partir del presupuesto ${presupuesto.numero}.`,
      });
      await api.update('Presupuesto', presupuesto.id, {
        proyectoId: nuevo.id, estado: ['aceptado', 'facturado'].includes(presupuesto.estado) ? presupuesto.estado : 'aceptado',
      });
      toast(`Proyecto "${nombre}" creado`);
      onChanged();
      onClose();
      if (navigate) navigate('proyectos');
    } catch (err) { toast(err.message || 'Error al crear el proyecto', 'error'); }
    finally { setCreandoProyecto(false); }
  }

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <p className="text-xs text-slate-400">Cliente</p>
          <p className="font-semibold text-ink-900">{(clienteById[presupuesto.clienteId] || {}).nombre || '—'}</p>
        </div>
        <EstadoBadge estado={presupuesto.estado} />
      </div>
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
        <div><p className="text-xs text-slate-400">Emisión</p><p className="font-medium">{formatDate(presupuesto.fechaEmision)}</p></div>
        <div><p className="text-xs text-slate-400">Válido hasta</p><p className="font-medium">{formatDate(presupuesto.fechaValidez)}</p></div>
        <div><p className="text-xs text-slate-400">Subtotal</p><p className="font-medium">{formatCurrency(presupuesto.subtotal)}</p></div>
        <div><p className="text-xs text-slate-400">Total</p><p className="font-bold text-ink-900">{formatCurrency(presupuesto.total)}</p></div>
      </div>
      {loading ? <PageLoader /> : (
        <div className="border border-slate-200 rounded-lg overflow-hidden overflow-x-auto">
          <table className="w-full min-w-[480px] text-sm">
            <thead className="bg-slate-50 text-slate-400"><tr><Th>Concepto</Th><Th className="text-right">Cant.</Th><Th className="text-right">Precio</Th><Th className="text-right">IVA</Th><Th className="text-right">Total c/IVA</Th></tr></thead>
            <tbody className="divide-y divide-slate-100">
              {items.map((it) => (
                <tr key={it.id}><Td>{it.concepto}</Td><Td className="text-right">{it.cantidad}</Td><Td className="text-right">{formatCurrency(it.precioUnitario)}</Td><Td className="text-right">{it.iva}%</Td><Td className="text-right font-medium">{formatCurrency(calcLineTotal(it) * (1 + Number(it.iva || 0) / 100))}</Td></tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      <div className="flex justify-end"><div className="w-full sm:w-96"><ResumenFiscal r={resumenBD} origen="Calculado por la base de datos" /></div></div>
      <div className="flex flex-wrap gap-2 pt-2 border-t border-slate-100">
        {presupuesto.estado === 'borrador' && <Button size="sm" variant="secondary" onClick={() => cambiarEstado('enviado')}>Marcar como enviado</Button>}
        {['borrador', 'enviado'].includes(presupuesto.estado) && <Button size="sm" variant="secondary" onClick={() => cambiarEstado('aceptado')}>Marcar como aceptado</Button>}
        {['borrador', 'enviado'].includes(presupuesto.estado) && <Button size="sm" variant="danger" onClick={() => cambiarEstado('rechazado')}>Marcar como rechazado</Button>}
        {presupuesto.estado === 'aceptado' && <Button size="sm" icon={Icons.Receipt} onClick={crearFactura} disabled={converting}>{converting ? 'Creando...' : 'Crear factura'}</Button>}
        {presupuesto.proyectoId ? (
          <Button size="sm" variant="secondary" icon={Icons.Briefcase} onClick={() => { onClose(); if (navigate) navigate('proyectos'); }}>Ver proyecto</Button>
        ) : (
          <Button size="sm" variant="secondary" icon={Icons.Briefcase} onClick={crearProyecto} disabled={creandoProyecto}>{creandoProyecto ? 'Creando...' : 'Crear proyecto'}</Button>
        )}
        <Button size="sm" variant="secondary" icon={Icons.Download} onClick={descargarPDF}>Descargar PDF</Button>
        <Button size="sm" variant="ghost" icon={Icons.Print} onClick={() => window.print()}>Imprimir</Button>
        <Button size="sm" variant="ghost" icon={Icons.Edit} onClick={onEdit}>Editar</Button>
      </div>
    </div>
  );
}

function Presupuestos({ prefill, onConsumePrefill, navigate }) {
  const toast = useToast();
  const [loading, setLoading] = useState(true);
  const [items, setItems] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [proyectos, setProyectos] = useState([]);
  const [productos, setProductos] = useState([]);
  const [search, setSearch] = useState('');
  const [filterEstado, setFilterEstado] = useState('todos');
  const [modal, setModal] = useState(null);
  const [detail, setDetail] = useState(null);
  const [toDelete, setToDelete] = useState(null);
  const [sort, setSort] = useState({ key: null, dir: 'asc' });
  const onSort = (key) => setSort((s) => toggleSort(s, key));

  useEffect(() => {
    if (prefill && prefill.clienteId) {
      setModal({ mode: 'new', prefillClienteId: prefill.clienteId });
      onConsumePrefill && onConsumePrefill();
    }
    // eslint-disable-next-line
  }, [prefill]);

  async function load() {
    setLoading(true);
    const [pr, cl, py, pd] = await Promise.all([
      api.list('Presupuesto'), api.list('Cliente', { order: 'nombre', ascending: true }),
      api.list('Proyecto'), api.list('Producto', { order: 'nombre', ascending: true }),
    ]);
    setItems(pr); setClientes(cl); setProyectos(py); setProductos(pd.filter((p) => p.activo));
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const clienteById = Object.fromEntries(clientes.map((c) => [c.id, c]));
  const filtered = items.filter((p) => {
    if (filterEstado !== 'todos' && p.estado !== filterEstado) return false;
    const q = search.toLowerCase();
    if (!q) return true;
    return [p.numero, (clienteById[p.clienteId] || {}).nombre].filter(Boolean).some((v) => v.toLowerCase().includes(q));
  });
  const sorted = sortRows(filtered, sort, {
    numero: (p) => p.numero,
    cliente: (p) => (clienteById[p.clienteId] || {}).empresa || (clienteById[p.clienteId] || {}).nombre,
    subtotal: (p) => Number(p.subtotal || 0),
    fechaEmision: (p) => p.fechaEmision || '',
    total: (p) => Number(p.total || 0),
    aTransferir: (p) => Number(p.totalATransferir || 0),
    estado: (p) => p.estado,
  });

  function handleClienteCreado(c) {
    setClientes((cs) => [...cs, c].sort((a, b) => a.nombre.localeCompare(b.nombre)));
  }
  function handleProductoCreado(p) {
    setProductos((ps) => [...ps, p].sort((a, b) => a.nombre.localeCompare(b.nombre)));
  }

  async function handleDelete() {
    try {
      await api.removeWhere('PresupuestoItem', 'presupuestoId', toDelete.id);
      await api.remove('Presupuesto', toDelete.id);
      toast('Presupuesto eliminado'); setToDelete(null); load();
    } catch (err) { toast('No se pudo eliminar', 'error'); setToDelete(null); }
  }

  async function guardarFechaPresupuesto(p, valor) {
    const actualizado = await api.update('Presupuesto', p.id, { fechaEmision: valor });
    setItems((prev) => prev.map((x) => (x.id === p.id ? { ...x, ...actualizado } : x)));
  }
  async function guardarClientePresupuesto(c, campo, valor) {
    const actualizado = await api.update('Cliente', c.id, { [campo]: valor });
    setClientes((cs) => cs.map((x) => (x.id === c.id ? { ...x, ...actualizado } : x)));
  }

  async function cambiarEstado(p, nuevoEstado) {
    setItems((prev) => prev.map((x) => (x.id === p.id ? { ...x, estado: nuevoEstado } : x)));
    try {
      await api.update('Presupuesto', p.id, { estado: nuevoEstado });
      toast('Estado actualizado');
    } catch (err) {
      setItems((prev) => prev.map((x) => (x.id === p.id ? { ...x, estado: p.estado } : x)));
      toast('No se pudo actualizar el estado', 'error');
    }
  }

  return (
    <div className="fade-in">
      <PageHeader title="Presupuestos" subtitle={`${items.length} presupuestos`}
        action={<div className="flex gap-2">
          <ExportCsvButton nombre="presupuestos" filas={sorted} columnas={[
            { titulo: 'Número', valor: (p) => p.numero }, { titulo: 'Cliente', valor: (p) => csvCliente(clienteById[p.clienteId]) }, { titulo: 'Estado', valor: (p) => p.estado },
            { titulo: 'Fecha emisión', valor: (p) => csvFecha(p.fechaEmision) }, { titulo: 'Válido hasta', valor: (p) => csvFecha(p.fechaValidez) },
            { titulo: 'Subtotal', valor: (p) => Number(p.subtotal || 0) }, { titulo: 'Descuento', valor: (p) => Number(p.descuento || 0) }, { titulo: 'IVA', valor: (p) => Number(p.ivaTotal || 0) },
            { titulo: 'Total', valor: (p) => Number(p.total || 0) }, { titulo: 'Retención IRPF %', valor: (p) => Number(p.retencionPorcentaje || 0) },
            { titulo: 'Retención IRPF', valor: (p) => Number(p.retencionImporte || 0) }, { titulo: 'A transferir', valor: (p) => Number(p.totalATransferir || 0) }]} />
          <Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo presupuesto</Button>
        </div>} />

      <Toolbar search={search} onSearch={setSearch} placeholder="Buscar por número o cliente..."
        right={
          <Select value={filterEstado} onChange={(e) => setFilterEstado(e.target.value)} className="!py-1.5 !text-xs w-auto">
            <option value="todos">Todos los estados</option>
            <option value="borrador">Borrador</option><option value="enviado">Enviado</option>
            <option value="aceptado">Aceptado</option><option value="facturado">Facturado</option><option value="rechazado">Rechazado</option><option value="caducado">Caducado</option>
          </Select>
        } />

      {loading ? <PageLoader /> : filtered.length === 0 ? (
        <CardTable><EmptyState icon={Icons.FileText} title="No hay presupuestos" action={<Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo presupuesto</Button>} /></CardTable>
      ) : (
        <CardTable>
          <table className="w-full min-w-[700px]">
            <thead className="bg-slate-700 text-white"><tr>
              <SortableTh sortKey="fechaEmision" sort={sort} onSort={onSort}>Fecha Emisión</SortableTh>
              <SortableTh sortKey="cliente" sort={sort} onSort={onSort}>Cliente</SortableTh>
              <SortableTh sortKey="subtotal" sort={sort} onSort={onSort} className="text-right">Total sin IVA</SortableTh>
              <SortableTh sortKey="total" sort={sort} onSort={onSort} className="text-right">Total</SortableTh>
              <SortableTh sortKey="aTransferir" sort={sort} onSort={onSort} className="text-right">A transferir</SortableTh>
              <SortableTh sortKey="estado" sort={sort} onSort={onSort}>Estado</SortableTh>
              <Th className="text-right">Acciones</Th>
            </tr></thead>
            <tbody className="divide-y divide-slate-200">
              {sorted.map((p) => (
                <tr key={p.id} className="hover:bg-slate-50/60 cursor-pointer" onClick={() => setDetail(p)}>
                  <Td className="font-medium text-ink-800" onClick={(e) => e.stopPropagation()}>
                    <EditableCell type="date" value={toDateInput(p.fechaEmision)} required display={formatDate(p.fechaEmision)} onSave={(v) => guardarFechaPresupuesto(p, v)} />
                  </Td>
                  <Td onClick={(e) => e.stopPropagation()}>
                    {clienteById[p.clienteId] ? (
                      <>
                        <div className="flex items-center gap-1">
                          <EditableCell value={clienteById[p.clienteId].empresa || clienteById[p.clienteId].nombre || ''} required className="text-ink-800"
                            onSave={(v) => guardarClientePresupuesto(clienteById[p.clienteId], clienteById[p.clienteId].empresa ? 'empresa' : 'nombre', v)} />
                          <EditarClienteBtn cliente={clienteById[p.clienteId]} onSaved={load} />
                        </div>
                        {clienteById[p.clienteId].empresa && (
                          <EditableCell value={clienteById[p.clienteId].nombre || ''} required className="text-xs text-slate-400"
                            onSave={(v) => guardarClientePresupuesto(clienteById[p.clienteId], 'nombre', v)} />
                        )}
                      </>
                    ) : '—'}
                  </Td>
                  <Td className="text-right text-ink-800">{formatCurrency(p.subtotal)}</Td>
                  <Td className="text-right font-semibold text-ink-800">{formatCurrency(p.total)}</Td>
                  <Td className="text-right font-semibold text-brand-700">{formatCurrency(p.totalATransferir)}</Td>
                  <Td onClick={(e) => e.stopPropagation()}>
                    <EstadoSelect estado={p.estado} onChange={(v) => cambiarEstado(p, v)}
                      opciones={['borrador', 'enviado', 'aceptado', 'facturado', 'rechazado', 'caducado']} />
                  </Td>
                  <Td className="text-right" onClick={(e) => e.stopPropagation()}>
                    <div className="flex justify-end gap-1">
                      <button className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500" onClick={() => setModal({ mode: 'edit', item: p })}><Icons.Edit className="w-4 h-4" /></button>
                      <button className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500" onClick={() => setToDelete(p)}><Icons.Trash className="w-4 h-4" /></button>
                    </div>
                  </Td>
                </tr>
              ))}
            </tbody>
          </table>
        </CardTable>
      )}

      <Modal open={!!modal} onClose={() => setModal(null)} title={modal?.mode === 'edit' ? 'Editar presupuesto' : 'Nuevo presupuesto'} size="2xl">
        {modal && <PresupuestoForm initial={modal.mode === 'edit' ? modal.item : null} clientes={clientes} proyectos={proyectos} productos={productos}
          prefillClienteId={modal.prefillClienteId} existentesNumeros={items.map((i) => i.numero)}
          onClienteCreado={handleClienteCreado} onClienteActualizado={(u) => setClientes((cs) => cs.map((c) => (c.id === u.id ? u : c)))} onProductoCreado={handleProductoCreado}
          onCancel={() => setModal(null)} onSaved={() => { setModal(null); load(); }} />}
      </Modal>

      <Modal open={!!detail} onClose={() => setDetail(null)} title={detail ? `Presupuesto ${detail.numero}` : ''} wide>
        {detail && <PresupuestoDetail presupuesto={detail} clienteById={clienteById} navigate={navigate}
          onClose={() => setDetail(null)} onEdit={() => { setModal({ mode: 'edit', item: detail }); setDetail(null); }}
          onChanged={load} />}
      </Modal>

      <ConfirmDialog open={!!toDelete} title="Eliminar presupuesto" danger message={`¿Eliminar el presupuesto "${toDelete?.numero}"?`} onCancel={() => setToDelete(null)} onConfirm={handleDelete} />
    </div>
  );
}

// ===================== pages/Facturas.js =====================
const FACTURA_ESTADOS = {
  borrador: { label: 'Borrador', cls: 'bg-slate-100 text-slate-600 ring-slate-500/20' },
  emitida: { label: 'Emitida', cls: 'bg-blue-50 text-blue-700 ring-blue-600/20' },
  pagada_parcial: { label: 'Pago parcial', cls: 'bg-orange-50 text-orange-700 ring-orange-600/20' },
  pagada: { label: 'Pagada', cls: 'bg-emerald-50 text-emerald-700 ring-emerald-600/20' },
  vencida: { label: 'Vencida', cls: 'bg-rose-50 text-rose-700 ring-rose-600/20' },
  rectificada: { label: 'Rectificada', cls: 'bg-yellow-50 text-yellow-800 ring-yellow-600/20' },
  cancelada: { label: 'Cancelada', cls: 'bg-slate-600 text-white ring-slate-700/30' },
};
const FACTURA_TIPOS = { completa: 'Completa', simplificada: 'Simplificada', rectificativa: 'Rectificativa' };
const METODOS_PAGO = { transferencia: 'Transferencia', tarjeta: 'Tarjeta', bizum: 'Bizum', paypal: 'PayPal', efectivo: 'Efectivo', otro: 'Otro' };

function FacturaEstadoBadge({ estado }) {
  const e = FACTURA_ESTADOS[estado] || { label: estado, cls: 'bg-slate-100 text-slate-600 ring-slate-500/20' };
  return <span className={classNames('inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium ring-1 ring-inset', e.cls)}>{e.label}</span>;
}

// Una factura vencida no es un estado de la base de datos: se deduce de la fecha de vencimiento si sigue 'emitida'.
function conVencida(f) {
  return f.estado === 'emitida' && f.fechaVencimiento && new Date(f.fechaVencimiento) < new Date() ? { ...f, estado: 'vencida' } : f;
}

function FacturaForm({ initial, clientes, proyectos, productos, onClienteCreado, onClienteActualizado, onProductoCreado, onCancel, onSaved }) {
  const toast = useToast();
  const [saving, setSaving] = useState(true);
  const [header, setHeader] = useState(null);
  const [items, setItems] = useState([]);
  const [descuento, setDescuento] = useState(0);
  const [gastosPendientes, setGastosPendientes] = useState([]);
  const [gastosAnadidosIds, setGastosAnadidosIds] = useState([]);

  useEffect(() => {
    async function loadGastos() {
      if (!header || !header.clienteId) { setGastosPendientes([]); return; }
      const todos = await api.list('Gasto');
      setGastosPendientes(todos.filter((g) => g.clienteId === header.clienteId && g.repercutible && !g.facturado && !gastosAnadidosIds.includes(g.id)));
    }
    loadGastos();
    // eslint-disable-next-line
  }, [header && header.clienteId]);

  function anadirGastoALinea(gasto) {
    setItems((its) => [...its, { _key: uid(), concepto: gasto.descripcion, descripcion: 'Gasto repercutido', cantidad: 1, precioUnitario: Number(gasto.importe || 0), iva: 21 }]);
    setGastosAnadidosIds((ids) => [...ids, gasto.id]);
    setGastosPendientes((gs) => gs.filter((g) => g.id !== gasto.id));
  }

  useEffect(() => {
    async function init() {
      if (initial) {
        setHeader({
          ...initial,
          fechaEmision: toDateInput(initial.fechaEmision) || toDateInput(new Date()),
          fechaVencimiento: toDateInput(initial.fechaVencimiento),
        });
        setDescuento(initial.descuento || 0);
        const its = await api.list('FacturaItem', { order: 'orden', ascending: true });
        setItems(its.filter((i) => i.facturaId === initial.id).map((i) => ({ ...i, _key: i.id })));
      } else {
        const fecha = new Date(); const venc = new Date(); venc.setDate(venc.getDate() + 15);
        setHeader({
          clienteId: '', proyectoId: '', tipoFactura: 'completa',
          fechaEmision: toDateInput(fecha), fechaVencimiento: toDateInput(venc), notas: '',
        });
        setItems([]);
      }
      setSaving(false);
    }
    init();
  }, [initial]);

  const set = (k) => (e) => setHeader((f) => ({ ...f, [k]: e.target.value }));

  const clienteSel = header ? clientes.find((c) => c.id === header.clienteId) : null;
  const sinIvaCliente = !!clienteSel && (clienteSel.tipoCliente === 'ue' || clienteSel.tipoCliente === 'fuera_ue');

  useEffect(() => {
    if (sinIvaCliente) setItems((its) => (its.some((it) => Number(it.iva || 0) !== 0) ? its.map((it) => ({ ...it, iva: 0 })) : its));
    // eslint-disable-next-line
  }, [sinIvaCliente, items.length]);

  async function cambiarTipoCliente(e) {
    const tipo = e.target.value || null;
    try {
      const actualizado = await api.update('Cliente', clienteSel.id, { tipoCliente: tipo, ...(tipo !== 'ue' ? { nifIntracomunitario: null } : {}) });
      onClienteActualizado && onClienteActualizado(actualizado);
      toast('Tipo de cliente actualizado');
    } catch (err) { toast(err.message || 'No se pudo cambiar el tipo de cliente', 'error'); }
  }

  async function handleSubmit(e) {
    e.preventDefault();
    if (!header.clienteId) { toast('Selecciona un cliente', 'error'); return; }
    if (items.length === 0) { toast('Añade al menos una línea', 'error'); return; }
    const sinInicio = items.find((it) => it.recurrente && !it.recInicio);
    if (sinInicio) { toast(`Indica la fecha de activación del servicio recurrente «${sinInicio.concepto || 'sin concepto'}»`, 'error'); return; }
    setSaving(true);
    try {
      const itemsCalc = sinIvaCliente ? items.map((it) => ({ ...it, iva: 0 })) : items;
      const { subtotal, ivaTotal, total } = calcTotales(itemsCalc, descuento);
      const payload = {
        clienteId: header.clienteId, tipoFactura: header.tipoFactura || 'completa',
        proyectoId: header.proyectoId || null, fechaEmision: header.fechaEmision || null,
        fechaVencimiento: header.fechaVencimiento || null, notas: header.notas || '',
        subtotal, ivaTotal, descuento: Number(descuento || 0), total,
        beneficioReal: header.beneficioReal === '' || header.beneficioReal === undefined ? null : Number(header.beneficioReal),
      };
      let id = header.id;
      if (id) {
        await api.update('Factura', id, payload);
        await api.removeWhere('FacturaItem', 'facturaId', id);
      } else {
        const created = await api.insert('Factura', payload);
        id = created.id;
      }
      const itemsPayload = items.map((it, idx) => ({
        facturaId: id, concepto: it.concepto, descripcion: it.descripcion || '',
        cantidad: Number(it.cantidad || 0), precioUnitario: Number(it.precioUnitario || 0),
        descuentoPct: Number(it.descuentoPct || 0), descuentoImporte: Number(it.descuentoImporte || 0),
        iva: sinIvaCliente ? 0 : Number(it.iva || 0), orden: idx,
        recurrente: !!it.recurrente, recPeriodicidad: it.recurrente ? (it.recPeriodicidad || 'anual') : null,
        recInicio: it.recurrente ? (it.recInicio || null) : null,
        recPrecio: it.recurrente && it.recPrecio !== '' && it.recPrecio != null ? Number(it.recPrecio) : null,
        recRenovacionAuto: it.recRenovacionAuto !== false, recPrimeraGratis: !!it.recPrimeraGratis,
      }));
      if (itemsPayload.length) {
        const { error } = await supabaseClient.from('FacturaItem').insert(itemsPayload);
        if (error) throw error;
      }
      for (const gastoId of gastosAnadidosIds) {
        await api.update('Gasto', gastoId, { facturado: true });
      }
      // Si la factura ya estaba emitida, registra los servicios recurrentes marcados (sin duplicar los existentes)
      if (initial && initial.estado !== 'borrador') await supabaseClient.rpc('sincronizar_recurrentes_factura', { p_factura_id: id });
      toast(header.id ? 'Factura actualizada' : 'Factura creada');
      onSaved();
    } catch (err) { toast(err.message || 'Error al guardar', 'error'); }
    finally { setSaving(false); }
  }

  if (!header) return <PageLoader />;

  return (
    <form onSubmit={handleSubmit}>
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
        <Field label="Cliente" required className="sm:col-span-2">
          <ClienteSelect value={header.clienteId} clientes={clientes} onChange={(v) => setHeader((f) => ({ ...f, clienteId: v }))} onCreado={onClienteCreado} required />
        </Field>
        <Field label="Proyecto (opcional)">
          <ProyectoSelect value={header.proyectoId || ''} proyectos={proyectos} clienteId={header.clienteId} onChange={(v) => setHeader((f) => ({ ...f, proyectoId: v }))} />
        </Field>
        {header.tipoFactura !== 'rectificativa' && (
          <Field label="Tipo de factura">
            <Select value={header.tipoFactura || 'completa'} onChange={set('tipoFactura')}>
              <option value="completa">Completa</option><option value="simplificada">Simplificada</option>
            </Select>
          </Field>
        )}
        <Field label="Fecha de emisión"><Input type="date" value={header.fechaEmision || ''} onChange={set('fechaEmision')} /></Field>
        <Field label="Fecha de vencimiento"><Input type="date" value={header.fechaVencimiento || ''} onChange={set('fechaVencimiento')} /></Field>
        <Field label="Beneficio real (€)" className="sm:col-span-2 lg:col-span-2">
          <Input type="number" step="0.01" value={header.beneficioReal ?? ''} onChange={set('beneficioReal')} placeholder="Solo informativo, no se contabiliza" />
        </Field>
        <Field label="Observaciones / notas de la factura" hint="Aparecen en la factura, justo encima de los detalles de pago" className="sm:col-span-2 lg:col-span-4"><Textarea rows={2} value={header.notas || ''} onChange={set('notas')} /></Field>
      </div>

      {clienteSel && (
        <div className="mb-4 space-y-2">
          {!clienteSel.tipoCliente && (
            <div className="flex items-center gap-2 text-rose-600 bg-rose-50 rounded-lg px-3.5 py-2.5 text-sm font-medium">
              <Icons.Alert className="w-4 h-4 shrink-0" /> Elige el tipo de cliente antes de emitir la factura
            </div>
          )}
          <Field label="Tipo de cliente" hint={CLIENTE_TIPO_AYUDA[clienteSel.tipoCliente]} className="sm:max-w-xs">
            <Select value={clienteSel.tipoCliente || ''} onChange={cambiarTipoCliente}>
              <option value="">Selecciona un tipo</option>
              {Object.entries(CLIENTE_TIPOS).map(([k, label]) => <option key={k} value={k}>{label}</option>)}
            </Select>
          </Field>
        </div>
      )}
      {sinIvaCliente && <p className="text-xs text-slate-500 mb-4">Cliente {clienteSel.tipoCliente === 'ue' ? 'de la UE' : 'fuera de la UE'}: la factura va sin IVA.</p>}

      {gastosPendientes.length > 0 && (
        <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-4">
          <p className="text-xs font-semibold text-amber-800 mb-2 flex items-center gap-1.5"><Icons.Alert className="w-4 h-4" /> Gastos pendientes de repercutir a este cliente</p>
          <div className="space-y-1.5">
            {gastosPendientes.map((g) => (
              <div key={g.id} className="flex items-center justify-between gap-2 text-sm bg-white rounded-lg px-3 py-2">
                <span className="text-ink-700">{g.descripcion} <span className="text-slate-400">· {formatCurrency(g.importe)}</span></span>
                <Button size="sm" variant="secondary" onClick={() => anadirGastoALinea(g)}>Añadir a la factura</Button>
              </div>
            ))}
          </div>
        </div>
      )}

      <LineItemsEditor items={items} setItems={setItems} productos={productos} onProductoCreado={onProductoCreado} sinIva={sinIvaCliente} permitirRecurrente />
      <TotalsSummary items={sinIvaCliente ? items.map((it) => ({ ...it, iva: 0 })) : items} descuento={descuento} setDescuento={setDescuento} />

      <div className="flex justify-end gap-2 mt-5">
        <Button variant="secondary" type="button" onClick={onCancel}>Cancelar</Button>
        <Button type="submit" disabled={saving}>{saving ? 'Guardando...' : (initial && initial.estado !== 'borrador' ? 'Guardar cambios' : 'Guardar borrador')}</Button>
      </div>
    </form>
  );
}

// Lista de pagos de una factura (solo lectura): el estado de la factura lo actualiza la base de datos con un trigger.
function PagosLista({ pagos, loading }) {
  if (loading) return <PageLoader />;
  if (pagos.length === 0) return <p className="text-xs text-slate-400 text-center py-4">Sin pagos registrados</p>;
  return (
    <div className="border border-slate-200 rounded-lg overflow-hidden overflow-x-auto">
      <table className="w-full min-w-[520px] text-sm">
        <thead className="bg-slate-50 text-slate-400"><tr>
          <Th>Fecha</Th><Th>Método</Th><Th>Referencia</Th><Th className="text-right">Importe</Th><Th className="text-right">Comisión</Th><Th className="text-right">Neto</Th>

          {pagos.map((p) => (

              <Td>{formatDate(p.fecha)}</Td>
              <Td>{METODOS_PAGO[p.metodo] || p.metodo}</Td>
              <Td className="text-slate-500">{p.referencia || '—'}</Td>
              <Td className="text-right font-medium">{formatCurrency(p.importe)}</Td>
              <Td className="text-right text-slate-500">{formatCurrency(p.comision)}</Td>

}

function EmitirFacturaForm({ factura, onCancel, onDone }) {
  const toast = useToast();
  const [cobrada, setCobrada] = useState(false);
  const [form, setForm] = useState({ metodo: 'transferencia', comision: '', referencia: '' });
  const [saving, setSaving] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setSaving(true);
    try {
      const args = { p_factura_id: factura.id };
      if (cobrada) {
        args.p_metodo = form.metodo;
        args.p_comision = Number(form.comision || 0);
        args.p_referencia = form.referencia.trim() || null;
      }
      const { data, error } = await supabaseClient.rpc('emitir_factura', args);
      if (error) await manejarError(error);
      toast(`Factura ${data.numero || ''} emitida`.replace('  ', ' '));
      onDone(data.id);
    } catch (err) { toast(err.message || 'No se pudo emitir la factura', 'error'); }
    finally { setSaving(false); }
  }

  return (
    <form onSubmit={handleSubmit}>
      <p className="text-sm text-ink-600 mb-4">Al emitir se asigna el número de factura y ya no se podrá modificar ni borrar.</p>
      <label className="flex items-center gap-3 cursor-pointer select-none mb-4">
        <button type="button" role="switch" aria-checked={cobrada} onClick={() => setCobrada((v) => !v)}
          className={classNames('relative w-10 h-6 rounded-full transition shrink-0', cobrada ? 'bg-brand-600' : 'bg-slate-300')}>
          <span className={classNames('absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform', cobrada && 'translate-x-4')}></span>
        </button>
        <span className="text-sm font-medium text-ink-800">Ya he cobrado esta factura</span>
      </label>
      {cobrada && <div className="grid grid-cols-1 sm:grid-cols-2 gap-4"><CamposCobro form={form} setForm={setForm} /></div>}
      <div className="flex justify-end gap-2 mt-5">
        <Button variant="secondary" type="button" onClick={onCancel}>Cancelar</Button>
        <Button type="submit" disabled={saving}>{saving ? 'Emitiendo...' : 'Emitir factura'}</Button>
      </div>
    </form>
  );
}

function RecurrenteDesdeItemForm({ item, clienteId, fechaEmision, onCancel, onSaved }) {
  const toast = useToast();
  const base = fechaEmision || toDateInput(new Date());
  const [form, setForm] = useState({
    descripcion: item.concepto,
    precio: Number(item.precioUnitario || 0) * Number(item.cantidad || 1),
    iva: Number(item.iva || 21),
    periodicidad: 'anual',
    fechaInicio: base,
    proximaRenovacion: addMonths(base, PERIODICIDAD_MESES.anual),
    notas: '',
  });
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  function setPeriodicidad(e) {
    const periodicidad = e.target.value;
    setForm((f) => ({ ...f, periodicidad, proximaRenovacion: addMonths(base, PERIODICIDAD_MESES[periodicidad] || 12) }));

  async function handleSubmit(e) {
    e.preventDefault();

    try {
      await api.insert('ServicioRecurrente', {

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">

function FacturaDetail({ factura, facturas, clienteById, onClose, onEdit, onChanged }) {
  const toast = useToast();
  const [items, setItems] = useState([]);
  const [pagos, setPagos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [recurrenteItem, setRecurrenteItem] = useState(null);
  const [accion, setAccion] = useState(null); // 'emitir' | 'cobro' | 'rectificar'
  const [archivo, setArchivo] = useState('no-aplica'); // 'no-aplica' | 'si' | 'no' | 'guardando'
  const [editFechas, setEditFechas] = useState(false);
  const [fEmision, setFEmision] = useState('');
  const [fPago, setFPago] = useState('');
  const [guardandoFechas, setGuardandoFechas] = useState(false);

  useEffect(() => {
    if (!factura.numero || factura.estado === 'borrador' || !factura.enviadaAt) { setArchivo('no-aplica'); return undefined; }
    let vivo = true;
    supabaseClient.storage.from(BUCKET_FACTURAS_CLIENTES).createSignedUrl(rutaArchivoFactura(factura), 60)
      .then(({ error }) => { if (vivo) setArchivo(error ? 'no' : 'si'); });
    return () => { vivo = false; };
  }, [factura.id, factura.numero, factura.estado, factura.enviadaAt]);

  async function archivarAhora() {
    setArchivo('guardando');
    try { await archivarFacturaPDF(factura.id); setArchivo('si'); toast('Copia en PDF archivada'); }
    catch (err) { setArchivo('no'); toast(err.message || 'No se pudo archivar el PDF', 'error'); }
  }

  useEffect(() => {
    async function load() {
      setLoading(true);
      const [its, pgs] = await Promise.all([
        api.list('FacturaItem', { order: 'orden', ascending: true }),
        api.list('Pago', { order: 'fecha', ascending: false }),
      ]);
      setItems(its.filter((i) => i.facturaId === factura.id));
      setPagos(pgs.filter((p) => p.facturaId === factura.id));
      setLoading(false);
    }
    load();
  }, [factura]);

  const esBorrador = factura.estado === 'borrador';
  const esRectificativa = factura.tipoFactura === 'rectificativa';
  const totalCobrado = pagos.reduce((a, p) => a + Number(p.importe || 0), 0);
  const pendiente = Number(factura.totalATransferir || 0) - totalCobrado;
  const puedeCobrar = ['emitida', 'pagada_parcial', 'vencida'].includes(factura.estado) && pendiente > 0.005;
  const puedeRectificar = ['emitida', 'pagada', 'pagada_parcial', 'vencida'].includes(factura.estado) && !esRectificativa;
  const rectificada = esRectificativa && factura.facturaRectificadaId ? (facturas || []).find((f) => f.id === factura.facturaRectificadaId) : null;

  const resumen = {
    base: Number(factura.subtotal || 0) - Number(factura.descuento || 0), ivaTotal: Number(factura.ivaTotal || 0),
    sinIva: !!factura.sinIva, mencionIva: factura.mencionIva, pct: Number(factura.retencionPorcentaje || 0),
    retencion: Number(factura.retencionImporte || 0), total: Number(factura.total || 0), aTransferir: Number(factura.totalATransferir || 0), descuentosLineas: descuentoTotalLineas(items),
  };

  async function descargarPDF() {
    try {
      const empresaRows = await api.list('Empresa');
      const cliente = clienteById[factura.clienteId];
      const pdfDoc = generateDocumentoPDF('Factura', factura, items, cliente, empresaRows[0], { facturaOriginal: rectificada });
      pdfDoc.save(`Factura_${factura.numero || 'Borrador'}.pdf`);
    } catch (err) { toast('No se pudo generar el PDF', 'error'); }
  }

  const enviada = !!factura.enviadaAt;
  const puedeEditarFechas = !esBorrador && !enviada && factura.estado !== 'cancelada';
  const [confirmEnviar, setConfirmEnviar] = useState(false);
  const [confirmBorrar, setConfirmBorrar] = useState(false);
  async function borrarFactura() {
    setConfirmBorrar(false);
    try {
      if (factura.enviadaAt) throw new Error('Una factura enviada al cliente no se puede borrar. Crea una rectificativa.');
      if (!esBorrador) await api.removeWhere('Pago', 'facturaId', factura.id);
      await api.removeWhere('FacturaItem', 'facturaId', factura.id);
      await api.remove('Factura', factura.id);
      if (factura.presupuestoId) { try { await api.update('Presupuesto', factura.presupuestoId, { estado: 'aceptado' }); } catch (e2) { /* sin presupuesto */ } }
      toast(esBorrador ? 'Borrador eliminado' : 'Factura eliminada');
      onClose(); onChanged();
    } catch (err) { toast(err.message || 'No se pudo eliminar', 'error'); }
  }
  async function marcarEnviada() {
    setConfirmEnviar(false);
    try {
      await archivarFacturaPDF(factura.id);
      await api.update('Factura', factura.id, { enviadaAt: new Date().toISOString() });
      toast('Factura marcada como enviada y archivada. Fechas bloqueadas.'); onChanged(factura.id);
    } catch (err) { toast(err.message || 'No se pudo marcar como enviada', 'error'); }
  }
  const pagoFinal = pagos.length ? pagos.reduce((m, p) => (String(p.fecha) > String(m.fecha) ? p : m), pagos[0]) : null;
  function abrirEditarFechas() {
    setFEmision(toDateInput(factura.fechaEmision)); setFPago(toDateInput(factura.fechaPago)); setEditFechas(true);
  }
  async function guardarFechas() {
    if (!fEmision) { toast('La fecha de emisión es obligatoria', 'error'); return; }
    setGuardandoFechas(true);
    try {
      if (fEmision !== toDateInput(factura.fechaEmision)) await api.update('Factura', factura.id, { fechaEmision: fEmision });
      if (factura.estado === 'pagada' && pagoFinal && fPago && fPago !== toDateInput(factura.fechaPago)) await api.update('Pago', pagoFinal.id, { fecha: fPago });
      toast('Fechas actualizadas'); setEditFechas(false); onChanged(factura.id);
    } catch (err) { toast(err.message || 'No se pudieron guardar las fechas', 'error'); }
    setGuardandoFechas(false);
  }

  async function cambiarTipo(e) {
    try {
      await api.update('Factura', factura.id, { tipoFactura: e.target.value });
      toast('Tipo de factura actualizado');
      onChanged(factura.id);
    } catch (err) { toast(err.message || 'No se pudo cambiar el tipo', 'error'); }
  }

  const cliente = clienteById[factura.clienteId] || {};

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <p className="text-xs text-slate-400">Cliente</p>
          <p className="font-semibold text-ink-900">{cliente.empresa || cliente.nombre || '—'}</p>
          {cliente.empresa && <p className="text-xs text-slate-400">{cliente.nombre}</p>}
        </div>
        <div className="flex items-center gap-2">
          <span className="text-xs text-slate-400">{FACTURA_TIPOS[factura.tipoFactura] || factura.tipoFactura}</span>
          <FacturaEstadoBadge estado={factura.estado} />
        </div>
      </div>

      {esRectificativa && (
        <div className="rounded-lg bg-yellow-50 border border-yellow-200 px-3.5 py-2.5 text-sm text-yellow-900">
          <p className="font-semibold">Rectifica la factura {rectificada ? (rectificada.numero || 'Borrador') : '—'}</p>
          {factura.motivoRectificacion && <p className="text-xs mt-0.5">Motivo: {factura.motivoRectificacion}</p>}
        </div>
      )}

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
        <div><p className="text-xs text-slate-400">Número</p><p className="font-medium">{factura.numero || 'Borrador'}</p></div>
        <div><p className="text-xs text-slate-400">Emisión</p>
          {editFechas ? <Input type="date" value={fEmision} onChange={(e) => setFEmision(e.target.value)} className="!py-1 !text-sm" />
            : <p className="font-medium">{formatDate(factura.fechaEmision)}</p>}</div>
        <div><p className="text-xs text-slate-400">Vencimiento</p><p className="font-medium">{formatDate(factura.fechaVencimiento)}</p></div>
        <div><p className="text-xs text-slate-400">Fecha de pago</p>
          {editFechas && factura.estado === 'pagada' && pagoFinal ? <Input type="date" value={fPago} onChange={(e) => setFPago(e.target.value)} className="!py-1 !text-sm" />
            : <p className="font-medium">{factura.fechaPago ? formatDate(factura.fechaPago) : '—'}</p>}</div>
        <div><p className="text-xs text-slate-400">Beneficio real</p><p className="font-medium text-emerald-600">{factura.beneficioReal !== null && factura.beneficioReal !== undefined ? formatCurrency(factura.beneficioReal) : '—'}</p></div>
        {esBorrador && !esRectificativa && (
          <div>
            <p className="text-xs text-slate-400 mb-0.5">Tipo de factura</p>
            <Select value={factura.tipoFactura} onChange={cambiarTipo} className="!py-1 !text-sm">
              <option value="completa">Completa</option><option value="simplificada">Simplificada</option>
            </Select>
          </div>
        )}
      </div>

      {puedeEditarFechas && (
        <div className="flex flex-wrap items-center gap-2 -mt-2">
          {editFechas ? (<>
            <Button onClick={guardarFechas} disabled={guardandoFechas}>{guardandoFechas ? 'Guardando...' : 'Guardar fechas'}</Button>
            <Button variant="secondary" onClick={() => setEditFechas(false)}>Cancelar</Button>
            <span className="text-xs text-slate-400">La fecha de pago se corrige en el último cobro registrado.</span>
          </>) : <button type="button" className="text-sm text-brand-600 hover:underline" onClick={abrirEditarFechas}>Editar fechas de emisión y pago</button>}
        </div>
      )}
      {!esBorrador && factura.estado !== 'cancelada' && (
        <label className={classNames('flex items-center gap-2.5 rounded-lg border px-3.5 py-2.5 text-sm', enviada ? 'bg-slate-50 border-slate-200 text-slate-500' : 'bg-amber-50 border-amber-200 text-amber-900 cursor-pointer')}>
          <input type="checkbox" checked={enviada} disabled={enviada} onChange={() => setConfirmEnviar(true)} className="w-4 h-4 rounded border-amber-300 text-amber-600" />
          <span><span className="font-semibold">Enviada al cliente</span> · {enviada ? 'bloqueada' : 'márcala cuando la hayas enviado: queda bloqueada y archivada. Hasta entonces puedes editarla entera.'}</span>
        </label>
      )}
      {!esBorrador && enviada && <p className="text-xs text-slate-500 -mt-2">🔒 Enviada al cliente el {formatDate(factura.enviadaAt)} · fechas bloqueadas (para corregir, crea una rectificativa).</p>}

      {loading ? <PageLoader /> : (
        <div className="border border-slate-200 rounded-lg overflow-hidden overflow-x-auto">
          <table className="w-full min-w-[540px] text-sm">
            <thead className="bg-slate-50 text-slate-400"><tr><Th>Concepto</Th><Th className="text-right">Cant.</Th><Th className="text-right">Precio</Th><Th className="text-right">IVA</Th><Th className="text-right">Total c/IVA</Th><Th className="w-10"></Th></tr></thead>
            <tbody className="divide-y divide-slate-100">

                      <Icons.Repeat className="w-4 h-4" />

                </tr>

          </table>
        </div>
      )}
      {recurrenteItem && (
        <RecurrenteDesdeItemForm item={recurrenteItem} clienteId={factura.clienteId} fechaEmision={factura.fechaEmision}
          onCancel={() => setRecurrenteItem(null)} onSaved={() => setRecurrenteItem(null)} />
      )}

      <div className="flex justify-end"><div className="w-full sm:w-96"><ResumenFiscal r={resumen} origen="Calculado por la base de datos" /></div></div>

      {!esBorrador && (
        <div>
          <div className="flex items-center justify-between mb-2">
            <h4 className="text-sm font-semibold text-ink-800">Pagos <span className="text-xs font-normal text-slate-400">· cobrado {formatCurrency(totalCobrado)} · pendiente {formatCurrency(Math.max(pendiente, 0))}</span></h4>
          </div>
          <PagosLista pagos={pagos} loading={loading} />
        </div>
      )}

      <div className="flex flex-wrap gap-2 pt-2 border-t border-slate-100">
        {esBorrador && <Button size="sm" icon={Icons.Check} onClick={() => setAccion('emitir')}>Emitir factura</Button>}
        {puedeCobrar && <Button size="sm" icon={Icons.Euro} onClick={() => setAccion('cobro')}>Registrar cobro</Button>}
        {puedeRectificar && <Button size="sm" variant="danger" icon={Icons.Repeat} onClick={() => setAccion('rectificar')}>Rectificar</Button>}
        <Button size="sm" variant="secondary" icon={Icons.Download} onClick={descargarPDF}>Descargar PDF</Button>
        {archivo === 'si' && <Button size="sm" variant="secondary" icon={Icons.FileText} onClick={() => abrirFacturaArchivada(factura).catch(() => toast('No se pudo abrir el PDF archivado', 'error'))}>PDF archivado</Button>}
        {(archivo === 'no' || archivo === 'guardando') && <Button size="sm" variant="secondary" icon={Icons.FileText} onClick={archivarAhora} disabled={archivo === 'guardando'}>{archivo === 'guardando' ? 'Archivando...' : 'Archivar PDF'}</Button>}
        <Button size="sm" variant="ghost" icon={Icons.Print} onClick={() => window.open(`${window.location.pathname}${window.location.search}#facturas/${factura.id}/imprimir?print=1`, '_blank')}>Imprimir / PDF</Button>
        {!enviada && <Button size="sm" variant="danger" icon={Icons.Trash} onClick={() => setConfirmBorrar(true)}>Eliminar</Button>}
        {!enviada && factura.estado !== 'cancelada' && <Button size="sm" variant="ghost" icon={Icons.Edit} onClick={onEdit}>{esBorrador ? 'Editar' : 'Editar factura (líneas, cantidades, fechas)'}</Button>}
      </div>

      <ConfirmDialog open={confirmBorrar} title={esBorrador ? 'Eliminar borrador' : 'Eliminar factura'} danger
        message={esBorrador ? '¿Eliminar este borrador de factura?' : `¿Eliminar la factura ${factura.numero}? Se borran también sus cobros y su número quedará sin usar (hueco en la numeración). No se puede deshacer.`}
        onCancel={() => setConfirmBorrar(false)} onConfirm={borrarFactura} />
      <ConfirmDialog open={confirmEnviar} title="Marcar como enviada" message="Al marcarla como enviada se guarda la copia en PDF en el archivo y se bloquean las fechas de emisión y de cobro. Después solo se puede corregir con una rectificativa. ¿Continuar?"
        onCancel={() => setConfirmEnviar(false)} onConfirm={marcarEnviada} />
      <Modal open={accion === 'emitir'} onClose={() => setAccion(null)} title="Emitir factura">
        {accion === 'emitir' && <EmitirFacturaForm factura={factura} onCancel={() => setAccion(null)} onDone={(id) => { setAccion(null); onChanged(id); }} />}
      </Modal>
      <Modal open={accion === 'cobro'} onClose={() => setAccion(null)} title="Registrar cobro">
        {accion === 'cobro' && <RegistrarCobroForm factura={factura} pendiente={pendiente} onCancel={() => setAccion(null)} onDone={() => { setAccion(null); onChanged(factura.id); }} />}
      </Modal>
      <Modal open={accion === 'rectificar'} onClose={() => setAccion(null)} title="Rectificar factura">
        {accion === 'rectificar' && <RectificarForm factura={factura} onCancel={() => setAccion(null)} onDone={(id) => { setAccion(null); onChanged(id); }} />}
      </Modal>
    </div>
  );
}

function Facturas({ prefill, onConsumePrefill }) {
  const toast = useToast();
  const [loading, setLoading] = useState(true);
  const [items, setItems] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [proyectos, setProyectos] = useState([]);
  const [productos, setProductos] = useState([]);
  const [search, setSearch] = useState('');
  const [filterEstado, setFilterEstado] = useState('todos');
  const [filterYear, setFilterYear] = useState('todos');
  const [modal, setModal] = useState(null);
  const [detail, setDetail] = useState(null);
  const [toDelete, setToDelete] = useState(null);
  const [sort, setSort] = useState({ key: null, dir: 'asc' });
  const onSort = (key) => setSort((s) => toggleSort(s, key));

  async function load() {
    setLoading(true);
    let [fa, cl, py, pd] = await Promise.all([
      api.list('Factura'), api.list('Cliente', { order: 'nombre', ascending: true }),
      api.list('Proyecto'), api.list('Producto', { order: 'nombre', ascending: true }),
    ]);
    fa = fa.map(conVencida);
    setItems(fa); setClientes(cl); setProyectos(py); setProductos(pd.filter((p) => p.activo));
    setLoading(false);
    if (prefill && prefill.facturaId) {
      const nueva = fa.find((f) => f.id === prefill.facturaId);
      if (nueva) setDetail(nueva);
      onConsumePrefill && onConsumePrefill();
    }
  }
  useEffect(() => { load(); }, []);

  const clienteById = Object.fromEntries(clientes.map((c) => [c.id, c]));
  const anios = Array.from(new Set(items.map((f) => (f.fechaEmision || '').slice(0, 4)).filter(Boolean))).sort((a, b) => b.localeCompare(a));
  const filtered = items.filter((f) => {
    if (filterEstado !== 'todos' && f.estado !== filterEstado) return false;
    if (filterYear !== 'todos' && (f.fechaEmision || '').slice(0, 4) !== filterYear) return false;
    const q = search.toLowerCase();
    if (!q) return true;
    return [f.numero, (clienteById[f.clienteId] || {}).nombre, (clienteById[f.clienteId] || {}).empresa].filter(Boolean).some((v) => v.toLowerCase().includes(q));
  });

  async function handleDelete() {
    try {
      if (toDelete.enviadaAt) throw new Error('Una factura enviada al cliente no se puede borrar. Crea una rectificativa.');
      if (toDelete.estado !== 'borrador') await api.removeWhere('Pago', 'facturaId', toDelete.id);
      await api.removeWhere('FacturaItem', 'facturaId', toDelete.id);
      await api.remove('Factura', toDelete.id);
      if (toDelete.presupuestoId) { try { await api.update('Presupuesto', toDelete.presupuestoId, { estado: 'aceptado' }); } catch (e2) { /* sin presupuesto */ } }
      toast(toDelete.estado === 'borrador' ? 'Borrador eliminado' : 'Factura eliminada'); setToDelete(null); load();
    } catch (err) { toast(err.message || 'No se pudo eliminar', 'error'); setToDelete(null); }
  }

  // Recarga el listado y, si se indica, vuelve a leer esa factura de la base de datos y la muestra en el detalle.
  async function refrescar(id) {
    await load();
    if (id) {
      try { setDetail(conVencida(await api.get('Factura', id))); } catch (err) { toast(err.message || 'No se pudo leer la factura', 'error'); }
    }
  }

  function handleClienteCreado(c) {
    setClientes((cs) => [...cs, c].sort((a, b) => a.nombre.localeCompare(b.nombre)));
  }
  function handleProductoCreado(p) {
    setProductos((ps) => [...ps, p].sort((a, b) => a.nombre.localeCompare(b.nombre)));
  }

  const sortGetters = {
    numero: (f) => f.numero || '',
    cliente: (f) => (clienteById[f.clienteId] || {}).empresa || (clienteById[f.clienteId] || {}).nombre,
    tipo: (f) => f.tipoFactura,
    fechaEmision: (f) => f.fechaEmision || '',
    fechaPago: (f) => f.fechaPago || '',
    aTransferir: (f) => Number(f.totalATransferir || 0),
    subtotal: (f) => Number(f.subtotal || 0),
    fechaVencimiento: (f) => f.fechaVencimiento || '',
    total: (f) => Number(f.total || 0),
    estado: (f) => f.estado,
    enviada: (f) => (f.enviadaAt ? 1 : 0),
  };
  const noPagadas = sortRows(filtered.filter((f) => f.estado !== 'pagada'), sort, sortGetters);
  const pagadas = sortRows(filtered.filter((f) => f.estado === 'pagada'), sort, sortGetters);

  const [confirmEnviarF, setConfirmEnviarF] = useState(null);
  async function marcarEnviadaLista() {
    const f = confirmEnviarF; setConfirmEnviarF(null);
    try {
      await archivarFacturaPDF(f.id);
      await api.update('Factura', f.id, { enviadaAt: new Date().toISOString() });
      toast('Factura marcada como enviada y archivada'); load();
    } catch (err) { toast(err.message || 'No se pudo marcar como enviada', 'error'); }
  }

  async function descargarPDFFactura(f) {
    try {
      const [its, empresas, cli, original] = await Promise.all([
        api.list('FacturaItem', { order: 'orden', ascending: true }), api.list('Empresa'), api.get('Cliente', f.clienteId),
        f.facturaRectificadaId ? api.get('Factura', f.facturaRectificadaId) : Promise.resolve(null),
      ]);
      generateDocumentoPDF('Factura', f, its.filter((i) => i.facturaId === f.id), cli, empresas[0] || {}, { facturaOriginal: original }).save(`Factura_${f.numero || 'Borrador'}.pdf`);
    } catch (err) { toast('No se pudo generar el PDF', 'error'); }
  }

  function renderTablaFacturas(lista, emptyTitle) {
    if (lista.length === 0) {
      return <CardTable><EmptyState icon={Icons.Receipt} title={emptyTitle} /></CardTable>;
    }
    return (
      <CardTable>
        <table className="w-full min-w-[1000px]">
          <thead className="bg-slate-700 text-white"><tr>
            <SortableTh sortKey="numero" sort={sort} onSort={onSort}>Nº Factura</SortableTh>
            <SortableTh sortKey="cliente" sort={sort} onSort={onSort}>Nombre del Cliente</SortableTh>
            <SortableTh sortKey="tipo" sort={sort} onSort={onSort}>Tipo</SortableTh>
            <SortableTh sortKey="fechaPago" sort={sort} onSort={onSort}>Fecha de pago</SortableTh>
            <SortableTh sortKey="total" sort={sort} onSort={onSort} className="text-right">Total IVA incluido</SortableTh>
            <Th className="text-right">Beneficio</Th>
            <SortableTh sortKey="estado" sort={sort} onSort={onSort}>Estado</SortableTh>
            <SortableTh sortKey="enviada" sort={sort} onSort={onSort}>Enviada</SortableTh>
            <Th className="text-right">Acciones</Th>
          </tr></thead>
          <tbody className="divide-y divide-slate-200">
            {lista.map((f) => (
              <tr key={f.id} className="hover:bg-slate-50/60 cursor-pointer" onClick={() => setDetail(f)}>
                <Td className={classNames('font-medium', f.numero ? 'text-ink-800' : 'text-slate-400')}>{f.numero || 'Borrador'}</Td>
                <Td>
                  <div className="flex items-center gap-1"><p className="text-ink-800">{(clienteById[f.clienteId] || {}).empresa || (clienteById[f.clienteId] || {}).nombre || '—'}</p><EditarClienteBtn cliente={clienteById[f.clienteId]} onSaved={load} /></div>
                  {(clienteById[f.clienteId] || {}).empresa && <p className="text-xs text-rose-500">{(clienteById[f.clienteId] || {}).nombre}</p>}
                </Td>
                <Td className="text-slate-500">{FACTURA_TIPOS[f.tipoFactura] || f.tipoFactura}</Td>
                <Td>{f.fechaPago ? formatDate(f.fechaPago) : '—'}</Td>
                <Td className="text-right text-ink-800">{formatCurrency(f.total)}</Td>
                <Td className="text-right text-emerald-600">{f.beneficioReal !== null && f.beneficioReal !== undefined ? formatCurrency(f.beneficioReal) : '—'}</Td>
                <Td><FacturaEstadoBadge estado={f.estado} /></Td>
                <Td onClick={(e) => e.stopPropagation()}>
                  {f.estado === 'borrador' || f.estado === 'cancelada' ? <span className="text-slate-300">—</span>
                    : <input type="checkbox" checked={!!f.enviadaAt} disabled={!!f.enviadaAt} title={f.enviadaAt ? `Enviada el ${formatDate(f.enviadaAt)} · bloqueada` : 'Marcar como enviada (bloquea la factura)'}
                        onChange={() => setConfirmEnviarF(f)} className="w-4 h-4 rounded border-slate-300 text-brand-600 cursor-pointer disabled:cursor-default" />}
                </Td>
                <Td className="text-right" onClick={(e) => e.stopPropagation()}>
                  <div className="flex justify-end gap-1">
                    {f.estado !== 'borrador' && <button className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500" title="Descargar PDF" onClick={() => descargarPDFFactura(f)}><Icons.Download className="w-4 h-4" /></button>}
                    <button className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500" title="Ver detalle" onClick={() => setDetail(f)}><Icons.Eye className="w-4 h-4" /></button>
                    {!f.enviadaAt && f.estado !== 'cancelada' && <>
                      <button className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500" title="Editar" onClick={() => setModal({ mode: 'edit', item: f })}><Icons.Edit className="w-4 h-4" /></button>
                      <button className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500" title={f.estado === 'borrador' ? 'Eliminar borrador' : 'Eliminar factura (no enviada)'} onClick={() => setToDelete(f)}><Icons.Trash className="w-4 h-4" /></button>
                    </>}
                  </div>
                </Td>
              </tr>
            ))}
          </tbody>
        </table>
      </CardTable>
    );
  }

  return (
    <div className="fade-in">
      <PageHeader title="Facturas y pagos" subtitle={`${items.length} facturas`}
        action={<div className="flex gap-2">
          <ExportCsvButton nombre="facturas" filas={filtered} columnas={[
            { titulo: 'Número', valor: (f) => f.numero || 'Borrador' }, { titulo: 'Tipo', valor: (f) => FACTURA_TIPOS[f.tipoFactura] || f.tipoFactura },
            { titulo: 'Cliente', valor: (f) => csvCliente(clienteById[f.clienteId]) }, { titulo: 'Estado', valor: (f) => (FACTURA_ESTADOS[f.estado] || {}).label || f.estado },
            { titulo: 'Fecha emisión', valor: (f) => csvFecha(f.fechaEmision) }, { titulo: 'Vencimiento', valor: (f) => csvFecha(f.fechaVencimiento) }, { titulo: 'Fecha de pago', valor: (f) => csvFecha(f.fechaPago) },
            { titulo: 'Subtotal', valor: (f) => Number(f.subtotal || 0) }, { titulo: 'Descuento', valor: (f) => Number(f.descuento || 0) }, { titulo: 'IVA', valor: (f) => Number(f.ivaTotal || 0) },
            { titulo: 'Total', valor: (f) => Number(f.total || 0) }, { titulo: 'Retención IRPF %', valor: (f) => Number(f.retencionPorcentaje || 0) },
            { titulo: 'Retención IRPF', valor: (f) => Number(f.retencionImporte || 0) }, { titulo: 'A transferir', valor: (f) => Number(f.totalATransferir || 0) },
            { titulo: 'Beneficio real', valor: (f) => (f.beneficioReal === null || f.beneficioReal === undefined ? '' : Number(f.beneficioReal)) }]} />
          <Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nueva factura o pago</Button>
        </div>} />

      <Toolbar search={search} onSearch={setSearch} placeholder="Buscar por número, cliente o empresa..."
        right={
          <div className="flex items-center gap-2 flex-nowrap shrink-0">
            <Select value={filterYear} onChange={(e) => setFilterYear(e.target.value)} className="!py-1.5 !text-xs w-auto">
              <option value="todos">Todos los años</option>
              {anios.map((a) => <option key={a} value={a}>{a}</option>)}
            </Select>
            <Select value={filterEstado} onChange={(e) => setFilterEstado(e.target.value)} className="!py-1.5 !text-xs w-auto">
              <option value="todos">Todos los estados</option>
              {Object.entries(FACTURA_ESTADOS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
            </Select>
          </div>
        } />

      {loading ? <PageLoader /> : (
        <div className="space-y-6">
          <div>
            <h2 className="text-sm font-semibold text-ink-700 mb-2 flex items-center gap-2">
              Pendientes de cobro <span className="text-xs font-normal text-slate-400">({noPagadas.length})</span>
            </h2>
            {renderTablaFacturas(noPagadas, 'Ninguna factura')}
          </div>
          <div>
            <h2 className="text-sm font-semibold text-ink-700 mb-2 flex items-center gap-2">
              Pagadas <span className="text-xs font-normal text-slate-400">({pagadas.length})</span>
            </h2>
            {renderTablaFacturas(pagadas, 'Ninguna factura')}
          </div>
        </div>
      )}

      <Modal open={!!modal} onClose={() => setModal(null)} title={modal?.mode === 'edit' ? 'Editar factura o pago' : 'Nueva factura o pago'} size="2xl">
        {modal && <FacturaForm initial={modal.mode === 'edit' ? modal.item : null} clientes={clientes} proyectos={proyectos} productos={productos}
          onClienteCreado={handleClienteCreado} onClienteActualizado={(u) => setClientes((cs) => cs.map((c) => (c.id === u.id ? u : c)))} onProductoCreado={handleProductoCreado}
          onCancel={() => setModal(null)} onSaved={() => { setModal(null); load(); }} />}
      </Modal>

      <Modal open={!!detail} onClose={() => setDetail(null)} title={detail ? `Factura ${detail.numero || 'Borrador'}` : ''} wide>
        {detail && <FacturaDetail factura={detail} facturas={items} clienteById={clienteById}
          onClose={() => setDetail(null)} onEdit={() => { setModal({ mode: 'edit', item: detail }); setDetail(null); }}
          onChanged={refrescar} />}
      </Modal>

      <ConfirmDialog open={!!confirmEnviarF} title="Marcar como enviada" message="Al marcarla como enviada se guarda la copia en PDF en el archivo y la factura queda bloqueada (no se podrá editar ni borrar). ¿Continuar?"
        onCancel={() => setConfirmEnviarF(null)} onConfirm={marcarEnviadaLista} />
      <ConfirmDialog open={!!toDelete} title={toDelete && toDelete.estado !== 'borrador' ? 'Eliminar factura' : 'Eliminar borrador'} danger
        message={toDelete && toDelete.estado !== 'borrador' ? `¿Eliminar la factura ${toDelete.numero}? Se borran también sus cobros y su número quedará sin usar (hueco en la numeración). No se puede deshacer.` : '¿Eliminar este borrador de factura?'} onCancel={() => setToDelete(null)} onConfirm={handleDelete} />
    </div>
  );
}

// ===================== pages/Leads.js =====================
const LEAD_EMPTY = { nombre: '', email: '', telefono: '', empresa: '', estado: 'nuevo', notas: '' };
const LEAD_ESTADOS = ['nuevo', 'contactado', 'calificado', 'propuesta_enviada', 'convertido', 'perdido'];

function LeadForm({ initial, onCancel, onSaved }) {
  const toast = useToast();
  const [form, setForm] = useState(initial || LEAD_EMPTY);
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  async function handleSubmit(e) {
    e.preventDefault();
    if (!form.nombre.trim()) { toast('El nombre es obligatorio', 'error'); return; }
    setSaving(true);
    try {
      if (form.id) {
        const { id, createdAt, clienteId, fechaConversion, ...payload } = form;
        await api.update('Lead', form.id, payload);
        toast('Lead actualizado');
      } else {
        await api.insert('Lead', form);
        toast('Lead creado');
      }
      onSaved();
    } catch (err) { toast(err.message || 'Error al guardar', 'error'); }
    finally { setSaving(false); }
  }

  return (
    <form onSubmit={handleSubmit}>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <Field label="Nombre" required className="sm:col-span-2"><Input value={form.nombre} onChange={set('nombre')} required autoFocus /></Field>
        <Field label="Empresa"><Input value={form.empresa || ''} onChange={set('empresa')} /></Field>
        <Field label="Estado">
          <Select value={form.estado} onChange={set('estado')}>
            {LEAD_ESTADOS.map((e) => <option key={e} value={e}>{ESTADO_LABELS[e]}</option>)}
          </Select>
        </Field>
        <Field label="Teléfono"><Input type="tel" inputMode="tel" maxLength={12} value={form.telefono || ''} onChange={set('telefono')} /></Field>
        <Field label="Email"><Input type="email" value={form.email || ''} onChange={set('email')} /></Field>
        <Field label="Notas" className="sm:col-span-2"><Textarea value={form.notas || ''} onChange={set('notas')} /></Field>
      </div>
      <div className="flex justify-end gap-2 mt-5">
        <Button variant="secondary" type="button" onClick={onCancel}>Cancelar</Button>
        <Button type="submit" disabled={saving}>{saving ? 'Guardando...' : 'Guardar lead'}</Button>
      </div>
    </form>
  );
}

function Leads({ navigate }) {
  const toast = useToast();
  const [loading, setLoading] = useState(true);
  const [items, setItems] = useState([]);
  const [search, setSearch] = useState('');
  const [filterEstado, setFilterEstado] = useState('todos');
  const [modal, setModal] = useState(null);
  const [toDelete, setToDelete] = useState(null);
  const [working, setWorking] = useState(null);
  const [sort, setSort] = useState({ key: null, dir: 'asc' });
  const onSort = (key) => setSort((s) => toggleSort(s, key));

  async function load() { setLoading(true); setItems(await api.list('Lead')); setLoading(false); }
  useEffect(() => { load(); }, []);

  const activos = items.filter((l) => l.estado !== 'convertido');
  const filtered = items.filter((l) => {
    if (filterEstado === 'todos') { if (l.estado === 'convertido') return false; }
    else if (l.estado !== filterEstado) return false;
    const q = search.toLowerCase();
    if (!q) return true;
    return [l.nombre, l.empresa, l.email].filter(Boolean).some((v) => v.toLowerCase().includes(q));
  });
  const sorted = sortRows(filtered, sort, {
    nombre: (l) => l.nombre,
    estado: (l) => l.estado,
  });

  async function handleDelete() {
    try { await api.remove('Lead', toDelete.id); toast('Lead eliminado'); setToDelete(null); load(); }
    catch (err) { toast('No se pudo eliminar', 'error'); setToDelete(null); }
  }

  // Convierte el lead en cliente (si no lo está ya) y devuelve el id de cliente resultante
  async function asegurarCliente(l) {
    if (l.clienteId) return l.clienteId;
    const cliente = await api.insert('Cliente', {
      nombre: l.nombre, empresa: l.empresa || '', email: l.email || '', telefono: l.telefono || '',
      estado: 'activo', notas: l.notas || '',
    });
    await api.update('Lead', l.id, { estado: 'convertido', clienteId: cliente.id, fechaConversion: new Date().toISOString() });
    return cliente.id;
  }

  async function convertirACliente(l) {
    setWorking(l.id);
    try {
      await asegurarCliente(l);
      toast(`${l.nombre} convertido en cliente`);
      load();
    } catch (err) { toast(err.message || 'Error al convertir', 'error'); }
