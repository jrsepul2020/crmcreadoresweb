};

function ClienteForm({ initial, onCancel, onSaved, onVerHistorial, onVista }) {
  const toast = useToast();
  const esNuevo = !(initial && initial.id);
  const [form, setForm] = useState(() => clienteAFormulario(initial));
  const [saving, setSaving] = useState(false);
  const [historialReciente, setHistorialReciente] = useState([]);
  const [apren, setApren] = useState({ cpMap: {}, poblaciones: [], etiquetas: [] });
  const [autoMsg, setAutoMsg] = useState('');
  const autoRef = useRef({ poblacion: '', provincia: 'Sevilla' });
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  const setMayus = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value.toUpperCase() }));

  useEffect(() => { api.list('Cliente').then((cs) => setApren(construirAprendizajeClientes(cs))).catch(() => {}); }, []);

  // Al completar el código postal rellena provincia (por el prefijo) y población (de tus clientes con ese CP),
  // solo si el campo está vacío o contiene un valor puesto antes automáticamente.
  function alCambiarCP(valor) {
    const cp = esEspana ? valor.replace(/\D/g, '') : valor;
    const nf = { ...form, codigoPostal: cp };
    const rellenados = [];
    if (esEspana && cp.length === 5) {
      const propio = apren.cpMap[cp];
      const prov = (propio && propio.provincia) || provinciaDeCP(cp);
      const pob = (propio && propio.poblacion) || '';
      const libre = (campo) => !form[campo] || form[campo] === autoRef.current[campo];
      if (prov && libre('provincia') && form.provincia !== prov) { nf.provincia = prov; autoRef.current.provincia = prov; rellenados.push('provincia'); }
      if (pob && libre('poblacion') && form.poblacion !== pob) { nf.poblacion = pob; autoRef.current.poblacion = pob; rellenados.push('población'); }
      else if (!pob && form.poblacion && form.poblacion === autoRef.current.poblacion) { nf.poblacion = ''; autoRef.current.poblacion = ''; }
    }
    setAutoMsg(rellenados.length ? `Rellenado automáticamente: ${rellenados.join(' y ')}` : '');
    setForm(nf);
  }

  const nombreCompleto = [form.nombrePila, form.apellidos].map((x) => (x || '').trim()).filter(Boolean).join(' ');
  const esUE = form.tipoCliente === 'ue';
  const esEspana = !form.pais || form.pais === 'España';
  const exigeEmpresa = ['empresa', 'ue', 'fuera_ue'].includes(form.tipoCliente);
  const fiscal = form.estado !== 'potencial';
  const paisUEnoEspana = PAISES_UE.includes(form.pais) && form.tipoCliente && !esUE;
  const validaNifES = esEspana && !['ue', 'fuera_ue'].includes(form.tipoCliente);
  const nifRes = validaNifES && (form.nif || '').trim() ? validarNifEspanol(form.nif) : null;
  const nifIvaRes = esUE && (form.nifIntracomunitario || '').trim() ? validarNifIva(form.nifIntracomunitario) : null;

  useEffect(() => {
    if (onVista) onVista({ nombre: nombreCompleto, empresa: (form.empresa || '').trim(), tipo: form.tipoCliente });
    // eslint-disable-next-line
  }, [nombreCompleto, form.empresa, form.tipoCliente]);

  useEffect(() => {
    if (!form.id) return;
    api.list('ClienteInteraccion', { order: 'fecha', ascending: false }).then((all) => {
      setHistorialReciente(all.filter((i) => i.clienteId === form.id).slice(0, 3));
    });
  }, [form.id]);

  async function handleSubmit(e) {
    e.preventDefault();
    const vacio = (k) => !(form[k] || '').toString().trim();
    const faltan = [];
    if (vacio('nombrePila')) faltan.push('Nombre');
    if (!form.tipoCliente) faltan.push('Tipo de cliente');
    if (esNuevo) {
      if (vacio('apellidos')) faltan.push('Apellidos');
      if (vacio('telefono')) faltan.push('Teléfono principal');
      if (vacio('email')) faltan.push('Email principal');
      if (fiscal) {
        if (exigeEmpresa && vacio('empresa')) faltan.push('Empresa / Razón social');
        if (vacio('nif')) faltan.push('NIF / CIF');
        if (esUE && vacio('nifIntracomunitario')) faltan.push('NIF-IVA intracomunitario');
        if (vacio('direccion')) faltan.push('Dirección fiscal');
        if (vacio('codigoPostal')) faltan.push('Código postal');
        if (vacio('poblacion')) faltan.push('Población');
        if (vacio('provincia')) faltan.push('Provincia');
        if (vacio('pais')) faltan.push('País');
      }
    } else if (esUE && vacio('nifIntracomunitario')) faltan.push('NIF-IVA intracomunitario');
    if (faltan.length) { toast(`Falta rellenar: ${faltan.join(', ')}`, 'error'); return; }
    const nifCambiado = esNuevo || (form.nif || '').trim() !== ((initial && initial.nif) || '').trim();
    if (nifRes && !nifRes.ok && nifCambiado) { toast(`NIF/CIF no válido: ${nifRes.msg}`, 'error'); return; }
    if (nifIvaRes && !nifIvaRes.ok) { toast(`NIF-IVA no válido: ${nifIvaRes.msg}`, 'error'); return; }

    const nulo = (v) => ((v || '').toString().trim() || null);
    const datos = {
      ...form,
      nombre: nombreCompleto,
      nombrePila: nulo(form.nombrePila), apellidos: nulo(form.apellidos),
      cargo: nulo(form.cargo), nombreComercial: nulo(form.nombreComercial), pais: nulo(form.pais), emailFacturacion: nulo(form.emailFacturacion),
      servicioInteres: nulo(form.servicioInteres), origenLead: nulo(form.origenLead),
      tipoCliente: form.tipoCliente || null,
      nifIntracomunitario: esUE ? form.nifIntracomunitario.trim().toUpperCase() : null,
      etiquetas: form.etiquetas || [],
      sitioWeb: normalizarWeb(form.sitioWeb), sitioWeb2: normalizarWeb(form.sitioWeb2),
    };
    setSaving(true);
    try {
      if (form.id) {
        const { id, createdAt, ...payload } = datos;
        await api.update('Cliente', form.id, payload);
        toast('Cliente actualizado');
      } else {
        await api.insert('Cliente', datos);
        toast('Cliente creado');
      }
      onSaved();
    } catch (err) {
      toast(err.message || 'Error al guardar', 'error');
    } finally {
      setSaving(false);
    }
  }

  return (
    <form onSubmit={handleSubmit} className="flex flex-col min-h-0 flex-1">
      <div className="flex-1 overflow-y-auto px-5 sm:px-6 py-5 space-y-6 bg-slate-100/80">
        <SeccionForm primera icono={Icons.Users} titulo="Datos personales">
          <Field label="Apellidos" required={esNuevo} className="sm:col-span-3 lg:col-span-3"><InputCopy value={form.apellidos || ''} onChange={set('apellidos')} copyLabel="apellidos" autoComplete="family-name" /></Field>
          <Field label="Nombre" required className="sm:col-span-3 lg:col-span-3"><InputCopy value={form.nombrePila || ''} onChange={set('nombrePila')} copyLabel="nombre" autoFocus autoComplete="given-name" /></Field>
          <Field label="Cargo" className="sm:col-span-6 lg:col-span-2"><Input value={form.cargo || ''} onChange={set('cargo')} placeholder="Gerente, propietario…" /></Field>
          <Field label="Nombre comercial" className="sm:col-span-3 lg:col-span-4"><InputCopy value={form.nombreComercial || ''} onChange={set('nombreComercial')} copyLabel="nombre comercial" placeholder="Marca o nombre con el que se conoce el negocio" /></Field>
          <Field label="Persona de contacto" className="sm:col-span-6 lg:col-span-3"><InputCopy value={form.personaContacto || ''} onChange={set('personaContacto')} copyLabel="contacto" placeholder="Si es distinta del titular" /></Field>
          <Field label="Teléfono principal" required={esNuevo} className="sm:col-span-3 lg:col-span-2"><InputCopy type="tel" inputMode="tel" maxLength={16} value={form.telefono || ''} onChange={set('telefono')} copyLabel="teléfono" /></Field>
          <Field label="Teléfono secundario" className="sm:col-span-3 lg:col-span-2"><InputCopy type="tel" inputMode="tel" maxLength={16} value={form.telefono2 || ''} onChange={set('telefono2')} copyLabel="teléfono" /></Field>
          <Field label="Email principal" required={esNuevo} className="sm:col-span-3 lg:col-span-5"><InputCopy type="email" value={form.email || ''} onChange={set('email')} copyLabel="email" autoComplete="email" /></Field>
          <Field label="Email secundario" className="sm:col-span-3 lg:col-span-5"><InputCopy type="email" value={form.email2 || ''} onChange={set('email2')} copyLabel="email" /></Field>
        </SeccionForm>

        <SeccionForm icono={Icons.Receipt} titulo="Facturación">
          <Field label="Empresa / Razón social" required={esNuevo && fiscal && exigeEmpresa} className="sm:col-span-6 lg:col-span-5">
            <InputCopy value={form.empresa || ''} onChange={set('empresa')} copyLabel="empresa" placeholder={form.tipoCliente === 'particular' ? 'No aplica a particulares' : ''} />
          </Field>
          <Field label="NIF / CIF" required={esNuevo && fiscal} hint={avisoNif(nifRes)} className="sm:col-span-3 lg:col-span-3"><InputCopy value={form.nif || ''} onChange={setMayus('nif')} copyLabel="NIF" maxLength={15} className="uppercase" /></Field>
          {esUE && (

          )}
          <Field label="Tipo de cliente" required hint={CLIENTE_TIPO_AYUDA[form.tipoCliente]} className="sm:col-span-3 lg:col-span-4">
            <Select value={form.tipoCliente || ''} onChange={set('tipoCliente')}>

          </Field>
          <Field label="Estado" required className="sm:col-span-3 lg:col-span-2">

          </Field>
          <Field label="Email de facturación" hint="Si es distinto del principal: aquí se envían las facturas" className="sm:col-span-6 lg:col-span-5"><InputCopy type="email" value={form.emailFacturacion || ''} onChange={set('emailFacturacion')} copyLabel="email" /></Field>
          {paisUEnoEspana && (
            <p className="sm:col-span-6 lg:col-span-12 text-xs text-amber-700 bg-amber-50 rounded-lg px-3 py-2">El país es de la UE: revisa si el tipo de cliente debería ser «Empresa de la UE».</p>

          <Field label="Dirección fiscal" required={esNuevo && fiscal} className="sm:col-span-6 lg:col-span-7"><InputCopy value={form.direccion || ''} onChange={set('direccion')} copyLabel="dirección" autoComplete="street-address" /></Field>
          <Field label="Código postal" required={esNuevo && fiscal} className="sm:col-span-2 lg:col-span-2">
            <InputCopy value={form.codigoPostal || ''} onChange={(e) => alCambiarCP(e.target.value)} copyLabel="código postal" maxLength={esEspana ? 5 : 10} inputMode={esEspana ? 'numeric' : 'text'} />
          </Field>
          <Field label="Población" required={esNuevo && fiscal} hint={autoMsg || undefined} className="sm:col-span-4 lg:col-span-3">

            <Select value={form.servicioInteres || ''} onChange={set('servicioInteres')}>
              <option value="">Selecciona…</option>
              {(SERVICIOS_INTERES.includes(form.servicioInteres) || !form.servicioInteres ? SERVICIOS_INTERES : [form.servicioInteres, ...SERVICIOS_INTERES]).map((s) => <option key={s} value={s}>{s}</option>)}

              <p className="text-xs text-slate-400">Sin registros en el historial todavía.</p>

              <div className="border border-slate-100 rounded-lg divide-y divide-slate-100">
                {historialReciente.map((it) => {
                  const info = INTERACCION_TIPOS[it.tipo] || INTERACCION_TIPOS.nota;

                  return (

                  );
                })}
              </div>
            )}
          </div>
        )}
        {esNuevo && <p className="text-xs text-slate-400">Los campos con * son obligatorios al crear un cliente. Los datos fiscales no se exigen a los clientes «potenciales».</p>}
      </div>

      <div className="shrink-0 border-t border-slate-200 bg-white px-5 sm:px-6 py-4 grid grid-cols-5 gap-3">
        <button type="button" onClick={onCancel}
          className="col-span-2 h-14 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-ink-800 text-base font-bold transition">Cancelar</button>
        <button type="submit" disabled={saving}
          className="col-span-3 h-14 rounded-xl bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white text-base font-bold flex items-center justify-center gap-2 shadow-sm shadow-brand-600/30 disabled:opacity-60 transition">
          <Icons.Check className="w-5 h-5" /> {saving ? 'Guardando...' : 'Guardar cliente'}
        </button>
      </div>
    </form>
  );
}

// ---------- Historial (llamadas, reuniones, emails, notas de seguimiento) ----------
const INTERACCION_EMPTY = { tipo: 'nota', fecha: toDateInput(new Date()), descripcion: '' };
const INTERACCION_TIPOS = {
  llamada: { label: 'Llamada', icon: 'Phone', color: 'blue' },
  reunion: { label: 'Reunión', icon: 'Users', color: 'violet' },
  email: { label: 'Email', icon: 'Mail', color: 'amber' },
  nota: { label: 'Nota', icon: 'FileText', color: 'slate' },
  otro: { label: 'Otro', icon: 'Alert', color: 'rose' },
};
const TIPO_TONES = {
  blue: 'bg-blue-50 text-blue-600', violet: 'bg-violet-50 text-violet-600',
  amber: 'bg-amber-50 text-amber-600', slate: 'bg-slate-100 text-slate-500', rose: 'bg-rose-50 text-rose-600',
};

function InteraccionForm({ clienteId, initial, mode, onCancel, onSaved }) {
  const toast = useToast();
  const [form, setForm] = useState(initial
    ? { tipo: initial.tipo, fecha: mode === 'duplicate' ? toDateInput(new Date()) : toDateInput(initial.fecha), descripcion: initial.descripcion }
    : INTERACCION_EMPTY);
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  async function handleSubmit(e) {
    e.preventDefault();
    if (!form.descripcion.trim()) { toast('Describe brevemente la interacción', 'error'); return; }
    setSaving(true);
    try {
      if (mode === 'edit') {
        await api.update('ClienteInteraccion', initial.id, form);
        toast('Registro actualizado');
      } else {
        await api.insert('ClienteInteraccion', { ...form, clienteId });
        toast(mode === 'duplicate' ? 'Registro duplicado' : 'Registrado en el historial');
      }
      onSaved();
    } catch (err) {
      toast(err.message || 'Error al guardar', 'error');
    } finally {
      setSaving(false);
    }
  }

  return (
    <form onSubmit={handleSubmit} className="bg-slate-50 rounded-xl p-4 mb-4 border border-slate-100">
      <div className="grid grid-cols-1 sm:grid-cols-[140px_140px_1fr] gap-3">
        <Field label="Tipo">
          <Select value={form.tipo} onChange={set('tipo')}>
            {Object.entries(INTERACCION_TIPOS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
          </Select>
        </Field>
        <Field label="Fecha"><Input type="date" value={form.fecha} onChange={set('fecha')} autoFocus={mode === 'duplicate'} /></Field>
        <Field label="Descripción"><Input value={form.descripcion} onChange={set('descripcion')} placeholder="¿Qué se habló o hizo?" autoFocus={mode !== 'duplicate'} /></Field>
      </div>
      <div className="flex justify-end gap-2 mt-3">
        <Button variant="secondary" size="sm" type="button" onClick={onCancel}>Cancelar</Button>
        <Button size="sm" type="submit" disabled={saving}>
          {saving ? 'Guardando...' : mode === 'edit' ? 'Guardar cambios' : mode === 'duplicate' ? 'Crear duplicado' : 'Añadir al historial'}
        </Button>
      </div>
    </form>
  );
}

const PAGE_SIZE_CLIENTES = 25;

function Clientes() {
  const toast = useToast();
  const [loading, setLoading] = useState(true);
  const [clientes, setClientes] = useState([]);
  const [search, setSearch] = useState('');
  const [modal, setModal] = useState(null); // {mode:'new'|'edit', cliente}
  const [toDelete, setToDelete] = useState(null);
  const [filterEstado, setFilterEstado] = useState('todos');
  const [sort, setSort] = useState({ key: 'nombre', dir: 'asc' });
  const onSort = (key) => setSort((s) => toggleSort(s, key));
  const [page, setPage] = useState(1);

  async function load() {
    setLoading(true);
    setClientes(await api.list('Cliente', { order: 'nombre', ascending: true }));
    setLoading(false);
  }
  useEffect(() => { load(); }, []);
  useEffect(() => { setPage(1); }, [search, filterEstado, sort]);

  const filtered = clientes.filter((c) => {
    if (filterEstado !== 'todos' && c.estado !== filterEstado) return false;
    const q = search.toLowerCase();
    if (!q) return true;
    return [c.nombre, c.nombreComercial, c.empresa, c.sitioWeb, c.email, c.telefono, c.nif].filter(Boolean).some((v) => v.toLowerCase().includes(q));
  });
  const sorted = sortRows(filtered, sort, {
    nombre: (c) => (c.nombre || c.empresa || '').toLowerCase(),
    sitioWeb: (c) => (c.sitioWeb || '').toLowerCase(),
    estado: (c) => c.estado,
  });
  const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE_CLIENTES));
  const paged = sorted.slice((page - 1) * PAGE_SIZE_CLIENTES, page * PAGE_SIZE_CLIENTES);

  // Guarda un solo campo de un cliente desde el listado y actualiza la fila sin recargar toda la lista
  async function guardarCampo(c, campo, valor) {
    const cambios = { [campo]: valor };
    if (campo === 'tipoCliente') {
      cambios.tipoCliente = valor || null;
      if (valor !== 'ue') cambios.nifIntracomunitario = null;
      else if (!c.nifIntracomunitario) toast('Tipo guardado. Completa el NIF-IVA intracomunitario en la ficha del cliente', 'info');
    }
    const actualizado = await api.update('Cliente', c.id, cambios);
    setClientes((cs) => cs.map((x) => (x.id === c.id ? { ...x, ...actualizado } : x)));
  }

  async function handleDelete() {
    try {
      await api.remove('Cliente', toDelete.id);
      toast('Cliente eliminado');
      setToDelete(null);
      load();
    } catch (err) {
      toast('No se puede eliminar: tiene proyectos, presupuestos o facturas asociadas', 'error');
      setToDelete(null);
    }
  }

  return (
    <div className="fade-in">
      <PageHeader title="Clientes" subtitle={`${clientes.length} clientes registrados`}
        action={<div className="flex gap-2">
          <ExportCsvButton nombre="clientes" filas={sorted} columnas={[
            { titulo: 'Nombre completo', valor: (c) => c.nombre }, { titulo: 'Apellidos', valor: (c) => c.apellidos }, { titulo: 'Nombre', valor: (c) => c.nombrePila },
            { titulo: 'Cargo', valor: (c) => c.cargo }, { titulo: 'Empresa', valor: (c) => c.empresa }, { titulo: 'Tipo de cliente', valor: (c) => CLIENTE_TIPOS[c.tipoCliente] || '' },
            { titulo: 'NIF/CIF', valor: (c) => c.nif }, { titulo: 'NIF-IVA intracomunitario', valor: (c) => c.nifIntracomunitario }, { titulo: 'Nombre comercial', valor: (c) => c.nombreComercial }, { titulo: 'Persona de contacto', valor: (c) => c.personaContacto },
            { titulo: 'Email', valor: (c) => c.email }, { titulo: 'Email 2', valor: (c) => c.email2 }, { titulo: 'Teléfono', valor: (c) => c.telefono }, { titulo: 'Teléfono 2', valor: (c) => c.telefono2 },
            { titulo: 'Dirección', valor: (c) => c.direccion }, { titulo: 'Código postal', valor: (c) => c.codigoPostal }, { titulo: 'Población', valor: (c) => c.poblacion },
            { titulo: 'Provincia', valor: (c) => c.provincia }, { titulo: 'País', valor: (c) => c.pais }, { titulo: 'Email de facturación', valor: (c) => c.emailFacturacion },
            { titulo: 'Sitio web', valor: (c) => c.sitioWeb }, { titulo: 'Servicio de interés', valor: (c) => c.servicioInteres }, { titulo: 'Origen del lead', valor: (c) => c.origenLead },
            { titulo: 'Etiquetas', valor: (c) => (c.etiquetas || []).join(', ') }, { titulo: 'Estado', valor: (c) => c.estado }, { titulo: 'Notas', valor: (c) => c.notas }]} />
          <Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo cliente</Button>
        </div>} />

      <Toolbar search={search} onSearch={setSearch} placeholder="Buscar cliente, empresa, email..."
        right={
          <Select value={filterEstado} onChange={(e) => setFilterEstado(e.target.value)} className="!py-1.5 !text-xs w-auto">
            <option value="todos">Todos los estados</option>
            <option value="activo">Activos</option>
            <option value="potencial">Potenciales</option>
            <option value="inactivo">Inactivos</option>
          </Select>
        } />

      {loading ? <PageLoader /> : filtered.length === 0 ? (
        <CardTable><EmptyState icon={Icons.Users} title="No hay clientes" message="Añade tu primer cliente para empezar." action={<Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo cliente</Button>} /></CardTable>
      ) : (
        <CardTable footer={<Pagination page={page} totalPages={totalPages} onPageChange={setPage} totalItems={sorted.length} pageSize={PAGE_SIZE_CLIENTES} />}>
          <table className="w-full min-w-[720px]">
            <thead className="bg-slate-700 text-white"><tr>
              <SortableTh sortKey="nombre" sort={sort} onSort={onSort}>Cliente</SortableTh>
              <Th>Contacto</Th>
              <Th>Tipo</Th>
              <SortableTh sortKey="sitioWeb" sort={sort} onSort={onSort}>Web</SortableTh>
              <SortableTh sortKey="estado" sort={sort} onSort={onSort}>Estado</SortableTh>
              <Th className="text-right">Acciones</Th>
            </tr></thead>
            <tbody className="divide-y divide-slate-200">
              {paged.map((c) => (
                <tr key={c.id} className="hover:bg-slate-50/60 cursor-pointer" onClick={() => setModal({ mode: 'edit', cliente: c })}>
                  <Td>
                    <div className="flex items-center gap-3">
                      <Avatar name={c.nombre} />
                      <div className="min-w-0">
                        <div className="flex items-center gap-1">
                          <EditableCell value={c.nombre || ''} required className="font-medium text-ink-800 truncate"
                            onSave={(v) => guardarCampo(c, 'nombre', v)} />
                          <CopyIconButton text={c.nombre} label="nombre" />
                        </div>
                        {c.nombreComercial
                          ? <EditableCell value={c.nombreComercial} className="text-xs text-slate-500 truncate" onSave={(v) => guardarCampo(c, 'nombreComercial', v)} />
                          : (c.empresa && <span className="block text-xs text-slate-400 truncate">{c.empresa}</span>)}
                      </div>
                    </div>
                  </Td>
                  <Td onClick={(e) => e.stopPropagation()}>
                    <div className="flex items-center gap-1 text-xs">
                      <EditableCell value={c.email || ''} type="email" placeholder="Añadir email" onSave={(v) => guardarCampo(c, 'email', v)}
                        validate={(v) => (/^\S+@\S+\.\S+$/.test(v) ? '' : 'El email no es válido')} />
                      {c.email && <a href={mailtoLink(c.email)} title="Escribir un email" className="text-slate-300 hover:text-brand-600"><Icons.Mail className="w-3.5 h-3.5" /></a>}
                    </div>
                    <div className="flex items-center gap-1 text-xs mt-0.5">
                      <EditableCell value={c.telefono || ''} type="tel" maxLength={12} placeholder="Añadir teléfono" onSave={(v) => guardarCampo(c, 'telefono', v)} />
                      {c.telefono && <a href={telLink(c.telefono)} title="Llamar" className="text-slate-300 hover:text-brand-600"><Icons.Phone className="w-3.5 h-3.5" /></a>}
                    </div>
                  </Td>
                  <Td onClick={(e) => e.stopPropagation()}>
                    <EditableCell value={c.tipoCliente || ''} options={[['', 'Sin tipo'], ...Object.entries(CLIENTE_TIPOS)]} onSave={(v) => guardarCampo(c, 'tipoCliente', v)}
                      display={<span className={classNames('inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium ring-1 ring-inset',
                        c.tipoCliente ? 'bg-slate-100 text-slate-600 ring-slate-500/20' : 'bg-rose-50 text-rose-700 ring-rose-600/20')}>
                        {c.tipoCliente ? (CLIENTE_TIPOS[c.tipoCliente] || c.tipoCliente) : 'Falta tipo'}
                      </span>} />
                  </Td>
                  <Td onClick={(e) => e.stopPropagation()}>
                    {c.sitioWeb

                  </Td>
                  <Td onClick={(e) => e.stopPropagation()}>
                    <EditableCell value={c.estado || 'activo'} options={[['activo', 'Activo'], ['potencial', 'Potencial'], ['inactivo', 'Inactivo']]} onSave={(v) => guardarCampo(c, 'estado', v)}
                      display={<EstadoBadge estado={c.estado} />} />
                  </Td>
                  <Td className="text-right" onClick={(e) => e.stopPropagation()}>
                    <div className="flex justify-end gap-1">

                      <button className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500" onClick={() => setToDelete(c)}><Icons.Trash className="w-4 h-4" /></button>
                    </div>
                  </Td>
                </tr>
              ))}
            </tbody>
          </table>
        </CardTable>
      )}

      <Modal open={!!modal} onClose={() => setModal(null)} title={modal?.mode === 'edit' ? 'Editar cliente' : 'Nuevo cliente'} size="xl" bare>
        {modal && <ClienteModalBody modal={modal} onCancel={() => setModal(null)} onSaved={() => { setModal(null); load(); }} />}
      </Modal>

      <ConfirmDialog open={!!toDelete} title="Eliminar cliente" danger
        message={`¿Seguro que quieres eliminar a "${toDelete?.nombre}"? Esta acción no se puede deshacer.`}

  );
}

      api.list('CategoriaServicio', { order: 'nombre', ascending: true }),
    ]);
    setItems(provs); setCategorias(cats); setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const filtered = items.filter((p) => {
    const q = search.toLowerCase();
    if (!q) return true;
    return [p.nombre, p.categoria, p.email, p.telefono].filter(Boolean).some((v) => v.toLowerCase().includes(q));

const PAGE_SIZE_PRODUCTOS = 25;

function Productos() {
  const toast = useToast();
  const [loading, setLoading] = useState(true);
  const [items, setItems] = useState([]);
  const [proveedores, setProveedores] = useState([]);
  const [categorias, setCategorias] = useState([]);
  const [search, setSearch] = useState('');
  const [modal, setModal] = useState(null);
  const [toDelete, setToDelete] = useState(null);
  const [sort, setSort] = useState({ key: null, dir: 'asc' });
  const onSort = (key) => setSort((s) => toggleSort(s, key));
  const [page, setPage] = useState(1);

  async function load() {
    setLoading(true);
    const [prods, provs, cats] = await Promise.all([
      api.list('Producto', { order: 'nombre', ascending: true }),
      api.list('Proveedor', { order: 'nombre', ascending: true }),
      api.list('CategoriaServicio', { order: 'nombre', ascending: true }),
    ]);
    setItems(prods); setProveedores(provs); setCategorias(cats); setLoading(false);
  }
  useEffect(() => { load(); }, []);
  useEffect(() => { setPage(1); }, [search, sort]);

  const provById = Object.fromEntries(proveedores.map((p) => [p.id, p]));
  const filtered = items.filter((p) => {
    const q = search.toLowerCase();
    if (!q) return true;
    return [p.nombre, p.categoria, p.tipo].filter(Boolean).some((v) => v.toLowerCase().includes(q));
  });
  const sorted = sortRows(filtered, sort, {
    nombre: (p) => p.nombre,
    categoria: (p) => p.categoria,
    proveedor: (p) => (provById[p.proveedorId] || {}).nombre,
    precio: (p) => Number(p.precio || 0),
    precioIva: (p) => priceWithIVA(p.precio, p.iva),
    estado: (p) => (p.activo ? 1 : 0),
  });
  const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE_PRODUCTOS));
  const paged = sorted.slice((page - 1) * PAGE_SIZE_PRODUCTOS, page * PAGE_SIZE_PRODUCTOS);

  async function guardarProducto(p, cambios) {
    const actualizado = await api.update('Producto', p.id, cambios);
    setItems((prev) => prev.map((x) => (x.id === p.id ? { ...x, ...actualizado } : x)));
  }

  async function handleDuplicar(p) {
    try {
      const { id, createdAt, ...rest } = p;
      const nuevo = await api.insert('Producto', { ...rest, nombre: `${p.nombre} (copia)` });
      toast('Producto duplicado: ajusta lo que cambie y guarda');
      await load();
      setModal({ mode: 'edit', item: nuevo });
    } catch (err) { toast(err.message || 'No se pudo duplicar', 'error'); }
  }

  async function handleDelete() {
    try { await api.remove('Producto', toDelete.id); toast('Producto eliminado'); setToDelete(null); load(); }
    catch (err) { toast('No se puede eliminar este producto', 'error'); setToDelete(null); }
  }

  return (
    <div className="fade-in">
      <PageHeader title="Productos y servicios" subtitle={`${items.length} elementos en el catálogo`}
        action={<div className="flex gap-2">
          <ExportCsvButton nombre="productos" filas={sorted} columnas={[
            { titulo: 'Nombre', valor: (p) => p.nombre }, { titulo: 'Descripción', valor: (p) => p.descripcion }, { titulo: 'Categoría', valor: (p) => p.categoria },
            { titulo: 'Tipo', valor: (p) => p.tipo }, { titulo: 'Precio', valor: (p) => Number(p.precio || 0) }, { titulo: 'IVA %', valor: (p) => Number(p.iva || 0) },
            { titulo: 'Coste', valor: (p) => (p.coste === null || p.coste === undefined || p.coste === '' ? '' : Number(p.coste)) },
            { titulo: 'Activo', valor: (p) => csvSiNo(p.activo) }, { titulo: 'Proveedor', valor: (p) => (provById[p.proveedorId] || {}).nombre }]} />
          <Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo producto</Button>
        </div>} />
      <Toolbar search={search} onSearch={setSearch} placeholder="Buscar producto o servicio..." />
      {loading ? <PageLoader /> : filtered.length === 0 ? (
        <CardTable><EmptyState icon={Icons.Box} title="No hay productos" action={<Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo producto</Button>} /></CardTable>
      ) : (
        <CardTable footer={<Pagination page={page} totalPages={totalPages} onPageChange={setPage} totalItems={sorted.length} pageSize={PAGE_SIZE_PRODUCTOS} />}>
          <table className="w-full min-w-[800px]">
            <thead className="bg-slate-700 text-white"><tr>
              <SortableTh sortKey="nombre" sort={sort} onSort={onSort}>Nombre</SortableTh>
              <SortableTh sortKey="categoria" sort={sort} onSort={onSort}>Categoría</SortableTh>
              <SortableTh sortKey="proveedor" sort={sort} onSort={onSort}>Proveedor</SortableTh>
              <SortableTh sortKey="precio" sort={sort} onSort={onSort} className="text-right">Precio</SortableTh>
              <SortableTh sortKey="precioIva" sort={sort} onSort={onSort} className="text-right">Precio c/IVA</SortableTh>
              <SortableTh sortKey="estado" sort={sort} onSort={onSort}>Estado</SortableTh>
              <Th className="text-right">Acciones</Th>
            </tr></thead>
            <tbody className="divide-y divide-slate-200">
              {paged.map((p) => (
                <tr key={p.id} className="hover:bg-slate-50/60">
                  <Td>
                    <EditableCell value={p.nombre || ''} required className="font-medium text-ink-800" onSave={(v) => guardarProducto(p, { nombre: v })} />
                    <div><EditableCell value={p.tipo || 'servicio'} options={[['servicio', 'Servicio'], ['producto', 'Producto']]} className="text-xs text-slate-400 capitalize" onSave={(v) => guardarProducto(p, { tipo: v })} /></div>
                  </Td>
                  <Td><EditableCell value={p.categoria || ''} options={opcionesCategoria(categorias, p.categoria)} display={p.categoria || '—'} onSave={(v) => guardarProducto(p, { categoria: v })} /></Td>
                  <Td><EditableCell value={p.proveedorId || ''} options={[['', 'Sin proveedor'], ...proveedores.map((x) => [x.id, x.nombre])]} display={(provById[p.proveedorId] || {}).nombre || '—'} onSave={(v) => guardarProducto(p, { proveedorId: v || null })} /></Td>
                  <Td className="text-right"><EditableCell type="number" step="0.01" value={String(p.precio ?? '')} validate={validarImporte} display={formatCurrency(p.precio)} onSave={(v) => guardarProducto(p, { precio: Number(v) })} /></Td>
                  <Td className="text-right font-medium">{formatCurrency(priceWithIVA(p.precio, p.iva))} <EditableCell type="number" step="1" value={String(p.iva ?? 21)} validate={validarImporte} display={<span className="text-slate-400 font-normal">({p.iva}%)</span>} onSave={(v) => guardarProducto(p, { iva: Number(v) })} /></Td>

                      <button className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500" onClick={() => setToDelete(p)}><Icons.Trash className="w-4 h-4" /></button>
                    </div>
                  </Td>
                </tr>
              ))}
            </tbody>
          </table>
        </CardTable>
      )}
      <Modal open={!!modal} onClose={() => setModal(null)} title={modal?.mode === 'edit' ? 'Editar producto' : 'Nuevo producto'} wide>
        {modal && <ProductoForm initial={modal.mode === 'edit' ? modal.item : null} proveedores={proveedores} categorias={categorias}
          onCategoriaCreada={(c) => setCategorias((cs) => [...cs, c].sort((a, b) => a.nombre.localeCompare(b.nombre)))}
          onCancel={() => setModal(null)} onSaved={() => { setModal(null); load(); }} />}
      </Modal>
      <ConfirmDialog open={!!toDelete} title="Eliminar producto" danger message={`¿Eliminar "${toDelete?.nombre}"?`} onCancel={() => setToDelete(null)} onConfirm={handleDelete} />
    </div>
  );
}

const PROYECTO_EMPTY = {
  nombre: '', clienteId: '', estado: 'pendiente', prioridad: 'media', progreso: 0,
  presupuestoTotal: '', fechaInicio: '', fechaPrevista: '', url: '', tipo: '', notas: '',
};

function ProyectoForm({ initial, clientes, categorias, onClienteCreado, onCategoriaCreada, onCancel, onSaved }) {
  const toast = useToast();
  const [form, setForm] = useState(initial ? { ...initial, fechaInicio: toDateInput(initial.fechaInicio), fechaPrevista: toDateInput(initial.fechaPrevista) } : PROYECTO_EMPTY);
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  async function handleSubmit(e) {
    e.preventDefault();
    if (!form.nombre.trim()) { toast('El nombre es obligatorio', 'error'); return; }
    if (!form.clienteId) { toast('Selecciona un cliente', 'error'); return; }
    setSaving(true);
    try {
      const payload = {
        ...form,
        progreso: Number(form.progreso || 0),
        presupuestoTotal: form.presupuestoTotal === '' ? null : Number(form.presupuestoTotal),
        fechaInicio: form.fechaInicio || null,
        fechaPrevista: form.fechaPrevista || null,
      };
      if (form.id) {
        const { id, createdAt, presupuestoId, ...rest } = payload;
        await api.update('Proyecto', form.id, rest);
        toast('Proyecto actualizado');
      } else {
        const { presupuestoId, ...rest } = payload;
        await api.insert('Proyecto', rest);
        toast('Proyecto creado');
      }
      onSaved();
    } catch (err) { toast(err.message || 'Error al guardar', 'error'); }
    finally { setSaving(false); }
  }

  return (
    <form onSubmit={handleSubmit}>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <Field label="Nombre del proyecto" required className="sm:col-span-2"><Input value={form.nombre} onChange={set('nombre')} required autoFocus /></Field>
        <Field label="Cliente" required>
          <ClienteSelect value={form.clienteId} clientes={clientes} onChange={(v) => setForm((f) => ({ ...f, clienteId: v }))} onCreado={onClienteCreado} required placeholder="Selecciona un cliente" />
        </Field>
        <Field label="Tipo de proyecto" hint="Basado en las categorías de tu catálogo de productos/servicios">
          <CategoriaSelect value={form.tipo} categorias={categorias} onChange={(v) => setForm((f) => ({ ...f, tipo: v }))} onCreada={onCategoriaCreada} />
        </Field>
        <Field label="Estado">
          <Select value={form.estado} onChange={set('estado')}>
            <option value="pendiente">Pendiente</option>
            <option value="activo">Activo</option>
            <option value="pausado">Pausado</option>
            <option value="completado">Completado</option>
            <option value="cancelado">Cancelado</option>
          </Select>
        </Field>
        <Field label="Prioridad">
          <Select value={form.prioridad} onChange={set('prioridad')}>
            <option value="baja">Baja</option><option value="media">Media</option><option value="alta">Alta</option>
          </Select>
        </Field>
        <Field label="Progreso (%)" hint="Se recalcula solo al completar tareas; edítalo a mano si el proyecto no tiene tareas."><Input type="number" min="0" max="100" value={form.progreso} onChange={set('progreso')} /></Field>
        <Field label="Presupuesto total (€)"><Input type="number" step="0.01" min="0" value={form.presupuestoTotal ?? ''} onChange={set('presupuestoTotal')} /></Field>
        <Field label="Fecha de inicio">
          <Input type="date" value={form.fechaInicio || ''} onChange={(e) => {
            const v = e.target.value;
            setForm((f) => ({ ...f, fechaInicio: v, fechaPrevista: f.fechaPrevista || addDays(v, 15) }));
          }} />
        </Field>
        <Field label="Fecha prevista de entrega" hint="Por defecto, 15 días después del inicio. Puedes cambiarla.">
          <Input type="date" value={form.fechaPrevista || ''} onChange={set('fechaPrevista')} />
        </Field>
        <Field label="URL / Dominio" className="sm:col-span-2"><Input value={form.url || ''} onChange={set('url')} placeholder="https://" /></Field>
        <Field label="Notas" className="sm:col-span-2"><Textarea value={form.notas || ''} onChange={set('notas')} /></Field>
      </div>
      <div className="flex justify-end gap-2 mt-5">
        <Button variant="secondary" type="button" onClick={onCancel}>Cancelar</Button>
        <Button type="submit" disabled={saving}>{saving ? 'Guardando...' : 'Guardar proyecto'}</Button>
      </div>
    </form>
  );
}

function TareasPanel({ proyecto, onProgresoChange }) {
  const toast = useToast();
  const [tareas, setTareas] = useState([]);
  const [loading, setLoading] = useState(true);
  const [nueva, setNueva] = useState('');
  const [nuevaFecha, setNuevaFecha] = useState('');
  const [nuevaPrioridad, setNuevaPrioridad] = useState('media');
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState(null);

  async function load() {
    setLoading(true);
    const all = await api.list('Tarea', { order: 'orden', ascending: true });
    const mine = all.filter((t) => t.proyectoId === proyecto.id);
    setTareas(mine);
    setLoading(false);
    if (mine.length > 0) {
      const completadas = mine.filter((t) => t.estado === 'completada').length;
      const nuevoProgreso = Math.round((completadas / mine.length) * 100);
      if (nuevoProgreso !== Number(proyecto.progreso || 0)) {
        try {
          await api.update('Proyecto', proyecto.id, { progreso: nuevoProgreso });
          onProgresoChange && onProgresoChange(nuevoProgreso);
        } catch (e) { /* silencioso */ }
      }
    }
  }
  useEffect(() => { load(); }, [proyecto.id]);

  async function addTarea(e) {
    e.preventDefault();
    if (!nueva.trim()) return;
    try {
      await api.insert('Tarea', { titulo: nueva.trim(), proyectoId: proyecto.id, estado: 'pendiente', orden: tareas.length, fechaLimite: nuevaFecha || null, prioridad: nuevaPrioridad });
      setNueva(''); setNuevaFecha(''); setNuevaPrioridad('media');
      load();
    } catch (err) { toast(err.message || 'Error al crear la tarea', 'error'); }
  }

  const cycle = { pendiente: 'en_progreso', en_progreso: 'completada', completada: 'pendiente' };

  async function toggleEstado(t) {
    await api.update('Tarea', t.id, { estado: cycle[t.estado] || 'pendiente' });
    load();
  }
  async function removeTarea(t) {
    await api.remove('Tarea', t.id);
    load();
  }

  function startEdit(t) {
    setEditingId(t.id);
    setEditForm({ titulo: t.titulo, fechaLimite: toDateInput(t.fechaLimite) || '', prioridad: t.prioridad || 'media' });
  }
  async function saveEdit(t) {
    if (!editForm.titulo.trim()) { toast('El título no puede estar vacío', 'error'); return; }
    try {
      await api.update('Tarea', t.id, { titulo: editForm.titulo.trim(), fechaLimite: editForm.fechaLimite || null, prioridad: editForm.prioridad });
      setEditingId(null);
      load();
    } catch (err) { toast(err.message || 'Error al guardar', 'error'); }
  }

  if (loading) return <PageLoader />;

  return (
    <div>
      <form onSubmit={addTarea} className="flex flex-wrap gap-2 mb-4">
        <Input value={nueva} onChange={(e) => setNueva(e.target.value)} placeholder="Añadir una tarea..." className="flex-1 min-w-[160px]" />
        <Input type="date" value={nuevaFecha} onChange={(e) => setNuevaFecha(e.target.value)} className="!w-40" />
        <Select value={nuevaPrioridad} onChange={(e) => setNuevaPrioridad(e.target.value)} className="!w-32">
          <option value="baja">Baja</option><option value="media">Media</option><option value="alta">Alta</option>
        </Select>
        <Button type="submit" icon={Icons.Plus}>Añadir</Button>
      </form>
      {tareas.length === 0 ? <EmptyState icon={Icons.ListTasks} title="Sin tareas todavía" /> : (
        <div className="space-y-2">
          {tareas.map((t) => (
            editingId === t.id ? (
              <div key={t.id} className="bg-slate-50 rounded-lg px-3 py-2.5 space-y-2">
                <Input value={editForm.titulo} onChange={(e) => setEditForm((f) => ({ ...f, titulo: e.target.value }))} autoFocus />
                <div className="flex flex-wrap gap-2">
                  <Input type="date" value={editForm.fechaLimite} onChange={(e) => setEditForm((f) => ({ ...f, fechaLimite: e.target.value }))} className="!w-40" />
                  <Select value={editForm.prioridad} onChange={(e) => setEditForm((f) => ({ ...f, prioridad: e.target.value }))} className="!w-32">
                    <option value="baja">Baja</option><option value="media">Media</option><option value="alta">Alta</option>
                  </Select>
                  <Button size="sm" variant="secondary" type="button" onClick={() => setEditingId(null)}>Cancelar</Button>
                  <Button size="sm" type="button" onClick={() => saveEdit(t)}>Guardar</Button>
                </div>
              </div>
            ) : (
              <div key={t.id} className="flex items-center gap-3 bg-slate-50 rounded-lg px-3 py-2.5">
                <button onClick={() => toggleEstado(t)} className={classNames(
                  'w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 transition',
                  t.estado === 'completada' ? 'bg-emerald-500 border-emerald-500' : t.estado === 'en_progreso' ? 'border-blue-500' : 'border-slate-300'
                )}>
                  {t.estado === 'completada' && <Icons.Check className="w-3 h-3 text-white" strokeWidth={3} />}
                </button>
                <div className="min-w-0 flex-1">
                  <p className={classNames('text-sm', t.estado === 'completada' ? 'text-slate-400 line-through' : 'text-ink-700')}>{t.titulo}</p>
                  {t.fechaLimite && <p className="text-xs text-slate-400">Vence: {formatDate(t.fechaLimite)}</p>}
                </div>
                <EstadoBadge estado={t.prioridad || 'media'} />
                <EstadoBadge estado={t.estado} />
                <button onClick={() => startEdit(t)} className="p-1 text-slate-400 hover:text-brand-600"><Icons.Edit className="w-4 h-4" /></button>
                <button onClick={() => removeTarea(t)} className="p-1 text-slate-400 hover:text-rose-500"><Icons.Trash className="w-4 h-4" /></button>
              </div>
            )
          ))}
        </div>
      )}
    </div>
  );
}

function ProyectoDocumentos({ proyecto }) {
  const toast = useToast();
  const [files, setFiles] = useState([]);
  const [loading, setLoading] = useState(true);
  const [uploading, setUploading] = useState(false);

  async function load() {
    setLoading(true);
    const { data, error } = await supabaseClient.storage.from('proyecto-documentos').list(proyecto.id, { sortBy: { column: 'created_at', order: 'desc' } });
    if (!error) setFiles((data || []).filter((f) => f.name !== '.emptyFolderPlaceholder'));
    setLoading(false);
  }
  useEffect(() => { load(); }, [proyecto.id]);

  async function handleUpload(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setUploading(true);
    try {
      const path = `${proyecto.id}/${Date.now()}_${file.name}`;
      const { error } = await supabaseClient.storage.from('proyecto-documentos').upload(path, file);
      if (error) throw error;
      toast('Archivo subido');
      load();
    } catch (err) { toast(err.message || 'Error al subir el archivo', 'error'); }
    finally { setUploading(false); }
  }

  async function handleDownload(file) {
    try {
      const path = `${proyecto.id}/${file.name}`;
      const { data, error } = await supabaseClient.storage.from('proyecto-documentos').createSignedUrl(path, 60);
      if (error) throw error;
      window.open(data.signedUrl, '_blank');
    } catch (err) { toast('No se pudo abrir el archivo', 'error'); }
  }

  async function handleDelete(file) {
    try {
      const path = `${proyecto.id}/${file.name}`;
      const { error } = await supabaseClient.storage.from('proyecto-documentos').remove([path]);
      if (error) throw error;
      toast('Archivo eliminado');
      load();
    } catch (err) { toast('No se pudo eliminar', 'error'); }
  }

  function nombreLegible(name) {
    const idx = name.indexOf('_');
    return idx > 0 && /^\d+$/.test(name.slice(0, idx)) ? name.slice(idx + 1) : name;
  }
  function tamanoLegible(bytes) {
    if (!bytes && bytes !== 0) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  return (
    <div>
      <div className="flex items-center justify-between gap-3 mb-3">
        <p className="text-xs text-slate-400">Briefings, diseños, contratos o cualquier archivo relacionado con el proyecto.</p>
        <label className={classNames('inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-medium cursor-pointer',
          uploading ? 'bg-slate-100 text-slate-400' : 'bg-white text-ink-700 border border-slate-200 hover:bg-slate-50')}>
          <Icons.Plus className="w-4 h-4" /> {uploading ? 'Subiendo...' : 'Subir archivo'}
          <input type="file" className="hidden" onChange={handleUpload} disabled={uploading} />
        </label>
      </div>
      {loading ? <PageLoader /> : files.length === 0 ? (
        <EmptyState icon={Icons.FileText} title="Sin documentos" message="Sube el primer archivo de este proyecto." />
      ) : (
        <div className="space-y-1.5">
          {files.map((f) => (
            <div key={f.id || f.name} className="flex items-center gap-3 bg-slate-50 rounded-lg px-3 py-2.5">
              <Icons.FileText className="w-4 h-4 text-slate-400 shrink-0" />
              <div className="min-w-0 flex-1">
                <p className="text-sm text-ink-700 truncate">{nombreLegible(f.name)}</p>
                <p className="text-xs text-slate-400">{tamanoLegible(f.metadata && f.metadata.size)}</p>
              </div>
              <button onClick={() => handleDownload(f)} className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500" title="Descargar"><Icons.Download className="w-4 h-4" /></button>
              <button onClick={() => handleDelete(f)} className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500" title="Eliminar"><Icons.Trash className="w-4 h-4" /></button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function Proyectos({ navigate }) {
  const toast = useToast();
  const [loading, setLoading] = useState(true);
  const [items, setItems] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [categorias, setCategorias] = useState([]);
  const [presupuestos, setPresupuestos] = useState([]);
  const [facturas, setFacturas] = useState([]);
  const [search, setSearch] = useState('');
  const [filterTab, setFilterTab] = useState('todos'); // 'todos' | 'pendientes' | 'completados'
  const [modal, setModal] = useState(null);
  const [detail, setDetail] = useState(null);
  const [detailTab, setDetailTab] = useState('tareas');
  const [toDelete, setToDelete] = useState(null);
  const [sort, setSort] = useState({ key: null, dir: 'asc' });
  const onSort = (key) => setSort((s) => toggleSort(s, key));

  async function load() {
    setLoading(true);
    const [pr, cl, cat, pre, fa] = await Promise.all([
      api.list('Proyecto'), api.list('Cliente', { order: 'nombre', ascending: true }),
      api.list('CategoriaServicio', { order: 'nombre', ascending: true }),
      api.list('Presupuesto'), api.list('Factura'),
    ]);
    setItems(pr); setClientes(cl); setCategorias(cat); setPresupuestos(pre); setFacturas(fa); setLoading(false);
  }
  useEffect(() => { load(); }, []);

  function abrirDetalle(p) { setDetail(p); setDetailTab('tareas'); }

  function handleProgresoChange(nuevoProgreso) {
    setDetail((d) => (d ? { ...d, progreso: nuevoProgreso } : d));
    setItems((its) => its.map((it) => (detail && it.id === detail.id ? { ...it, progreso: nuevoProgreso } : it)));
  }

  const clienteById = Object.fromEntries(clientes.map((c) => [c.id, c]));
  const pendientesCount = items.filter((p) => p.estado !== 'completado').length;
  const completadosCount = items.filter((p) => p.estado === 'completado').length;
  const filtered = items.filter((p) => {
    if (filterTab === 'pendientes' && p.estado === 'completado') return false;
    if (filterTab === 'completados' && p.estado !== 'completado') return false;
    const q = search.toLowerCase();
    if (!q) return true;
    return [p.nombre, (clienteById[p.clienteId] || {}).nombre].filter(Boolean).some((v) => v.toLowerCase().includes(q));
  });
  const sorted = sortRows(filtered, sort, {
    nombre: (p) => p.nombre,
    cliente: (p) => (clienteById[p.clienteId] || {}).nombre,
    progreso: (p) => Number(p.progreso || 0),
    prioridad: (p) => p.prioridad,
    estado: (p) => p.estado,
  });

  async function handleDelete() {
    try { await api.remove('Proyecto', toDelete.id); toast('Proyecto eliminado'); setToDelete(null); load(); }
    catch (err) { toast('No se puede eliminar: tiene tareas o facturas asociadas', 'error'); setToDelete(null); }
  }

  function handleClienteCreado(c) {
    setClientes((cs) => [...cs, c].sort((a, b) => a.nombre.localeCompare(b.nombre)));

  function handleCategoriaCreada(c) {
    setCategorias((cs) => [...cs, c].sort((a, b) => a.nombre.localeCompare(b.nombre)));

  const PROYECTO_TABS = [
    { key: 'todos', label: 'Todos', count: items.length, active: 'bg-slate-800 text-white border-slate-800', idle: 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50' },
    { key: 'pendientes', label: 'Pendientes', count: pendientesCount, active: 'bg-amber-500 text-white border-amber-500', idle: 'bg-white text-amber-600 border-amber-200 hover:bg-amber-50' },
    { key: 'completados', label: 'Completados', count: completadosCount, active: 'bg-emerald-600 text-white border-emerald-600', idle: 'bg-white text-emerald-600 border-emerald-200 hover:bg-emerald-50' },
  ];

  return (
    <div className="fade-in">
      <PageHeader title="Proyectos" subtitle={`${items.length} proyectos registrados`}
        action={<div className="flex gap-2">
          <ExportCsvButton nombre="proyectos" filas={sorted} columnas={[
            { titulo: 'Nombre', valor: (p) => p.nombre }, { titulo: 'Cliente', valor: (p) => csvCliente(clienteById[p.clienteId]) }, { titulo: 'Estado', valor: (p) => p.estado },
            { titulo: 'Prioridad', valor: (p) => p.prioridad }, { titulo: 'Progreso %', valor: (p) => Number(p.progreso || 0) },
            { titulo: 'Presupuesto', valor: (p) => (p.presupuestoTotal === null || p.presupuestoTotal === undefined || p.presupuestoTotal === '' ? '' : Number(p.presupuestoTotal)) },
            { titulo: 'Fecha inicio', valor: (p) => csvFecha(p.fechaInicio) }, { titulo: 'Fecha prevista', valor: (p) => csvFecha(p.fechaPrevista) },
            { titulo: 'URL', valor: (p) => p.url }, { titulo: 'Tipo', valor: (p) => p.tipo }, { titulo: 'Notas', valor: (p) => p.notas }]} />
          <Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo proyecto</Button>
        </div>} />

      <div className="flex items-center gap-2 mb-4 flex-wrap">
        {PROYECTO_TABS.map((t) => (
          <button key={t.key} type="button" onClick={() => setFilterTab(t.key)}

              'px-4 py-2 rounded-xl text-sm font-semibold border transition shadow-sm',
              filterTab === t.key ? t.active : t.idle
            )}>
            {t.label} <span className="opacity-75 font-normal">({t.count})</span>
          </button>
        ))}
      </div>

      {loading ? <PageLoader /> : filtered.length === 0 ? (
        <CardTable><EmptyState icon={Icons.Briefcase} title="No hay proyectos" action={<Button icon={Icons.Plus} onClick={() => setModal({ mode: 'new' })}>Nuevo proyecto</Button>} /></CardTable>
      ) : (
        <CardTable>
          <table className="w-full min-w-[760px]">
            <thead className="bg-slate-700 text-white"><tr>
              <SortableTh sortKey="nombre" sort={sort} onSort={onSort}>Proyecto</SortableTh>
              <SortableTh sortKey="cliente" sort={sort} onSort={onSort}>Cliente</SortableTh>

                        <p className="text-ink-800">{(clienteById[p.clienteId] || {}).empresa || (clienteById[p.clienteId] || {}).nombre || '—'}</p>

                      <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden flex-1"><div className="h-full bg-brand-500 rounded-full" style={{ width: (p.progreso || 0) + '%' }}></div></div>

                  <Td><EstadoBadge estado={p.prioridad || 'media'} /></Td>
                  <Td><EstadoBadge estado={p.estado} /></Td>

                  </Td>
                </tr>
              ))}

          </table>

          <Button variant="secondary" onClick={() => setDetail(null)}>Cerrar</Button>

              <div><p className="text-xs text-slate-400">Estado</p><EstadoBadge estado={detail.estado} /></div>

              <div><p className="text-xs text-slate-400">Inicio</p><p className="font-medium text-ink-800">{formatDate(detail.fechaInicio)}</p></div>
              <div><p className="text-xs text-slate-400">Entrega prevista</p><p className="font-medium text-ink-800">{formatDate(detail.fechaPrevista)}</p></div>
              <div className="col-span-2 sm:col-span-4">
                <p className="text-xs text-slate-400 mb-1">Progreso (automático según tareas completadas)</p>
                <div className="flex items-center gap-2">
                  <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden flex-1"><div className="h-full bg-brand-500 rounded-full" style={{ width: (detail.progreso || 0) + '%' }}></div></div>
                  <span className="text-xs text-slate-500 w-8">{detail.progreso || 0}%</span>

              </div>
            </div>

            <div className="flex gap-1 border-b border-slate-100">
              {[['tareas', 'Tareas', Icons.ListTasks], ['documentos', 'Documentos', Icons.FileText], ['comercial', 'Presupuestos/Facturas', Icons.Receipt]].map(([key, label, Ic]) => (
                <button key={key} type="button" onClick={() => setDetailTab(key)}

      <ConfirmDialog open={!!toDelete} title="Eliminar proyecto" danger message={`¿Eliminar "${toDelete?.nombre}"?`} onCancel={() => setToDelete(null)} onConfirm={handleDelete} />

  );
}
